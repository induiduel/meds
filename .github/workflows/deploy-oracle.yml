name: Deploy code to Oracle VM

# main'e push -> kod Oracle'a rsync ile gider, meds-app imajı yeniden derlenir.
# Oracle'da git klonu yok (deploy-code.sh ile aynı rsync yolu).
# VERİ HARİÇ: data/ ve src/data/*.json cihazdaki çalışma kopyasından gelir
# (deploy/oracle/deploy-code.sh veya sync-data.sh). Git'teki eski sürüm Oracle'ı ezmesin.
# Gerekli Secrets: ORACLE_HOST (92.5.55.109), ORACLE_USER (ubuntu), ORACLE_SSH_KEY (~/.ssh/medsor-oracle.key içeriği)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'src/data/**/*.json'
      - '**/*.md'
  workflow_dispatch:

# Üst üste binen iki dağıtım sunucuyu iki kez yeniden başlatıyordu (2026-10-11 kesintileri)
concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH anahtarı
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Kod rsync (veri ve .env hariç)
        run: |
          rsync -az --checksum \
            --exclude='/node_modules' --exclude='/dist' --exclude='/dist-gh' \
            --exclude='/data' --exclude='/.git' --exclude='/.github' --exclude='/models' \
            --exclude='/training_data' --exclude='/linux' \
            --exclude='.venv*' --exclude='__pycache__' --exclude='*.log' \
            --exclude='/supabase-server/volumes' --exclude='/supabase-server/backups' \
            --exclude='/cloudflared.exe' --exclude='src/data/decks/items' \
            --exclude='/src/data/*.json' --exclude='/src/data/**/*.json' \
            --exclude='/.env' \
            -e "ssh -i ~/.ssh/oracle" ./ "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/home/ubuntu/medsor/meds/"

      - name: Derle + başlat + sağlık
        run: |
          ssh -i ~/.ssh/oracle "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" '
            set -e
            cd /home/ubuntu/medsor/meds
            C="docker compose --env-file /home/ubuntu/medsor/meds/.env -f deploy/oracle/docker-compose.oracle.yml"
            # Kesintisiz: imaj önce derlenir; meds-app yeniden başlarken kapı (meds-server, Caddy) istekleri bekletir.
            flock /tmp/meds-deploy.lock sh -c "$C build meds-app && $C up -d --no-deps meds-app && $C up -d --no-deps meds-server"
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 3; done
            echo "sağlık kontrolü geçmedi"; docker logs meds-app --tail 40; exit 1
          '
