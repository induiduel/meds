name: Deploy MedSoru to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-medsoru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build with Vite
        run: |
          npm run build
          touch ./dist/.nojekyll
          cp ./dist/index.html ./dist/404.html

      # 1. Deploy to gh-pages branch (works if Pages source is "Deploy from a branch")
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: true

      # 2. Direct Pages Deploy (works if Pages source is "GitHub Actions")
      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
