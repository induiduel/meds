# docker-compose.oracle.yml — Oracle VM üzerinde canlı MedSoru.
# Çalıştırma yeri: meds/ dizini →  docker compose -f deploy/oracle/docker-compose.oracle.yml up -d --build
# .env (Oracle sürümü) meds/.env konumunda olmalı. Token gelmeden önce yalnız site (meds-app + kapı meds-server) ayağa kaldırılır:
#   docker compose -f deploy/oracle/docker-compose.oracle.yml up -d --build meds-app meds-server
name: medsoru-oracle

services:
  # Kapı: cloudflared (Cloudflare panelinde kaynak http://meds-server:3000) ve ders işçisi buraya bağlanır.
  # Uygulama (meds-app) yeniden başlarken istekleri bekletir → dağıtımda 502 yok. Ayrıntı: Caddyfile.
  meds-server:
    image: caddy:2-alpine
    container_name: meds-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # Uygulama. Dağıtımda yalnız bu yeniden kurulur (deploy-code.sh); dışarıya kapı üzerinden açılır.
  meds-app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.oracle
    image: medsoru-server:oracle
    container_name: meds-app
    restart: unless-stopped
    stop_grace_period: 15s
    # Always Free (2 OCPU / ~12GB): site + meds-pg + embed aynı makinede; taşan bir süreç diğerlerini düşürmesin.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
    # Doğrudan erişim (kapıyı atlayarak hata ayıklama): 127.0.0.1:3001
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      meds-pg:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Çalışma zamanı yığını 3G konteyner tavanının altında (imajdaki 4096 yalnız derleme içindir).
      - NODE_OPTIONS=--max-old-space-size=2560
      # Veritabanı: aynı compose ağındaki meds-pg (dışarıya kapalı). Parola ../../.env → MEDS_PG_PASSWORD.
      - DATABASE_URL=postgres://meds:${MEDS_PG_PASSWORD:?MEDS_PG_PASSWORD .env içinde olmalı}@meds-pg:5432/meds
      # Vektör arama: sorgu gömme Oracle içindeki bge-m3 servisinden, vektörler meds-pg'den.
      - MEDS_EMBED_URL=http://meds-embed:8094/embed
      - MEDS_EMBED_BGE_URL=http://meds-embed:8094/embed
      - MEDS_VECTOR_SEARCH=${MEDS_VECTOR_SEARCH:-1}
    volumes:
      # Kod imaja gömülmez (2026-10-20): çalışan ağaç doğrudan bağlanır, dist/ cihazda derlenip rsync ile gelir.
      # Ön yüz değişikliği = yalnız rsync; sunucu kodu = docker restart; bağımlılık = imaj (yalnız /node_modules).
      - ../..:/app
      - ../../data:/app/data
      - /home/ubuntu/medsor/meds_database:/home/ubuntu/medsor/meds_database:ro
      - /home/ubuntu/medsor/meds_database_v2:/home/ubuntu/medsor/meds_database_v2:ro
      - /home/ubuntu/medsor/meds_database_core:/home/ubuntu/medsor/meds_database_core:ro
      - /home/ubuntu/medsor/meds_temp:/home/ubuntu/medsor/meds_temp:ro
      - /home/ubuntu/medsor/meds_downloads:/home/ubuntu/medsor/meds_downloads:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Veritabanı: Postgres 17 + pgvector (Supabase'in yerine, 2026-10-12). İnternete kapalı; yalnız
  # 127.0.0.1:54330 (SSH tüneli: deploy/oracle/db-yonet.sh). Canlı yayın tetikleyicileri: deploy/pg/sql/realtime.sql.
  # Günlük yedek: deploy/pg/backup.sh (cron, 7 gün saklanır).
  meds-pg:
    image: pgvector/pgvector:pg17
    container_name: meds-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: meds
      POSTGRES_USER: meds
      POSTGRES_PASSWORD: ${MEDS_PG_PASSWORD:?MEDS_PG_PASSWORD .env içinde olmalı}
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=60
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - meds-pg-data:/var/lib/postgresql/data
      - ../pg/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meds -d meds"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: meds-tunnel
    restart: unless-stopped
    # Token, Zero Trust → Networks → Tunnels → medsoru-oracle → Configure → Token
    # (.env'deki CLOUDFLARE_TUNNEL_TOKEN; compose --env-file ile okunur)
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - meds-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # bge-m3 sorgu gömme servisi (CPU). İlk açılışta modeli (~1.2GB) indirir.
  meds-embed:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.embed
    image: medsoru-embed:bge-m3
    container_name: meds-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      - MEDS_EMBED_MODEL=BAAI/bge-m3
      - MEDS_EMBED_HOST=0.0.0.0
      - MEDS_EMBED_PORT=8094
      - MEDS_EMBED_THREADS=2
      - MEDS_EMBED_PRELOAD=1
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2800M
    volumes:
      - meds-embed-models:/models
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # Ders işçisi: Drive kök klasörünü 30 dk'da bir tarar; yeni ders PDF'ini Claude aboneliğiyle (CLAUDE_CODE_OAUTH_TOKEN,
  # ../../.env) işler ve çıktıyı YALNIZ /isci/taslak altına yazar. Kod salt-okunur; yayın yönetim onayıyla.
  # Anahtar yüklemek için cihazda: deploy/oracle/isci-token-yukle.sh
  meds-ders-isci:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.isci
    image: medsoru-isci:latest
    container_name: meds-ders-isci
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      - meds-server
      - meds-app
      - meds-embed
    env_file:
      - path: ../../.env
        required: true
    environment:
      - HOME=/isci/home
      - MEDS_APP_DIR=/app
      - MEDS_ISCI_DIR=/isci
      - MEDS_DOWNLOADS_DIR=/home/ubuntu/medsor/meds_downloads
      - MEDS_DATABASE_DIR=/home/ubuntu/medsor/meds_database
      - MEDS_TEMP_DIR=/home/ubuntu/medsor/meds_temp
      - MEDS_ISCI_API=http://meds-server:3000
      - MEDS_EMBED_URL=http://meds-embed:8094/embed
      - MEDS_EMBED_BGE_URL=http://meds-embed:8094/embed
      - MEDS_ISCI_GUNLUK=4
      - MEDS_ISCI_SAATLER=00-24
      - MEDS_ISCI_ARALIK=7200
      - MEDS_ISCI_DERS_ARASI=10800
      # kullanıcı kararı (2026-10-12): ders işçisi Opus 5.5, düşük efor (claude -p --model … --effort low)
      - MEDS_ISCI_MODEL=claude-opus-5-5
      - MEDS_ISCI_EFFORT=low
    volumes:
      - ../..:/app:ro
      - /home/ubuntu/medsor/ders_isci:/isci
      - /home/ubuntu/medsor/meds_downloads:/home/ubuntu/medsor/meds_downloads
      - /home/ubuntu/medsor/meds_database:/home/ubuntu/medsor/meds_database:ro
      - /home/ubuntu/medsor/meds_database_v2:/home/ubuntu/medsor/meds_database_v2:ro
      - /home/ubuntu/medsor/meds_temp:/home/ubuntu/medsor/meds_temp:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # EMA Lightning ses işçisi (yalnız CPU): sesli anlatım kuyruğundaki ema-yerel işlerini Oracle'da seslendirir
  # (/api/sesli-anlatim/yerel/* uçları, MEDS_PANEL_SECRET). Yeni ders yayınlanınca Emel + EMA sesi bilgisayar
  # kapalıyken de üretilir. Kod salt-okunur; model ~34 MB (meds-ema-models). 2026-10-16.
  meds-ema:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.ema
    image: medsoru-ema:latest
    container_name: meds-ema
    # KAPALI (kullanıcı kararı 2026-10-22): Oracle EMA işçisine iş verilmez; yalnız `--profile ema-oracle` ile başlar,
    # başlasa da ema_isci.py ve /yerel/al reddeder. EMA sesleri yalnız yerel bilgisayardaki meds-ema biriminde.
    profiles: ["ema-oracle"]
    restart: "no"
    depends_on:
      - meds-server
      - meds-app
    env_file:
      - path: ../../.env
        required: true
    environment:
      - MEDS_EMA_SUNUCU=http://meds-server:3000
      - MEDS_EMA_AD=oracle-ema
      - EMA_IS_PARCACIGI=1
    volumes:
      - ../..:/app:ro
      - meds-ema-models:/models
      - meds-ema-veri:/veri
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  meds-embed-models:
  meds-pg-data:
  meds-ema-models:
  meds-ema-veri:
