# Yerel (ücretsiz) küçük yapay zeka modelleri için Ollama.
# Başlat: docker compose -f docker-compose.ollama.yml up -d
# API:    http://localhost:11434  (OpenAI uyumlu: http://localhost:11434/v1)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: meds-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_FLASH_ATTENTION: "0"
      OLLAMA_KV_CACHE_TYPE: f16
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
    # NVIDIA GPU (nvidia-container-toolkit kurulu olmalı)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models:
