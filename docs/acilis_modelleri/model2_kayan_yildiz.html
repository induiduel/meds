<!doctype html><html><head><meta charset=utf-8><title>Açılış · Model 2 · Kayan yıldız</title>    <style>
      /* Açılış ekranı · Model 2 "Kayan yıldız" — EKG kalbin üst-orta hizasında akar, kısa bir tikten sonra aniden düşer;
         düşüş kavisli bir yayla hızlanıp kalbin ortasına kıvrılır ve orada minik bir yıldız (tek hamle pentagram) çizer.
         Hız: EKG 5, düşüş+yay 14, minik yıldız 7 birim (dış 324 + yay 223 + yıldız 430 birim; hareket döngünün ilk %85'i).
         Işık izi uzun (kuyruk); yıldız tamamlanınca merkezde parıltı ve kalp "lub-dub" atar. */
      #app-splash {
        --sp-bg: #F4F6F9; --sp-glow: rgba(232,48,106,.12);
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(60vmax 60vmax at 50% 46%, var(--sp-glow), transparent 62%), var(--sp-bg);
        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-glow: rgba(184,50,79,.12); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-glow: rgba(255,92,134,.16); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.04); visibility: hidden; pointer-events: none; }
      .sp-heart { position: relative; width: min(380px, 86vw); aspect-ratio: 592 / 340; will-change: transform;
        animation: sp-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
      html.is-standalone .sp-heart { animation: none; }
      .sp-beat { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%; animation: sp-beat 3.2s .35s ease-out infinite; }
      .sp-beat > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .sp-shape { filter: drop-shadow(0 10px 18px rgba(232,48,106,.4)); }
      .sp-draw { stroke-dasharray: 1 1; animation: sp-draw 3.2s .35s linear both; }
      .sp-comet { stroke-dasharray: 0.09 2; stroke-dashoffset: 0.09; animation: sp-comet 3.2s .35s linear infinite; }
      .sp-twinkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-twinkle 3.2s .35s ease-out infinite; }
      @keyframes sp-twinkle { 0%, 83% { opacity: 0; transform: scale(.3); } 88% { opacity: .85; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
      .sp-comet.is-in { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px #fff); }
      /* Yükselen küçük kalpler */
      .sp-p { position: absolute; width: 18px; height: 15px; opacity: 0; will-change: transform, opacity; animation: sp-up 2.8s ease-in infinite; }
      .sp-p svg { display: block; width: 100%; height: 100%; }
      .sp-p:nth-child(1) { left: 4%; bottom: 30%; width: 23px; height: 20px; animation-delay: 0.2s; }
      .sp-p:nth-child(2) { left: 14%; bottom: 8%; width: 32px; height: 27px; animation-delay: 1.3s; }
      .sp-p:nth-child(3) { left: 24%; bottom: 46%; width: 20px; height: 17px; animation-delay: 0.7s; }
      .sp-p:nth-child(4) { left: 34%; bottom: 4%; width: 38px; height: 32px; animation-delay: 2.0s; }
      .sp-p:nth-child(5) { left: 46%; bottom: 22%; width: 26px; height: 22px; animation-delay: 1.0s; }
      .sp-p:nth-child(6) { left: 56%; bottom: 0%; width: 32px; height: 27px; animation-delay: 0.45s; }
      .sp-p:nth-child(7) { left: 66%; bottom: 40%; width: 23px; height: 20px; animation-delay: 1.6s; }
      .sp-p:nth-child(8) { left: 76%; bottom: 10%; width: 35px; height: 30px; animation-delay: 0.85s; }
      .sp-p:nth-child(9) { left: 86%; bottom: 30%; width: 26px; height: 22px; animation-delay: 2.3s; }
      .sp-p:nth-child(10) { left: 94%; bottom: 6%; width: 20px; height: 17px; animation-delay: 1.15s; }
      .sp-p:nth-child(11) { left: 9%; bottom: 60%; width: 17px; height: 14px; animation-delay: 1.8s; }
      .sp-p:nth-child(12) { left: 90%; bottom: 58%; width: 20px; height: 17px; animation-delay: 0.55s; }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.55); } 100% { opacity: 1; transform: none; } }
      /* Uzaklık (pathLength=1) ↔ zaman: A girişi %19,2 → %23,5 · A çıkışı %80,4 → %61,0 · son %100 → %85 */
      @keyframes sp-draw { 0% { stroke-dashoffset: 1; } 38.8% { stroke-dashoffset: 0.668; } 48.3% { stroke-dashoffset: 0.440; } 85%, 100% { stroke-dashoffset: 0; } }
      @keyframes sp-comet { 0% { stroke-dashoffset: 0.09; } 38.8% { stroke-dashoffset: -0.242; } 48.3% { stroke-dashoffset: -0.470; } 85% { stroke-dashoffset: -0.91; } 90%, 100% { stroke-dashoffset: -1; } }
      @keyframes sp-beat { 0%, 82% { transform: none; } 88% { transform: scale(1.08); } 93% { transform: scale(.99); } 97% { transform: scale(1.05); } 100% { transform: none; } }
      @keyframes sp-up { 0% { opacity: 0; transform: translateY(0) scale(.8); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-150px) scale(1.15) rotate(15deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash *::after { animation: none !important; transform: none !important; }
        .sp-heart { opacity: 1 !important; }
        .sp-draw { stroke-dashoffset: 0; }
        .sp-p, .sp-comet { display: none; }
      }
