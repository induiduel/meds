<!doctype html><html><head><meta charset=utf-8><title>Açılış · Model 3 · EKG-kalp-yıldız</title>    <style>
      /* Açılış ekranı (v14) — metinsiz logo: [EKG] → [♥] → [yıldız-A].
         EKG soldan gelir ve kalbin üstünden geçer (kalbin dışında pembe, içinde beyaz; ortada büyük bir QRS); ışık kalbin içinden
         geçerken kalp "lub-dub" atar, sağ kenardan küçük bir dalgayla çıkıp kalbin sağında el yazısı yıldız-A'yı
         çizer: sol ayak → tepe → sağ ayak → sol kol → sağ kol → sol ayak (beş çizgi, yıldız tamamlanır, çizim orada biter).
         Işık hızı: EKG 5, kalbin içi 8, çıkış 5, yıldız 10 birim; anahtar kareler çizgi uzunluklarından
         hesaplandı (EKG 503 + kalbin içi 611 + çıkış 82 + yıldız 795 birim; hareket döngünün ilk %85'i).
         Kalp mobilde ekranın ~%45'i genişlikte. TÜM hareketler transform/opacity/stroke-dashoffset.
         En az ~5 sn görünür (App.tsx); çizim ~1,9 sn, döngü 2,2 sn. */
      #app-splash {
        --sp-bg: #F4F6F9; --sp-glow: rgba(232,48,106,.12);
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(60vmax 60vmax at 50% 46%, var(--sp-glow), transparent 62%), var(--sp-bg);
        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-glow: rgba(184,50,79,.12); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-glow: rgba(255,92,134,.16); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.04); visibility: hidden; pointer-events: none; }
      .sp-heart { position: relative; width: min(460px, 86vw); aspect-ratio: 850 / 340; will-change: transform;
        animation: sp-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
      html.is-standalone .sp-heart { animation: none; }
      .sp-heart > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .sp-hg { transform-box: fill-box; transform-origin: center; will-change: transform; animation: sp-beat 2.2s .35s ease-out infinite; }
      .sp-hg path { filter: drop-shadow(0 10px 18px rgba(232,48,106,.4)); }
      .sp-draw { stroke-dasharray: 1 1; animation: sp-draw 2.2s .35s linear both; }
      .sp-comet { stroke-dasharray: 0.05 2; stroke-dashoffset: 0.05; animation: sp-comet 2.2s .35s linear infinite; filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 1.5px #fff); }
      /* Yükselen küçük kalpler (kalbin çevresinde) */
      .sp-p { position: absolute; width: 18px; height: 15px; opacity: 0; will-change: transform, opacity; animation: sp-up 2.8s ease-in infinite; }
      .sp-p svg { display: block; width: 100%; height: 100%; }
      .sp-p:nth-child(1) { left: 22%; bottom: 30%; width: 18px; height: 15px; animation-delay: 0.2s; }
      .sp-p:nth-child(2) { left: 28%; bottom: 6%; width: 26px; height: 22px; animation-delay: 1.3s; }
      .sp-p:nth-child(3) { left: 34%; bottom: 46%; width: 16px; height: 14px; animation-delay: 0.7s; }
      .sp-p:nth-child(4) { left: 40%; bottom: 2%; width: 32px; height: 27px; animation-delay: 2.0s; }
      .sp-p:nth-child(5) { left: 46%; bottom: 26%; width: 20px; height: 17px; animation-delay: 1.0s; }
      .sp-p:nth-child(6) { left: 52%; bottom: 0%; width: 26px; height: 22px; animation-delay: 0.45s; }
      .sp-p:nth-child(7) { left: 58%; bottom: 40%; width: 18px; height: 15px; animation-delay: 1.6s; }
      .sp-p:nth-child(8) { left: 64%; bottom: 10%; width: 30px; height: 26px; animation-delay: 0.85s; }
      .sp-p:nth-child(9) { left: 70%; bottom: 32%; width: 20px; height: 17px; animation-delay: 2.3s; }
      .sp-p:nth-child(10) { left: 74%; bottom: 4%; width: 16px; height: 14px; animation-delay: 1.15s; }
      .sp-p:nth-child(11) { left: 25%; bottom: 62%; width: 14px; height: 12px; animation-delay: 1.8s; }
      .sp-p:nth-child(12) { left: 68%; bottom: 60%; width: 16px; height: 14px; animation-delay: 0.55s; }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.55); } 100% { opacity: 1; transform: none; } }
      /* Uzaklık (pathLength=1) ↔ zaman: kalbe giriş %25.3 → %31.4 · kalpten çıkış %56.0 → %55.1 · yıldız başı %60.1 → %60.2 · son %100 → %85 */
      @keyframes sp-draw { 0% { stroke-dashoffset: 1; } 31.4% { stroke-dashoffset: 0.747; } 55.1% { stroke-dashoffset: 0.440; } 60.2% { stroke-dashoffset: 0.399; } 85%, 100% { stroke-dashoffset: 0; } }
      @keyframes sp-comet { 0% { stroke-dashoffset: 0.05; } 31.4% { stroke-dashoffset: -0.203; } 55.1% { stroke-dashoffset: -0.510; } 60.2% { stroke-dashoffset: -0.551; } 85% { stroke-dashoffset: -0.95; } 88%, 100% { stroke-dashoffset: -1; } }
      @keyframes sp-beat { 0%, 37% { transform: none; } 44% { transform: scale(1.08); } 51% { transform: scale(.99); } 57% { transform: scale(1.05); } 67%, 100% { transform: none; } }
      @keyframes sp-up { 0% { opacity: 0; transform: translateY(0) scale(.8); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-110px) scale(1.15) rotate(15deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash *::after { animation: none !important; transform: none !important; }
        .sp-heart { opacity: 1 !important; }
        .sp-draw { stroke-dashoffset: 0; }
        .sp-p, .sp-comet { display: none; }
      }
    </style>
