<!doctype html><html><head><meta charset=utf-8><title>Açılış · Model 4 · Çizgisel logo</title>    <style>
      /* Açılış ekranı (v15) — çizgisel logo: [gri→kırmızı EKG] → [çizgi kalp + içinde el yazısı A] → [kırmızı→gri EKG],
         kalbin çevresinde nabız yayları ve alt çapraz çizgiler (kullanıcının verdiği logo görseli temel alındı).
         Akış soldan sağa: tek EKG çizgisi gelir (.3–.94 sn) → kalbin sol kenarında kollara ayrılır, aynı anda (.94–2,19 sn)
         kalbin üstü ve alt V çizilir, A sağdan yazılmaya başlar (sağ ayak → tepe → sol bacak → altta ilmek → yatay
         kıvrım → "~") → A'nın "~" ucundan sağ EKG çizilir (2,19–2,79 sn) → yaylar
         belirir; kalp grubu atar, monitör ışığı önce sol sonra sağ EKG'den geçer. En az ~5 sn görünür (App.tsx).
         Renkler tema değişkeni (açık/sepya/koyu). */
      #app-splash {
        --sp-bg: #F4F5F7; --sp-ink: #3B4048; --sp-red: #D7263D;
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(70vmax 70vmax at 50% 46%, #fff 0%, transparent 60%), var(--sp-bg);
        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-ink: #4A3D30; --sp-red: #B8323F; background: var(--sp-bg); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-ink: #C3CAD4; --sp-red: #FF5A6E; background: radial-gradient(70vmax 70vmax at 50% 46%, #152033 0%, transparent 60%), var(--sp-bg); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.03); visibility: hidden; pointer-events: none; }
      .sp-logo { position: relative; width: min(520px, 92vw); aspect-ratio: 950 / 440; }
      .sp-logo > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .sp-d { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: sp-draw var(--dur) var(--del) cubic-bezier(.42,0,.35,1) both; }
      .sp-c { stroke-dasharray: .06 2; stroke-dashoffset: .06; opacity: .95; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px var(--sp-red));
        animation: sp-comet var(--dur) var(--del) cubic-bezier(.42,0,.35,1) both; }
      /* Monitör ışığı: tek döngüde önce sol EKG, ardından sağ EKG (öncekinden %10 hızlı) */
      .sp-m { stroke-dasharray: .07 2; stroke-dashoffset: .07; opacity: .9; filter: drop-shadow(0 0 4px #fff);
        animation: sp-mon-l 2.7s var(--del) linear infinite; }
      .sp-m2 { animation-name: sp-mon-r; }
      .sp-arc { opacity: 0; animation: sp-fade .45s 2.6s ease forwards; }
      .sp-hg { transform-box: view-box; transform-origin: 510px 500px; will-change: transform; animation: sp-beat 1.5s 2.9s ease-out infinite; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-comet { to { stroke-dashoffset: -1; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-mon-l { 0% { stroke-dashoffset: .07; } 50%, 100% { stroke-dashoffset: -1; } }
      @keyframes sp-mon-r { 0%, 50% { stroke-dashoffset: .07; } 100% { stroke-dashoffset: -1; } }
      @keyframes sp-beat { 0%, 100% { transform: none; } 12% { transform: scale(1.05); } 24% { transform: none; } 36% { transform: scale(1.03); } 50% { transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash * { animation: none !important; transform: none !important; }
        .sp-d { stroke-dashoffset: 0; } .sp-arc { opacity: 1; } .sp-c, .sp-m { display: none; }
      }
    </style>
