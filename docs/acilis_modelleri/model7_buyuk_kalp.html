<!doctype html><html><head><meta charset=utf-8><title>Açılış · Model 7 · Büyük kalp</title>    <style>
      /* Açılış ekranı (v18) — Model 7 "Büyük kalp": Model 6'dan — kalp ve hale %15 daha büyük (toplam ×1,32), A %5 kısa

         ilk vuruş ışık yıldızı bitirince), dış EKG uçları 40'ar birim kısa, A'nın ayakları EKG çizgisine 12 birim yakın. Model 6: Model 5'in devamı — A daha belirgin (yüksek tepe, uzun açık bacaklar,
         dar ve alçak kollar), çizgi %10 + %20 kalın, kalp ve hale %15 büyük. Temel Model 5: "Kalp içi yıldız-A, dış EKG" (kullanıcının Lottie dosyası ve iki referans görseli temel alındı).
         Tek çizgi: EKG kalpten uzakta başlar (iki P-QRS-T), düz hatla kalbe girer; kalbin içinde kavisli yıldız-A çizer —
         kavisle sağ kola → düz çizgiyle sol kola → kavisle sağ ayağa → tepeye → sol ayağa → kavisle kalpten çıkar — ve sağda
         yine kalpten uzakta iki P-QRS-T ile biter. Çizgi iki tonlu (kırmızı kontür + açık pembe çekirdek); ışık beyaz çekirdek
         + pembe hale. Hız: yıldızın dışında 5, içinde 10 birim (dış 876 + yıldız 1092 + dış 886 birim; hareket
         döngünün ilk %85'i). Kalp ve arkasındaki hale ışık yıldızı bitirince atar; mini kalpler uçuşur. En az ~5 sn (App.tsx). */
