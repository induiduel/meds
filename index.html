<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MeDSor · Tıp Kurul Soru Havuzu</title>
    <meta name="description" content="Tıp fakültesi kurul sınavları için kolektif soru hatırlama, şık tamamlama ve yapay zeka ile %100 doğrulukta soru rekonstrüksiyon platformu." />
    <link rel="canonical" href="https://nofrostlife.com.tr" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="MeDSor · Tıp Kurul Soru Havuzu" />
    <meta property="og:description" content="Tıp fakültesi kurul sınavları için kolektif soru hatırlama, şık tamamlama ve yapay zeka ile %100 doğrulukta soru rekonstrüksiyon platformu." />
    <meta property="og:url" content="https://nofrostlife.com.tr" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        // NOT: event.preventDefault() çağrılmamalıdır; aksi halde Vite yakalama işlevi undefined döner ve React.lazy çöker.
        var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
        if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
          sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
          window.location.reload();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
