    <script>
      // Görünüm tercihi boyamadan önce uygulanır (tema/palet/yoğunluk yanıp sönmesin) — utils/appearance.ts ile aynı anahtar
      (function () {
        try {
          var d = document.documentElement, a = JSON.parse(localStorage.getItem('medsoru_appearance') || 'null');
          var legacy = localStorage.getItem('medsoru_theme');
          var mode = a && a.mode ? a.mode : (legacy || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
          d.dataset.mode = mode;
          d.dataset.palette = (a && a.palettes && a.palettes[mode]) || 'a';
          d.dataset.density = (a && a.density) || 'normal';
          if (mode === 'dark') d.classList.add('theme-dark');
        } catch (e) {}
      })();
    </script>
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        if (!navigator.onLine) {
          event.preventDefault();
          return;
        }
        var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
        if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
          sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
          window.location.reload();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            // Çevrimdışıyken sayfayı yenileyip tarayıcının çevrimdışı hata sayfasına düşmesini engelle
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;
        background: #0f172a; transition: opacity .35s ease, visibility .35s;
      }
      #app-splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      .app-splash-mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .app-splash-box { fill: #3b82f6; }
      .app-splash-pulse {
        fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 160; stroke-dashoffset: 0;
      }
      .app-splash-word { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -.03em; color: #f8fafc; }
      .app-splash-word span { color: #3b82f6; }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash-mark">
        <svg viewBox="0 0 120 120" width="88" height="88">
          <rect class="app-splash-box" x="6" y="6" width="108" height="108" rx="30" />
          <path class="app-splash-pulse" d="M22 64 H44 L52 44 L62 84 L72 54 L78 64 H98" />
        </svg>
        <div class="app-splash-word">
          Me<span>DS</span>or
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
