    <script>
      // Dağıtımdan sonra service worker eski index.html'i (artık sunucuda olmayan /assets/ parçalarıyla) verirse
      // uygulama açılış ekranında kalıyordu: eski kabuk parçası yüklenemeyince önbellekteki kabuğu sil ve yenile.
      window.__medsoruTazeYukle = function () {
        if (!navigator.onLine) return false;
        var son = Number(sessionStorage.getItem('medsoru_chunk_reload') || 0);
        if (Date.now() - son < 8000) return false;
        sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
        var bitti = function () { window.location.reload(); };
        try {
          if (!window.caches) return bitti(), true;
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              return caches.open(k).then(function (c) {
                return Promise.all(['/', '/index.html', location.pathname].map(function (u) { return c.delete(u, { ignoreSearch: true }); }));
              });
            }));
          }).then(bitti, bitti);
        } catch (e) { bitti(); }
        return true;
      };
      window.addEventListener('error', function (e) {
        var t = e.target;
        var src = t && (t.src || t.href) || '';
        if ((t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) && src.indexOf('/assets/') !== -1) window.__medsoruTazeYukle();
      }, true);
    </script>
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        if (!navigator.onLine) {
          event.preventDefault();
          return;
        }
        window.__medsoruTazeYukle();
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            // Çevrimdışıyken sayfayı yenileyip tarayıcının çevrimdışı hata sayfasına düşmesini engelle
            return;
          }
          window.__medsoruTazeYukle();
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });

    <style>
      /* Açılış ekranı (v13) — metinsiz: atan kalp; içinde EKG çizgisiyle tek hamlede elle çizilen beş köşeli yıldız.
         Model 1 "Yıldız-A": A'sı baskın (yüksek tepe, düz bacaklar, kısa kollar), el yazısı
         yıldız. EKG Q dalgası gibi sol ayağa iner → tepe → sağ ayak → sol kol → sağ kol → sol ayak (beş çizgi); ışık son
         çizginin üzerinden sağ kola döner (çizgi üst üste biner, görünmez) ve yatay kol EKG olarak sağa sürer. Kenarlar hafif ve farklı kavisli, köşeler yuvarlatılmış (çizim index.html'de üretilmiş; kaynak: köşe listesi + yarıçap).
         Beyaz ışık EKG'yi soldan yazarak gelir, yıldız-A'yı çizer, EKG olarak sağa sürer; sonra aynı yolda monitör
         taraması gibi döner. Işık hızı A'nın dışında 5, içinde 10 birim: anahtar kareler çizgi uzunluklarından hesaplandı
         (dış 627 + A 1116 + dış 632 birim; hareket döngünün ilk %85'i). Kalp, A bittiğinde "lub-dub" atar.
         En az ~5 sn görünür (App.tsx); çizim ~1,9 sn. */
      #app-splash {
        --sp-bg: #F4F6F9; --sp-glow: rgba(232,48,106,.12);
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(60vmax 60vmax at 50% 46%, var(--sp-glow), transparent 62%), var(--sp-bg);
        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-glow: rgba(184,50,79,.12); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-glow: rgba(255,92,134,.16); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.04); visibility: hidden; pointer-events: none; }
      .sp-heart { position: relative; width: min(510px, 94vw); aspect-ratio: 792 / 340; will-change: transform;
        animation: sp-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
      html.is-standalone .sp-heart { animation: none; }
      .sp-beat { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%; animation: sp-beat 2.2s .35s ease-out infinite; }
      .sp-beat > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .sp-shape { filter: drop-shadow(0 10px 18px rgba(232,48,106,.4)); }
      .sp-draw { stroke-dasharray: 1 1; animation: sp-draw 2.2s .35s linear both; }
      .sp-comet { stroke-dasharray: .05 2; stroke-dashoffset: .05; animation: sp-comet 2.2s .35s linear infinite; }
      .sp-comet.is-in { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 1.5px #fff); }
      /* Yükselen küçük kalpler */
      .sp-p { position: absolute; width: 18px; height: 15px; opacity: 0; will-change: transform, opacity; animation: sp-up 2.8s ease-in infinite; }
      .sp-p svg { display: block; width: 100%; height: 100%; }

      /* Uzaklık (pathLength=1) ↔ zaman: A girişi %26,4 → %29,3 · A çıkışı %73,4 → %55,4 · son %100 → %85 */
