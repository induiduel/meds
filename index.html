  <head>

    <meta name="apple-mobile-web-app-title" content="MeDSor" />
    <meta property="og:title" content="MeDSor · Tıp Kurul Soru Havuzu" />
    <meta property="og:description" content="Tıp fakültesi kurul sınavları için kolektif soru hatırlama, şık tamamlama ve yapay zeka ile %100 doğrulukta soru rekonstrüksiyon platformu." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Görünüm tercihi boyamadan önce uygulanır (tema/palet/yoğunluk yanıp sönmesin) — utils/appearance.ts ile aynı anahtar
      (function () {
        try {
          var d = document.documentElement, a = JSON.parse(localStorage.getItem('medsoru_appearance') || 'null');
          var legacy = localStorage.getItem('medsoru_theme');
          // Kayıtlı tercih yoksa açılış (ve uygulama) açık temayla başlar — sistem koyu olsa bile
          var mode = a && (a.mode === 'light' || a.mode === 'sepia' || a.mode === 'dark') ? a.mode : (legacy === 'dark' ? 'dark' : 'light');
          d.dataset.mode = mode;
          d.dataset.palette = (a && a.palettes && a.palettes[mode]) || 'a';
          d.dataset.density = (a && a.density) || 'normal';
          if (mode === 'dark') d.classList.add('theme-dark');
        } catch (e) {}
      })();
    </script>
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        if (!navigator.onLine) {
          event.preventDefault();
          return;
        }
        var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
        if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
          sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
          window.location.reload();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            // Çevrimdışıyken sayfayı yenileyip tarayıcının çevrimdışı hata sayfasına düşmesini engelle
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
    <style>
      /* Açılış ekranı — tema uyumlu (açık/koyu, boyamadan önce html[data-mode] ayarlanır), marka renkleri.
         Sıra: zemin ışıması → işaret yaylanarak belirir → kalp ritmi çizgisi çizilir → nabız halkası →
         yazı harf harf yükselir → alt ince ilerleme çubuğu. Çıkışta hafif büyüyüp bulanıklaşarak kaybolur. */
      #app-splash {
        --sp-bg: #F4F6F9; --sp-ink: #121A24; --sp-ink3: #566475; --sp-accent: #1A5FB4; --sp-brand: #E0245E; --sp-glow: rgba(10,106,133,.16);
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(60vmax 60vmax at 50% 42%, var(--sp-glow), transparent 62%), var(--sp-bg);
        transition: opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1), filter .45s ease, visibility .45s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-ink: #32271D; --sp-ink3: #6A5846; --sp-accent: #7E5026; --sp-brand: #B8324F; --sp-glow: rgba(126,80,38,.14); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-ink: #E2E8F1; --sp-ink3: #8A97A8; --sp-accent: #5CC6E4; --sp-brand: #FF375F; --sp-glow: rgba(92,198,228,.14); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.04); filter: blur(6px); visibility: hidden; pointer-events: none; }
      .app-splash-mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .app-splash-logo { position: relative; width: 92px; height: 92px; animation: sp-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
      .app-splash-logo svg { position: relative; z-index: 1; width: 100%; height: 100%; filter: drop-shadow(0 14px 24px rgba(224,36,94,.28)); }
      .app-splash-box { fill: var(--sp-brand); }
      .app-splash-pulse { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 130; stroke-dashoffset: 130; animation: sp-draw .9s .35s cubic-bezier(.65,0,.35,1) forwards, sp-beat 1.6s 1.3s ease-in-out infinite; }
      .app-splash-ring { position: absolute; inset: 0; border-radius: 30px; border: 2px solid var(--sp-brand); opacity: 0; animation: sp-ring 1.6s 1s cubic-bezier(.22,1,.36,1) infinite; }
      .app-splash-word { display: flex; font-family: "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -.03em; color: var(--sp-ink); }
      .app-splash-word > span { display: inline-block; opacity: 0; transform: translateY(10px); animation: sp-up .5s cubic-bezier(.22,1,.36,1) forwards; }
      .app-splash-word > span.is-acc { color: var(--sp-accent); }
      .app-splash-word > span:nth-child(1) { animation-delay: .55s; } .app-splash-word > span:nth-child(2) { animation-delay: .6s; }
      .app-splash-word > span:nth-child(3) { animation-delay: .65s; } .app-splash-word > span:nth-child(4) { animation-delay: .7s; }
      .app-splash-word > span:nth-child(5) { animation-delay: .75s; } .app-splash-word > span:nth-child(6) { animation-delay: .8s; }
      .app-splash-sub { margin-top: -8px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; color: var(--sp-ink3); opacity: 0; animation: sp-fade .6s .95s ease forwards; }
      .app-splash-bar { position: absolute; left: 50%; bottom: max(48px, env(safe-area-inset-bottom)); width: 120px; height: 3px; margin-left: -60px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--sp-ink) 10%, transparent); opacity: 0; animation: sp-fade .4s 1s ease forwards; }
      .app-splash-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: inherit; background: var(--sp-accent); animation: sp-slide 1.1s ease-in-out infinite; }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-beat { 0%, 100% { transform: none; } 12% { transform: scale(1.06); } 24% { transform: none; } 36% { transform: scale(1.04); } }
      .app-splash-logo svg { transform-origin: 50% 50%; }
      .app-splash-logo { animation-name: sp-pop; }
      @keyframes sp-ring { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.55); } }
      @keyframes sp-up { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-slide { 0% { left: -40%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash *::after { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash-mark">
        <div class="app-splash-logo">
          <span class="app-splash-ring"></span>
          <svg viewBox="0 0 120 120">
            <rect class="app-splash-box" x="6" y="6" width="108" height="108" rx="30" />
            <path class="app-splash-pulse" d="M22 64 H44 L52 44 L62 84 L72 54 L78 64 H98" />
          </svg>
        </div>
        <div class="app-splash-word"><span>M</span><span>e</span><span class="is-acc">D</span><span class="is-acc">S</span><span>o</span><span>r</span></div>
        <div class="app-splash-sub">Tıp kurul soru havuzu</div>
      </div>
      <div class="app-splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
