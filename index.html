    <script>
      // Görünüm tercihi boyamadan önce uygulanır (tema/palet/yoğunluk yanıp sönmesin) — utils/appearance.ts ile aynı anahtar
      (function () {
        try {
          var d = document.documentElement, a = JSON.parse(localStorage.getItem('medsoru_appearance') || 'null');
          var legacy = localStorage.getItem('medsoru_theme');
          // Kayıtlı tercih yoksa açılış (ve uygulama) açık temayla başlar — sistem koyu olsa bile
          var mode = a && (a.mode === 'light' || a.mode === 'sepia' || a.mode === 'dark') ? a.mode : (legacy === 'dark' ? 'dark' : 'light');
          d.dataset.mode = mode;
          d.dataset.palette = (a && a.palettes && a.palettes[mode]) || 'a';
          d.dataset.density = (a && a.density) || 'normal';
          d.dataset.layout = (a && a.layout) || 'pano';
          if (mode === 'dark') d.classList.add('theme-dark');
          if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) d.classList.add('is-standalone');
        } catch (e) {}
      })();
    </script>
    <script>
      // Dağıtımdan sonra service worker eski index.html'i (artık sunucuda olmayan /assets/ parçalarıyla) verirse
      // uygulama açılış ekranında kalıyordu: eski kabuk parçası yüklenemeyince önbellekteki kabuğu sil ve yenile.
      window.__medsoruTazeYukle = function () {
        if (!navigator.onLine) return false;
        var son = Number(sessionStorage.getItem('medsoru_chunk_reload') || 0);
        if (Date.now() - son < 8000) return false;
        sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
        var bitti = function () { window.location.reload(); };
        try {
          if (!window.caches) return bitti(), true;
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              return caches.open(k).then(function (c) {
                return Promise.all(['/', '/index.html', location.pathname].map(function (u) { return c.delete(u, { ignoreSearch: true }); }));
              });
            }));
          }).then(bitti, bitti);
        } catch (e) { bitti(); }
        return true;
      };
      window.addEventListener('error', function (e) {
        var t = e.target;
        var src = t && (t.src || t.href) || '';
        if ((t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) && src.indexOf('/assets/') !== -1) window.__medsoruTazeYukle();
      }, true);
    </script>
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        if (!navigator.onLine) {
          event.preventDefault();
          return;
        }
        window.__medsoruTazeYukle();
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            // Çevrimdışıyken sayfayı yenileyip tarayıcının çevrimdışı hata sayfasına düşmesini engelle
            return;
          }
          window.__medsoruTazeYukle();
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
    <style>
      /* Açılış ekranı (v17) — Model 6 "Belirgin A": Model 5'in devamı — A daha belirgin (yüksek tepe, uzun açık bacaklar,

         Tek çizgi: EKG kalpten uzakta başlar (iki P-QRS-T), düz hatla kalbe girer; kalbin içinde kavisli yıldız-A çizer —
         kavisle sağ kola → düz çizgiyle sol kola → kavisle sağ ayağa → tepeye → sol ayağa → kavisle kalpten çıkar — ve sağda

         + pembe hale. Hız: yıldızın dışında 5, içinde 10 birim (dış 836 + yıldız 1155 + dış 846 birim; hareket
         döngünün ilk %85'i). Kalp ve arkasındaki hale ışık yıldızı bitirince atar; mini kalpler uçuşur. En az ~5 sn (App.tsx). */
      #app-splash {

        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;

        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-glow: rgba(184,50,79,.10); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-glow: rgba(255,92,134,.14); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.03); visibility: hidden; pointer-events: none; }
      .sp-logo { position: relative; width: min(560px, 94vw); aspect-ratio: 1112 / 410; animation: sp-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
      html.is-standalone .sp-logo { animation: none; }
      .sp-logo > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .sp-hg, .sp-aura { transform-box: view-box; transform-origin: 256px 215px; will-change: transform; animation: sp-beat 2.6s .3s ease-out infinite; }
      .sp-hg path { filter: drop-shadow(0 10px 18px rgba(242,61,94,.38)); }
      .sp-aura { animation-name: sp-aura; }
      .sp-d { stroke-dasharray: 1 1; animation: sp-draw 2.6s .3s linear both; }
      .sp-c { stroke-dasharray: 0.12 2; stroke-dashoffset: 0.12; animation: sp-comet 2.6s .3s linear infinite; }
      .sp-c.is-core { filter: drop-shadow(0 0 3px #fff); }
      .sp-p { position: absolute; width: 18px; height: 15px; opacity: 0; will-change: transform, opacity; animation: sp-up 2.8s ease-in infinite; }
      .sp-p svg { display: block; width: 100%; height: 100%; }
      .sp-p:nth-child(1) { left: 30%; bottom: 62%; width: 16px; height: 14px; animation-delay: 0.4s; }
      .sp-p:nth-child(2) { left: 33%; bottom: 8%; width: 22px; height: 19px; animation-delay: 1.5s; }
      .sp-p:nth-child(3) { left: 42%; bottom: 74%; width: 14px; height: 12px; animation-delay: 0.9s; }
      .sp-p:nth-child(4) { left: 47%; bottom: 2%; width: 18px; height: 15px; animation-delay: 2.0s; }
      .sp-p:nth-child(5) { left: 55%; bottom: 70%; width: 20px; height: 17px; animation-delay: 1.2s; }
      .sp-p:nth-child(6) { left: 60%; bottom: 6%; width: 14px; height: 12px; animation-delay: 0.6s; }
      .sp-p:nth-child(7) { left: 66%; bottom: 58%; width: 18px; height: 15px; animation-delay: 1.8s; }
      .sp-p:nth-child(8) { left: 69%; bottom: 14%; width: 22px; height: 19px; animation-delay: 1.0s; }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.7); } 100% { opacity: 1; transform: none; } }
      /* Uzaklık (pathLength=1) ↔ zaman: yıldıza giriş %29.5 → %31.4 · yıldızdan çıkış %70.2 → %53.2 · son %100 → %85 */
      @keyframes sp-draw { 0% { stroke-dashoffset: 1; } 31.4% { stroke-dashoffset: 0.705; } 53.2% { stroke-dashoffset: 0.298; } 85%, 100% { stroke-dashoffset: 0; } }
      @keyframes sp-comet { 0% { stroke-dashoffset: 0.12; } 31.4% { stroke-dashoffset: -0.175; } 53.2% { stroke-dashoffset: -0.582; } 85% { stroke-dashoffset: -0.88; } 92%, 100% { stroke-dashoffset: -1; } }
      @keyframes sp-beat { 0%, 49% { transform: none; } 55% { transform: scale(1.11); } 61% { transform: scale(1.01); } 66% { transform: scale(1.06); } 75%, 100% { transform: none; } }
      @keyframes sp-aura { 0%, 49% { transform: scale(1); opacity: .8; } 57% { transform: scale(1.12); opacity: 1; } 79%, 100% { transform: scale(1); opacity: .8; } }
      @keyframes sp-up { 0% { opacity: 0; transform: translateY(0) scale(.8); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-90px) scale(1.1) rotate(15deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash * { animation: none !important; transform: none !important; }
        .sp-logo { opacity: 1 !important; } .sp-d { stroke-dashoffset: 0; } .sp-p, .sp-c { display: none; }
