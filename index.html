    <script>
      // Görünüm tercihi boyamadan önce uygulanır (tema/palet/yoğunluk yanıp sönmesin) — utils/appearance.ts ile aynı anahtar
      (function () {
        try {
          var d = document.documentElement, a = JSON.parse(localStorage.getItem('medsoru_appearance') || 'null');
          var legacy = localStorage.getItem('medsoru_theme');
          // Kayıtlı tercih yoksa açılış (ve uygulama) açık temayla başlar — sistem koyu olsa bile
          var mode = a && (a.mode === 'light' || a.mode === 'sepia' || a.mode === 'dark') ? a.mode : (legacy === 'dark' ? 'dark' : 'light');
          d.dataset.mode = mode;
          d.dataset.palette = (a && a.palettes && a.palettes[mode]) || 'a';
          d.dataset.density = (a && a.density) || 'normal';
          if (mode === 'dark') d.classList.add('theme-dark');
          if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) d.classList.add('is-standalone');
        } catch (e) {}
      })();
    </script>
    <script>
      // Sürüm güncellemesi sonrası eski chunk önbellek hatasını otomatik yenile
      window.addEventListener('vite:preloadError', function(event) {
        if (!navigator.onLine) {
          event.preventDefault();
          return;
        }
        var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
        if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
          sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
          window.location.reload();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            // Çevrimdışıyken sayfayı yenileyip tarayıcının çevrimdışı hata sayfasına düşmesini engelle
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
          return;
        }
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
        if (
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf("reading 'default'") !== -1
        ) {
          if (!navigator.onLine) {
            return;
          }
          var lastReload = sessionStorage.getItem('medsoru_chunk_reload');
          if (!lastReload || (Date.now() - Number(lastReload) > 8000)) {
            sessionStorage.setItem('medsoru_chunk_reload', String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
    <style>
      /* Açılış ekranı (v9) — yeni simgeyle aynı çizim; TÜM hareketler GPU'da (transform/opacity):
         uygulama kodu yüklenirken ana iş parçacığı meşgul olsa da takılmaz.
         Sıra: simge yaylanarak belirir → EKG çizgisi soldan sağa TAMAMEN çizilir (iki katmanlı silme: dış katman
         sağa kayarken iç katman ters yönde kayar, çizgi yerinde durur) → nabız atar + halka → yazı → ince çubuk.
         Yüklü uygulamada (standalone) sistem açılış ekranı aynı simgeyi zaten gösterdiği için simge girişsiz başlar. */
      #app-splash {
        --sp-bg: #F4F6F9; --sp-ink: #121A24; --sp-ink3: #566475; --sp-accent: #1A5FB4; --sp-glow: rgba(232,48,106,.10);
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(60vmax 60vmax at 50% 42%, var(--sp-glow), transparent 62%), var(--sp-bg);
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
      }
      html[data-mode="sepia"] #app-splash { --sp-bg: #F3ECDD; --sp-ink: #32271D; --sp-ink3: #6A5846; --sp-accent: #7E5026; --sp-glow: rgba(184,50,79,.10); }
      html[data-mode="dark"] #app-splash { --sp-bg: #0D1420; --sp-ink: #E2E8F1; --sp-ink3: #8A97A8; --sp-accent: #5CC6E4; --sp-glow: rgba(255,92,134,.12); }
      #app-splash.is-leaving { opacity: 0; transform: scale(1.03); visibility: hidden; pointer-events: none; }
      .app-splash-mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .sp-logo { position: relative; width: 96px; height: 96px; will-change: transform;
        animation: sp-pop .55s cubic-bezier(.34,1.56,.64,1) both, sp-beat 1.6s 1.15s ease-in-out infinite; }
      html.is-standalone .sp-logo { animation: sp-beat 1.6s 1.15s ease-in-out infinite; }
      .sp-clip { position: absolute; inset: 0; border-radius: 22.6%; overflow: hidden; box-shadow: 0 14px 28px -10px rgba(200,20,80,.45); transform: translateZ(0); }
      .sp-clip > svg, .sp-wipe, .sp-wipe-in, .sp-wipe-in > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .sp-wipe, .sp-wipe-in { will-change: transform; animation-duration: .72s; animation-delay: .22s; animation-timing-function: cubic-bezier(.45,0,.25,1); animation-fill-mode: both; }
      .sp-wipe { overflow: hidden; animation-name: sp-wipe-out; }
      .sp-wipe-in { animation-name: sp-wipe-in; }
      .sp-ring { position: absolute; inset: 0; border-radius: 22.6%; border: 2px solid #E8306A; opacity: 0; will-change: transform, opacity; animation: sp-ring 1.6s 1.15s cubic-bezier(.22,1,.36,1) infinite; }
      .app-splash-word { display: flex; font-family: "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -.03em; color: var(--sp-ink); }
      .app-splash-word > span { display: inline-block; opacity: 0; transform: translateY(10px); animation: sp-up .45s cubic-bezier(.22,1,.36,1) forwards; }
      .app-splash-word > span.is-acc { color: var(--sp-accent); }
      .app-splash-word > span:nth-child(1) { animation-delay: .5s; } .app-splash-word > span:nth-child(2) { animation-delay: .55s; }
      .app-splash-word > span:nth-child(3) { animation-delay: .6s; } .app-splash-word > span:nth-child(4) { animation-delay: .65s; }
      .app-splash-word > span:nth-child(5) { animation-delay: .7s; } .app-splash-word > span:nth-child(6) { animation-delay: .75s; }
      .app-splash-sub { margin-top: -8px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; color: var(--sp-ink3); opacity: 0; animation: sp-fade .5s .9s ease forwards; }
      .app-splash-bar { position: absolute; left: 50%; bottom: max(48px, env(safe-area-inset-bottom)); width: 120px; height: 3px; margin-left: -60px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--sp-ink) 10%, transparent); opacity: 0; animation: sp-fade .4s 1.1s ease forwards; }
      .app-splash-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: inherit; background: #E8306A; will-change: transform; animation: sp-slide 1.1s 1.1s ease-in-out infinite; transform: translateX(-100%); }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-wipe-out { from { transform: translateX(-100%); } to { transform: none; } }
      @keyframes sp-wipe-in { from { transform: translateX(100%); } to { transform: none; } }
      @keyframes sp-beat { 0%, 100% { transform: none; } 10% { transform: scale(1.07); } 22% { transform: none; } 34% { transform: scale(1.04); } 46% { transform: none; } }
      @keyframes sp-ring { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(1.55); } }
      @keyframes sp-up { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash *, #app-splash *::after { animation: none !important; opacity: 1 !important; transform: none !important; }
        .sp-ring, .app-splash-bar { display: none; }
      }
    </style>

  <body>
    <div id="app-splash" aria-hidden="true">
