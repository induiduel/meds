<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">GABA-A kanalı: aynı kapı, iki farklı etki</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="80" width="400" height="290" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="260" y="124" text-anchor="middle" font-size="27" font-weight="bold" fill="#1d4ed8">Benzodiazepin</text>
    <text x="260" y="162" text-anchor="middle" font-size="24" fill="#1e293b">daha sık açtırır</text>
    <path d="M110 250 h40 v-60 h40 v60 h40 v-60 h40 v60 h40 v-60 h40 v60 h40" stroke="#2563eb" stroke-width="5" fill="none"/>
    <text x="260" y="320" text-anchor="middle" font-size="23" fill="#475569">açılma sıklığı artar</text>

    <rect x="540" y="80" width="400" height="290" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="740" y="124" text-anchor="middle" font-size="27" font-weight="bold" fill="#6d28d9">Barbitürat</text>
    <text x="740" y="162" text-anchor="middle" font-size="24" fill="#1e293b">daha uzun açık tutar</text>
    <path d="M590 250 h30 v-60 h220 v60 h40" stroke="#7c3aed" stroke-width="5" fill="none"/>
    <text x="740" y="320" text-anchor="middle" font-size="23" fill="#475569">açık kalma süresi uzar</text>

    <rect x="60" y="400" width="880" height="110" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="500" y="444" text-anchor="middle" font-size="25" fill="#1e293b">İkisinde de içeri klorür girer, nöron hiperpolarize olur.</text>
    <text x="500" y="484" text-anchor="middle" font-size="25" font-weight="bold" fill="#b91c1c">Sonuç: bilinç kapanır.</text>
  </g>
</svg>
