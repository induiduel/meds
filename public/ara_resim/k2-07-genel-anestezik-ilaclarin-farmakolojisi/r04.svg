<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <radialGradient id="alv" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#93c5fd"/></radialGradient>
    <linearGradient id="kan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="okn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/></marker>
    <g id="n2o"><circle r="8" fill="#6366f1" stroke="#3730a3" stroke-width="1.5"/></g>
    <g id="sevo"><path d="M0 -9 L8 5 L-8 5 z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/></g>
    <g id="o2"><circle r="8" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/></g>
    <path id="kese" d="M60 310 C30 230 90 170 170 180 C230 150 320 180 330 240 C380 270 360 330 300 340 C260 370 100 370 60 310 z"/>
  </defs>
  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Azot protoksit: ikinci gaz etkisi ve difüzyon hipoksisi</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">İki etki de gazın alveolle kan arasında çok hızlı yer değiştirmesinden doğar (slayt 29)</text>

  <!-- PANEL A: verirken -->
  <rect x="30" y="100" width="560" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Verirken: ikinci gaz etkisi</text>
  <use href="#kese" x="40" y="0" fill="url(#alv)" stroke="#1d4ed8" stroke-width="2.5"/>
  <use href="#n2o" x="150" y="230"/><use href="#n2o" x="190" y="210"/><use href="#n2o" x="250" y="225"/><use href="#n2o" x="300" y="260"/>
  <use href="#sevo" x="210" y="270"/><use href="#sevo" x="240" y="290"/><use href="#sevo" x="270" y="275"/><use href="#sevo" x="180" y="295"/>
  <path d="M70 420 C180 400 330 440 560 410" stroke="url(#kan)" stroke-width="40" fill="none" stroke-linecap="round"/>
  <path d="M160 320 C160 350 162 375 164 398" stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#okn)"/>
  <path d="M210 330 C210 355 212 378 214 400" stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#okn)"/>
  <path d="M320 330 C322 355 324 378 326 398" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <use href="#n2o" x="170" y="420"/><use href="#n2o" x="225" y="425"/><use href="#n2o" x="280" y="428"/><use href="#sevo" x="335" y="430"/>
  <line x1="300" y1="200" x2="420" y2="170" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="426" y="168" font-size="17" fill="#1e3a8a" font-weight="bold">Alveol</text>
  <text x="400" y="230" font-size="17" fill="#3730a3">● azot protoksit</text>
  <text x="400" y="256" font-size="17" fill="#92400e">▲ sevofluran</text>
  <text x="80" y="480" font-size="17" fill="#991b1b" font-weight="bold">Kapiller kan</text>
  <text x="54" y="514" font-size="17" fill="#1e293b">%50'den yüksek azot protoksit kana çok hızlı geçer;</text>
  <text x="54" y="540" font-size="17" fill="#1e293b">kalan sevofluran yoğunlaşır, onun alımı da hızlanır.</text>

  <!-- PANEL B: keserken -->
  <rect x="610" y="100" width="560" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="634" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Keserken: difüzyon hipoksisi</text>
  <use href="#kese" x="620" y="0" fill="url(#alv)" stroke="#1d4ed8" stroke-width="2.5"/>
  <use href="#n2o" x="730" y="220"/><use href="#n2o" x="770" y="250"/><use href="#n2o" x="820" y="215"/><use href="#n2o" x="860" y="260"/><use href="#n2o" x="900" y="235"/><use href="#n2o" x="790" y="295"/><use href="#n2o" x="850" y="300"/>
  <use href="#o2" x="760" y="200"/><use href="#o2" x="880" y="290"/>
  <path d="M650 420 C760 400 910 440 1140 410" stroke="url(#kan)" stroke-width="40" fill="none" stroke-linecap="round"/>
  <use href="#n2o" x="760" y="420"/><use href="#n2o" x="830" y="425"/><use href="#n2o" x="900" y="428"/>
  <path d="M760 396 C760 375 758 352 756 330" stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#okn)"/>
  <path d="M830 398 C830 375 828 352 826 330" stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#okn)"/>
  <path d="M900 400 C900 375 898 352 896 330" stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#okn)"/>
  <line x1="884" y1="296" x2="990" y2="190" stroke="#991b1b" stroke-width="1.5"/>
  <text x="996" y="186" font-size="17" fill="#991b1b" font-weight="bold">● oksijen</text>
  <text x="996" y="208" font-size="17" fill="#991b1b">seyrelir</text>
  <text x="660" y="480" font-size="17" fill="#991b1b" font-weight="bold">Kandaki azot protoksit alveole döner</text>
  <rect x="634" y="496" width="512" height="60" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="532" font-size="17" fill="#065f46" font-weight="bold">Önlem: %100 oksijenle 5–10 dakika ventilasyon</text>

  <!-- PANEL C -->
  <rect x="30" y="590" width="1140" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="626" font-size="22" font-weight="bold" fill="#0f172a">C · Kapalı boşluklar ve ilacın yeri</text>
  <path d="M90 700 C90 660 150 650 160 690 C170 730 100 740 90 700 z" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <path d="M70 700 C70 640 180 630 185 690 C190 750 75 760 70 700 z" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M190 690 h30" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
  <text x="230" y="672" font-size="17" fill="#1e293b" font-weight="bold">Hava içeren kapalı boşluk balon gibi şişer:</text>
  <text x="230" y="698" font-size="17" fill="#1e293b">pnömotoraks, orta kulak, bağırsak ileusu.</text>
  <line x1="640" y1="646" x2="640" y2="746" stroke="#cbd5e1" stroke-width="2"/>
  <text x="664" y="672" font-size="17" fill="#3730a3" font-weight="bold">MAK 105: tek başına anestezi için yetersiz.</text>
  <text x="664" y="698" font-size="17" fill="#3730a3">Güçlü analjezik, zayıf hipnotik; NMDA antagonizması.</text>
  <text x="664" y="724" font-size="17" fill="#3730a3">Amaç: birlikte verilen volatil ajanın dozunu düşürmek.</text>
  <text x="600" y="766" text-anchor="middle" font-size="17" fill="#475569">Verirken alveolden kana, keserken kandan alveole: yön değişir, etki tersine döner.</text>
</svg>
