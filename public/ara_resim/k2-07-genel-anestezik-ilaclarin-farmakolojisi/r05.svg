<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">Sinirden kasa: dört adım</text>
  <defs><marker id="okn" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M0 0 L20 11 L0 22 z" fill="#475569"/></marker></defs>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="110" width="200" height="190" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="140" y="152" text-anchor="middle" font-size="26" font-weight="bold" fill="#334155">1</text>
    <text x="140" y="196" text-anchor="middle" font-size="22" fill="#1e293b">Sinir ucundan</text>
    <text x="140" y="226" text-anchor="middle" font-size="22" font-weight="bold" fill="#0e7490">asetilkolin</text>
    <text x="140" y="256" text-anchor="middle" font-size="22" fill="#1e293b">salınır.</text>

    <rect x="270" y="110" width="200" height="190" rx="16" fill="#cffafe" stroke="#0e7490" stroke-width="3"/>
    <text x="370" y="152" text-anchor="middle" font-size="26" font-weight="bold" fill="#155e75">2</text>
    <text x="370" y="196" text-anchor="middle" font-size="21" fill="#1e293b">Asetilkolin nikotinik</text>
    <text x="370" y="226" text-anchor="middle" font-size="21" fill="#1e293b">reseptöre bağlanır,</text>
    <text x="370" y="256" text-anchor="middle" font-size="21" fill="#1e293b">uç plak uyarılır.</text>

    <rect x="500" y="110" width="200" height="190" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="600" y="152" text-anchor="middle" font-size="26" font-weight="bold" fill="#9a3412">3</text>
    <text x="600" y="196" text-anchor="middle" font-size="22" fill="#1e293b">Kalsiyum salınır,</text>
    <text x="600" y="226" text-anchor="middle" font-size="22" font-weight="bold" fill="#9a3412">kas kasılır.</text>

    <rect x="730" y="110" width="230" height="190" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <text x="845" y="152" text-anchor="middle" font-size="26" font-weight="bold" fill="#334155">4</text>
    <text x="845" y="196" text-anchor="middle" font-size="22" fill="#1e293b">Asetilkolinesteraz</text>
    <text x="845" y="226" text-anchor="middle" font-size="22" fill="#1e293b">yıkar, uyarı biter.</text>

    <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#okn)">
      <path d="M242 205 h22"/><path d="M472 205 h22"/><path d="M702 205 h22"/>
    </g>
    <rect x="120" y="356" width="760" height="78" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="500" y="404" text-anchor="middle" font-size="24" fill="#1e293b">Kas gevşeticiler bu zinciri ikinci adımda, reseptör düzeyinde keser.</text>
  </g>
</svg>
