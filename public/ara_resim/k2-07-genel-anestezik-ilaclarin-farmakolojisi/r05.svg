<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="sinir" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="kas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <g id="vez"><circle r="13" fill="#ffffff" stroke="#a16207" stroke-width="2"/><circle r="3" cx="-4" cy="-2" fill="#16a34a"/><circle r="3" cx="4" cy="3" fill="#16a34a"/></g>
    <g id="ach"><circle r="5" fill="#16a34a" stroke="#14532d" stroke-width="1"/></g>
    <g id="rsp"><path d="M-10 0 v-26 q10 -10 20 0 v26 z" fill="#38bdf8" stroke="#075985" stroke-width="2"/></g>
    <g id="no"><circle r="15" fill="#1e293b"/><text y="6" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">1</text></g>
  </defs>
  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Sinirden kasa iletim: dört adım</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Nöromüsküler kavşak kesiti; asetilkolin salınımından yıkılmasına (slayt 37, 38)</text>

  <!-- PANEL A -->
  <rect x="30" y="100" width="760" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Motor sinir ucu ve motor uç plak</text>
  <!-- sinir ucu -->
  <path d="M120 150 C120 200 110 230 150 260 C200 300 480 300 530 260 C570 230 560 200 560 150 z" fill="url(#sinir)" stroke="#a16207" stroke-width="2.5"/>
  <use href="#vez" x="230" y="220"/><use href="#vez" x="290" y="240"/><use href="#vez" x="350" y="225"/><use href="#vez" x="410" y="245"/><use href="#vez" x="470" y="222"/>
  <path d="M160 170 h120" stroke="#ca8a04" stroke-width="3" marker-end="url(#ok)"/>
  <text x="300" y="176" font-size="17" fill="#713f12" font-weight="bold">aksiyon potansiyeli</text>
  <text x="590" y="200" font-size="17" fill="#713f12" font-weight="bold">Motor sinir ucu</text>
  <text x="590" y="222" font-size="17" fill="#713f12">kesecikte asetilkolin</text>
  <!-- ekzositoz -->
  <path d="M330 278 q10 18 20 0" fill="#fff" stroke="#a16207" stroke-width="2"/>
  <use href="#ach" x="320" y="306"/><use href="#ach" x="340" y="316"/><use href="#ach" x="360" y="304"/><use href="#ach" x="300" y="318"/><use href="#ach" x="380" y="320"/><use href="#ach" x="430" y="312"/>
  <text x="590" y="300" font-size="17" fill="#14532d" font-weight="bold">Sinaptik aralık</text>
  <text x="590" y="322" font-size="17" fill="#14532d">Ca²⁺ ile ekzositoz</text>
  <!-- kas zarı katlantılı -->
  <path d="M90 350 q40 0 50 30 q10 -30 50 -30 q40 0 50 30 q10 -30 50 -30 q40 0 50 30 q10 -30 50 -30 q40 0 50 30 q10 -30 50 -30 q40 0 50 30 q10 -30 40 -30 V480 H90 z" fill="url(#kas)" stroke="#7f1d1d" stroke-width="2.5"/>
  <use href="#rsp" x="190" y="352"/><use href="#rsp" x="290" y="352"/><use href="#rsp" x="390" y="352"/><use href="#rsp" x="490" y="352"/>
  <use href="#ach" x="390" y="330"/>
  <path d="M470 340 l14 -10 l14 10 l-14 10 z" fill="#a855f7" stroke="#581c87" stroke-width="2"/>
  <line x1="498" y1="340" x2="586" y2="372" stroke="#581c87" stroke-width="1.5"/>
  <text x="590" y="372" font-size="17" fill="#581c87" font-weight="bold">Asetilkolinesteraz</text>
  <text x="590" y="394" font-size="17" fill="#581c87">kolin + asetat</text>
  <line x1="200" y1="330" x2="150" y2="300" stroke="#075985" stroke-width="1.5"/>
  <text x="54" y="296" font-size="17" fill="#075985" font-weight="bold">Nikotinik reseptör</text>
  <text x="590" y="446" font-size="17" fill="#7f1d1d" font-weight="bold">Kas lifi</text>
  <text x="590" y="468" font-size="17" fill="#7f1d1d">motor uç plak</text>
  <use href="#no" x="100" y="240"/>
  <g transform="translate(250 318)"><circle r="15" fill="#1e293b"/><text y="6" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">2</text></g>
  <g transform="translate(160 440)"><circle r="15" fill="#1e293b"/><text y="6" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">3</text></g>
  <g transform="translate(470 310)"><circle r="15" fill="#1e293b"/><text y="6" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">4</text></g>
  <text x="54" y="520" font-size="17" fill="#475569">Asetilkolin nikotinik reseptöre bağlanınca Na⁺ ve K⁺ kanalları açılır</text><text x="54" y="544" font-size="17" fill="#475569">ve motor uç plak potansiyeli oluşur.</text>

  <!-- PANEL B: adımlar -->
  <rect x="810" y="100" width="360" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="834" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Adım adım</text>
  <g font-size="17" fill="#1e293b">
    <text x="834" y="176" font-weight="bold">1 · Salınım</text>
    <text x="834" y="198">Aksiyon potansiyeli sinir ucuna</text>
    <text x="834" y="220">ulaşır, asetilkolin salınır.</text>
    <text x="834" y="266" font-weight="bold">2 · Bağlanma</text>
    <text x="834" y="288">Nikotinik reseptöre bağlanır,</text>
    <text x="834" y="310">uç plak potansiyeli oluşur.</text>
    <text x="834" y="356" font-weight="bold">3 · Kasılma</text>
    <text x="834" y="378">Yeterli potansiyel kasta aksiyon</text>
    <text x="834" y="400">potansiyeli doğurur; sarkoplazmik</text>
    <text x="834" y="422">retikulumdan Ca²⁺ salınır.</text>
    <text x="834" y="468" font-weight="bold">4 · Sonlanma</text>
    <text x="834" y="490">Enzim asetilkolini yıkar,</text>
    <text x="834" y="512">reseptör serbest kalır,</text>
    <text x="834" y="534">depolarizasyon biter.</text>
  </g>

  <!-- PANEL C -->
  <rect x="30" y="590" width="1140" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="626" font-size="22" font-weight="bold" fill="#0f172a">C · Blokörler zinciri reseptörde iki farklı yoldan keser</text>
  <g font-size="17">
    <rect x="54" y="646" width="540" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="70" y="676" font-weight="bold" fill="#7f1d1d">Depolarizan blokör (non-kompetitif)</text>
    <text x="70" y="702" fill="#7f1d1d">Reseptörü aktive eder ve kalıcı</text>
    <text x="70" y="726" fill="#7f1d1d">depolarizasyon oluşturur.</text>
    <rect x="606" y="646" width="540" height="92" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="622" y="676" font-weight="bold" fill="#0c4a6e">Non-depolarizan blokör (kompetitif)</text>
    <text x="622" y="702" fill="#0c4a6e">Asetilkolinle yarışır, reseptörü</text>
    <text x="622" y="726" fill="#0c4a6e">bloke eder.</text>
  </g>
  <text x="600" y="766" text-anchor="middle" font-size="17" fill="#475569">Kas gevşeticiler bu zinciri motor uç plaktaki nikotinik reseptörde keser.</text>
</svg>
