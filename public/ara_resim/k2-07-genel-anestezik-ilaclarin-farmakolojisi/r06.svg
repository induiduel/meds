<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">İki blok, iki farklı anahtar</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="50" y="86" width="420" height="300" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="260" y="130" text-anchor="middle" font-size="26" font-weight="bold" fill="#9a3412">Depolarizan: süksinilkolin</text>
    <text x="260" y="176" text-anchor="middle" font-size="23" fill="#1e293b">Reseptörü açar ve açık bırakır.</text>
    <text x="260" y="214" text-anchor="middle" font-size="23" fill="#1e293b">Kas önce seğirir, sonra gevşer.</text>
    
    <rect x="90" y="286" width="340" height="76" rx="12" fill="#fed7aa"/>
    <text x="260" y="320" text-anchor="middle" font-size="23" fill="#7c2d12">Asetilkolin artarsa</text>
    <text x="260" y="350" text-anchor="middle" font-size="24" font-weight="bold" fill="#b91c1c">blok kötüleşir</text>

    <rect x="530" y="86" width="420" height="300" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="740" y="130" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d4ed8">Non-depolarizan: kürar tipi</text>
    <text x="740" y="176" text-anchor="middle" font-size="23" fill="#1e293b">Asetilkolinle yarışır, açmaz.</text>
    <text x="740" y="214" text-anchor="middle" font-size="23" fill="#1e293b">Seğirme olmaz, kas gevşer.</text>
    
    <rect x="570" y="286" width="340" height="76" rx="12" fill="#bfdbfe"/>
    <text x="740" y="320" text-anchor="middle" font-size="23" fill="#1e3a8a">Asetilkolin artarsa</text>
    <text x="740" y="350" text-anchor="middle" font-size="24" font-weight="bold" fill="#15803d">blok çözülür</text>

    <rect x="120" y="430" width="760" height="94" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="500" y="468" text-anchor="middle" font-size="24" fill="#1e293b">Kolinesteraz inhibitörü asetilkolini artırır.</text>
    <text x="500" y="502" text-anchor="middle" font-size="24" font-weight="bold" fill="#b91c1c">Bu yüzden yalnız non-depolarizan blokta antidottur.</text>
  </g>
</svg>
