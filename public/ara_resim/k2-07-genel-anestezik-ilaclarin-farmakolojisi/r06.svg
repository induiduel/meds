<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="rs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="okr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
    <g id="fos"><circle r="7" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/><path d="M-3 7 q-2 12 1 22 M3 7 q2 12 -1 22" stroke="#c2410c" stroke-width="2" fill="none"/></g>
    <g id="zar">
      <use href="#fos" x="20" y="0"/><use href="#fos" x="46" y="0"/><use href="#fos" x="72" y="0"/><use href="#fos" x="98" y="0"/><use href="#fos" x="124" y="0"/>
      <use href="#fos" x="310" y="0"/><use href="#fos" x="336" y="0"/><use href="#fos" x="362" y="0"/><use href="#fos" x="388" y="0"/><use href="#fos" x="414" y="0"/>
      <g transform="translate(0 66) scale(1 -1)">
        <use href="#fos" x="20" y="0"/><use href="#fos" x="46" y="0"/><use href="#fos" x="72" y="0"/><use href="#fos" x="98" y="0"/><use href="#fos" x="124" y="0"/>
        <use href="#fos" x="310" y="0"/><use href="#fos" x="336" y="0"/><use href="#fos" x="362" y="0"/><use href="#fos" x="388" y="0"/><use href="#fos" x="414" y="0"/>
      </g>
    </g>
    <g id="ach"><circle r="9" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/></g>
    <g id="na"><circle r="11" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">+</text></g>
  </defs>
  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Depolarizan ve non-depolarizan blok: asetilkolin artınca ne olur</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Aynı nikotinik reseptör, iki farklı anahtar (slayt 39, 40)</text>

  <!-- PANEL A -->
  <rect x="30" y="100" width="560" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="136" font-size="22" font-weight="bold" fill="#991b1b">A · Süksinilkolin (depolarizan)</text>
  <use href="#zar" x="70" y="270"/>
  <path d="M206 210 q-10 60 4 120 q4 30 14 50 h34 q4 -60 -2 -110 q-4 -40 -12 -60 z" fill="url(#rs)" stroke="#075985" stroke-width="2.5"/>
  <path d="M374 210 q10 60 -4 120 q-4 30 -14 50 h-34 q-4 -60 2 -110 q4 -40 12 -60 z" fill="url(#rs)" stroke="#075985" stroke-width="2.5"/>
  <path d="M240 220 l12 -14 l12 14 l-12 14 z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M316 220 l12 -14 l12 14 l-12 14 z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <use href="#na" x="290" y="190"/><use href="#na" x="290" y="290"/>
  <path d="M290 206 C290 240 290 260 290 274" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <path d="M290 306 C290 330 290 350 290 372" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <line x1="340" y1="210" x2="420" y2="172" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="380" y="164" font-size="17" fill="#7f1d1d" font-weight="bold">süksinilkolin bağlı</text>
  <text x="380" y="252" font-size="17" fill="#075985" font-weight="bold">kanal açık kalır</text>
  <text x="54" y="420" font-size="17" fill="#1e293b">Reseptör sürekli uyarılır: kalıcı depolarizasyon.</text>
  <text x="54" y="444" font-size="17" fill="#1e293b">Kas önce seğirir, sonra yorulup gevşer.</text>
  <rect x="54" y="466" width="512" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="498" font-size="17" fill="#7f1d1d" font-weight="bold">Asetilkolin artarsa: blok KÖTÜLEŞİR</text>
  <text x="70" y="524" font-size="17" fill="#7f1d1d">Fazladan asetilkolin uyarıyı daha da artırır.</text>

  <!-- PANEL B -->
  <rect x="610" y="100" width="560" height="470" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="634" y="136" font-size="22" font-weight="bold" fill="#0c4a6e">B · Non-depolarizan blokör (kompetitif)</text>
  <use href="#zar" x="650" y="270"/>
  <path d="M800 210 q-6 60 6 120 q4 30 14 50 h34 q8 -60 4 -110 q-4 -40 -8 -60 z" fill="url(#rs)" stroke="#075985" stroke-width="2.5"/>
  <path d="M940 210 q6 60 -6 120 q-4 30 -14 50 h-34 q-8 -60 -4 -110 q4 -40 8 -60 z" fill="url(#rs)" stroke="#075985" stroke-width="2.5"/>
  <path d="M858 216 h24" stroke="#075985" stroke-width="6"/>
  <rect x="818" y="196" width="28" height="28" rx="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="894" y="196" width="28" height="28" rx="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <use href="#ach" x="790" y="166"/><use href="#ach" x="950" y="170"/><use href="#ach" x="870" y="160"/>
  <path d="M790 176 C800 186 806 190 812 194" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>
  <line x1="922" y1="210" x2="990" y2="220" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="996" y="224" font-size="17" fill="#1e3a8a" font-weight="bold">blokör yeri kapar</text>
  <text x="996" y="246" font-size="17" fill="#1e3a8a">kanal açılmaz</text>
  <line x1="958" y1="166" x2="1000" y2="150" stroke="#14532d" stroke-width="1.5"/>
  <text x="1006" y="154" font-size="17" fill="#14532d" font-weight="bold">asetilkolin</text>
  <text x="634" y="420" font-size="17" fill="#1e293b">Blokör asetilkolinle aynı yer için yarışır</text>
  <text x="634" y="444" font-size="17" fill="#1e293b">(kompetitif); reseptörü açmaz.</text>
  <rect x="634" y="466" width="512" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="498" font-size="17" fill="#14532d" font-weight="bold">Asetilkolin artarsa: blok ÇÖZÜLÜR</text>
  <text x="650" y="524" font-size="17" fill="#14532d">Çoğalan asetilkolin yarışı kazanır.</text>

  <!-- PANEL C -->
  <rect x="30" y="590" width="1140" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="626" font-size="22" font-weight="bold" fill="#0f172a">C · Kolinesteraz inhibitörü verilirse</text>
  <g font-size="17">
    <rect x="54" y="648" width="300" height="86" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="204" y="684" text-anchor="middle" font-weight="bold" fill="#4c1d95">Kolinesteraz inhibitörü</text>
    <text x="204" y="710" text-anchor="middle" fill="#4c1d95">asetilkolin artar</text>
    <path d="M358 668 C400 660 420 660 452 664" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#okr)"/>
    <path d="M358 714 C400 722 420 722 452 718" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
    <text x="462" y="670" fill="#7f1d1d" font-weight="bold">Depolarizan blok: kas felci kötüleşir</text>
    <text x="462" y="724" fill="#14532d" font-weight="bold">Non-depolarizan blok: geri çevrilir</text>
  </g>
  <text x="600" y="766" text-anchor="middle" font-size="17" fill="#475569">Bu yüzden kolinesteraz inhibitörleri yalnız non-depolarizan bloğu geri çevirmek için kullanılır.</text>
</svg>
