<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <radialGradient id="beyin" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#f9a8d4"/></radialGradient>
    <linearGradient id="kc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6a07a"/><stop offset="1" stop-color="#92400e"/></linearGradient>
    <linearGradient id="rs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <radialGradient id="halka" cx="0.5" cy="0.5" r="0.6"><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#a78bfa"/></radialGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <g id="ilac"><circle r="7" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/></g>
  </defs>
  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Uyanmanın iki yolu ve uyanmayı gölgeleyen üç sorun</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Farmakokinetik hızlanma, farmakodinamik tersleme ve uyanma döneminin riskleri (slayt 53, 54)</text>

  <!-- PANEL A -->
  <rect x="30" y="100" width="560" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Farmakokinetik: ilaç ortamdan uzaklaşır</text>
  <path d="M290 160 c-50 0 -75 35 -62 70 c-25 25 0 65 38 58 c25 26 88 26 112 0 c38 6 62 -36 38 -64 c12 -42 -38 -72 -76 -60 c-12 -14 -38 -12 -50 -4 z" fill="url(#beyin)" stroke="#be185d" stroke-width="2.5"/>
  <path d="M262 205 q25 -18 50 0 q25 18 50 0 M258 245 q30 -14 60 0 q25 14 50 0" stroke="#be185d" stroke-width="1.8" fill="none"/>
  <use href="#ilac" x="290" y="225"/><use href="#ilac" x="330" y="260"/><use href="#ilac" x="350" y="215"/>
  <text x="300" y="312" font-size="17" fill="#9d174d" font-weight="bold" text-anchor="middle">Beyin</text>
  <!-- yağ/kas -->
  <path d="M220 270 C170 300 140 330 128 370" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#okm)"/>
  <circle cx="100" cy="400" r="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><circle cx="134" cy="410" r="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><circle cx="116" cy="440" r="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="70" y="490" font-size="17" fill="#92400e" font-weight="bold">Redistribüsyon:</text>
  <text x="70" y="512" font-size="17" fill="#92400e">yağ ve kasa dağılır</text>
  <!-- karaciğer + böbrek -->
  <path d="M380 270 C420 300 440 330 450 360" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#okm)"/>
  <path d="M400 380 C430 360 520 360 545 385 C555 410 520 430 470 432 C430 434 395 410 400 380 z" fill="url(#kc)" stroke="#78350f" stroke-width="2"/>
  <path d="M470 445 c-25 0 -30 30 -10 40 c-15 15 5 35 22 22 c10 -12 0 -25 -5 -30 c8 -10 5 -32 -7 -32 z" fill="#c084fc" stroke="#6b21a8" stroke-width="2" transform="translate(30 -10)"/>
  <text x="330" y="490" font-size="17" fill="#78350f" font-weight="bold">Klirens: karaciğer</text>
  <text x="330" y="512" font-size="17" fill="#78350f">ve böbrek yoluyla</text>

  <!-- PANEL B -->
  <rect x="610" y="100" width="560" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="634" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Farmakodinamik: tersleme ilaçları</text>
  <path d="M640 300 C760 290 1000 310 1150 300 V330 C1000 340 760 320 640 330 z" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
  <path d="M700 300 q-6 -50 10 -80 h40 q16 30 10 80 z" fill="url(#rs)" stroke="#075985" stroke-width="2.5"/>
  <path d="M716 216 q14 -16 28 0" fill="#fff" stroke="#075985" stroke-width="2"/>
  <circle cx="730" cy="190" r="12" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <path d="M742 180 C770 160 790 160 806 168" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ok)"/>
  <path d="M660 214 l12 -12 l12 12 l-12 12 z" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="812" y="172" font-size="17" fill="#14532d" font-weight="bold">agonist yerinden edilir</text>
  <text x="634" y="374" font-size="17" fill="#1e3a8a" font-weight="bold">Nalokson, flumazenil:</text>
  <text x="634" y="396" font-size="17" fill="#1e3a8a">agonistin yerini alır</text>
  <path d="M1020 240 C1020 220 1070 220 1070 240 C1070 260 1020 260 1020 240 z" fill="url(#halka)" stroke="#6d28d9" stroke-width="3"/>
  <rect x="1036" y="231" width="18" height="18" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="900" y="374" font-size="17" fill="#4c1d95" font-weight="bold">Sugammadex:</text>
  <text x="900" y="396" font-size="17" fill="#4c1d95">reseptöre bağlanmaz,</text>
  <text x="900" y="418" font-size="17" fill="#4c1d95">kas gevşeticiyi kanda sarar</text>
  <rect x="634" y="444" width="512" height="66" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="472" font-size="17" fill="#065f46" font-weight="bold">Güvenli ve hızlı uyanma iki stratejinin</text>
  <text x="650" y="496" font-size="17" fill="#065f46" font-weight="bold">birlikte yürütülmesine dayanır.</text>

  <!-- PANEL C -->
  <rect x="30" y="548" width="1140" height="232" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="582" font-size="22" font-weight="bold" fill="#0f172a">C · Uyanmayı gölgeleyen üç sorun</text>
  <g font-size="17">
    <rect x="54" y="598" width="350" height="140" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="70" y="626" font-weight="bold" fill="#7f1d1d">1 · Yetersiz analjezi</text>
    <text x="70" y="652" fill="#7f1d1d">Ağrı → sempatik aktivasyon</text>
    <text x="70" y="676" fill="#7f1d1d">→ hipertansiyon, taşikardi,</text>
    <text x="70" y="700" fill="#7f1d1d">ajitasyon döngüsü.</text>
    <rect x="424" y="598" width="350" height="140" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="440" y="626" font-weight="bold" fill="#4c1d95">2 · Fazla, uzamış sedasyon</text>
    <text x="440" y="652" fill="#4c1d95">Aşırı doz ya da birikim →</text>
    <text x="440" y="676" fill="#4c1d95">bilinç geç açılır, solunum</text>
    <text x="440" y="700" fill="#4c1d95">depresyonu sürer, ekstübasyon</text>
    <text x="440" y="724" fill="#4c1d95">gecikir.</text>
    <rect x="794" y="598" width="352" height="140" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="810" y="626" font-weight="bold" fill="#0c4a6e">3 · Nöromüsküler blok rezidüsü</text>
    <text x="810" y="652" fill="#0c4a6e">Dörtlü uyarı oranı &lt; 0,9: hasta</text>
    <text x="810" y="676" fill="#0c4a6e">uyanık, kas gücü yetersiz →</text>
    <text x="810" y="700" fill="#0c4a6e">refleksler bozulur, aspirasyon.</text>
  </g>
  <text x="600" y="764" text-anchor="middle" font-size="17" fill="#475569">Dörtlü uyarı izlemi zorunludur; reversal yeterli dozda uygulanır, analjezi planı ameliyatla birlikte yürür.</text>
</svg>
