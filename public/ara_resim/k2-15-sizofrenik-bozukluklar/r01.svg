<text x="652" y="638" font-size="17" fill="#1e293b" text-anchor="start">Ailede hastalık öyküsü ve genç yaşta davranış</text>
<text x="652" y="660" font-size="17" fill="#1e293b" text-anchor="start">değişikliği hekimin şüphesini artırır.</text>
<circle cx="639" cy="683.2" r="4.5" fill="#334155"/>
<text x="652" y="688" font-size="17" fill="#1e293b" text-anchor="start">Hastalık başladıktan sonra tek nedene bağlanamaz;</text>
<text x="652" y="710" font-size="17" fill="#1e293b" text-anchor="start">yakınların “neden oldu” sorusuna kesin yanıt yoktur.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 6–11 · şizofreni, kanser gibi çoklu vuruş hastalığı olarak düşünülür</text>
