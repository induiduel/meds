<text x="316" y="636" font-size="17" fill="#1e293b" text-anchor="start">Mor: yatkın kişi, stresör</text>
<text x="316" y="658" font-size="17" fill="#1e293b" text-anchor="start">eşiği aşar. Yeşil: yatkın</text>
