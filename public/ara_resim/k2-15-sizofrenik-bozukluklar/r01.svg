<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Çoklu vuruş: genetik yatkınlığın üstüne eklenen etkenler</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Stres-diyatez modeli · gebe kalmadan genç erişkinliğe uzanan vuruşlar (slayt 6–11)</text>
