<text x="230" y="345" font-size="24" fill="#2f6db5" text-anchor="middle" font-weight="700">+ hipofrontalite</text>
<line x1="425" y1="295" x2="570" y2="295" stroke="#1f2430" stroke-width="3" marker-end="url(#ok)"/>
<rect x="575" y="240" width="385" height="110" rx="14" fill="#fbfaf6" stroke="#2f6db5" stroke-width="3"/>
<text x="767" y="285" font-size="28" fill="#2f6db5" text-anchor="middle" font-weight="700">Negatif belirtiler</text>
<text x="767" y="325" font-size="24" fill="#1f2430" text-anchor="middle">aloji, apati</text>
<rect x="40" y="395" width="920" height="70" rx="14" fill="#f1f1ee" stroke="#8a8f99" stroke-width="2"/>
<text x="500" y="440" font-size="26" fill="#1f2430" text-anchor="middle">Fensiklidin → glutamat → şizofreni benzeri belirtiler</text>
