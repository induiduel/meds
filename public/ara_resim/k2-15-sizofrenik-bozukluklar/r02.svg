<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" width="1000" height="495" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" role="img" aria-label="Dopamin ve belirti grupları">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="1000" height="495" fill="#fbfaf6"/>
<text x="500" y="52" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="700">Dopamin ve belirti grupları</text>
<rect x="40" y="90" width="380" height="110" rx="14" fill="#c8463c22" stroke="#c8463c" stroke-width="3"/>
<text x="230" y="135" font-size="30" fill="#c8463c" text-anchor="middle" font-weight="700">Dopamin fazla</text>
<text x="230" y="175" font-size="24" fill="#c8463c" text-anchor="middle">hiperdopaminerjik</text>
<line x1="425" y1="145" x2="570" y2="145" stroke="#1f2430" stroke-width="3" marker-end="url(#ok)"/>
<rect x="575" y="90" width="385" height="110" rx="14" fill="#fbfaf6" stroke="#c8463c" stroke-width="3"/>
<text x="767" y="135" font-size="28" fill="#c8463c" text-anchor="middle" font-weight="700">Pozitif belirtiler</text>
<text x="767" y="175" font-size="24" fill="#1f2430" text-anchor="middle">sanrı, varsanı</text>
<rect x="40" y="230" width="380" height="130" rx="14" fill="#2f6db522" stroke="#2f6db5" stroke-width="3"/>
<text x="230" y="275" font-size="30" fill="#2f6db5" text-anchor="middle" font-weight="700">Dopamin az</text>
