<text x="350" y="164" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">Sanrılar</text>
<text x="525" y="352" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">Varsanılar</text>
<text x="520" y="534" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">Darmadağın konuşma</text>
<text x="210" y="534" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Dağınık davranış / katatoni</text>
<text x="175" y="352" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Silik (negatif)</text>
<text x="175" y="374" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">belirtiler</text>
<path d="M392 200 C470 190 540 220 550 252" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="530" y="182" font-size="17" fill="#b91c1c" text-anchor="middle">kırmızı halka: en az biri</text>
<rect x="690" y="96" width="480" height="460" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="712" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">B · Kural ve tuzaklar</text>
<circle cx="717" cy="163" r="4.5" fill="#334155"/>
<text x="730" y="168" font-size="17" fill="#1e293b" text-anchor="start">Beş belirtiden en az ikisi, bir aylık sürenin</text>
<text x="730" y="190" font-size="17" fill="#1e293b" text-anchor="start">önemli bir kesiminde bulunur; başarılı</text>
<text x="730" y="212" font-size="17" fill="#1e293b" text-anchor="start">tedavide bu süre daha kısa olabilir.</text>
<circle cx="717" cy="239.29999999999998" r="4.5" fill="#334155"/>
<text x="730" y="244" font-size="17" fill="#1e293b" text-anchor="start">İki belirtiden en az biri mutlaka sanrı,</text>
<text x="730" y="266" font-size="17" fill="#1e293b" text-anchor="start">varsanı ya da darmadağın konuşmadır (kırmızı</text>
<text x="730" y="288" font-size="17" fill="#1e293b" text-anchor="start">halkalılar).</text>
<circle cx="717" cy="315.6" r="4.5" fill="#334155"/>
<text x="730" y="321" font-size="17" fill="#1e293b" text-anchor="start">Yalnız negatif belirti ve dağınık davranış</text>
<text x="730" y="343" font-size="17" fill="#1e293b" text-anchor="start">olan hastada A ölçütü karşılanmaz.</text>
<circle cx="717" cy="369.80000000000007" r="4.5" fill="#334155"/>
<text x="730" y="375" font-size="17" fill="#1e293b" text-anchor="start">Negatif belirti tanı için zorunlu değildir;</text>
<text x="730" y="397" font-size="17" fill="#1e293b" text-anchor="start">“en az bir negatif belirti gerekir” ifadesi</text>
<text x="730" y="419" font-size="17" fill="#1e293b" text-anchor="start">yanlıştır.</text>
<rect x="30" y="572" width="1140" height="182" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="52" y="606" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">C · Ölçüt B (işlevsellik) ve ölçüt C (süre)</text>
<line x1="60" y1="636" x2="480" y2="636" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<text x="60" y="628" font-size="17" fill="#64748b" text-anchor="start">hastalık öncesi işlevsellik düzeyi</text>
<path d="M60 646 C200 646 240 650 280 680 C320 712 380 714 480 716" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="300" y="740" font-size="17" fill="#4c1d95" text-anchor="middle">iş, okul, ilişkilerde belirgin düşüş</text>
<rect x="560" y="650" width="560" height="34" rx="17" fill="url(#mor)" stroke="#6d28d9" stroke-width="2"/>
<rect x="560" y="650" width="94" height="34" rx="17" fill="url(#kirmizi)" stroke="#b91c1c" stroke-width="2"/>
<line x1="560" y1="690" x2="560" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="653" y1="690" x2="653" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="747" y1="690" x2="747" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="840" y1="690" x2="840" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="933" y1="690" x2="933" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="1026" y1="690" x2="1026" y2="700" stroke="#334155" stroke-width="2"/>
<line x1="1120" y1="690" x2="1120" y2="700" stroke="#334155" stroke-width="2"/>
<text x="607" y="640" font-size="17" fill="#991b1b" text-anchor="middle" font-weight="bold">≥1 ay A belirtileri</text>
<text x="1120" y="640" font-size="17" fill="#4c1d95" text-anchor="end" font-weight="bold">en az 6 ay (3 ay değil)</text>
<text x="840" y="726" font-size="17" fill="#4c1d95" text-anchor="middle">süregiden bulgular: toplam en az altı ay</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 17 · “en az altı ay” çıkmış sınavda sorulmuştur</text>
</svg>