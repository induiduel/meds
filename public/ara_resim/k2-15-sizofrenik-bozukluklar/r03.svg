<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Şizofreni tanısı üç ölçüte dayanır: A, B ve C</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">DSM-5 · belirti sayısı, işlevsellik ve süre (slayt 17)</text>
<rect x="30" y="96" width="640" height="460" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="52" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">A · Ölçüt A: beş belirtiden en az ikisi, en az bir ay</text>
<use href="#kisi" transform="translate(350 380) scale(1.3)"/>
