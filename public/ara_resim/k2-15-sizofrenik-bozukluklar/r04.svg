<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" role="img" aria-label="Süre ayrımı: 1 ay ve 6 ay eşikleri">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="1000" height="370" fill="#fbfaf6"/>
<text x="500" y="52" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="700">Süre ayrımı: 1 ay ve 6 ay eşikleri</text>
<rect x="60" y="170" width="230" height="80" rx="12" fill="#3a9a5b33" stroke="#3a9a5b" stroke-width="3"/>
<rect x="290" y="170" width="330" height="80" rx="12" fill="#b8901a33" stroke="#b8901a" stroke-width="3"/>
<rect x="620" y="170" width="320" height="80" rx="12" fill="#8e3b5a33" stroke="#8e3b5a" stroke-width="3"/>
<text x="175" y="220" font-size="26" fill="#3a9a5b" text-anchor="middle" font-weight="700">Kısa psikotik</text>
<text x="455" y="220" font-size="26" fill="#b8901a" text-anchor="middle" font-weight="700">Şizofreniform</text>
<text x="780" y="220" font-size="26" fill="#8e3b5a" text-anchor="middle" font-weight="700">Şizofreni</text>
<line x1="60" y1="140" x2="60" y2="280" stroke="#1f2430" stroke-width="3" stroke-dasharray="6 5"/>
<text x="60" y="130" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="700">1 gün</text>
<line x1="290" y1="140" x2="290" y2="280" stroke="#1f2430" stroke-width="3" stroke-dasharray="6 5"/>
<text x="290" y="130" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="700">1 ay</text>
<line x1="620" y1="140" x2="620" y2="280" stroke="#1f2430" stroke-width="3" stroke-dasharray="6 5"/>
<text x="620" y="130" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="700">6 ay</text>
<line x1="60" y1="305" x2="950" y2="305" stroke="#5b6170" stroke-width="2" marker-end="url(#ok)"/>
<text x="950" y="292" font-size="20" fill="#5b6170" text-anchor="middle">süre</text>
<text x="175" y="340" font-size="21" fill="#5b6170" text-anchor="middle">1 gün–1 ay</text>
<text x="455" y="340" font-size="21" fill="#5b6170" text-anchor="middle">1–6 ay</text>
<text x="780" y="340" font-size="21" fill="#5b6170" text-anchor="middle">6 ay ve üzeri</text>
</svg>
