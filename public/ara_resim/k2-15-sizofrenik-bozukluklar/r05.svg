<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" role="img" aria-label="Pozitif ve negatif belirtiler">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" fill="#fbfaf6"/>
<text x="500" y="52" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="700">Pozitif ve negatif belirtiler</text>
<rect x="40" y="80" width="440" height="430" rx="14" fill="#c8463c14" stroke="#c8463c" stroke-width="3"/>
<text x="260" y="125" font-size="26" fill="#c8463c" text-anchor="middle" font-weight="700">Pozitif: bir şey eklenir</text>
<text x="260" y="180" font-size="24" fill="#1f2430" text-anchor="middle">Sanrı</text>
<text x="260" y="230" font-size="24" fill="#1f2430" text-anchor="middle">Varsanı (algı bozukluğu)</text>
<text x="260" y="280" font-size="24" fill="#1f2430" text-anchor="middle">Formel düşünce bozukluğu</text>
<text x="260" y="330" font-size="24" fill="#1f2430" text-anchor="middle">(enkoherans)</text>
<text x="260" y="380" font-size="24" fill="#1f2430" text-anchor="middle">Dezorganize davranış</text>
<rect x="520" y="80" width="440" height="430" rx="14" fill="#2f6db514" stroke="#2f6db5" stroke-width="3"/>
<text x="740" y="125" font-size="26" fill="#2f6db5" text-anchor="middle" font-weight="700">Negatif: bir şey eksilir</text>
<text x="740" y="172" font-size="24" fill="#1f2430" text-anchor="middle">Aloji</text>
<text x="740" y="218" font-size="24" fill="#1f2430" text-anchor="middle">Duygusal küntleşme</text>
<text x="740" y="264" font-size="24" fill="#1f2430" text-anchor="middle">Anhedoni</text>
<text x="740" y="310" font-size="24" fill="#1f2430" text-anchor="middle">Toplumsal içe çekilme</text>
<text x="740" y="356" font-size="24" fill="#1f2430" text-anchor="middle">Avolüsyon</text>
<text x="740" y="402" font-size="24" fill="#1f2430" text-anchor="middle">Apati</text>
<text x="740" y="448" font-size="24" fill="#1f2430" text-anchor="middle">Dikkat bozukluğu</text>
</svg>
