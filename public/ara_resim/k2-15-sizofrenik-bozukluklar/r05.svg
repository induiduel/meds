<text x="52" y="476" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">C · İki grubun üyeleri</text>
<text x="60" y="504" font-size="18" fill="#991b1b" text-anchor="start" font-weight="bold">Pozitif (4):</text>
<text x="180" y="504" font-size="17" fill="#7f1d1d" text-anchor="start">sanrılar · varsanılar · pozitif formel düşünce bozukluğu (enkoherans, raydan çıkma, çevresellik,</text>
<text x="180" y="526" font-size="17" fill="#7f1d1d" text-anchor="start">teğetsellik) · acayip ya da dezorganize davranış</text>
<text x="180" y="556" font-size="17" fill="#475569" text-anchor="start">Formel düşünce bozukluğu düşüncenin içeriğinde değil, akışında ve bağlantısında olur.</text>
<text x="60" y="600" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="bold">Negatif (7):</text>
<text x="180" y="600" font-size="17" fill="#1e3a8a" text-anchor="start">aloji · duygusal küntleşme · anhedoni · toplumsal içe çekilme · avolüsyon · apati · dikkat bozukluğu</text>
<rect x="30" y="656" width="1140" height="98" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="52" y="690" font-size="18" fill="#7f1d1d" text-anchor="start" font-weight="bold">Çıkmış tuzakları</text>
<text x="52" y="716" font-size="17" fill="#7f1d1d" text-anchor="start">Apati negatiftir, pozitif listede yoktur. Enkoherans ve darmadağın konuşma pozitiftir. Algı bozukluğu (varsanı)</text>
<text x="52" y="738" font-size="17" fill="#7f1d1d" text-anchor="start">olmayan bir algının eklenmesidir; negatif değil pozitiftir.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 16, 22–24</text>
