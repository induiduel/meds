<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Şizofreni evreleri: her atak neden kalıcı iz bırakır</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Ataklar ve nöron kaybı · dört evrede ne görülür (slayt 28)</text>
