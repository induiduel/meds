<text x="52" y="486" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">B · Dört evrede ne görülür</text>
<circle cx="110" cy="520" r="14" fill="#16a34a" stroke="#0f172a" stroke-width="2"/>
<text x="134" y="526" font-size="18" fill="#16a34a" text-anchor="start" font-weight="bold">Belirtisiz dönem</text>
<path d="M302 520 C317 512 360 512 372 520" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="70" y="562" font-size="17" fill="#475569" text-anchor="start" font-style="italic">yaklaşık 15 yaşa dek</text>
<text x="70" y="590" font-size="17" fill="#1e293b" text-anchor="start">Tam işlevsel, neredeyse hiç</text>
<text x="70" y="612" font-size="17" fill="#1e293b" text-anchor="start">belirti yok.</text>
<circle cx="390" cy="520" r="14" fill="#ca8a04" stroke="#0f172a" stroke-width="2"/>
<text x="414" y="526" font-size="18" fill="#ca8a04" text-anchor="start" font-weight="bold">Prodromal dönem</text>
<path d="M572 520 C586 512 640 512 652 520" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="350" y="562" font-size="17" fill="#475569" text-anchor="start" font-style="italic">ergenlik</text>
<text x="350" y="590" font-size="17" fill="#1e293b" text-anchor="start">Garip davranış ve silik</text>
<text x="350" y="612" font-size="17" fill="#1e293b" text-anchor="start">negatif belirtiler; işlev</text>
<text x="350" y="634" font-size="17" fill="#1e293b" text-anchor="start">hafifçe düşer. Belirtisiz</text>
<text x="350" y="656" font-size="17" fill="#1e293b" text-anchor="start">değildir, depresyon gibi</text>
<text x="350" y="678" font-size="17" fill="#1e293b" text-anchor="start">görünebilir.</text>
<circle cx="670" cy="520" r="14" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
<text x="694" y="526" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold">Aktif dönem</text>
<path d="M810 520 C824 512 920 512 932 520" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="630" y="562" font-size="17" fill="#475569" text-anchor="start" font-style="italic">yirmili yaşlar</text>
<text x="630" y="590" font-size="17" fill="#1e293b" text-anchor="start">Pozitif belirtiler,</text>
<text x="630" y="612" font-size="17" fill="#1e293b" text-anchor="start">alevlenme ve düzelmeler;</text>
<text x="630" y="634" font-size="17" fill="#1e293b" text-anchor="start">her alevlenmeden sonra</text>
<text x="630" y="656" font-size="17" fill="#1e293b" text-anchor="start">önceki düzeye tam dönüş</text>
<text x="630" y="678" font-size="17" fill="#1e293b" text-anchor="start">yok.</text>
<circle cx="950" cy="520" r="14" fill="#6d28d9" stroke="#0f172a" stroke-width="2"/>
<text x="974" y="526" font-size="18" fill="#6d28d9" text-anchor="start" font-weight="bold">Rezidüel dönem</text>
<text x="910" y="562" font-size="17" fill="#475569" text-anchor="start" font-style="italic">kırklı yaşlar ve sonrası</text>
<text x="910" y="590" font-size="17" fill="#1e293b" text-anchor="start">Belirgin negatif ve</text>
<text x="910" y="612" font-size="17" fill="#1e293b" text-anchor="start">bilişsel belirtiler, düşük</text>
<text x="910" y="634" font-size="17" fill="#1e293b" text-anchor="start">işlev; antipsikotiğe</text>
<text x="910" y="656" font-size="17" fill="#1e293b" text-anchor="start">giderek dirençli olabilir.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 28 · slayttaki işlevsellik grafiği evreleri yaşa göre gösterir; burada atak–nöron ilişkisi tamamlanır</text>
