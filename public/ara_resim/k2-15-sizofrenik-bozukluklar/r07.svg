<circle cx="310" cy="220" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="350" cy="150" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="290" cy="280" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="380" cy="210" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="340" cy="300" r="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<path d="M220 230 C270 180 300 300 350 210 C380 160 410 280 440 230" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="330" y="350" font-size="17" fill="#4c1d95" text-anchor="middle">yaygın, sistematize olmayan sanrılar</text>
<text x="330" y="372" font-size="17" fill="#4c1d95" text-anchor="middle">+ diğer belirtiler (varsanı, darmadağın</text>
<text x="330" y="394" font-size="17" fill="#4c1d95" text-anchor="middle">konuşma, negatif belirtiler)</text>
<path d="M90 500 A80 80 0 0 1 250 500" stroke="#e2e8f0" stroke-width="16" fill="none" stroke-linecap="round"/>
<path d="M90 500 A80 80 0 0 1 105.3 453.0" stroke="#dc2626" stroke-width="16" fill="none" stroke-linecap="round"/>
<line x1="170" y1="500" x2="120" y2="464" stroke="#0f172a" stroke-width="4"/>
<circle cx="170" cy="500" r="7" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="170" y="530" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">İşlevsellik: kötü</text>
<text x="330" y="470" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">Yeti kaybı:</text>
<text x="330" y="494" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="bold">var</text>
<text x="330" y="530" font-size="17" fill="#334155" text-anchor="start">Konuşma: dağınık olabilir</text>
<rect x="610" y="96" width="560" height="470" rx="18" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
<text x="632" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">B · Sanrılı bozukluk</text>
<path d="M690 310 C670 270 670 200 730 190 C780 184 796 230 786 260 L796 278 L782 282 C782 302 760 306 740 304 L736 330" stroke="#475569" stroke-width="3" fill="#e2e8f0" stroke-linecap="round"/>
<path d="M820 230 C810 160 900 140 930 170 C970 140 1050 170 1030 230 C1050 290 950 310 920 285 C880 310 810 290 820 230 Z" stroke="#0d9488" stroke-width="3" fill="#ccfbf1" stroke-linecap="round"/>
<circle cx="930" cy="228" r="18" fill="none" stroke="#0f766e" stroke-width="2"/>
<circle cx="930" cy="228" r="36" fill="none" stroke="#0f766e" stroke-width="2"/>
<circle cx="930" cy="228" r="54" fill="none" stroke="#0f766e" stroke-width="2"/>
<circle cx="930" cy="228" r="6" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<text x="930" y="350" font-size="17" fill="#134e4a" text-anchor="middle">tek alana odaklı, sistematize sanrı</text>
<text x="930" y="372" font-size="17" fill="#134e4a" text-anchor="middle">(bizar olmayan: ör. eşi aldatıyor)</text>
<text x="930" y="394" font-size="17" fill="#134e4a" text-anchor="middle">şizofreninin diğer belirtileri yok</text>
<path d="M670 500 A80 80 0 0 1 830 500" stroke="#e2e8f0" stroke-width="16" fill="none" stroke-linecap="round"/>
<path d="M670 500 A80 80 0 0 1 821.3 463.7" stroke="#16a34a" stroke-width="16" fill="none" stroke-linecap="round"/>
<line x1="750" y1="500" x2="805" y2="472" stroke="#0f172a" stroke-width="4"/>
<circle cx="750" cy="500" r="7" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="750" y="530" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">İşlevsellik: iyi</text>
<text x="910" y="470" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">Yeti kaybı:</text>
<text x="910" y="494" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">yok</text>
<text x="910" y="530" font-size="17" fill="#334155" text-anchor="start">Konuşma: tutarlı, akıcı</text>
<rect x="30" y="582" width="1140" height="172" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="56" y="618" font-size="20" fill="#134e4a" text-anchor="start" font-weight="bold">C · Vaka ipucu</text>
<text x="56" y="650" font-size="18" fill="#134e4a" text-anchor="start">İşini sürdüren, tek ve düzenli bir sanrısı olan, başka belirtisi bulunmayan hasta sanrılı bozukluğu düşündürür.</text>
<text x="56" y="681" font-size="17" fill="#134e4a" text-anchor="start">Sanrıya darmadağın konuşma eklenirse tablo şizofreniye döner; sanrılı bozuklukta şizofreninin A ölçütü hiçbir zaman</text>
<text x="56" y="704" font-size="17" fill="#134e4a" text-anchor="start">karşılanmaz.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 40 (önceki: 37–38)</text>
</svg>