<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Şizofreni ile sanrılı bozukluk dört noktada ayrılır</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Aynı ölçekte iki hasta · işlevsellik, yeti kaybı, sanrı yapısı, diğer belirtiler (slayt 40)</text>
<rect x="30" y="96" width="560" height="470" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
<text x="52" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">A · Şizofreni</text>
<path d="M110 310 C90 270 90 200 150 190 C200 184 216 230 206 260 L216 278 L202 282 C202 302 180 306 160 304 L156 330" stroke="#475569" stroke-width="3" fill="#e2e8f0" stroke-linecap="round"/>
