<path d="M320 352 L320 344 L540 344 L540 352" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="430" y="330" font-size="17" fill="#7f1d1d" text-anchor="middle" font-weight="bold">duygudurum belirtisi olmadan</text>
<text x="430" y="308" font-size="17" fill="#7f1d1d" text-anchor="middle" font-weight="bold">en az 2 hafta psikoz</text>
<text x="980" y="300" font-size="17" fill="#78350f" text-anchor="middle">psikozun üstüne eklenen ataklar</text>
<text x="720" y="470" font-size="17" fill="#4c1d95" text-anchor="middle">sürekli psikoz, atak hâlinde duygudurum belirtisi yok</text>
<text x="1140" y="580" font-size="17" fill="#475569" text-anchor="end">zaman</text>
<rect x="30" y="612" width="1140" height="142" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="56" y="646" font-size="20" fill="#78350f" text-anchor="start" font-weight="bold">B · İki ayrım noktası</text>
<circle cx="61" cy="675" r="4.5" fill="#b45309"/>
<text x="74" y="680" font-size="18" fill="#1e293b" text-anchor="start">Duygudurum bozukluğundan: şizoaffektif bozuklukta ataklar arasında tam iyilik hâli yoktur.</text>
<circle cx="61" cy="704.4" r="4.5" fill="#b45309"/>
<text x="74" y="709" font-size="18" fill="#1e293b" text-anchor="start">Şizofreniden: psikotik belirtilerin üstüne ataklar hâlinde duygudurum belirtileri eklenir.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 43 · iki haftalık şart psikozun yalnız depresyon ya da mani dönemine bağlı olmadığını gösterir</text>
