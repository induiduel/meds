<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Şizoaffektif bozukluk iki komşusundan nasıl ayrılır</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Aynı zaman ekseninde üç gidiş · mor: psikotik belirtiler, sarı: duygudurum atakları (slayt 43)</text>
