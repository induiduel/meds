<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Kalıtım: hasta akraba sayısı ve yakınlığı arttıkça risk artar</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Aile, ikiz ve evlat edinme çalışmalarında yaşam boyu risk (slayt 12)</text>
