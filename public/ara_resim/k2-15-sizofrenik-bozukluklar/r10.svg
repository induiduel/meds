<text x="441" y="328" font-size="17" fill="#1e3a8a" text-anchor="start" font-weight="bold">%14</text>
<text x="318" y="378" font-size="17" fill="#0f172a" text-anchor="end">Bir çocuk ve bir ebeveyn hasta</text>
