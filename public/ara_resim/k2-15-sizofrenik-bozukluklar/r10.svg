<text x="678" y="528" font-size="17" fill="#1e3a8a" text-anchor="start" font-weight="bold">%47</text>
<rect x="770" y="96" width="400" height="520" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
<text x="792" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">B · İkizler ve kuşaklar</text>
