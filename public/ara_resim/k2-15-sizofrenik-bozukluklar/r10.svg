<use href="#kisi" transform="translate(960 280) scale(1.1)"/>
<path d="M880 290 C900 316 940 316 960 290" stroke="#4338ca" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="800" y="334" font-size="17" fill="#1e293b" text-anchor="start">Tek yumurta ikizinde bile risk %46:</text>
<text x="800" y="356" font-size="17" fill="#1e293b" text-anchor="start">genler önemli ama tek başına yetmez.</text>
<rect x="830" y="430" width="36" height="36" fill="#c7d2fe" stroke="#3730a3" stroke-width="2"/>
<circle cx="848" cy="548" r="18" fill="#a5b4fc" stroke="#3730a3" stroke-width="2"/>
<line x1="848" y1="466" x2="848" y2="526" stroke="#3730a3" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="884" y="446" font-size="17" fill="#1e1b4b" text-anchor="start">Ebeveyn: geç ve</text>
<text x="884" y="468" font-size="17" fill="#1e1b4b" text-anchor="start">silik başlangıç</text>
<text x="884" y="544" font-size="17" fill="#1e1b4b" text-anchor="start">Çocuk: daha erken</text>
<text x="884" y="566" font-size="17" fill="#1e1b4b" text-anchor="start">ve şiddetli</text>
<text x="800" y="412" font-size="18" fill="#3730a3" text-anchor="start" font-weight="bold">Antisipasyon</text>
<rect x="30" y="632" width="1140" height="122" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="56" y="668" font-size="18" fill="#1e1b4b" text-anchor="start">Şizofreni basit baskın kalıtımla geçmez, ama genlerin etkisi önemlidir. Ailede hasta birey sayısı arttıkça risk</text>
<text x="56" y="691" font-size="18" fill="#1e1b4b" text-anchor="start">artar; antisipasyonda hastalık kuşaklar boyunca daha erken ve daha şiddetli başlar.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 12 (genel toplum yaygınlığı: slayt 4)</text>
