<text x="56" y="664" font-size="18" fill="#7c2d12" text-anchor="start">Boyut ayrımında pozitif grup ikiye bölünür: sanrı ve varsanı psikotik boyutta, konuşma ve davranış bozukluğu</text>
<text x="56" y="687" font-size="18" fill="#7c2d12" text-anchor="start">dezorganizasyon boyutunda yer alır. Uygunsuz duygulanım, anlatılan konuya uymayan duygu göstermektir.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 25 (pozitif–negatif listeler: slayt 23–24)</text>
