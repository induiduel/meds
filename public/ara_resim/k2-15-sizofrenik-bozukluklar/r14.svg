<text x="60" y="722" font-size="17" fill="#475569" text-anchor="start">Zorluk: gelişimsel hastalıkta belirti çocuklukta vardır; yirmi yaşında başlayan hastalığı gelişimsel saymak kolay</text>
<text x="60" y="744" font-size="17" fill="#475569" text-anchor="start">değildir.</text>
