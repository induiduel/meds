<text x="240" y="488" font-size="17" fill="#b45309" text-anchor="middle">turuncu nokta: sinaps</text>
<text x="410" y="488" font-size="17" fill="#334155" text-anchor="start">Hipokampusta sinaps ve dendrit azalır;</text>
<text x="410" y="510" font-size="17" fill="#334155" text-anchor="start">dorsal talamusta nöron sayısı azdır.</text>
