<text x="1012" y="222" font-size="17" fill="#14532d" text-anchor="start">sonradan</text>
<text x="1012" y="244" font-size="17" fill="#14532d" text-anchor="start">hasarda:</text>
<text x="1012" y="266" font-size="17" fill="#14532d" text-anchor="start">glia çoğalır</text>
<text x="834" y="320" font-size="17" fill="#1e293b" text-anchor="start">Gliozis, hasardan sonra glia</text>
<text x="834" y="342" font-size="17" fill="#1e293b" text-anchor="start">hücrelerinin çoğalıp yara izi</text>
<text x="834" y="364" font-size="17" fill="#1e293b" text-anchor="start">oluşturmasıdır. Şizofrenide</text>
<text x="834" y="386" font-size="17" fill="#1e293b" text-anchor="start">gliozis yoktur; bu, sonradan</text>
<text x="834" y="408" font-size="17" fill="#1e293b" text-anchor="start">gelişen hasar yerine beyin</text>
<text x="834" y="431" font-size="17" fill="#1e293b" text-anchor="start">gelişimi sırasında oluşan bir</text>
<text x="834" y="453" font-size="17" fill="#1e293b" text-anchor="start">sorunu düşündürür.</text>
