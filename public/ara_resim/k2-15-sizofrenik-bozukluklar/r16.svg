<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Katalepsi, balmumu esnekliği ve postur alma nasıl ayrılır</text>
<text x="600" y="76" font-size="19" fill="#475569" text-anchor="middle">Üç katatoni belirtisi · konumu kim veriyor, kim sürdürüyor (slayt 32–33)</text>
<rect x="30" y="96" width="360" height="520" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="52" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">A · Katalepsi</text>
<text x="52" y="500" font-size="17" fill="#1e293b" text-anchor="start">Kişi yer çekimine karşı bir</text>
<text x="52" y="522" font-size="17" fill="#1e293b" text-anchor="start">konumda edilgin olarak kalır.</text>
<rect x="420" y="96" width="360" height="520" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="442" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">B · Balmumu esnekliği</text>
<text x="442" y="500" font-size="17" fill="#1e293b" text-anchor="start">Muayene edenin verdiği konuma çok</text>
<text x="442" y="522" font-size="17" fill="#1e293b" text-anchor="start">az direnç gösterilir; kol balmumu</text>
<text x="442" y="544" font-size="17" fill="#1e293b" text-anchor="start">gibi bükülür.</text>
<rect x="810" y="96" width="360" height="520" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
<text x="832" y="130" font-size="21" fill="#0f172a" text-anchor="start" font-weight="bold">C · Postur alma</text>
<text x="832" y="500" font-size="17" fill="#1e293b" text-anchor="start">Kişi yer çekimine karşı konumu</text>
<text x="832" y="522" font-size="17" fill="#1e293b" text-anchor="start">kendiliğinden ve etkin biçimde</text>
<text x="832" y="544" font-size="17" fill="#1e293b" text-anchor="start">sürdürür; günlerce kalabilir.</text>
