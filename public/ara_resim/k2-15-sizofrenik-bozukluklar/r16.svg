<text x="1090" y="322" font-size="17" fill="#991b1b" text-anchor="middle" font-weight="bold">çaba</text>
<rect x="30" y="632" width="1140" height="122" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="56" y="668" font-size="18" fill="#7f1d1d" text-anchor="start">Katalepside konum edilgin olarak alınır, postur almada ise kişi konumu kendisi etkin biçimde korur. Balmumu</text>
<text x="56" y="691" font-size="18" fill="#7f1d1d" text-anchor="start">esnekliğinde konumu muayene eden verir. Katatoni tanısı için on iki belirtiden en az üçü baskın olmalıdır.</text>
<text x="600" y="778" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 32–33 · kırmızı: kolun konumu</text>
