  <text x="820" y="676" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">ikidir.</text>
  <text x="60" y="744" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Sıra: önce kasılma, sonra hareket, sonra yerçekimi, en son direnç. Hoca kas gücü muayenesini olmazsa olmaz saydı.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 8 · Amaç: normal kas gücünden ne kadar kayıp olduğunu belirlemek</text>
