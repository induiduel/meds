  <text x="248" y="440" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="middle">1</text>
  <circle cx="196" cy="304" r="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="196" y="310" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="middle">2</text>
  <circle cx="72" cy="408" r="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="72" y="414" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="middle">3</text>
  <circle cx="64" cy="348" r="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="64" y="354" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="middle">4</text>
  <text x="440" y="340" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="start">1 Ön boynuz hastalığı</text>
  <text x="440" y="366" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="start">2 Tabes dorsalis</text>
  <text x="440" y="392" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="start">3 Polinöropati</text>
  <text x="440" y="418" font-size="17" font-weight="bold" fill="#9a3412" text-anchor="start">4 Kas hastalıkları</text>
  <text x="440" y="314" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">Hipotoni yapan lezyonlar:</text>
  <ellipse cx="160" cy="170" rx="70" ry="30" fill="url(#beyin)" stroke="#db2777" stroke-width="2"/>
  <text x="160" y="176" font-size="17" font-weight="bold" fill="#831843" text-anchor="middle">Hemisfer</text>
  <ellipse cx="310" cy="170" rx="64" ry="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="310" y="176" font-size="17" font-weight="bold" fill="#831843" text-anchor="middle">Beyin sapı</text>
  <ellipse cx="460" cy="170" rx="70" ry="26" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="460" y="176" font-size="17" font-weight="bold" fill="#831843" text-anchor="middle">Serebellum</text>
