  <text x="318" y="236" font-size="17" font-weight="normal" fill="#831843" text-anchor="start">Suprasegmenter ayar</text>
  <text x="318" y="260" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Bu yapılar bozulunca da tonus</text>
  <text x="318" y="282" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">değişir.</text>
  <rect x="670" y="100" width="500" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="692" y="134" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">B · Agonist ve antagonistte tonus</text>
  <text x="692" y="184" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start">Hipotoni</text>
  <text x="692" y="208" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Tonus azalır</text>
  <path d="M960 146 L960 234" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="940" cy="190" rx="12" ry="40" fill="url(#kasA)" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="982" cy="190" rx="12" ry="40" fill="url(#kasA)" stroke="#b91c1c" stroke-width="2"/>
  <text x="692" y="299" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start">Spastisite</text>
  <text x="692" y="323" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Birinde diğerine göre artış</text>
  <path d="M960 261 L960 349" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="940" cy="305" rx="22" ry="40" fill="url(#kas)" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="982" cy="305" rx="12" ry="40" fill="url(#kasA)" stroke="#b91c1c" stroke-width="2"/>
  <text x="692" y="414" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start">Rijidite</text>
  <text x="692" y="438" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">İkisinde birden artış</text>
  <path d="M960 376 L960 464" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="940" cy="420" rx="22" ry="40" fill="url(#kas)" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="982" cy="420" rx="22" ry="40" fill="url(#kas)" stroke="#b91c1c" stroke-width="2"/>
  <text x="1022" y="186" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Sol: agonist</text>
  <text x="1022" y="208" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Sağ: antagonist</text>
  <text x="692" y="488" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Örnek: spastisitede artış biseps ya da trisepsten</text>
  <text x="692" y="510" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">yalnız birindedir.</text>
  <rect x="30" y="556" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="590" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">C · Hangi hastalık hangi tonus değişikliği</text>
  <rect x="60" y="600" width="340" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="230.0" y="628" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Piramidal yol hastalığı</text>
  <text x="230.0" y="652" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Spastisite; pasif harekete direnç</text>
  <rect x="430" y="600" width="340" height="110" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="600.0" y="628" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Ekstrapiramidal: Parkinson</text>
  <text x="600.0" y="652" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Rijidite; direnç kesik kesik</text>
  <text x="600.0" y="674" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">çözülür: dişli çark belirtisi</text>
  <rect x="800" y="600" width="340" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="970.0" y="628" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Akut hemipleji, parapleji</text>
  <text x="970.0" y="652" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Erken dönemde tendon refleksleri</text>
  <text x="970.0" y="674" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">kaybolur, bir süre hipotoni</text>
  <text x="60" y="738" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Ayırmanın yolu: tonus tek kas grubunda mı arttı (spastisite), karşılıklı iki grupta mı (rijidite)?</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 9–10 · Tonus: istirahatteki kasta pasif hareket sırasında hissedilen gerginlik</text>
