  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Tonus: segmenter devre, hipotoni ve hipertoni</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Tonusu kim sağlar, nerede bozulur, nasıl artar (slayt 9–10)</text>
