  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Brunnstrom evrelemesi: spastisite ve sinerjinin seyri</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Hemiplejik hastada motor iyileşme altı evrede (slayt 20–21)</text>
