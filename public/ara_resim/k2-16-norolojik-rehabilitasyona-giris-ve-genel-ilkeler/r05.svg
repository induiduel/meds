  <path d="M1078 204 Q1106 216 1132 210" stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1134" y1="210" x2="1156" y2="208" stroke="#16a34a" stroke-width="2" marker-end="url(#oky)"/>
  <text x="1070" y="340" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">Evre 6</text>
  <text x="1070" y="364" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">İzole ve</text>
  <text x="1070" y="386" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">koordine</text>
  <text x="792" y="470" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Kırmızı: etkilenen kol. Hareket hep</text>
  <text x="792" y="492" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">aynı kalıpta ise sinerji içindedir.</text>
  <rect x="30" y="556" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="590" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">C · Evreleme nasıl kullanılır</text>
  <rect x="60" y="598" width="340" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="230.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Üç bölge ayrı</text>
  <text x="230.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Üst ekstremite, el ve alt</text>
  <text x="230.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">ekstremite ayrı evrelenir</text>
  <rect x="430" y="598" width="340" height="112" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="600.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">1-1-1 ve 2-1-3</text>
  <text x="600.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">1-1-1: üç bölge tam flask; 2-1-3:</text>
  <text x="600.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">alt ekstremite daha iyi, el kötü</text>
  <rect x="800" y="598" width="340" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="970.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Geliş ve takip</text>
  <text x="970.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">İyileşme kişiden kişiye değişir,</text>
  <text x="970.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">herhangi bir evrede durabilir</text>
  <text x="60" y="738" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Motor iyileşme tek tek kas gücüyle değil sinerjiyle gelir; bazı hastalar yalnız sinerjiyle hareket eder.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 20–21 · Eğri şematiktir; slayttaki ifadeler: başlar, belirgin, azalır</text>
