  <text x="950" y="364" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Dirsek</text>
  <text x="950" y="386" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">bükülür, kol</text>
  <text x="950" y="408" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">kalıba</text>
  <text x="950" y="430" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">katılır</text>
