  <text x="120" y="446" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Yok</text>
  <text x="285.0" y="446" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">Sinerji içinde</text>
  <text x="285.0" y="468" font-size="17" font-weight="normal" fill="#2563eb" text-anchor="middle">zayıf → istemli</text>
  <text x="610" y="446" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">Sinerji dışında</text>
  <text x="610" y="468" font-size="17" font-weight="normal" fill="#16a34a" text-anchor="middle">özgün → izole, koordine</text>
