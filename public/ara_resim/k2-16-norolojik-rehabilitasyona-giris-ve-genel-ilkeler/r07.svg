  <path d="M120 220 L90 300 M120 220 L150 300" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M480 160 L450 240 M480 160 L510 240" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
