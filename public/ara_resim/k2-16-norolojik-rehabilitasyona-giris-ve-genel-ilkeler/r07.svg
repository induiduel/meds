  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Spastisite ne zaman tedavi edilir?</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Zararı belirginse tedavi edilir, yararlıysa korunur (slayt 40)</text>
  <rect x="30" y="100" width="560" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="134" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">A · Karar terazisi</text>
  <path d="M300 420 L270 470 L330 470 Z" stroke="#475569" stroke-width="2" fill="#94a3b8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 420 L300 180" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 220 L480 160" stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
