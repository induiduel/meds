  <path d="M430 240 Q480 280 530 240 Z" stroke="#15803d" stroke-width="2.5" fill="#dcfce7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="346" font-size="19" font-weight="bold" fill="#dc2626" text-anchor="middle">Zarar</text>
  <text x="480" y="286" font-size="19" font-weight="bold" fill="#16a34a" text-anchor="middle">Yarar</text>
  <text x="52" y="374" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Aktivite ya da hijyen</text>
  <text x="52" y="396" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">güçleşir; tedavi</text>
  <text x="52" y="418" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">edilmezse ağrı,</text>
  <text x="52" y="440" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">kontraktür, bası yarası,</text>
  <text x="52" y="462" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">işlev kaybı</text>
  <text x="350" y="316" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Kas gücü yerine alt</text>
  <text x="350" y="338" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">ekstremitede</text>
  <text x="350" y="360" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">stabiliteyi artırabilir</text>
  <text x="52" y="500" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">Yalnız olumsuz etkisi belirgin olan spastik</text>
  <text x="52" y="522" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">sendrom tedavi edilir.</text>
  <rect x="610" y="100" width="560" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="632" y="134" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">B · Derste verilen klinik örnekler</text>
  <path d="M650 300 C640 250 660 210 700 206 C740 204 760 230 758 270 C756 300 730 320 700 318 C676 316 660 312 650 300 Z" stroke="#c08457" stroke-width="2.5" fill="url(#deri)" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M672 232 q8 18 0 34" stroke="#c08457" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M692 232 q8 18 0 34" stroke="#c08457" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M712 232 q8 18 0 34" stroke="#c08457" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M732 232 q8 18 0 34" stroke="#c08457" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M690 300 L690 360" stroke="#c08457" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="632" y="410" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Fleksör</text>
  <text x="632" y="432" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">spastisite:</text>
  <text x="632" y="454" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">tırnaklar avuç</text>
  <text x="632" y="476" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">içine batar</text>
  <path d="M850 200 L830 300 L870 380 M890 200 L910 300 L870 380" stroke="#c08457" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M845 300 L895 300" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="830" y1="300" x2="862" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#okk)"/>
  <line x1="910" y1="300" x2="878" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#okk)"/>
  <text x="806" y="410" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Adüktör</text>
  <text x="806" y="432" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">spastisite: alt</text>
  <text x="806" y="454" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">bez</text>
  <text x="806" y="476" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">değiştirilemez</text>
  <circle cx="1060" cy="170" r="16" fill="#fde7cf" stroke="#c08457" stroke-width="2"/>
  <path d="M1060 186 L1060 270" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1060 270 L1052 320 L1052 376" stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1060 270 L1080 316 L1072 376" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1052" cy="320" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="990" y="410" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="start">Dizini</text>
  <text x="990" y="432" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="start">kilitleyerek</text>
  <text x="990" y="454" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="start">ayakta durur</text>
  <text x="632" y="512" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Adüktörlere enjeksiyon hijyen ve bakım için önemlidir.</text>
  <rect x="30" y="556" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="590" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">C · Tedavi sırası (hocanın anlatımı)</text>
  <rect x="60" y="598" width="320" height="92" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="220.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">1. Oral ilaç</text>
  <text x="220.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Çoğunlukla ilk basamak</text>
  <rect x="440" y="598" width="320" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="600.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">2. Botulinum toksin</text>
  <text x="600.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Lokal enjeksiyon</text>
  <rect x="820" y="598" width="320" height="92" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="980.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">3. İntratekal baklofen</text>
  <text x="980.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Gerekirse</text>
  <line x1="384" y1="644" x2="434" y2="644" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="764" y1="644" x2="814" y2="644" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
  <text x="60" y="724" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Zayıf bacaklı hasta ayakta durmak için dizini kilitleyebilmelidir; tonus her zaman yok edilmeye çalışılmaz.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 40 · Tonus artışı: tedavi hedefleri</text>
