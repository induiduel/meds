  <path d="M360 395 Q380 380 370 360" stroke="#c08457" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="430" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Muayene eden el</text>
