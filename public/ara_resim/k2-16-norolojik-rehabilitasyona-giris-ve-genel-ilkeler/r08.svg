  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Modifiye Ashworth Skalası: pasif harekete direnç</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Spastisitenin şiddeti sıfırdan beşe altı derecede (slayt 11)</text>
