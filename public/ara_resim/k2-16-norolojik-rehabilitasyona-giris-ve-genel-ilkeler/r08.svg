  <text x="196" y="170" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">Spastik kas:</text>
  <text x="196" y="190" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">harekete direnç</text>
  <text x="52" y="470" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Tonus, istirahatteki kasta pasif hareket</text>
  <text x="52" y="492" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">sırasında hissedilen gerginliktir; burada</text>
  <text x="52" y="514" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">aktif kas gücü ölçülmez.</text>
