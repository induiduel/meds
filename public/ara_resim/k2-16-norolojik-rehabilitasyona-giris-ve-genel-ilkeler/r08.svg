  <text x="230.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Manuel kas gücü testi</text>
  <text x="230.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Aktif hareketi ölçer: hastanın</text>
  <text x="230.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">kendi kas gücü</text>
  <rect x="430" y="598" width="340" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="600.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Modifiye Ashworth</text>
  <text x="600.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Pasif harekete karşı direnci</text>
  <text x="600.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">ölçer: tonus</text>
  <rect x="800" y="598" width="340" height="100" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="970.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Botulinum toksin</text>
  <text x="970.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Tıbbi amaçla büyük kaslara; etkisi</text>
  <text x="970.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">yaklaşık altı ay</text>
  <text x="60" y="728" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Enjeksiyon biseps, el bileği ve parmak fleksörleri gibi büyük kas gruplarına yapılır; altı ayın sonunda yeniden</text>
  <text x="60" y="750" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">planlanır.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 11 · Derece arttıkça direnç hareket açıklığının daha büyük bölümüne yayılır</text>
