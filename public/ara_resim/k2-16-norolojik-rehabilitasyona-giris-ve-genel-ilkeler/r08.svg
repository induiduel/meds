  <rect x="30" y="556" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="590" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">C · İki ölçeği karıştırma; derste anlatılan tedavi</text>
