  <text x="650" y="496" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="start">Lezyon tarafı: mesafe ayarlanamaz, parmak</text>
  <text x="650" y="518" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="start">burna ya da yanağa çarpar</text>
  <text x="632" y="160" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Hasta kolunu yana açıp işaret</text>
  <text x="632" y="182" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">parmağını burnuna değdirir.</text>
