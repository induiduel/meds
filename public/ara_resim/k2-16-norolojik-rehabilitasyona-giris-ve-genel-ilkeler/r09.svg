  <text x="1000" y="420" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Hedefe yaklaştıkça</text>
  <text x="1000" y="440" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">titreme artar</text>
