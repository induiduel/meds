  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Serebellar bulgular lezyonla aynı tarafta</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Dissinerji, dismetri, intansiyonel tremor ve ataksi (slayt 12–13)</text>
