  <text x="392" y="506" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="start">tarafına sapar</text>
  <text x="52" y="456" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Aynı taraf kol ve bacakta</text>
  <text x="52" y="478" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">hipotoni, dismetri ve</text>
  <text x="52" y="500" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">disdiadokokinezi görülür; hasta o</text>
  <text x="52" y="522" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">tarafa düşebilir.</text>
