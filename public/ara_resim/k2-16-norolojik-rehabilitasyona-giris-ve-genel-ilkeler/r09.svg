  <text x="185.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Normal düzen</text>
  <text x="185.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Agonist kasılırken</text>
  <text x="185.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">antagonist gevşer</text>
  <rect x="345" y="598" width="250" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="470.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Serebellum hastalığı</text>
  <text x="470.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Bu düzen kaybolur</text>
  <rect x="630" y="598" width="250" height="112" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="755.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Disdiadokokinezi</text>
  <text x="755.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Hızlı pronasyon ve</text>
  <text x="755.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">supinasyon düzensiz</text>
  <rect x="915" y="598" width="230" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1030.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Serebellar dizartri</text>
  <text x="1030.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Kesik, patlayıcı;</text>
  <text x="1030.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">sarhoş konuşması</text>
