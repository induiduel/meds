  <text x="60" y="738" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Tremor statik değil kinetiktir (intansiyonel); Parkinson hastalığındaki tremor ise istirahatte görülür.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 12–13 · Serebellar bulguların hepsi lezyonla aynı taraftadır</text>
