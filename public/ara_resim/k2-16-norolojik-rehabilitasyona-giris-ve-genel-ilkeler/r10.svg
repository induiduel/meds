  <path d="M370 300 Q380 280 400 270" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="230" cy="260" rx="44" ry="30" fill="url(#hasar)" stroke="none" stroke-width="2"/>
  <line x1="272" y1="262" x2="430" y2="292" stroke="#dc2626" stroke-width="1.5"/>
  <text x="436" y="290" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="start">Zedelenen</text>
  <text x="436" y="312" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="start">bölge</text>
  <text x="60" y="410" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Vasküler, travmatik ya da tümöral zedelenme</text>
  <path d="M70 456 h160 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-110 l-20 16 l4 -16 h-34 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" stroke="#2563eb" stroke-width="2" fill="#eff6ff" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="152" y="492" font-size="19" font-weight="bold" fill="#2563eb" text-anchor="middle">Anlama</text>
  <path d="M330 456 h200 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-150 l-20 16 l4 -16 h-34 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" stroke="#2563eb" stroke-width="2" fill="#eff6ff" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="492" font-size="19" font-weight="bold" fill="#2563eb" text-anchor="middle">İfade etme</text>
  <text x="286" y="492" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">ya da</text>
  <text x="60" y="438" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">Ya biri ya ikisi birden bozulur:</text>
  <rect x="610" y="100" width="560" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="632" y="134" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">B · Dizartri: konuşma kaslarının uyumu bozulur</text>
  <path d="M760 150 C860 150 900 220 896 280 L916 310 L896 318 L900 340 Q904 360 884 362 L890 380 Q880 400 850 400 L840 460" stroke="#c08457" stroke-width="2.5" fill="url(#deri)" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M840 460 L740 460 C720 380 690 220 760 150" stroke="#c08457" stroke-width="2.5" fill="url(#deri)" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M856 352 Q880 346 896 356" stroke="#b91c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M836 344 C850 330 870 330 884 340" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="884" y1="336" x2="960" y2="250" stroke="#64748b" stroke-width="1.5"/>
  <text x="964" y="236" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Konuşmayı</text>
  <text x="964" y="256" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">sağlayan kaslar</text>
  <path d="M930 330 q10 -12 20 0 M960 330 q10 -12 20 0 M1000 324 q10 -24 20 0 M1030 324 l0 10 M1050 330 q10 -12 20 0" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="964" y="300" font-size="17" font-weight="bold" fill="#7c3aed" text-anchor="start">Kesik, patlayıcı heceler</text>
  <text x="632" y="490" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">Hasta ne söyleyeceğini bilir, ama sözcükleri düzgün</text>
  <text x="632" y="512" font-size="17" font-weight="normal" fill="#475569" text-anchor="start">çıkaramaz.</text>
  <text x="964" y="180" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">Kaslar arası</text>
  <text x="964" y="202" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="start">sinerji bozulur</text>
  <rect x="30" y="556" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="590" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">C · Ayırıcı noktalar</text>
  <rect x="60" y="598" width="340" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="230.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Afazi</text>
  <text x="230.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Konuşma öğrenildikten sonra;</text>
  <text x="230.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">motor, duyusal, karma, yalnız</text>
  <text x="230.0" y="694" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">okuma ya da yazma</text>
  <rect x="430" y="598" width="340" height="116" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="600.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Dizartri</text>
  <text x="600.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Dil sağlam; konuşmayı sağlayan</text>
  <text x="600.0" y="672" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">kasların sinerjisi bozuk</text>
  <rect x="800" y="598" width="340" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="970.0" y="626" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Psikiyatrik mutizm</text>
  <text x="970.0" y="650" font-size="17" font-weight="normal" fill="#475569" text-anchor="middle">Afazi değildir: hasta hiç konuşmaz</text>
  <text x="60" y="740" font-size="17" font-weight="normal" fill="#0f172a" text-anchor="start">Hocanın örneği: serviste konuşan ve anlayan ama okuyamayan hemiplejik hasta.</text>
  <text x="600" y="788" text-anchor="middle" font-size="17" fill="#64748b">Kaynak: slayt 15 · Afazi psikiyatrik bir sorundan ya da kas düzeyindeki bir engelden kaynaklanmaz</text>
</svg>
