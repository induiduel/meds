  <rect width="1200" height="800" fill="url(#zemin)"/>
  <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">Afazi ile dizartri: dil mi, konuşma kasları mı?</text>
  <text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Konuşmanın değerlendirilmesinde iki ayrı sorun (slayt 15)</text>
  <rect x="30" y="100" width="560" height="440" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="134" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="start">A · Afazi: dilin seçici bozulması</text>
  <path d="M90 300 C80 220 150 160 250 158 C340 156 410 190 420 250 C428 300 400 330 360 336 C350 360 320 372 290 360 C250 380 190 372 160 350 C120 346 94 330 90 300 Z" stroke="#9d174d" stroke-width="2.5" fill="url(#beyin)" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 220 Q180 240 200 210" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 190 Q240 230 280 200" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 200 Q320 240 360 220" stroke="#be185d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
