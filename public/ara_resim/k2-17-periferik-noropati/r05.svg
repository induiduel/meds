<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Üç yıkım biçiminde hücre düzeyinde ne olur?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Waller dejenerasyonu, segmental demiyelinizasyon ve geriye doğru ölme (slayt 10, 11)</text>
