<text x="970" y="444" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">doğru ölür</text>
<text x="970" y="468" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">(dying back)</text>
<line x1="906" y1="450" x2="970" y2="324" stroke="#94a3b8" stroke-width="1.3"/><circle cx="906" cy="450" r="3" fill="#334155"/>
<text x="974" y="330" font-size="17" text-anchor="start" font-weight="normal" fill="#0369a1">Miyelin kaybı sekonder</text>
<text x="820" y="604" font-size="17" text-anchor="start" font-weight="normal" fill="#475569">Kas incelir; örnek: polio, vinkristin</text>
<rect x="30" y="640" width="1140" height="64" rx="12" fill="url(#gsag)" stroke="#64748b"/>
<text x="50" y="680" font-size="18" text-anchor="start" font-weight="bold" fill="#065f46">Prognoz: en iyi segmental demiyelinizasyon (akson sağlam)</text>
<text x="1150" y="680" font-size="18" text-anchor="end" font-weight="bold" fill="#991b1b">en kötü distal aksonal dejenerasyon</text>
<text x="600" y="728" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Akson sağlam ve kas normalse demiyelinizasyon; yıkım kesi noktasından başlıyorsa Waller, uçtan başlıyorsa aksonal</text>
<text x="600" y="750" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">dejenerasyon.</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Çıkmış: distalde akson bozulup miyelinin makrofajlarla temizlenmesi Waller dejenerasyonudur.</text>
