<text x="584" y="250" font-size="17" text-anchor="start" font-weight="normal" fill="#b45309">Akson sağlam</text>
<text x="584" y="296" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">Yer yer miyelin kaybı</text>
<text x="584" y="320" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">(Schwann hasarı)</text>
<line x1="550" y1="545" x2="580" y2="464" stroke="#94a3b8" stroke-width="1.3"/><circle cx="550" cy="545" r="3" fill="#334155"/>
