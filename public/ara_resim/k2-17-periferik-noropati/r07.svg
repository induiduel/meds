<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Hangi lif, hangi duyu belirtisi?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Negatif fenomen bir duyunun kaybı, pozitif fenomen normalde olmayan bir duyunun gelmesidir (slayt 14, 15)</text>
<text x="390" y="130" font-size="20" text-anchor="middle" font-weight="bold" fill="#2563eb">Negatif fenomen: ses kesilir</text>
<text x="870" y="130" font-size="20" text-anchor="middle" font-weight="bold" fill="#dc2626">Pozitif fenomen: yayın yokken cızırtı</text>
<path d="M240 160 C 270 140 290 180 320 160 S 370 140 400 160" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M410 160 H 540" stroke="#2563eb" stroke-width="3" stroke-dasharray="3 8"/>
<path d="M720 160 l10 -14 l10 24 l10 -30 l10 30 l10 -18 l10 12 l10 -20 l10 26 l10 -10 l10 0" stroke="#dc2626" stroke-width="3" fill="none"/>
<rect x="30" y="190" width="1140" height="205" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="120" cy="290" r="52" fill="url(#gmiy)" stroke="#0369a1" stroke-width="2"/><circle cx="120" cy="290" r="30" fill="url(#gaks)" stroke="#b45309"/>
<text x="120" y="380" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Kalın miyelinli lif</text>
<path d="M240 210 v165" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<circle cx="262" cy="240" r="5" fill="#2563eb"/>
<text x="276" y="246" font-size="18" text-anchor="start" font-weight="bold" fill="#0f172a">Dokunma ve eklem pozisyonu kaybı</text>
<circle cx="262" cy="292" r="5" fill="#2563eb"/>
<text x="276" y="298" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">El ve ayakta keçelenme</text>
<circle cx="262" cy="344" r="5" fill="#2563eb"/>
<text x="276" y="350" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Gece dengesiz yürüyüş (karanlık)</text>
<path d="M720 210 v165" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<circle cx="742" cy="240" r="5" fill="#dc2626"/>
<text x="756" y="246" font-size="18" text-anchor="start" font-weight="bold" fill="#0f172a">Distal parestezi ve karıncalanma</text>
<circle cx="742" cy="292" r="5" fill="#dc2626"/>
<text x="756" y="298" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Uyaransız ortaya çıkan anormal his</text>
<circle cx="742" cy="344" r="5" fill="#dc2626"/>
<text x="756" y="350" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">(iğnelenme)</text>
<rect x="30" y="410" width="1140" height="205" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="120" cy="510" r="16" fill="url(#gaks)" stroke="#b45309" stroke-width="2"/><path d="M80 540 q40 -24 80 0" stroke="#94a3b8" fill="none"/>
<text x="120" y="600" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">İnce miyelinsiz lif</text>
<path d="M240 430 v165" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<circle cx="262" cy="460" r="5" fill="#2563eb"/>
<text x="276" y="466" font-size="18" text-anchor="start" font-weight="bold" fill="#0f172a">Ağrı ve ısıyı değerlendirme kaybı</text>
<circle cx="262" cy="512" r="5" fill="#2563eb"/>
<text x="276" y="518" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Ağrısız yanık ve travma</text>
<circle cx="262" cy="564" r="5" fill="#2563eb"/>
<text x="276" y="570" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Diyabetik ayak: yanığı kokusundan anlar</text>
<path d="M720 430 v165" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<circle cx="742" cy="460" r="5" fill="#dc2626"/>
<text x="756" y="466" font-size="18" text-anchor="start" font-weight="bold" fill="#0f172a">Dizestezi: çarşafın değmesi bile acı</text>
<circle cx="742" cy="512" r="5" fill="#dc2626"/>
<text x="756" y="518" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Hiperaljezi: ağrıya aşırı ağrı</text>
<circle cx="742" cy="564" r="5" fill="#dc2626"/>
<text x="756" y="570" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Kozalji: travma sonrası yanma ağrısı</text>
<rect x="30" y="640" width="357" height="70" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="209" y="681" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Kalın lif: dokunma, pozisyon</text>
<line x1="390" y1="675.0" x2="418" y2="675.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="421" y="640" width="357" height="70" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="600" y="681" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">İnce lif: ağrı, ısı</text>
<line x1="782" y1="675.0" x2="810" y2="675.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="813" y="640" width="357" height="70" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="991" y="659" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Negatif sorulursa karıncalanma,</text>
<text x="991" y="681" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">dizestezi, hiperaljezi, kozalji</text>
<text x="991" y="703" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">yanlış şıktır</text>
<text x="600" y="740" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Ağrılı nöropatide en sık nedenler diyabetik polinöropati ve kriptojenik duysal polinöropatidir.</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Çıkmış: polinöropatide negatif fenomen ağrısız yanma ve travmadır. His kaybı amputasyona kadar gidebilir.</text>
</svg>
