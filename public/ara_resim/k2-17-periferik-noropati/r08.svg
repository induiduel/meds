<line x1="782" y1="677.0" x2="810" y2="677.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="813" y="640" width="357" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="991" y="672" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Derin tendon refleksi azalır ya da</text>
<text x="991" y="694" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">kaybolur</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Çekiç zinciri başlatır, dizin öne fırlaması zincirin sonudur; gama lifler iğciğin gerginliğini ayarlar.</text>
