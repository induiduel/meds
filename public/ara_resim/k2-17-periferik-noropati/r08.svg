<text x="765" y="500" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Kaybolan refleks hangi kök ve sinir</text>
<text x="765" y="522" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">düzeyinin bozulduğunu gösterir.</text>
