<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<linearGradient id="gaks" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="gmiy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="0.5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
<radialGradient id="ggov" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#8b5cf6"/></radialGradient>
<linearGradient id="gkas" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fecaca"/><stop offset="0.5" stop-color="#f87171"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
<radialGradient id="gom" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/></radialGradient>
<linearGradient id="gsag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="okd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="okg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
<g id="miy"><path d="M-22 -9 h44 a9 9 0 0 1 0 18 h-44 a9 9 0 0 1 0 -18 z" fill="url(#gmiy)" stroke="#0369a1" stroke-width="1.2"/></g>
<g id="fos"><circle r="7" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/><path d="M-3 7 q-2 12 1 22 M3 7 q2 12 -1 22" stroke="#c2410c" stroke-width="2" fill="none"/></g>
<g id="mak"><path d="M-16 -4 q2 -14 16 -12 q14 -4 16 10 q6 12 -6 18 q-10 8 -20 0 q-12 -2 -6 -16 z" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="2" cy="1" r="5" fill="#6d28d9"/></g>
<g id="glob"><circle r="5" fill="#7dd3fc" stroke="#0369a1" stroke-width="1"/></g>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Kalınlık ve miyelin ileti hızını belirler</text>
<text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Tip A, Tip B ve Tip C liflerinin kesiti, hızı ve taşıdığı duyu (slayt 9)</text>
<rect x="30" y="100" width="1140" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="132" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Lif kesitleri (aynı ölçekte şematik)</text>
<circle cx="230" cy="245" r="70" fill="url(#gmiy)" stroke="#0369a1" stroke-width="2"/>
<circle cx="230" cy="245" r="44" fill="url(#gaks)" stroke="#b45309" stroke-width="1.5"/>
<path d="M166 245 A64 64 0 0 1 294 245" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
<text x="230" y="175" font-size="22" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip A</text>
<text x="230" y="350" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">2–20 µm, miyelinli, en kalın</text>
<text x="230" y="378" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Vibrasyon ve propriosepsiyon</text>
<circle cx="600" cy="245" r="34" fill="url(#gmiy)" stroke="#0369a1" stroke-width="2"/>
<circle cx="600" cy="245" r="24" fill="url(#gaks)" stroke="#b45309" stroke-width="1.5"/>
<path d="M572 245 A28 28 0 0 1 628 245" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
<text x="600" y="175" font-size="22" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip B</text>
<text x="600" y="350" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">yaklaşık 3 µm, ince miyelinli</text>
<text x="600" y="378" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Preganglionik otonom; bir ölçüde ağrı ve ısı</text>
<circle cx="960" cy="245" r="14" fill="url(#gaks)" stroke="#b45309" stroke-width="2"/>
<path d="M920 275 q40 -30 80 0" stroke="#94a3b8" stroke-width="1.3" fill="none"/>
<text x="960" y="175" font-size="22" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip C</text>
<text x="960" y="350" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">1 µm’den ince, miyelinsiz</text>
<text x="960" y="378" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Ağrı ve ısı</text>
<line x1="290" y1="205" x2="330" y2="194" stroke="#94a3b8" stroke-width="1.3"/><circle cx="290" cy="205" r="3" fill="#334155"/>
<text x="334" y="200" font-size="17" text-anchor="start" font-weight="normal" fill="#0369a1">Miyelin</text>
<line x1="230" y1="245" x2="330" y2="249" stroke="#94a3b8" stroke-width="1.3"/><circle cx="230" cy="245" r="3" fill="#334155"/>
<text x="334" y="255" font-size="17" text-anchor="start" font-weight="normal" fill="#b45309">Akson</text>
<text x="960" y="300" font-size="17" text-anchor="middle" font-weight="normal" fill="#dc2626">miyelin yok</text>
<rect x="30" y="445" width="1140" height="185" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="477" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">B · İleti hızı (metre/saniye)</text>
<line x1="200" y1="600" x2="1120" y2="600" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="120" y="512" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip A</text>
<text x="120" y="548" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip B</text>
<text x="120" y="584" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">Tip C</text>
<path d="M260 498 H1060 a8 8 0 0 1 0 16 H260 a8 8 0 0 1 0 -16 z" fill="#2563eb" opacity="0.85"/>
<text x="660" y="494" font-size="17" text-anchor="middle" font-weight="normal" fill="#2563eb">10–70 m/sn: en hızlı haberciler</text>
<path d="M210 536 C 230 530 250 542 260 536" stroke="#7c3aed" stroke-width="10" stroke-dasharray="4 4" fill="none"/>
<text x="280" y="548" font-size="17" text-anchor="start" font-weight="normal" fill="#7c3aed">Tip A ile Tip C arasında (slayttaki sayı okunamıyor)</text>
<path d="M200 572 H222 a8 8 0 0 1 0 16 H200 z" fill="#dc2626"/>
<text x="244" y="586" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">2 m/sn’den yavaş; EMG ile ölçülemez, hastalığı EMG ile gösterilemez</text>
<rect x="30" y="650" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="160" y="693" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Lif kalınlaşır</text>
<line x1="292" y1="687.0" x2="320" y2="687.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="324" y="650" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="453" y="693" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Miyelin artar</text>
<line x1="586" y1="687.0" x2="614" y2="687.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="617" y="650" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="747" y="682" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">İleti hızlanır: Tip A</text>
<text x="747" y="704" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">otoyol</text>
<line x1="880" y1="687.0" x2="908" y2="687.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="910" y="650" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="1040" y="682" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Miyelinsiz lif Tip C’dir:</text>
<text x="1040" y="704" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">dar köy yolu</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Çıkmış sınavda miyelinsiz sinir lifinin Tip C olduğu sorulmuştur.</text>
</svg>
