<text x="194" y="288" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Vibrasyon duyusu</text>
<circle cx="182" cy="312" r="4" fill="#0369a1"/>
<text x="194" y="318" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Eklem pozisyonu: göz kapalı, parmak yukarı mı aşağı mı?</text>
