<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Duyu muayenesi: hangi test hangi lifi sınar?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Kalın ve ince lif testleri, eldiven-çorap dağılımı (slayt 18)</text>
<rect x="30" y="100" width="640" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="132" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Testler ve sınadıkları lifler</text>
<circle cx="110" cy="210" r="40" fill="url(#gmiy)" stroke="#0369a1" stroke-width="2"/><circle cx="110" cy="210" r="22" fill="url(#gaks)" stroke="#b45309"/>
<text x="170" y="190" font-size="19" text-anchor="start" font-weight="bold" fill="#0369a1">Kalın miyelinli lif</text>
