<rect x="813" y="640" width="357" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="991" y="672" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Polinöropatide kayıp simetrik,</text>
<text x="991" y="694" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">eldiven-çorap tarzı</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Duyu muayenesi, belirtilerden sonra muayenenin ilk adımıdır.</text>
