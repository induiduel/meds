<text x="724" y="200" font-size="17" text-anchor="start" font-weight="normal" fill="#dc2626">Arka kordon</text>
<line x1="1110" y1="330" x2="1110" y2="401" stroke="#94a3b8" stroke-width="1.3"/><circle cx="1110" cy="330" r="3" fill="#334155"/>
<text x="1146" y="420" font-size="17" text-anchor="end" font-weight="normal" fill="#2563eb">Eklemden gelen pozisyon bilgisi</text>
<text x="705" y="470" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Ganglion: duysal nöronopati (duysal gövde</text>
<text x="705" y="492" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">burada, gövde hasarı kuralı).</text>
<text x="705" y="535" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Arka kordon: medulla spinalis lezyonu, örnek</text>
<text x="705" y="557" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">B12 eksikliği.</text>
