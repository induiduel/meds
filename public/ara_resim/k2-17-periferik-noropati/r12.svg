<rect x="617" y="640" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="747" y="672" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Gözler kapanınca tek</text>
<text x="747" y="694" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">dayanak da gider</text>
<line x1="880" y1="677.0" x2="908" y2="677.0" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="910" y="640" width="260" height="74" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="1040" y="672" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Romberg pozitif: ganglion</text>
<text x="1040" y="694" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">ya da arka kordon</text>
<text x="600" y="778" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">Muayenede ayrıca trofik değişiklik aranır: mavi soğuk ekstremite, kıl kaybı, gevrek parmaklar.</text>
