<text x="190" y="170" font-size="18" text-anchor="middle" font-weight="bold" fill="#059669">Göz açık: dengede</text>
<text x="480" y="170" font-size="18" text-anchor="middle" font-weight="bold" fill="#dc2626">Göz kapalı: sallanır</text>
<line x1="200" y1="206" x2="250" y2="284" stroke="#94a3b8" stroke-width="1.3"/><circle cx="200" cy="206" r="3" fill="#334155"/>
<text x="254" y="290" font-size="17" text-anchor="start" font-weight="normal" fill="#059669">Görme dengeyi</text>
<text x="254" y="312" font-size="17" text-anchor="start" font-weight="normal" fill="#059669">telafi eder</text>
<line x1="196" y1="540" x2="250" y2="494" stroke="#94a3b8" stroke-width="1.3"/><circle cx="196" cy="540" r="3" fill="#334155"/>
<text x="254" y="500" font-size="17" text-anchor="start" font-weight="normal" fill="#0f172a">Ayaklar bitişik</text>
<text x="50" y="596" font-size="17" text-anchor="start" font-weight="normal" fill="#475569">Gözler kapanınca dengesini kaybederse test pozitiftir.</text>
