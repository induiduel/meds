<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Romberg testi: göz kapanınca neden düşer?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Pozisyon duyusu kaybında görme tek dayanaktır; lezyon ganglionda ya da arka kordondadır (slayt 19)</text>
