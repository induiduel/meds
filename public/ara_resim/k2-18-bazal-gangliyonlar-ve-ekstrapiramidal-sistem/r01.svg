<text x="896" y="250" font-size="17" font-weight="bold" fill="#15803d">kortekse dönüş</text>
<text x="632" y="478" font-size="17" font-weight="bold" fill="#1d4ed8">a · Kortiko-bazal ganglia-talamo-kortikal yol</text>
<text x="632" y="504" font-size="17" font-weight="bold" fill="#6d28d9">b · Kortiko-serebellar-talamo-kortikal yol</text>
<text x="632" y="540" font-size="17" fill="#334155">İki döngü paralel ve bağımsız çalışır; ikisi de</text>
<text x="632" y="562" font-size="17" fill="#334155">talamustan geçer ama birbirine karışmaz.</text>
<rect x="30" y="640" width="1140" height="212" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="674" font-size="21" font-weight="bold" fill="#0f172a">C · Döngüler ne yapar, kaynak alanlar ne hazırlar?</text>
<text x="52" y="706" font-size="18" fill="#1e293b">Geri dönen yollar modülatördür: hareketi kendileri</text>
<text x="52" y="729" font-size="18" fill="#1e293b">yaptırmaz, kortekse dönerek hareketi artırır</text>
<text x="52" y="753" font-size="18" fill="#1e293b">(fasilitasyon) ya da azaltır (inhibisyon).</text>
<text x="52" y="792" font-size="18" font-weight="bold" fill="#78350f">Kaynak alanlar: lateral premotor, suplementer ve singulat</text>
<text x="52" y="815" font-size="18" font-weight="bold" fill="#78350f">motor alan.</text>
<text x="660" y="700" font-size="17" fill="#334155">Bu alanlar motor programı hazırlar, sıralar ve</text>
<text x="660" y="722" font-size="17" fill="#334155">duyusal bilgiyle bütünleştirir.</text>
