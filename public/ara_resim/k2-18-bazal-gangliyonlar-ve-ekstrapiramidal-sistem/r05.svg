<text x="470" y="500" font-size="17" font-weight="bold" fill="#1e293b">kıyaslar</text>
<path d="M346,580 C346,563.984 374.15999999999997,554 410,554 C449.424,554 474,565.44 474,580 C474,593.104 445.84000000000003,606 410,606 C377.74399999999997,606 346,594.56 346,580 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="410" y="586" font-size="17" text-anchor="middle" font-weight="bold" fill="#14532d">Talamus</text>
<path d="M410,502 Q410,527 410,552" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#ok)"/>
<path d="M474,580 C640,570 690,330 330,206" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" marker-end="url(#uy)"/>
<text x="560" y="560" font-size="17" font-weight="bold" fill="#15803d">düzeltme kortekse:</text>
<text x="560" y="600" font-size="17" font-style="italic" fill="#15803d">“doğru, devam et”</text>
<text x="560" y="624" font-size="17" font-style="italic" fill="#15803d">“biraz fazla”</text>
<text x="230" y="644" font-size="17" fill="#475569">İstirahatte bazal ganglion talamusu baskılar ve</text>
<text x="230" y="666" font-size="17" fill="#475569">korteksin uyarılabilirliğini kontrol altında tutar.</text>
<rect x="770" y="100" width="400" height="580" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="792" y="134" font-size="21" font-weight="bold" fill="#0f172a">B · Odaklama: bardağa uzanmak</text>
<path d="M820,330 C830,290 870,280 900,300 C930,320 940,350 930,380 L850,420 C830,400 815,370 820,330 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
<path d="M900,330 C960,360 1000,380 1040,385 L1040,412 C995,412 950,405 900,382 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
