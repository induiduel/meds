<text x="1115" y="470" font-size="17" text-anchor="middle" font-weight="bold" fill="#0e7490">Bardak</text>
<path d="M930,280 C990,250 1050,270 1100,330" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" marker-end="url(#uy)"/>
<text x="792" y="214" font-size="17" font-weight="bold" fill="#15803d">İstenen bileşen: kol bardağa</text>
<text x="792" y="238" font-size="17" fill="#15803d">gider; direkt yolla güçlenir.</text>
<path d="M960,450 q20,30 40,0 q20,-30 40,0" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
<path d="M965,470 L1035,430 M965,430 L1035,470" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<text x="792" y="530" font-size="17" font-weight="bold" fill="#dc2626">İstenmeyen bileşen: gereksiz</text>
<text x="792" y="554" font-size="17" fill="#dc2626">yerlere kayan hareket; indirekt</text>
<text x="792" y="578" font-size="17" fill="#dc2626">yolla baskılanır.</text>
<text x="792" y="630" font-size="17" fill="#334155">İki yol dengede çalışınca</text>
<text x="792" y="654" font-size="17" fill="#334155">hareket akıcı olur.</text>
<rect x="30" y="700" width="1140" height="104" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="734" font-size="21" font-weight="bold" fill="#0f172a">C · Sonuç</text>
<text x="52" y="764" font-size="17" fill="#334155">Ölçeklemede düzeltme talamus üzerinden kortekse bildirilir; odaklamada istenen bileşen güçlenir, istenmeyen susturulur.</text>
<text x="52" y="786" font-size="17" fill="#334155">Denge bozulunca istemsiz hareket ya da hareketi başlatamama ortaya çıkar.</text>
