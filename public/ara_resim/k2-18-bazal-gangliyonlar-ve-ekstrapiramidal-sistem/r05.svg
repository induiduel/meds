<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Ölçekleme ve odaklama: bazal ganglion hareketi nasıl ayarlar?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" fill="#475569">Komutun kopyası · derin duyu ile kıyas · düzeltme · istenen ve istenmeyen bileşen (slayt 11)</text>
