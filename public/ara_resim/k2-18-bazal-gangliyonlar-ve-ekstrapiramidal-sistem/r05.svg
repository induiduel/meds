<path d="M590,212 C590,300 560,370 506,398" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#okp)"/>
<text x="600" y="272" font-size="17" font-weight="bold" fill="#7c3aed">proprioseptif ve</text>
<text x="600" y="294" font-size="17" font-weight="bold" fill="#7c3aed">bilinçsiz derin</text>
<text x="600" y="316" font-size="17" font-weight="bold" fill="#7c3aed">duyu</text>
