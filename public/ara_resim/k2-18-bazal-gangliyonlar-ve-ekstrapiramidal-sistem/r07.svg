<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Segoe UI, Arial, sans-serif">
<defs><linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><radialGradient id="soma" cx="0.35" cy="0.35" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></radialGradient><linearGradient id="kor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><linearGradient id="deri" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde7d4"/><stop offset="1" stop-color="#f4c39b"/></linearGradient><linearGradient id="kas" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#dc2626"/></linearGradient><marker id="uy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="bs" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M4 0 h3 v10 h-3 z" fill="#b91c1c"/></marker><marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="okp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><g id="hap"><path d="M0,0 h22 a10,10 0 0 1 0,20 h-22 a10,10 0 0 1 0,-20 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/></g></defs>
<rect width="1200" height="840" fill="url(#zemin)"/>
<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">İlaca bağlı hareket bozuklukları: ne zaman, nerede?</text>
<text x="600" y="76" font-size="19" text-anchor="middle" fill="#475569">Nöroleptik (fenotiazin, butirofenon) · iyatrojenik dört tablo (slayt 19)</text>
<rect x="30" y="100" width="1140" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="134" font-size="21" font-weight="bold" fill="#0f172a">A · Zaman çizgisi: nöroleptik kullanım süresi</text>
<path d="M80,250 L1120,250" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="1120" y="280" font-size="17" text-anchor="end" fill="#475569">kullanım süresi →</text>
<circle cx="90" cy="250" r="10" fill="#fff" stroke="#334155" stroke-width="3"/>
<circle cx="1040" cy="250" r="10" fill="#fff" stroke="#334155" stroke-width="3"/>
<use href="#hap" x="80" y="190"/>
<use href="#hap" x="620" y="190"/>
<use href="#hap" x="666" y="190"/>
<use href="#hap" x="712" y="190"/>
<use href="#hap" x="758" y="190"/>
<use href="#hap" x="804" y="190"/>
<use href="#hap" x="850" y="190"/>
<use href="#hap" x="896" y="190"/>
<use href="#hap" x="942" y="190"/>
<use href="#hap" x="988" y="190"/>
<text x="70" y="174" font-size="17" font-weight="bold" fill="#dc2626">Tek doz yeterli</text>
<text x="620" y="174" font-size="17" font-weight="bold" fill="#7c3aed">Uzun süre nöroleptik</text>
<text x="90" y="316" font-size="17" font-weight="bold" fill="#dc2626">Akut distoni: hemen başlar</text>
<text x="1120" y="316" font-size="17" text-anchor="end" font-weight="bold" fill="#7c3aed">Tardif diskinezi: geç başlar, genellikle kalıcı</text>
<rect x="30" y="370" width="560" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="404" font-size="21" font-weight="bold" fill="#0f172a">B · Akut distoni: kasılan yerler</text>
<rect x="610" y="370" width="560" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="632" y="404" font-size="21" font-weight="bold" fill="#0f172a">C · Tardif diskinezi: ağız ve dil</text>
<path d="M130,490 C120,430 230,410 260,470 C272,494 274,514 286,530 C278,538 276,544 276,552 C280,560 274,568 270,574 C272,590 260,600 230,600 L220,635 L150,635 L150,590 C120,570 118,520 130,490 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="242" cy="500" rx="12" ry="8" fill="#fff" stroke="#9a3412" stroke-width="1.5"/>
<circle cx="248" cy="500" r="4.5" fill="#1e293b"/>
<circle cx="244" cy="500" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<line x1="244" y1="500" x2="294" y2="464" stroke="#64748b" stroke-width="1.5"/>
<circle cx="244" cy="500" r="3.5" fill="#64748b"/>
<text x="300" y="470" font-size="17" font-weight="bold" fill="#dc2626">gözler bir tarafa kayar</text>
<circle cx="236" cy="535" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<line x1="236" y1="535" x2="294" y2="506" stroke="#64748b" stroke-width="1.5"/>
<circle cx="236" cy="535" r="3.5" fill="#64748b"/>
<text x="300" y="512" font-size="17" font-weight="bold" fill="#dc2626">yüz</text>
<circle cx="272" cy="566" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<line x1="272" y1="566" x2="294" y2="548" stroke="#64748b" stroke-width="1.5"/>
<circle cx="272" cy="566" r="3.5" fill="#64748b"/>
<text x="300" y="554" font-size="17" font-weight="bold" fill="#dc2626">dil, çene</text>
<circle cx="190" cy="612" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<line x1="190" y1="612" x2="294" y2="624" stroke="#64748b" stroke-width="1.5"/>
<circle cx="190" cy="612" r="3.5" fill="#64748b"/>
<text x="300" y="630" font-size="17" font-weight="bold" fill="#dc2626">boyun: tortikolis</text>
<text x="300" y="592" font-size="17" fill="#7f1d1d">(çene kilitlenir)</text>
<text x="52" y="662" font-size="17" fill="#334155">Gözler takılı kalırsa: akut okülojirik distonik kriz;</text>
<text x="52" y="684" font-size="17" fill="#334155">panik ve huzursuzluk eşlik eder.</text>
<path d="M710,490 C700,430 810,410 840,470 C852,494 854,514 866,530 C858,538 856,544 856,552 C860,560 854,568 850,574 C852,590 840,600 810,600 L800,635 L730,635 L730,590 C700,570 698,520 710,490 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="822" cy="500" rx="12" ry="8" fill="#fff" stroke="#9a3412" stroke-width="1.5"/>
<circle cx="822" cy="500" r="4.5" fill="#1e293b"/>
<path d="M866,560 q10,8 0,16 q-10,8 0,16" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
<path d="M880,548 C910,540 920,560 900,572 M880,590 C915,596 920,616 896,620" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#okp)"/>
<text x="930" y="500" font-size="17" font-weight="bold" fill="#7c3aed">Çiğneme ve yalanma</text>
<text x="930" y="524" font-size="17" fill="#7c3aed">hareketleri; ağzını</text>
<text x="930" y="548" font-size="17" fill="#7c3aed">şapırdatır, dudaklarını</text>
<text x="930" y="572" font-size="17" fill="#7c3aed">yalar, durduramaz.</text>
<text x="632" y="662" font-size="17" fill="#334155">Antiparkinson ilaçlarla şiddetlenebilir.</text>
<rect x="30" y="720" width="1140" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="754" font-size="21" font-weight="bold" fill="#0f172a">D · Öteki iki tablo</text>
<text x="52" y="780" font-size="17" fill="#334155">İlaca bağlı Parkinson: lityum ve tipik antipsikotikler; tremor, yavaşlama, hareketi başlatamama. L-dopa diskinezisi:</text>
<text x="52" y="802" font-size="17" fill="#334155">dozu kendi başına artıran hastada (üç yerine beş tablet) toksisite ve istemsiz hareket.</text>
</svg>
