<text x="420" y="780" font-size="17" font-weight="bold" fill="#1e293b">Ayaklar yere değmeden: pedal hareketi</text>
<text x="790" y="590" font-size="17" fill="#334155">Frekans 4–7 Hz; dudak, çene ve</text>
<text x="790" y="614" font-size="17" fill="#334155">dilde de olabilir.</text>
<text x="790" y="660" font-size="17" fill="#334155">Tipler: statik, postural,</text>
<text x="790" y="684" font-size="17" fill="#334155">intensiyonel, esansiyel.</text>
<text x="790" y="730" font-size="17" font-weight="bold" fill="#7c2d12">Çıkmış: Parkinson ve bazal ganglion</text>
<text x="790" y="754" font-size="17" font-weight="bold" fill="#7c2d12">hastalığındaki tremor statik</text>
<text x="790" y="778" font-size="17" font-weight="bold" fill="#7c2d12">(istirahat) tremorudur.</text>
