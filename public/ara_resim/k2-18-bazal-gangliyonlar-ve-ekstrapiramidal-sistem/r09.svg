<text x="330" y="160" font-size="17" font-weight="bold" fill="#dc2626">Proksimal başlangıç: omuz</text>
<text x="440" y="520" font-size="17" font-weight="bold" fill="#dc2626">ani, fırlatıcı,</text>
<text x="440" y="542" font-size="17" font-weight="bold" fill="#dc2626">geniş amplitüdlü</text>
<text x="52" y="580" font-size="17" font-weight="bold" fill="#dc2626">Tek yarı: bir kol</text>
<text x="52" y="602" font-size="17" fill="#1e293b">ve aynı taraftaki</text>
<text x="52" y="624" font-size="17" fill="#1e293b">bacak</text>
<text x="560" y="224" font-size="17" text-anchor="middle" fill="#92400e">top</text>
<rect x="670" y="100" width="500" height="580" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="692" y="134" font-size="21" font-weight="bold" fill="#0f172a">B · Sonuçları</text>
<path d="M720,180 L720,330" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
<path d="M715,190 l-14,10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<path d="M715,230 l-14,10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
