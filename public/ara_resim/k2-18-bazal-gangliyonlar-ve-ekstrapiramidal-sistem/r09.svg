<text x="600" y="44" font-size="30" text-anchor="middle" font-weight="bold" fill="#0f172a">Hemiballismus: omuzdan başlayan fırlatıcı hareket</text>
<text x="600" y="76" font-size="19" text-anchor="middle" fill="#475569">Vücudun bir yarısı · proksimal başlangıç · geniş amplitüd (slayt 17)</text>
<rect x="30" y="100" width="620" height="580" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="134" font-size="21" font-weight="bold" fill="#0f172a">A · Hareketin yeri ve biçimi</text>
