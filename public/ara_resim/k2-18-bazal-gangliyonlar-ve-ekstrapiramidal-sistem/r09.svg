<path d="M208.0,233.5 C203.8,307.0 214.3,370.0 220.6,401.5 L279.4,401.5 C285.7,370.0 296.2,307.0 292.0,233.5 Q250,216.7 208.0,233.5 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>
