<path d="M715,310 l-14,10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<path d="M860,250 C820,230 780,240 732,250" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#ok)"/>
<path d="M740,240 l10,-14 M744,256 l14,4 M738,262 l4,14" stroke="#b91c1c" stroke-width="3"/>
<text x="780" y="206" font-size="17" font-weight="bold" fill="#1e293b">Kolunu ya da bacağını duvara</text>
<text x="780" y="300" font-size="17" font-weight="bold" fill="#1e293b">çarpıp yaralanabilir.</text>
<path d="M720,430 L1140,430 L1140,460 L720,460 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<path d="M780,420 q30,-20 60,0 q30,-20 60,0 q30,-20 60,0" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="720" y="500" font-size="17" font-weight="bold" fill="#1e293b">Yatak yüzeyine sürtünmekten derisi</text>
<text x="720" y="524" font-size="17" font-weight="bold" fill="#1e293b">soyulabilir.</text>
<text x="692" y="586" font-size="17" fill="#334155">Öteki hareketlerden ayıran üç nokta:</text>
<text x="692" y="612" font-size="17" font-weight="bold" fill="#7f1d1d">tek yarı, proksimal başlangıç,</text>
<text x="692" y="638" font-size="17" font-weight="bold" fill="#7f1d1d">geniş ve fırlatıcı hareket.</text>
<rect x="30" y="700" width="1140" height="96" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="734" font-size="21" font-weight="bold" fill="#0f172a">C · Çıkmış sınav notu</text>
<text x="52" y="762" font-size="17" fill="#7c2d12">Soru kökü bu tanımı verdi (bir yarı, proksimalden başlayan, ani, fırlatıcı, geniş amplitüdlü istemsiz hareket) ve hangi</text>
<text x="52" y="784" font-size="17" fill="#7c2d12">bozukluk olduğunu sordu.</text>
