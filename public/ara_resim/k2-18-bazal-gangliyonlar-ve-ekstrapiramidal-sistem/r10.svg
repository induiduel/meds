<circle cx="788" cy="380" r="3.5" fill="#64748b"/>
<text x="592" y="370" font-size="17" font-weight="bold" fill="#dc2626">SCM kası spazmla</text>
<text x="592" y="392" font-size="17" font-weight="bold" fill="#dc2626">kasılır</text>
<text x="930" y="180" font-size="17" font-weight="bold" fill="#1e293b">Baş karşı tarafa</text>
<text x="930" y="202" font-size="17" fill="#1e293b">döner ve öyle kalır;</text>
<text x="930" y="224" font-size="17" fill="#1e293b">hasta isteyerek</text>
<text x="930" y="246" font-size="17" fill="#1e293b">düzeltemez.</text>
<path d="M1010,450 C1000,420 1000,400 1020,390 C1050,380 1080,400 1078,430 C1076,456 1050,468 1030,462 Z" fill="url(#deri)" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
<path d="M1040,462 C1048,490 1056,510 1060,530 L1100,530 C1094,500 1080,470 1070,455" fill="url(#deri)" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
<path d="M1100,470 C1110,440 1100,410 1080,395" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ok)"/>
<text x="990" y="566" font-size="17" font-weight="bold" fill="#1e293b">Retrokolis: boyun</text>
<text x="990" y="588" font-size="17" font-weight="bold" fill="#1e293b">geriye bükülür</text>
<text x="592" y="580" font-size="17" fill="#334155">Baş yana ya da geriye de</text>
<text x="592" y="602" font-size="17" fill="#334155">anormal postür alabilir.</text>
<text x="592" y="646" font-size="17" font-weight="bold" fill="#7c2d12">Hocaya göre en sık görülen distoni budur.</text>
<rect x="30" y="700" width="1140" height="96" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="734" font-size="21" font-weight="bold" fill="#0f172a">C · Ayırt ettiren nokta</text>
<text x="52" y="762" font-size="17" fill="#334155">Distoniyi öteki hareketlerden ayıran şey, hareketin anormal bir duruşta takılıp kalmasıdır; spazmodik tortikoliste SCM</text>
<text x="52" y="784" font-size="17" fill="#334155">kasılması başı karşı tarafa çevirir.</text>
