<path d="M250,460 C240,442 160,442 150,460" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="320" y="300" font-size="17" font-weight="bold" fill="#7c3aed">yavaş, geniş</text>
<text x="320" y="322" font-size="17" font-weight="bold" fill="#7c3aed">amplitüdlü</text>
<text x="320" y="344" font-size="17" font-weight="bold" fill="#7c3aed">kıvrılma</text>
<text x="320" y="400" font-size="17" fill="#7c3aed">ekstremite, gövde</text>
<text x="320" y="422" font-size="17" fill="#7c3aed">ve boyunda</text>
<text x="320" y="480" font-size="17" font-weight="bold" fill="#334155">vücut anormal</text>
<text x="320" y="502" font-size="17" font-weight="bold" fill="#334155">postür alır</text>
<text x="320" y="560" font-size="17" fill="#334155">Kaslar sürekli çalışır,</text>
<text x="320" y="582" font-size="17" fill="#334155">zamanla hipertrofik</text>
<text x="320" y="604" font-size="17" fill="#334155">olur (kalınlaşır).</text>
<rect x="570" y="100" width="600" height="580" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="592" y="134" font-size="21" font-weight="bold" fill="#0f172a">B · Boyunda lokalize: spazmodik tortikolis</text>
