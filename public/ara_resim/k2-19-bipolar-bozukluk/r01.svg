e="#ea580c" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="408" font-size="17" text-anchor="end" font-weight="normal" fill="#ea580c">hipomani</text><line x1="420" y1="442" x2="1158" y2="442" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="448" font-size="17" text-anchor="end" font-weight="normal" fill="#475569">normal</text><line x1="420" y1="500" x2="1158" y2="500" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="506" font-size="17" text-anchor="end" font-weight="normal" fill="#1d4ed8">majör depr.</text><rect x="30" y="544" width="1140" height="206" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="420" y="558" width="738" height="104" fill="url(#mani)" opacity="0.35"/><rect x="420" y="662" width="738" height="78" fill="url(#dep)" opacity="0.35"/><line x1="420" y1="584" x2="1158" y2="584" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="590" font-size="17" text-anchor="end" font-weight="normal" fill="#c2410c">mani eşiği</text><line x1="420" y1="622" x2="1158" y2="622" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="628" font-size="17" text-anchor="end" font-weight="normal" fill="#ea580c">hipomani</text><line x1="420" y1="662" x2="1158" y2="662" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="668" font-size="17" text-anchor="end" font-weight="normal" fill="#475569">normal</text><line x1="420" y1="720" x2="1158" y2="720" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="412" y="726" font-size="17" text-anchor="end" font-weight="normal" fill="#1d4ed8">majör depr.</text><text x="54" y="144" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Bipolar I</text><g transform="matrix(0.86 0 0 1 162 0)"><path d="M300 222 C360 222 380 126 440 126 C500 126 520 222 580 222 C640 222 660 269 720 269 C780 269 800 222 860 222 L1158 222" fill="none" stroke="#0f172a" stroke-width="4"/></g><g transform="matrix(0.86 0 0 1 162 0)"><path d="M580 222 C640 222 660 269 720 269 C780 269 800 222 860 222" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="9 6"/></g><text x="644" y="134" font-size="17" text-anchor="start" font-weight="bold" fill="#9a3412">tek mani dönemi tanıya yeter</text><text x="919" y="264" font-size="17" text-anchor="start" font-weight="normal" fill="#1e3a8a">depresyon olabilir, şart değil</text><line x1="816" y1="254" x2="914" y2="259" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="816" cy="254" r="3.5" fill="#1e3a8a"/><text x="54" y="180" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">Hayatında bir kez</text><text x="54" y="204" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">mani geçiren kişi</text><text x="54" y="228" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">bipolar I tanısı</text><text x="54" y="252" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">alır.</text><text x="54" y="276" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">Yalnız manilerle</text><text x="54" y="300" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">de seyredebilir.</text><text x="54" y="364" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">B · Bipolar II</text><g transform="matrix(0.86 0 0 1 162 0)"><path d="M300 442 C340 442 350 394 400 394 C450 394 460 442 500 442 C560 442 580 508 660 508 C740 508 760 442 820 442 L900 442" fill="none" stroke="#0f172a" stroke-width="4"/></g><g transform="matrix(0.86 0 0 1 162 0)"><path d="M900 442 C930 442 940 354 980 354 C1020 354 1030 442 1070 442 L1158 442" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 6"/></g><text x="566" y="382" font-size="17" text-anchor="middle" font-weight="bold" fill="#9a3412">hipomani ≥ 4 gün</text><text x="730" y="484" font-size="17" text-anchor="middle" font-weight="bold" fill="#1e3a8a">majör depresyon ≥ 2 hafta</text><text x="1022" y="348" font-size="17" text-anchor="middle" font-weight="bold" fill="#b91c1c">mani çıkarsa → bipolar I</text><text x="54" y="400" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">En az birer hipomani</text><text x="54" y="424" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">ve majör depresyon;</text><text x="54" y="448" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">mani olmamalı.</text><text x="54" y="484" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">Hipomanide işlev kaybı,</text><text x="54" y="508" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">yatış, psikoz yok.</text><text x="54" y="584" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">C · Siklotimi</text><g transform="matrix(0.86 0 0 1 162 0)"><path d="M300 662 Q335 636 370 662 Q405 690 440 662 Q475 636 510 662 Q545 690 580 662 Q615 636 650 662 Q685 690 720 662 Q755 636 790 662 Q825 690 860 662 Q895 636 930 662 Q965 690 1000 662 Q1035 636 1070 662 Q1105 690 1140 662" fill="none" stroke="#0f172a" stroke-width="4"/></g><g transform="matrix(0.86 0 0 1 162 0)"><path d="M300 572 L1140 572" stroke="#7c3aed" stroke-width="3" marker-end="url(#ok)"/></g><text x="781" y="566" font-size="17" text-anchor="middle" font-weight="bold" fill="#5b21b6">en az 2 yıl sürer; sürekli iyilik en çok 2 ay</text><text x="54" y="620" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">Hafif hipomani ve</text><text x="54" y="644" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">depresyon belirtileri</text><text x="54" y="668" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">birbirini izler.</text><text x="54" y="704" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">Ne tam mani ne tam</text><text x="54" y="728" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">majör depresyon.</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 8–11 · Siklotiminin yaşam boyu sıklığı yaklaşık %0,4–1, kadın ve erkekte eşit</text></svg>