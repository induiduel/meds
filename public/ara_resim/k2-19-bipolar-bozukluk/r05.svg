</defs><rect width="1200" height="800" fill="url(#zemin)"/><text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Manik ve majör depresif epizod: süre ve belirti sayısı</text><text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Mani bir hafta ve üç belirtiyle, majör depresyon on beş gün ve beş belirtiyle tanınır</text><rect x="30" y="100" width="1140" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="134" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Aynı gün ölçeğinde süre ölçütleri</text><line x1="110" y1="300" x2="1070" y2="300" stroke="#334155" stroke-width="2"/><line x1="110" y1="294" x2="110" y2="306" stroke="#334155" stroke-width="2"/><text x="110" y="330" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">0</text><line x1="174" y1="294" x2="174" y2="306" stroke="#334155" stroke-width="2"/><line x1="238" y1="294" x2="238" y2="306" stroke="#334155" stroke-width="2"/><line x1="302" y1="294" x2="302" y2="306" stroke="#334155" stroke-width="2"/><line x1="366" y1="294" x2="366" y2="306" stroke="#334155" stroke-width="2"/><text x="366" y="330" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">4</text><line x1="430" y1="294" x2="430" y2="306" stroke="#334155" stroke-width="2"/><line x1="494" y1="294" x2="494" y2="306" stroke="#334155" stroke-width="2"/><line x1="558" y1="294" x2="558" y2="306" stroke="#334155" stroke-width="2"/><text x="558" y="330" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">7</text><line x1="622" y1="294" x2="622" y2="306" stroke="#334155" stroke-width="2"/><line x1="686" y1="294" x2="686" y2="306" stroke="#334155" stroke-width="2"/><line x1="750" y1="294" x2="750" y2="306" stroke="#334155" stroke-width="2"/><line x1="814" y1="294" x2="814" y2="306" stroke="#334155" stroke-width="2"/><line x1="878" y1="294" x2="878" y2="306" stroke="#334155" stroke-width="2"/><line x1="942" y1="294" x2="942" y2="306" stroke="#334155" stroke-width="2"/><line x1="1006" y1="294" x2="1006" y2="306" stroke="#334155" stroke-width="2"/><line x1="1070" y1="294" x2="1070" y2="306" stroke="#334155" stroke-width="2"/><text x="1070" y="330" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">15</text><text x="1115" y="330" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">gün</text><path d="M110 168 h256 q8 0 8 10 v14 q0 10 -8 10 h-256 z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text x="388" y="192" font-size="18" text-anchor="start" font-weight="bold" fill="#9a3412">Hipomani ≥ 4 gün</text><path d="M110 212 h448 q8 0 8 10 v14 q0 10 -8 10 h-448 z" fill="#fb923c" stroke="#c2410c" stroke-width="2"/><text x="580" y="236" font-size="18" text-anchor="start" font-weight="bold" fill="#9a3412">Mani ≥ 1 hafta (iki hafta değil)</text><path d="M110 254 h960 q8 0 8 10 v12 q0 10 -8 10 h-960 z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><text x="122" y="276" font-size="17" text-anchor="start" font-weight="bold" fill="#1e3a8a">Majör depresyon ≥ 15 gün (altı ay değil)</text><rect x="30" y="370" width="560" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="404" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">B · Manik epizod: 7 belirtiden ≥ 3</text><circle cx="64" cy="418" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/><text x="84" y="424" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">büyüklük, benlik saygısı ↑</text><circle cx="64" cy="452" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/><text x="84" y="458" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">uyku gereksinimi ↓</text><circle cx="64" cy="486" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/><text x="84" y="492" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">logore</text><circle cx="64" cy="520" r="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="84" y="526" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">fikir uçuşması</text><circle cx="64" cy="554" r="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="84" y="560" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">distraktibilite</text><circle cx="64" cy="588" r="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="84" y="594" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">amaca yönelik etkinlik ↑</text><circle cx="64" cy="622" r="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="84" y="628" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">riskli zevk etkinlikleri</text><text x="345" y="424" font-size="17" text-anchor="start" font-weight="bold" fill="#b91c1c">İrritabl mizaçta ≥ 4</text><text x="345" y="466" font-size="17" text-anchor="start" font-weight="bold" fill="#1e293b">Ek şartlar:</text><text x="345" y="496" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">mikst epizod dışlanır</text><text x="345" y="526" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">işlev kaybı, yatış</text><text x="345" y="552" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">ya da psikoz</text><text x="345" y="582" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">madde ya da tıbbi</text><text x="345" y="608" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">neden dışlanır</text><text x="50" y="704" font-size="17" text-anchor="start" font-weight="normal" fill="#b91c1c">Hipersomni ve psikomotor yavaşlama mani belirtisi değildir.</text><rect x="610" y="370" width="560" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="632" y="404" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">C · Majör depresif epizod: 8 belirtiden ≥ 5</text><circle cx="644" cy="414" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="420" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">depresif mizaç</text><circle cx="644" cy="444" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="450" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">iştah ↓ ya da ↑</text><circle cx="644" cy="474" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="480" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">uyku ↓ ya da ↑</text><circle cx="644" cy="504" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="510" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">psikomotor yavaşlama</text><text x="664" y="540" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">ya da ajitasyon</text><circle cx="644" cy="564" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="570" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">enerji ↓, yorgunluk</text><circle cx="644" cy="594" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="600" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">suçluluk, değersizlik</text><circle cx="644" cy="624" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="630" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">konsantrasyon güçlüğü</text><circle cx="644" cy="654" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="664" y="660" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">intihar eğilimi</text><text x="960" y="440" font-size="17" text-anchor="start" font-weight="bold" fill="#1e293b">Ek şartlar:</text><text x="960" y="470" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">işlev kaybı</text><text x="960" y="500" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">yas dışlanır</text><text x="960" y="526" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">(olağan üzüntü,</text><text x="960" y="552" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">iki aydan kısa)</text><path d="M950 580 C1000 566 1090 566 1150 580" stroke="#1d4ed8" stroke-width="2" fill="none"/><text x="630" y="704" font-size="17" text-anchor="start" font-weight="normal" fill="#1e3a8a">Uyku iki yönde değişebilir; manide yalnız azalır.</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 29–30 · Dolu daireler gereken en az belirti sayısını simgeler</text></svg>