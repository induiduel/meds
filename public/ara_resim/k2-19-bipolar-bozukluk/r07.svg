</defs><rect width="1200" height="800" fill="url(#zemin)"/><text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Tedavide ilaçların zaman içindeki yeri</text><text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Atakta dengeleyiciye ek ilaç eklenir; atak geçince ekler azaltılır, dengeleyici sürer</text><rect x="30" y="100" width="1140" height="400" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="134" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Atak sırasında ve atak geçince ilaçlar</text><path d="M260 200 C380 140 520 140 660 200 L1130 200" fill="none" stroke="#c2410c" stroke-width="4"/><text x="460" y="228" font-size="18" text-anchor="middle" font-weight="bold" fill="#c2410c">mani atağı</text><text x="900" y="186" font-size="18" text-anchor="middle" font-weight="normal" fill="#475569">atak geçti, iyilik dönemi</text><line x1="660" y1="130" x2="660" y2="480" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/><text x="50" y="256" font-size="18" text-anchor="start" font-weight="bold" fill="#16a34a">Duygudurum</text><text x="50" y="278" font-size="17" text-anchor="start" font-weight="normal" fill="#16a34a">dengeleyici</text><path d="M260 250 L1120 250" stroke="#16a34a" stroke-width="16" stroke-linecap="round" fill="none"/><text x="680" y="284" font-size="17" text-anchor="start" font-weight="normal" fill="#15803d">relaps olmasın diye sürer (ömür boyu)</text><text x="50" y="326" font-size="18" text-anchor="start" font-weight="bold" fill="#7c3aed">Antipsikotik</text><text x="50" y="348" font-size="17" text-anchor="start" font-weight="normal" fill="#7c3aed">ya da benzodiazepin</text><path d="M260 320 L660 320 Q710 320 740 320" stroke="#7c3aed" stroke-width="16" stroke-linecap="round" fill="none"/><text x="765" y="326" font-size="17" text-anchor="start" font-weight="normal" fill="#6d28d9">atak geçince gerekmeyen ek ilaç azaltılır</text><text x="50" y="386" font-size="18" text-anchor="start" font-weight="bold" fill="#0284c7">Uyku ilacı</text><path d="M260 380 L660 380" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M660 380 Q710 380 760 380" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round" fill="none" stroke-dasharray="2 22"/><text x="785" y="386" font-size="17" text-anchor="start" font-weight="normal" fill="#0369a1">hasta onsuz uyuyamıyorsa sürdürülür</text><text x="50" y="446" font-size="18" text-anchor="start" font-weight="bold" fill="#dc2626">Antidepresan</text><path d="M260 440 L640 440" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8" fill="none"/><path d="M440 430 l20 20 m-20 0 l20 -20" stroke="#dc2626" stroke-width="4"/><text x="680" y="446" font-size="17" text-anchor="start" font-weight="normal" fill="#b91c1c">manide kesilir; çökkün dönemde gerekirse geçici</text><rect x="40" y="520" width="360" height="200" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/><text x="220.0" y="592.8000000000001" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Neden antidepresan kesilir?</text><text x="220.0" y="614.9000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Antidepresan maniyi</text><text x="220.0" y="637.0000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">tetikleyebilir ve duygudurum</text><text x="220.0" y="659.1000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">düzenleyici değildir.</text><rect x="420" y="520" width="360" height="200" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="600.0" y="592.8000000000001" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Duygudurum düzenleyiciler</text><text x="600.0" y="614.9000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">lityum</text><text x="600.0" y="637.0000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">valproat / valproik asit</text><text x="600.0" y="659.1000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">karbamazepin</text><rect x="800" y="520" width="360" height="200" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="980.0" y="592.8000000000001" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Öteki tedaviler</text><text x="980.0" y="614.9000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">psikoterapi: bilişsel</text><text x="980.0" y="637.0000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">davranışçı terapi</text><text x="980.0" y="659.1000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">biyolojik: EKT, TMU</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 40–41 · EKT: elektrokonvülsif tedavi · TMU: transkraniyal manyetik uyarım</text></svg>