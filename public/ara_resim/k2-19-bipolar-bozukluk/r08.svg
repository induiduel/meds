" stroke="#334155" stroke-width="2"/><text x="1140" y="352" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">45</text><text x="1130" y="382" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">yaş</text><rect x="240" y="214" width="270" height="60" rx="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text x="375.0" y="250" font-size="18" text-anchor="middle" font-weight="bold" fill="#9a3412">başlangıç 15–24 yaş</text><path d="M510 240 C570 180 710 180 770 236" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#okm)"/><text x="640" y="172" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d4ed8">doğru tanı 5–10 yıl sürer</text><circle cx="780" cy="244" r="12" fill="#1d4ed8"/><text x="780" y="290" font-size="17" text-anchor="middle" font-weight="normal" fill="#1d4ed8">tanı</text><text x="840" y="210" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">Mani görülmeden bipolar</text><text x="840" y="234" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">tanısı konamaz; yalnız</text><text x="840" y="258" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">depresyonla gelen hasta</text><text x="840" y="282" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">yıllarca depresyon tanısıyla</text><text x="840" y="306" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">izlenebilir.</text><rect x="30" y="420" width="560" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="454" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">B · Tanıyı geciktiren üç neden</text><circle cx="74" cy="494" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="74" y="501" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d4ed8">1</text><text x="110" y="490" font-size="18" text-anchor="start" font-weight="bold" fill="#1e293b">Ataklar arası uzun olabilir</text><circle cx="74" cy="572" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="74" y="579" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d4ed8">2</text><text x="110" y="568" font-size="18" text-anchor="start" font-weight="bold" fill="#1e293b">Atağı doktor görmemiş olabilir</text><circle cx="74" cy="650" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="74" y="657" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d4ed8">3</text><text x="110" y="646" font-size="18" text-anchor="start" font-weight="bold" fill="#1e293b">İlk ataklar depresyonla gelebilir</text><text x="110" y="672" font-size="17" text-anchor="start" font-weight="normal" fill="#64748b">mani henüz görülmemiştir</text><rect x="610" y="420" width="560" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="632" y="454" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">C · Tekrarlama ve intihar riski</text><use href="#kisiv" x="660" y="530"/><use href="#kisiv" x="706" y="530"/><use href="#kisiv" x="752" y="530"/><use href="#kisiv" x="798" y="530"/><use href="#kisiv" x="844" y="530"/><use href="#kisiv" x="890" y="530"/><use href="#kisiv" x="936" y="530"/><use href="#kisiv" x="982" y="530"/><use href="#kisiv" x="1028" y="530"/><use href="#kisig" x="1074" y="530"/><text x="640" y="570" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">Tekrarlama %90: tek mani atağı geçiren</text><text x="640" y="594" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">her 10 hastadan ~9 yeni atak geçirir.</text><path d="M640 610 C800 602 960 602 1150 610" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="640" y="640" font-size="17" text-anchor="start" font-weight="bold" fill="#15803d">Bu yüzden tek mani atağından sonra</text><text x="640" y="664" font-size="17" text-anchor="start" font-weight="bold" fill="#15803d">duygudurum düzenleyici başlanır.</text><text x="640" y="704"