uyku düzeninin bozulması</text><line x1="382" y1="660" x2="436" y2="660" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/><rect x="440" y="600" width="340" height="120" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="610.0" y="654.9000000000001" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Uyku bozan işler</text><text x="610.0" y="677.0000000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">gece çalışma gerektiren iş</text><line x1="782" y1="660" x2="836" y2="660" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/><rect x="840" y="600" width="320" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1000.0" y="643.85" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Öneri</text><text x="1000.0" y="665.95" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">bipolar hasta yalnız</text><text x="1000.0" y="688.0500000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">gündüz görevlendirilir</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 17 · Pasta dilimleri hasta payını gösterir: 2/3 ve 1/5</text></svg>