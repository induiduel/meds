"/><text x="300.0" y="646.35" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Hemen "psikiyatri" yazıp geçme</text><text x="300.0" y="668.45" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">Delirium: bilincin bulanıklaştığı</text><text x="300.0" y="690.5500000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">ve dalgalandığı akut tablo</text><line x1="562" y1="662" x2="616" y2="662" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/><rect x="620" y="600" width="540" height="125" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="890.0" y="646.35" font-size="17" text-anchor="middle" font-weight="bold" fill="#0f172a">Mutlaka bak</text><text x="890.0" y="668.45" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">tansiyon, EKG, kaç gündür şikâyeti var,</text><text x="890.0" y="690.5500000000001" font-size="17" text-anchor="middle" font-weight="normal" fill="#0f172a">yeme içmede sorun var mı</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 22 · Bilişsel yetiler, bilinç maddesi</text></svg>