</defs><rect width="1200" height="800" fill="url(#zemin)"/><text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Klinik gidiş: hızlı düzelme, yüksek tekrarlama</text><text x="600" y="76" font-size="19" text-anchor="middle" font-weight="normal" fill="#475569">Atak sonrası kritik dönem, lityumun koruyucu değeri ve uzun dönem seyir</text><rect x="30" y="100" width="600" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="134" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">A · Tedaviden sonra düzelme ve kritik dönem</text><line x1="70" y1="380" x2="600" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/><rect x="270" y="200" width="150" height="170" fill="#fee2e2" opacity="0.8"/><path d="M70 180 C130 180 190 330 270 340 L590 340" fill="none" stroke="#c2410c" stroke-width="4"/><text x="80" y="168" font-size="17" text-anchor="start" font-weight="normal" fill="#c2410c">mani</text><line x1="270" y1="160" x2="270" y2="390" stroke="#94a3b8" stroke-dasharray="6 6" stroke-width="2"/><text x="170" y="412" font-size="17" text-anchor="middle" font-weight="bold" fill="#1e293b">3–4 hafta</text><text x="345" y="230" font-size="17" text-anchor="middle" font-weight="bold" fill="#b91c1c">ilk 3 ay</text><text x="345" y="254" font-size="17" text-anchor="middle" font-weight="normal" fill="#b91c1c">tekrarlama</text><text x="345" y="278" font-size="17" text-anchor="middle" font-weight="normal" fill="#b91c1c">için en kritik</text><text x="430" y="190" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">Orta-ileri yaşta</text><text x="430" y="214" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">uzun hareketlilik</text><text x="430" y="238" font-size="17" text-anchor="start" font-weight="normal" fill="#1e293b">aritmi tetikleyebilir.</text><rect x="650" y="100" width="520" height="330" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="672" y="134" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">B · Adölesanda lityum ve relaps (18 ay)</text><path d="M760 395 v-174.0 q0 -10 10 -10 h60 q10 0 10 10 v174.0 z" fill="#dc2626"/><text x="800" y="201.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#dc2626">%92</text><text x="800" y="418" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">lityum kesilen</text><path d="M960 395 v-64.0 q0 -10 10 -10 h60 q10 0 10 10 v64.0 z" fill="#16a34a"/><text x="1000" y="311.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#16a34a">%37</text><text x="1000" y="418" font-size="17" text-anchor="middle" font-weight="normal" fill="#1e293b">lityuma devam</text><text x="1080" y="260" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">lityum</text><text x="1080" y="284" font-size="17" text-anchor="middle" font-weight="normal" fill="#475569">koruyucudur</text><rect x="30" y="450" width="1140" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="484" font-size="21" text-anchor="start" font-weight="bold" fill="#0f172a">C · Uzun süreli seyir</text><circle cx="64" cy="510" r="10" fill="#f97316"/><text x="86" y="516" font-size="18" text-anchor="start" font-weight="normal" fill="#1e293b">Tek manik atağı olanların %90'dan fazlası daha sonra yeni epizod geçirir.</text><circle cx="64" cy="552" r="10" fill="#7c3aed"/><text x="86" y="558" font-size="18" text-anchor="start" font-weight="normal" fill="#1e293b">Uzun izlemde 2–30 manik epizod; %40'tan fazlası 10'dan fazla epizod geçirir.</text><circle cx="64" cy="594" r="10" fill="#0ea5e9"/><text x="86" y="600" font-size="18" text-anchor="start" font-weight="normal" fill="#1e293b">Orta ve geç yaşta ataklar arasındaki süreler daha kısadır.</text><circle cx="64" cy="636" r="10" fill="#dc2626"/><text x="86" y="642" font-size="18" text-anchor="start" font-weight="normal" fill="#1e293b">Ağır, koruyucu tedaviye dirençli seyirde nöbetler sıklaşır, mani ve depresyon iç içe geçer.</text><circle cx="64" cy="678" r="10" fill="#475569"/><text x="86" y="684" font-size="18" text-anchor="start" font-weight="normal" fill="#1e293b">Olguların %20–35'inde kronik gidiş; ataklar uzun dönemde nörokognitif yıkıma yol açar.</text><text x="600" y="782" font-size="17" text-anchor="middle" font-weight="normal" fill="#64748b">Kaynak: slayt 35–37 · Mani tanısı alan hasta ömür boyu duygudurum dengeleyici kullanır</text></svg>