<text x="320" y="205" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="bold">Katot (−)</text>
<text x="240" y="556" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">0,5–2 mA</text>
<text x="290" y="610" font-size="17" fill="#475569" text-anchor="start">pil benzeri cihaz</text>
<text x="40" y="470" font-size="17" fill="#475569" text-anchor="start">Tuzlu suyla</text>
<text x="40" y="494" font-size="17" fill="#475569" text-anchor="start">ıslatılmış ped</text>
<rect x="470" y="100" width="700" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="490" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Zar potansiyeli (eşik altı)</text>
