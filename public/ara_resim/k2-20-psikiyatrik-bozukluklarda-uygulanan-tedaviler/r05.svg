<text x="1000" y="222" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">ateşleme eşiği</text>
<line x1="520" y1="400" x2="1130" y2="400" stroke="#94a3b8" stroke-width="2"/>
<text x="530" y="392" font-size="17" fill="#475569" text-anchor="start">dinlenim</text>
