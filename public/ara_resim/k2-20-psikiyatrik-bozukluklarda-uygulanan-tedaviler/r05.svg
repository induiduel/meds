<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">tDCS: kutup, nöronun ateşlemeye yakınlığını değiştirir</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Eşik altı modülasyon · anodal artırır, katodal azaltır (slayt 20–22)</text>
