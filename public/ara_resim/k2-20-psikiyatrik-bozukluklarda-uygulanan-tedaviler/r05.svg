<path d="M560 400 L700 400 C730 400 740 490 780 490 L1100 490" fill="none" stroke="#2563eb" stroke-width="4"/>
<text x="800" y="332" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">Anodal: depolarizasyon,</text>
<text x="800" y="354" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">uyarılabilirlik artar</text>
<text x="800" y="520" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">Katodal: hiperpolarizasyon,</text>
<text x="800" y="542" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">uyarılabilirlik azalır</text>
<text x="540" y="258" font-size="17" fill="#475569" text-anchor="start">Eşiğe yaklaşır ama tek başına aşmaz</text>
<rect x="30" y="640" width="1140" height="135" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="60" y="680" font-size="19" fill="#14532d" text-anchor="start" font-weight="bold">tDCS tamamen nöromodülatördür; TMS hem nörostimülatör hem nöromodülatördür.</text>
<text x="60" y="714" font-size="17" fill="#1e293b" text-anchor="start">Etki uyarının süresine, yoğunluğuna ve polaritesine bağlıdır; akım yalnız en yüzeysel kortekse ulaşır.</text>
<text x="60" y="748" font-size="17" fill="#475569" text-anchor="start">tDCS şu anda hiçbir endikasyon için onaylı değildir; yan etkiler hafif: cilt tahrişi, yanma hissi.</text>
