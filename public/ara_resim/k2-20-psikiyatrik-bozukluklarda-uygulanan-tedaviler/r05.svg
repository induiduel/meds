<line x1="520" y1="560" x2="520" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="530" y="170" font-size="17" fill="#475569" text-anchor="start">zar potansiyeli</text>
<text x="1050" y="590" font-size="17" fill="#475569" text-anchor="start">zaman</text>
