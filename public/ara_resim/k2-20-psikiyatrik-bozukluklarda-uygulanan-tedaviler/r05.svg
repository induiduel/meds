<path d="M240 165 C230 230 250 330 240 445" fill="none" stroke="#be123c" stroke-width="2"/>
<ellipse cx="155" cy="250" rx="34" ry="22" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
<ellipse cx="325" cy="250" rx="34" ry="22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
