<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<radialGradient id="beyin" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#fde2e4"/><stop offset="1" stop-color="#f4a7b0"/></radialGradient>
<radialGradient id="isik" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#facc15"/></radialGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
<g id="vez"><circle r="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle r="3" fill="#b45309"/></g>
<g id="ay"><path d="M0 -14 A14 14 0 1 0 10 10 A11 11 0 1 1 0 -14 z" fill="#64748b"/></g>
<g id="gunes"><circle r="12" fill="#facc15" stroke="#ca8a04" stroke-width="2"/></g>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Fototerapi: ışık melatonini baskılar, ritmi ve duygudurumu etkiler</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Mevsimsel affektif bozukluk · 1984'ten beri (slayt 27)</text>
<rect x="30" y="100" width="560" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Kış başında ışık azalır</text>
<path d="M70 450 C170 250 260 200 330 200 C400 200 470 260 560 450" fill="none" stroke="#f59e0b" stroke-width="4"/>
<path d="M110 450 C190 340 250 310 310 310 C370 310 430 340 510 450" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 6"/>
<use href="#gunes" x="330" y="200"/>
<use href="#gunes" x="310" y="310"/>
<line x1="60" y1="450" x2="570" y2="450" stroke="#334155" stroke-width="2"/>
<text x="370" y="262" font-size="17" fill="#b45309" text-anchor="start" font-weight="bold">yaz: uzun gündüz</text>
<text x="250" y="400" font-size="17" fill="#475569" text-anchor="start" font-weight="bold">kış: kısa gündüz</text>
<text x="60" y="475" font-size="17" fill="#475569" text-anchor="start">güneşin günlük yolu</text>
<text x="50" y="505" font-size="17" fill="#1e293b" text-anchor="start">Mevsimsel depresyon tipik olarak kış başında</text>
<text x="50" y="529" font-size="17" fill="#1e293b" text-anchor="start">başlar ve çoğunlukla atipik özellik gösterir:</text>
<text x="50" y="553" font-size="17" fill="#1e293b" text-anchor="start">hasta çok uyur.</text>
<rect x="610" y="100" width="560" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="630" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Gece–gündüz ve melatonin</text>
<line x1="650" y1="440" x2="1130" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="1060" y="470" font-size="17" fill="#475569" text-anchor="start">saat</text>
<path d="M650 430 C720 430 760 250 840 230 C900 215 930 380 990 425 C1030 432 1100 430 1130 430" fill="none" stroke="#6d28d9" stroke-width="4"/>
<circle cx="960" cy="330" r="34" fill="url(#isik)" stroke="#ca8a04" stroke-width="2"/>
<line x1="1000" y1="330" x2="1016" y2="330" stroke="#ca8a04" stroke-width="3"/>
<line x1="980" y1="365" x2="988" y2="379" stroke="#ca8a04" stroke-width="3"/>
<line x1="940" y1="365" x2="932" y2="378" stroke="#ca8a04" stroke-width="3"/>
<line x1="920" y1="330" x2="904" y2="330" stroke="#ca8a04" stroke-width="3"/>
<line x1="940" y1="295" x2="933" y2="281" stroke="#ca8a04" stroke-width="3"/>
<line x1="980" y1="296" x2="989" y2="282" stroke="#ca8a04" stroke-width="3"/>
<line x1="925" y1="330" x2="880" y2="300" stroke="#a16207" stroke-width="3" marker-end="url(#ok)"/>
<text x="660" y="180" font-size="17" fill="#6d28d9" text-anchor="start" font-weight="bold">Melatonin karanlıkta salgılanır</text>
<use href="#ay" x="700" y="250"/>
<text x="1005" y="290" font-size="17" fill="#a16207" text-anchor="start" font-weight="bold">parlak ışık</text>
<text x="1005" y="314" font-size="17" fill="#a16207" text-anchor="start">salınımı azaltır</text>
<text x="630" y="500" font-size="17" fill="#1e293b" text-anchor="start">Işık, melatonin üzerinden sirkadiyen ritmi</text>
<text x="630" y="524" font-size="17" fill="#1e293b" text-anchor="start">(24 saatlik iç saat) ve duygudurumu etkiler.</text>
<rect x="30" y="590" width="1140" height="185" rx="16" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
<text x="60" y="630" font-size="18" fill="#713f12" text-anchor="start" font-weight="bold">Uygulama: 2.500–10.000 lüks parlak gündüz ışığı veren aletin karşısında 30 dakika, 1 ya da 2 saat.</text>
<text x="60" y="664" font-size="18" fill="#1e293b" text-anchor="start">Yanıt hızlıdır: 2–4 gün içinde görülür.</text>
<text x="60" y="698" font-size="17" fill="#1e293b" text-anchor="start">Hocanın önerisi: atipik depresyonlu, çok uyuyan hasta erken yatıp erken kalksın, sabah hareket etsin.</text>
<text x="60" y="732" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">Hoca: depresyon yalnız antidepresanla düzelmez, mutlaka davranış aktivasyonu gerekir.</text>
</svg>
