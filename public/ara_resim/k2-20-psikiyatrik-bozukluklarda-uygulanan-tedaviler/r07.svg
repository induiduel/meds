<text x="600" y="615" font-size="18" fill="#155e75" text-anchor="start" font-weight="bold">Sürdürmek için haftalarca aralıklı uygulama;</text>
<text x="600" y="641" font-size="18" fill="#1e293b" text-anchor="start">arada 1–2 gün normal uyku dönemi vardır.</text>
<text x="60" y="710" font-size="18" fill="#155e75" text-anchor="start" font-weight="bold">Antidepresan ya da lityumla birlikte: düzelme kalıcılaşır, antidepresanın etkinliği artar.</text>
<text x="60" y="744" font-size="18" fill="#c2410c" text-anchor="start" font-weight="bold">Hoca: kısa süreli kestirme bile şiddetli tekrarlama yapar, buna dikkat edilmeli.</text>
