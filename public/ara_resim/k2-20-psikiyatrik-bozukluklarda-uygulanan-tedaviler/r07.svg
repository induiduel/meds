<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Uyku yoksunluğu: hızlı ama kısa ömürlü antidepresan etki</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Depresyonda tam uyku yoksunluğu · 1971'den beri (slayt 28–29)</text>
