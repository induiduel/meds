<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Doz arttıkça baskı: doğrusal eğri ile yataylaşan eğri</text>
<text x="600" y="74" text-anchor="middle" font-size="18" fill="#475569">Şekil 22-1'in okunuşu · slayt 3</text>
