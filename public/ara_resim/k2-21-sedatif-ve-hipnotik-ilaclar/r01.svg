<text x="560" y="192" font-size="17" fill="#dc2626" text-anchor="end">barbitürat, alkol</text>
<text x="680" y="375" font-size="19" fill="#2563eb" text-anchor="end" font-weight="bold">İlaç B</text>
<text x="680" y="440" font-size="17" fill="#2563eb" text-anchor="end">hipnozdan sonra yataylaşır</text>
