<text x="770" y="129" font-size="21" font-weight="bold" fill="#0f172a">B · İlaç A ile ne olur?</text>
<text x="770" y="160" font-size="17" fill="#1e293b" text-anchor="start">Hipnoz dozu aşılınca</text>
<text x="770" y="184" font-size="17" fill="#1e293b" text-anchor="start">genel anesteziye geçilebilir.</text>
<path d="M960 196 L960 222" stroke="#dc2626" stroke-width="3" marker-end="url(#okk)"/>
<text x="770" y="250" font-size="17" fill="#1e293b" text-anchor="start">Daha yüksek dozda medulladaki</text>
