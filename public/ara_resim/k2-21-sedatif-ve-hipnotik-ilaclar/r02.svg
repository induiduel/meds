</defs>
<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Benzodiazepin metabolizması: faz I'den faz II'ye</text>
<text x="600" y="74" text-anchor="middle" font-size="18" fill="#475569">Karaciğerde dönüşüm, aktif metabolit ve birikim · slayt 10–12</text>
<rect x="30" y="95" width="1140" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="129" font-size="21" font-weight="bold" fill="#0f172a">A · Karaciğerde iki aşama</text>
<path d="M70 230 C80 160 200 140 300 160 C360 170 380 200 360 250 C340 320 200 360 120 330 C80 315 65 280 70 230 z" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="215" y="240" font-size="19" fill="#7f1d1d" text-anchor="middle" font-weight="bold">Karaciğer</text>
<text x="215" y="264" font-size="17" fill="#7f1d1d" text-anchor="middle">mikrozomal enzimler</text>
<rect x="400" y="150" width="210" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="505" y="180" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Ana ilaç</text>
<text x="505" y="205" font-size="17" fill="#1e3a8a" text-anchor="middle">diazepam,</text>
<text x="505" y="226" font-size="17" fill="#1e3a8a" text-anchor="middle">klordiazepoksit, prazepam,</text>
<text x="505" y="246" font-size="17" fill="#1e3a8a" text-anchor="middle">klorazepat (ön ilaç)</text>
<path d="M612 205 C650 205 660 205 690 205" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="650" y="190" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">Faz I</text>
<rect x="700" y="150" width="210" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="805" y="180" font-size="18" fill="#78350f" text-anchor="middle" font-weight="bold">Oksidasyon</text>
<text x="805" y="205" font-size="17" fill="#78350f" text-anchor="middle">CYP3A4 başta olmak üzere</text>
<text x="805" y="226" font-size="17" fill="#78350f" text-anchor="middle">sitokrom P450</text>
<text x="805" y="248" font-size="17" fill="#b45309" text-anchor="middle" font-weight="bold">metabolit çoğu hâlâ etkili</text>
<path d="M912 205 C940 205 950 205 975 205" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="943" y="190" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">Faz II</text>
<rect x="985" y="150" width="170" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1070" y="180" font-size="18" fill="#14532d" text-anchor="middle" font-weight="bold">Glukuronid</text>
<text x="1070" y="205" font-size="17" fill="#14532d" text-anchor="middle">suda çözünür,</text>
<text x="1070" y="226" font-size="17" fill="#14532d" text-anchor="middle">etkisiz</text>
<text x="1070" y="248" font-size="17" fill="#14532d" text-anchor="middle">idrarla atılır</text>
<path d="M360 210 C380 205 390 205 398 205" stroke="#991b1b" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="560" y="290" width="400" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="760" y="318" font-size="17" fill="#7c2d12" text-anchor="middle" font-weight="bold">Aktif metabolit: desmetildiazepam</text>
<text x="760" y="342" font-size="17" fill="#7c2d12" text-anchor="middle">(nordiazepam), yarılanma ömrü 40 saati aşar</text>
<text x="760" y="366" font-size="17" fill="#7c2d12" text-anchor="middle">diazepam, klordiazepoksit, prazepam</text>
<text x="760" y="388" font-size="17" fill="#7c2d12" text-anchor="middle">ve klorazepat ona dönüşür</text>
<path d="M805 262 L790 288" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="60" y="390" font-size="17" fill="#15803d" text-anchor="start">Alprazolam ve triazolam: metabolitleri hızla glukuronide</text>
<text x="60" y="412" font-size="17" fill="#15803d" text-anchor="start">bağlanır, etki kısa sürer.</text>
<rect x="30" y="440" width="1140" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="474" font-size="21" font-weight="bold" fill="#0f172a">B · Tekrarlanan dozlarda birikim</text>
<line x1="100" y1="650" x2="1120" y2="650" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<line x1="100" y1="650" x2="100" y2="490" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="1110" y="672" font-size="17" fill="#334155" text-anchor="end">zaman, tekrarlanan dozlar</text>
<text x="112" y="500" font-size="17" fill="#334155" text-anchor="start">vücuttaki miktar</text>
<path d="M110 645 C130 580 150 590 200 615 C220 560 245 565 300 595 C320 540 345 545 400 578 C420 525 445 530 500 565 C520 515 545 520 600 555 C620 510 645 515 700 548" stroke="#c2410c" stroke-width="4" fill="none"/>
<text x="720" y="545" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">uzun ömürlü ilaç ya da metabolit:</text>
<text x="720" y="567" font-size="17" fill="#c2410c" text-anchor="start">her doz öncekinin üstüne eklenir</text>
<path d="M110 645 C130 600 150 610 200 640 C220 600 245 605 300 640 C320 600 345 605 400 640 C420 600 445 605 500 640" stroke="#15803d" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
<text x="720" y="620" font-size="17" fill="#15803d" text-anchor="start">kısa ömürlü (triazolam): dozlar arasında temizlenir</text>
<rect x="30" y="694" width="1140" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="728" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Ölçülen yarılanma ömrü tek başına yetmez; aktif metabolitlerin ömrü de hesaba katılır.</text>
<text x="600" y="766" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 10, 11, 12 (Şekil 22-5)</text>
</svg>
