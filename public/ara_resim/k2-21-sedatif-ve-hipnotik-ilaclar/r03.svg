<text x="600" y="674" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Beyindeki ana tip: 2 α1 + 2 β2 + 1 γ2. Her ilaç sınıfının kendi bağlanma yeri vardır.</text>
