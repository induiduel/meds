<text x="735" y="305" font-size="17" fill="#334155" text-anchor="start">α1 ile γ2 arasında; flumazenil</text>
<text x="735" y="327" font-size="17" fill="#334155" text-anchor="start">ve zolpidem de bu bölgede</text>
