<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<linearGradient id="zar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<radialGradient id="kre" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#7dd3fc"/></radialGradient>
<radialGradient id="kar" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fdba74"/></radialGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<g id="cl"><circle r="11" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">Cl⁻</text></g>
<g id="gaba"><path d="M0 -10 L9 5 L-9 5 z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1.5"/></g>
<g id="bzd"><rect x="-9" y="-9" width="18" height="18" rx="3" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/></g>
<g id="bar"><path d="M0 -11 L11 0 L0 11 L-11 0 z" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/></g>
</defs>
<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Benzodiazepin ile barbitürat: aynı kanal, farklı etki</text>
<text x="600" y="74" text-anchor="middle" font-size="18" fill="#475569">Allosterik artırma ile açık kalma süresinin uzaması · slayt 21–22</text>
<rect x="30" y="95" width="560" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="129" font-size="21" font-weight="bold" fill="#0f172a">A · Benzodiazepin</text>
<rect x="70" y="200" width="480" height="60" fill="url(#zar)" stroke="#b45309" stroke-width="1.5"/>
<path d="M220 170 C210 230 210 230 220 290 L270 290 L270 170 z" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/>
<path d="M400 170 C410 230 410 230 400 290 L350 290 L350 170 z" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/>
<use href="#gaba" x="200" y="160"/>
<use href="#bzd" x="422" y="162"/>
<use href="#cl" x="310" y="188"/>
<path d="M310 205 L310 295" stroke="#15803d" stroke-width="3" marker-end="url(#oky)"/>
<text x="80" y="155" font-size="17" fill="#64748b" text-anchor="start">hücre dışı</text>
<text x="80" y="282" font-size="17" fill="#64748b" text-anchor="start">hücre içi</text>
<text x="50" y="345" font-size="17" fill="#1e293b" text-anchor="start">GABA kanala bağlanır; benzodiazepin başka</text>
<text x="50" y="367" font-size="17" fill="#1e293b" text-anchor="start">bir yerden bağlanıp GABA etkisini artırır.</text>
<text x="50" y="399" font-size="18" fill="#1d4ed8" text-anchor="start" font-weight="bold">Allosterik artırma</text>
<text x="50" y="425" font-size="17" fill="#1d4ed8" text-anchor="start">Kanalı kendisi açmaz, GABA'nın yerini tutmaz.</text>
<text x="50" y="457" font-size="17" fill="#1e293b" text-anchor="start">GABA yoksa etkisi de yoktur.</text>
<text x="50" y="485" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">Sonuç: sinapsta GABA inhibisyonu güçlenir.</text>
<rect x="610" y="95" width="560" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="630" y="129" font-size="21" font-weight="bold" fill="#0f172a">B · Barbitürat</text>
<rect x="650" y="200" width="480" height="60" fill="url(#zar)" stroke="#b45309" stroke-width="1.5"/>
<path d="M800 170 C790 230 790 230 800 290 L850 290 L850 170 z" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/>
<path d="M980 170 C990 230 990 230 980 290 L930 290 L930 170 z" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/>
<use href="#gaba" x="780" y="160"/>
<use href="#bar" x="1002" y="162"/>
<use href="#cl" x="890" y="188"/>
<path d="M890 205 L890 295" stroke="#15803d" stroke-width="3" marker-end="url(#oky)"/>
<text x="660" y="155" font-size="17" fill="#64748b" text-anchor="start">hücre dışı</text>
<text x="660" y="282" font-size="17" fill="#64748b" text-anchor="start">hücre içi</text>
<text x="630" y="345" font-size="17" fill="#1e293b" text-anchor="start">1. GABA'ya bağlı klorür kanalının açık</text>
<text x="630" y="367" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">kalma süresini uzatır.</text>
<text x="630" y="399" font-size="17" fill="#1e293b" text-anchor="start">2. Yüksek derişimde kanalı GABA olmadan</text>
<text x="630" y="421" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">doğrudan açar: GABA-mimetik etki.</text>
<text x="630" y="453" font-size="17" fill="#1e293b" text-anchor="start">3. AMPA reseptörüne bağlanıp glutamatın</text>
<text x="630" y="475" font-size="17" fill="#1e293b" text-anchor="start">uyarıcı etkisini de baskılar.</text>
<rect x="30" y="530" width="1140" height="150" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="564" font-size="21" font-weight="bold" fill="#0f172a">C · Sonuç</text>
<use href="#bzd" x="70" y="590"/>
<text x="95" y="596" font-size="17" fill="#1e3a8a" text-anchor="start">Kanalı açmak için GABA gerekir: etkisi daha seçicidir.</text>
<use href="#bar" x="70" y="640"/>
<text x="95" y="646" font-size="17" fill="#9a3412" text-anchor="start">Yüksek derişimde GABA olmadan açma + glutamat baskısı: daha az seçicidir.</text>
<rect x="30" y="694" width="1140" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="728" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Fark kanalı kimin açtığında: benzodiazepin GABA'ya yardım eder, barbitürat gerekirse kendisi açar.</text>
<text x="600" y="766" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 21, 22</text>
</svg>
