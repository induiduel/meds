</defs>
<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Tolerans, bağımlılık ve yoksunluk: uzun kullanımın akışı</text>
<text x="600" y="74" text-anchor="middle" font-size="18" fill="#475569">Sedatif-hipnotikler · slayt 29–32</text>
<rect x="30" y="95" width="560" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="129" font-size="21" font-weight="bold" fill="#0f172a">A · Tolerans neden gelişir?</text>
<text x="50" y="160" font-size="17" fill="#1e293b" text-anchor="start" font-weight="bold">Aynı doz zamanla daha az etki eder.</text>
<path d="M70 190 C140 200 200 240 250 265 C290 282 310 288 340 290" stroke="#2563eb" stroke-width="4" fill="none"/>
<text x="350" y="286" font-size="17" fill="#2563eb" text-anchor="start">aynı dozun etkisi</text>
<line x1="70" y1="310" x2="540" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="540" y="332" font-size="17" fill="#334155" text-anchor="end">tekrarlanan kullanım</text>
<path d="M60 330 C120 358 180 358 240 370" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<circle cx="80" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="118" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="156" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="194" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="232" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<path d="M300 370 C330 362 350 362 380 370" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<circle cx="320" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<circle cx="358" cy="366" r="8" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/>
<path d="M250 366 L292 366" stroke="#334155" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="60" y="342" font-size="17" fill="#1e40af" text-anchor="start" font-weight="bold">reseptör sayısı azalır</text>
<text x="50" y="406" font-size="17" fill="#1e293b" text-anchor="start">• Barbitürat: yıkım hızı artar.</text>
<text x="50" y="430" font-size="17" fill="#1e293b" text-anchor="start">• Çoğu ilaç: SSS yanıtı değişir.</text>
<text x="50" y="454" font-size="17" fill="#1d4ed8" text-anchor="start">• Benzodiazepin: reseptör azalır (aşağı regülasyon).</text>
<rect x="610" y="95" width="560" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="630" y="129" font-size="21" font-weight="bold" fill="#0f172a">B · Bağımlılık ve kesilme</text>
<rect x="640" y="150" width="500" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="890" y="178" font-size="17" fill="#4c1d95" text-anchor="middle" font-weight="bold">Sürekli kullanım: vücut ilaca uyum sağlar</text>
<text x="890" y="202" font-size="17" fill="#4c1d95" text-anchor="middle">ilaç gerektiren değişmiş fizyolojik durum</text>
<path d="M890 216 L890 246" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<rect x="640" y="252" width="500" height="50" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="890" y="284" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">İlaç kesilir</text>
<path d="M890 304 L890 334" stroke="#dc2626" stroke-width="3" marker-end="url(#okk)"/>
<rect x="640" y="340" width="500" height="96" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="890" y="368" font-size="17" fill="#7f1d1d" text-anchor="middle" font-weight="bold">Yoksunluk: SSS aşırı uyarılabilir</text>
<text x="890" y="394" font-size="17" fill="#7f1d1d" text-anchor="middle">anksiyete ve uykusuzlukla başlar,</text>
<text x="890" y="418" font-size="17" fill="#7f1d1d" text-anchor="middle">konvülsiyona kadar ilerleyebilir</text>
<path d="M640 470 C700 455 760 455 820 470" stroke="#cbd5e1" stroke-width="0" fill="none"/>
<rect x="30" y="470" width="1140" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="504" font-size="21" font-weight="bold" fill="#0f172a">C · Yoksunluğun şiddeti neye bağlı?</text>
<text x="60" y="530" font-size="17" fill="#1e293b" text-anchor="start" font-weight="bold">Kesilmeden önceki doz büyükse</text>
<text x="60" y="556" font-size="17" fill="#1e293b" text-anchor="start">ve ilaç aniden kesilirse daha ağırdır.</text>
<path d="M610 610 C640 540 660 540 690 610 C720 540 740 540 770 610 C800 540 820 540 850 610" stroke="#dc2626" stroke-width="3.5" fill="none"/>
<text x="600" y="525" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">Yarılanma ömrü çok kısa ilaç (triazolam):</text>
<text x="600" y="551" font-size="17" fill="#b91c1c" text-anchor="start">dozlar arasında bile yoksunluk; gündüz anksiyetesi</text>
<text x="880" y="612" font-size="17" fill="#b91c1c" text-anchor="start">↑ her doz arası düşüş</text>
<text x="60" y="600" font-size="17" fill="#1e293b" text-anchor="start">Eszopiklon, zaleplon, zolpidemin ani</text>
<text x="60" y="624" font-size="17" fill="#1e293b" text-anchor="start">kesilmesi de yoksunluk yapabilir.</text>
<rect x="30" y="694" width="1140" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="728" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Uzun kullanım → tolerans ve uyum → ani kesilme → aşırı uyarılabilir SSS.</text>
<text x="600" y="766" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 29, 30, 31, 32</text>
</svg>
