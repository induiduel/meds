<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<linearGradient id="zar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<radialGradient id="kre" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#7dd3fc"/></radialGradient>
<radialGradient id="kar" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffedd5"/><stop offset="1" stop-color="#fdba74"/></radialGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<g id="cl"><circle r="11" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">Cl⁻</text></g>
<g id="gaba"><path d="M0 -10 L9 5 L-9 5 z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1.5"/></g>
<g id="bzd"><rect x="-9" y="-9" width="18" height="18" rx="3" fill="#60a5fa" stroke="#1e40af" stroke-width="1.5"/></g>
