<text x="350" y="462" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">flumazenil</text>
<text x="50" y="505" font-size="17" fill="#1e293b" text-anchor="start">Yüksek afiniteyle aynı yere oturur.</text>
<text x="50" y="530" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">Geri çevirir: benzodiazepin, Z-ilaçları.</text>
<text x="50" y="555" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">Çeviremez: barbitürat, etanol,</text>
<text x="50" y="578" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">opioid, genel anestezik.</text>
