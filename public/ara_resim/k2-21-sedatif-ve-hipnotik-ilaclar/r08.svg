<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f172a">Flumazenilin kısa etkisi ve sedasyonun geri gelmesi</text>
<text x="600" y="74" text-anchor="middle" font-size="18" fill="#475569">Yarışmalı antagonist, kısa yarılanma ömrü · slayt 33–34</text>
<rect x="30" y="95" width="440" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="129" font-size="21" font-weight="bold" fill="#0f172a">A · Bağlanma yerinde yarış</text>
