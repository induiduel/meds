<line x1="560" y1="520" x2="560" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#ok)"/>
<text x="1130" y="545" font-size="17" fill="#334155" text-anchor="end">zaman</text>
<text x="572" y="170" font-size="17" fill="#334155" text-anchor="start">sedasyon</text>
<path d="M570 220 L1120 260" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<text x="1110" y="210" font-size="17" fill="#1e40af" text-anchor="end">benzodiazepin etkisi uzun sürer</text>
<path d="M570 220 L660 225 C690 230 700 470 740 480 C800 490 830 480 860 420 C900 340 930 290 1120 262" stroke="#7c3aed" stroke-width="5" fill="none"/>
<path d="M665 160 L665 200" stroke="#475569" stroke-width="3" marker-end="url(#ok)"/>
<text x="665" y="150" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">flumazenil damardan</text>
<text x="760" y="505" font-size="17" fill="#15803d" text-anchor="middle" font-weight="bold">hızlı uyanma</text>
<text x="900" y="400" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="bold">flumazenil hızla temizlenir:</text>
<text x="900" y="422" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="bold">sedasyon geri gelir</text>
<text x="510" y="560" font-size="17" fill="#b91c1c" text-anchor="start">Bağımlı hastada şiddetli yoksunluk sendromu başlayabilir;</text>
<text x="510" y="584" font-size="17" fill="#b91c1c" text-anchor="start">trisiklik antidepresan alan hastada nöbet ve ritim bozukluğu görülebilir.</text>
<rect x="30" y="630" width="1140" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="600" y="664" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Bütün benzodiazepinlerin etkisi flumazenilinkinden uzundur; sedasyon genellikle geri gelir.</text>
<text x="600" y="746" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 33, 34 · eğri şematiktir</text>
