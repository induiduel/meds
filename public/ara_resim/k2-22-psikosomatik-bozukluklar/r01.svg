<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Beyin bir tahmin makinesidir: duyum nasıl belirtiye dönüşür?</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Öngörüsel işleme modeli ve belirtiyi büyüten döngü · slayt 6–7</text>
<rect x="30" y="95" width="560" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#6d28d9" text-anchor="start" font-weight="bold">A · Öngörüsel işleme: algı = sinyal + tahmin</text>
<path d="M200 330 C170 300 180 240 230 225 C245 185 320 175 350 210 C400 195 450 230 440 280 C470 310 450 360 410 365 C390 395 330 400 300 380 C260 400 215 380 200 330 Z" stroke="#6d28d9" stroke-width="3" fill="#ede9fe" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M250 250 C270 300 330 300 350 260" stroke="#6d28d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300 230 C330 270 370 280 400 240" stroke="#6d28d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M235 310 C275 345 335 350 380 320" stroke="#6d28d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="322" y="300" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="bold">ALGILANAN BELİRTİ</text>
<text x="322" y="322" font-size="15" fill="#6d28d9" text-anchor="middle" font-style="italic">ikisinin “en iyi tahmini”</text>
<path d="M322 175 C322 190 322 200 322 215" stroke="#6d28d9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
<text x="322" y="162" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="bold">BEKLENTİ (yukarıdan aşağı)</text>
<text x="380" y="190" font-size="15" fill="#475569" text-anchor="start">önceki deneyim, inançlar,</text>
<text x="380" y="208" font-size="15" fill="#475569" text-anchor="start">korku, dikkat</text>
<path d="M322 470 C322 440 322 410 322 378" stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okt)"/>
<path d="M300 480 C290 465 300 450 312 456 C318 460 322 466 322 468 C322 466 326 460 332 456 C344 450 354 465 344 480 C338 490 322 500 322 500 C322 500 306 490 300 480 Z" stroke="#0f766e" stroke-width="2" fill="#ccfbf1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="490" font-size="16" fill="#0f766e" text-anchor="start" font-weight="bold">SİNYAL (aşağıdan yukarı)</text>
<text x="350" y="510" font-size="14" fill="#475569" text-anchor="start">kalp atımı, ağrı, kas ve eklem duyusu</text>
<text x="50" y="400" font-size="15" fill="#1e293b" text-anchor="start">Beyin sinyali olduğu gibi okumaz;</text>
<text x="50" y="418" font-size="15" fill="#1e293b" text-anchor="start">ne hissetmesi gerektiğini geçmişe</text>
<text x="50" y="436" font-size="15" fill="#1e293b" text-anchor="start">göre tahmin eder.</text>
<rect x="620" y="95" width="550" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="640" y="127" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">B · Belirtiyi büyüten kapalı döngü</text>
<path d="M930 200 Q981 201 997 248" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
