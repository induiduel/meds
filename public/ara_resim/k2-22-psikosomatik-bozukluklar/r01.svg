<text x="1013.8820645368942" y="286.37287570313157" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">Dikkat</text>
<circle cx="968.4731565365591" cy="421.12712429686843" r="34" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="968.4731565365591" y="419.12712429686843" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">Felaket</text>
<text x="968.4731565365591" y="434.12712429686843" font-size="14" fill="#ea580c" text-anchor="middle">yorumu</text>
<circle cx="821.5268434634409" cy="421.12712429686843" r="34" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="821.5268434634409" y="426.12712429686843" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">Kaygı</text>
<circle cx="776.1179354631058" cy="281.37287570313157" r="34" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="776.1179354631058" y="279.37287570313157" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">Duyum</text>
<text x="776.1179354631058" y="294.37287570313157" font-size="14" fill="#ea580c" text-anchor="middle">artar</text>
<line x1="925.0" y1="179.0" x2="935" y2="150" stroke="#64748b" stroke-width="1.4"/>
<circle cx="925.0" cy="179.0" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="941" y="155" font-size="14" fill="#475569" text-anchor="start">somatosensoriyel</text>
<text x="941" y="170" font-size="14" fill="#475569" text-anchor="start">amplifikasyon (Barsky):</text>
<text x="941" y="187" font-size="14" fill="#475569" text-anchor="start">olağan duyum yoğun ve</text>
<text x="941" y="204" font-size="14" fill="#475569" text-anchor="start">tehlikeli algılanır</text>
<line x1="1033.8820645368942" y1="311.37287570313157" x2="1150" y2="365" stroke="#64748b" stroke-width="1.4"/>
<circle cx="1033.8820645368942" cy="311.37287570313157" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="1144" y="370" font-size="14" fill="#475569" text-anchor="end">seçici dikkat:</text>
<text x="1150" y="383" font-size="14" fill="#475569" text-anchor="end">ne kadar bakılırsa o kadar bulunur</text>
<line x1="978.4731565365591" y1="455.12712429686843" x2="1150" y2="495" stroke="#64748b" stroke-width="1.4"/>
<circle cx="978.4731565365591" cy="455.12712429686843" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="1144" y="500" font-size="14" fill="#475569" text-anchor="end">felaketleştirme: “baş ağrısı = tümör”</text>
<line x1="787.5268434634409" y1="431.12712429686843" x2="640" y2="495" stroke="#64748b" stroke-width="1.4"/>
<circle cx="787.5268434634409" cy="431.12712429686843" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="646" y="500" font-size="14" fill="#475569" text-anchor="start">kaygı uyarılmayı artırır</text>
<line x1="766.1179354631058" y1="247.37287570313157" x2="745" y2="150" stroke="#64748b" stroke-width="1.4"/>
<circle cx="766.1179354631058" cy="247.37287570313157" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="739" y="155" font-size="14" fill="#475569" text-anchor="end">santral duyarlılaşma:</text>
<text x="745" y="170" font-size="14" fill="#475569" text-anchor="end">zararsız uyaran ağrılı algılanır</text>
<text x="895" y="325" font-size="30" fill="#ea580c" text-anchor="middle">↺</text>
<rect x="30" y="545" width="1140" height="170" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="577" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">C · Örnek: babasını kalp krizinden kaybeden genç</text>
<circle cx="130" cy="630" r="26" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
<text x="130" y="636" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">1</text>
<text x="130" y="680" font-size="14" fill="#1e293b" text-anchor="middle">merdiven çıkar</text>
<line x1="162" y1="630" x2="282" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<circle cx="315" cy="630" r="26" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
