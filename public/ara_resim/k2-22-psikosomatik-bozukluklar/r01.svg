<text x="315" y="680" font-size="14" fill="#1e293b" text-anchor="middle">olağan çarpıntı</text>
<line x1="347" y1="630" x2="467" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<circle cx="500" cy="630" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="500" y="636" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">3</text>
<text x="500" y="680" font-size="14" fill="#1e293b" text-anchor="middle">“kalbimde sorun var”</text>
<line x1="532" y1="630" x2="652" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<circle cx="685" cy="630" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="685" y="636" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">4</text>
<text x="685" y="680" font-size="14" fill="#1e293b" text-anchor="middle">göğüs ağrısı + tehlike</text>
<line x1="717" y1="630" x2="837" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<circle cx="870" cy="630" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="870" y="636" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">5</text>
<text x="870" y="680" font-size="14" fill="#1e293b" text-anchor="middle">kaygı → çarpıntı ↑</text>
<line x1="902" y1="630" x2="1022" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<circle cx="1055" cy="630" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="1055" y="636" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">6</text>
<text x="1055" y="680" font-size="14" fill="#1e293b" text-anchor="middle">korku doğrulanır</text>
<text x="600" y="705" font-size="15" fill="#475569" text-anchor="middle" font-style="italic">Beklenti sinyali tehlike diye okur; kaygı sinyali büyütür ve döngü kapanır.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 6 (öngörüsel işleme) ve slayt 7 (somatosensoriyel amplifikasyon, seçici dikkat, felaketleştirme, santral duyarlılaşma)</text>
