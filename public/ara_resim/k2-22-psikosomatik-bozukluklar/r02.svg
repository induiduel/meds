<circle cx="735" cy="175" r="20.3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<path d="M708.9 276.5 C703.1 218.5 720.5 198.2 735 198.2 C749.5 198.2 766.9 218.5 761.1 276.5 Z" stroke="#0f766e" stroke-width="2" fill="#0f766e" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M721.95 276.5 L719.05 346.1" stroke="#0f766e" stroke-width="10.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M748.05 276.5 L750.95 346.1" stroke="#0f766e" stroke-width="10.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150" cy="270" r="9" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="122" cy="300" r="9" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="178" cy="300" r="9" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="150" cy="232" r="9" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<line x1="150" y1="270" x2="250" y2="292" stroke="#64748b" stroke-width="1.4"/>
<circle cx="150" cy="270" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="256" y="297" font-size="15" fill="#ea580c" text-anchor="start">gerçek bedensel belirti: karın ağrısı</text>
<line x1="178" y1="300" x2="250" y2="322" stroke="#64748b" stroke-width="1.4"/>
<circle cx="178" cy="300" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="256" y="327" font-size="15" fill="#ea580c" text-anchor="start">eklem ağrıları, yorgunluk</text>
<path d="M215 195 C215 165 260 155 290 170 C330 155 380 175 370 205 C385 230 345 250 315 240 C290 260 240 250 240 225 C215 225 210 210 215 195 Z" stroke="#ea580c" stroke-width="2" fill="#fff7ed" stroke-linecap="round" stroke-linejoin="round"/>
<text x="292" y="195" font-size="14" fill="#ea580c" text-anchor="middle">“Bir şey gözden kaçtı,</text>
<text x="292" y="212" font-size="14" fill="#ea580c" text-anchor="middle">belirtim çok ciddi”</text>
<text x="50" y="372" font-size="15" fill="#1e293b" text-anchor="start">Kaygının odağı: belirtinin ciddiyeti ve anlamı</text>
<text x="50" y="394" font-size="15" fill="#1e293b" text-anchor="start">Tipik davranış: belirtiyle uğraş, tetkik, analjezik</text>
<text x="50" y="416" font-size="15" fill="#1e293b" text-anchor="start">A: ≥1 sıkıntı veren belirti · B: aşırı düşünce,</text>
<text x="50" y="438" font-size="15" fill="#1e293b" text-anchor="start">duygu ya da davranış (en az biri) · C: >6 ay</text>
<text x="50" y="492" font-size="15" fill="#ea580c" text-anchor="start" font-weight="bold">Doktor doktor dolaşma; normal tetkik rahatlatmaz</text>
<path d="M800 195 C800 165 845 155 875 170 C915 155 965 175 955 205 C970 230 930 250 900 240 C875 260 825 250 825 225 C800 225 795 210 800 195 Z" stroke="#6d28d9" stroke-width="2" fill="#f5f3ff" stroke-linecap="round" stroke-linejoin="round"/>
<text x="877" y="195" font-size="14" fill="#6d28d9" text-anchor="middle">“Ya bende de</text>
<text x="877" y="212" font-size="14" fill="#6d28d9" text-anchor="middle">kanser varsa?”</text>
<line x1="735" y1="270" x2="835" y2="292" stroke="#64748b" stroke-width="1.4"/>
<circle cx="735" cy="270" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="841" y="297" font-size="15" fill="#6d28d9" text-anchor="start">bedensel belirti yok ya da çok hafif</text>
<rect x="1000" y="300" width="120" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<line x1="1015" y1="318" x2="1105" y2="318" stroke="#6d28d9" stroke-width="2"/>
<line x1="1015" y1="335" x2="1090" y2="335" stroke="#6d28d9" stroke-width="2"/>
<line x1="1015" y1="352" x2="1100" y2="352" stroke="#6d28d9" stroke-width="2"/>
<text x="1060" y="388" font-size="14" fill="#6d28d9" text-anchor="middle">gece forumlarda belirti okuma</text>
<text x="635" y="405" font-size="15" fill="#1e293b" text-anchor="start">Kaygının odağı: hasta olma ya da hastalanma fikri</text>
<text x="635" y="427" font-size="15" fill="#1e293b" text-anchor="start">Tipik davranış: kontrol, araştırma ya da kaçınma</text>
<text x="635" y="449" font-size="15" fill="#1e293b" text-anchor="start">B: belirti yok ya da çok hafif · D: bakım arayan /</text>
<text x="635" y="471" font-size="15" fill="#1e293b" text-anchor="start">bakımdan kaçınan tip · E: ≥6 ay · F: dışlama</text>
<text x="635" y="492" font-size="15" fill="#6d28d9" text-anchor="start" font-weight="bold">Normal kolonoskopi yalnız bir hafta rahatlatır</text>
<rect x="30" y="535" width="1140" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="567" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">C · Ayrımın ilk sorusu</text>
<rect x="440" y="585" width="320" height="52" rx="26" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="600" y="617" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">Gerçek bedensel belirti var mı?</text>
<path d="M440 611 C380 611 340 640 300 660" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
<path d="M760 611 C820 611 860 640 900 660" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
<text x="300" y="690" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">EVET → bedensel belirti bozukluğu</text>
<text x="300" y="710" font-size="14" fill="#475569" text-anchor="middle">(eski adı somatizasyon bozukluğu)</text>
<text x="900" y="690" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="bold">HAYIR → hastalık kaygısı bozukluğu</text>
<text x="900" y="710" font-size="14" fill="#475569" text-anchor="middle">(eski adı hipokondriyazis)</text>
<text x="600" y="690" font-size="14" fill="#475569" text-anchor="middle">Ortak nokta: ikisinde de</text>
<text x="600" y="708" font-size="14" fill="#475569" text-anchor="middle">tıbbi hastalık tanıyı dışlamaz</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 13 (A+B+C), 22–23 (A–F), 24 (karşılaştırma tablosu)</text>
</svg>