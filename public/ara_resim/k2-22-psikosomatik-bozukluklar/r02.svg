<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Ayşe Hanım mı, Mert mi? Belirti var mı sorusu ayrımı belirler</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Bedensel belirti bozukluğu ile hastalık kaygısı bozukluğunun karşılaştırması · slayt 13, 22–24</text>
<rect x="30" y="95" width="555" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">A · Bedensel belirti bozukluğu (Ayşe Hanım)</text>
<rect x="615" y="95" width="555" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="635" y="127" font-size="20" fill="#6d28d9" text-anchor="start" font-weight="bold">B · Hastalık kaygısı bozukluğu (Mert)</text>
<circle cx="150" cy="175" r="20.3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
