<text x="60" y="657" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">Yorum</text>
<text x="60" y="680" font-size="14" fill="#1e293b" text-anchor="start">İşlevsel: istemli hareket bozuk, otomatik hareket normal → kas aslında güçlüdür; iç tutarsızlık yapısal lezyonla açıklanamaz.</text>
<text x="60" y="702" font-size="14" fill="#1e293b" text-anchor="start">Organik felç: her iki durumda da zayıflık sürer. Güvenilir olmayanlar: orta hatta bölünen duyu kaybı, güzel aldırmazlık, telkinle düzelme.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 31 (mantık ve tablo), 32 (Hoover), 33 (kalça abdüktör), 34 (titreme, tünel görme) · turuncu = zayıf/işlevsel, yeşil = sağlam/normal</text>
