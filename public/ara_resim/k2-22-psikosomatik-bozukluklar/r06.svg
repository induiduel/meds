<text x="50" y="697" font-size="14" fill="#1e293b" text-anchor="start">Video-EEG altın standarttır: epileptik nöbette deşarj ve postiktal yavaşlama, işlevsel nöbette artefaktın iki yanında kesintisiz alfa.</text>
<text x="50" y="713" font-size="14" fill="#1e293b" text-anchor="start">İşlevsel nöbeti olanların %22'sinde epilepsi de vardır; tek bulgu tanı koydurmaz.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 36 (uyku ile ilişki, %22 çift tanı) ve slayt 37 (video-EEG şeritleri) · teal/kırmızı = epileptik, yeşil = işlevsel</text>
