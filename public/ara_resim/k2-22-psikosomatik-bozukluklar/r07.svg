<circle cx="920" cy="458" r="5.6000000000000005" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<path d="M912.8 486.0 C911.2 470.0 916.0 464.4 920 464.4 C924.0 464.4 928.8 470.0 927.2 486.0 Z" stroke="#0f766e" stroke-width="2" fill="#0f766e" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M916.4 486.0 L915.6 505.2" stroke="#0f766e" stroke-width="2.8000000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M923.6 486.0 L924.4 505.2" stroke="#0f766e" stroke-width="2.8000000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M875 488 C890 473 905 473 915 488" stroke="#0f766e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okt)"/>
<text x="965" y="462" font-size="14" fill="#1e293b" text-anchor="start">önemli bir kişinin belirtisi</text>
<text x="965" y="479" font-size="14" fill="#1e293b" text-anchor="start">bilinçdışı örnek alınır;</text>
<text x="965" y="496" font-size="14" fill="#1e293b" text-anchor="start">yasta görülebilir</text>
<rect x="30" y="565" width="1140" height="155" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="597" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">E · Sınavda nasıl sorulur?</text>
<text x="50" y="625" font-size="14" fill="#1e293b" text-anchor="start">Güzel aldırmazlık hangi bozuklukta görülür? → konversiyon (işlevsel nörolojik belirti) bozukluğu; çeldiriciler somatizasyon, hipokondriyazis, dismorfik bozukluk.</text>
<text x="50" y="649" font-size="14" fill="#1e293b" text-anchor="start">Birincil kazanç içeride kaygıyı azaltır, ikincil kazanç dışarıdan ilgi ve kolaylık getirir; ikisi de bilinçli bir çıkar hesabı değildir (bilinçli çıkar = temaruz).</text>
<text x="600" y="700" font-size="15" fill="#475569" text-anchor="middle" font-style="italic">Tanıyı bu kavramlar değil, muayenedeki olumlu bulgular koydurur.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 3 (Freud: çatışma → belirti → birincil kazanç) ve slayt 38 (klasik kavramlar)</text>
</svg>