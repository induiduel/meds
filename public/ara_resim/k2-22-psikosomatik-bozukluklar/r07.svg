<path d="M1097.12 150.4 L1096.48 165.76" stroke="#ea580c" stroke-width="2.24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1102.88 150.4 L1103.52 165.76" stroke="#ea580c" stroke-width="2.24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1060" y="182" font-size="14" fill="#475569" text-anchor="middle">aile, çevre</text>
<rect x="460" y="405" width="345" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="437" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">C · Güzel aldırmazlık</text>
<path d="M500 470 C515 455 535 455 550 470" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M520 490 C525 500 535 500 540 490" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="575" y="455" font-size="14" fill="#1e293b" text-anchor="start">ciddi belirtiye karşın</text>
<text x="575" y="472" font-size="14" fill="#1e293b" text-anchor="start">uygunsuz kayıtsızlık</text>
<text x="575" y="489" font-size="14" fill="#1e293b" text-anchor="start">(la belle indifférence)</text>
<text x="480" y="520" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="bold">tarihsel kavram; tanısal değeri yok,</text>
<text x="480" y="537" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="bold">güvenilir bulgu değil</text>
<rect x="825" y="405" width="345" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="845" y="437" font-size="20" fill="#0f766e" text-anchor="start" font-weight="bold">D · Özdeşim</text>
<circle cx="860" cy="458" r="5.6000000000000005" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<path d="M852.8 486.0 C851.2 470.0 856.0 464.4 860 464.4 C864.0 464.4 868.8 470.0 867.2 486.0 Z" stroke="#64748b" stroke-width="2" fill="#64748b" stroke-linecap="round" stroke-linejoin="round"/>
