<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Konversiyon: çatışmadan belirtiye, belirtiden kazanca</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Birincil ve ikincil kazanç, güzel aldırmazlık, özdeşim · slayt 3 ve 38</text>
<rect x="30" y="95" width="400" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#6d28d9" text-anchor="start" font-weight="bold">A · Dönüşüm (konversiyon)</text>
<path d="M120 300 C90 260 100 190 160 170 C200 150 260 165 275 215 C285 250 265 275 262 300 C268 320 262 345 245 350 C240 370 215 380 200 360 C180 385 140 375 135 345 C115 340 112 318 120 300 Z" stroke="#6d28d9" stroke-width="3" fill="#f5f3ff" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M148 238 C172 204 224 204 248 238 C232 272 164 272 148 238 Z" stroke="#6d28d9" stroke-width="2" fill="#ddd6fe" stroke-linecap="round" stroke-linejoin="round"/>
<text x="198" y="245" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">bilinçdışı</text>
<text x="198" y="262" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">çatışma</text>
<text x="300" y="190" font-size="14" fill="#475569" text-anchor="start">bastırılmış duygu,</text>
<text x="300" y="207" font-size="14" fill="#475569" text-anchor="start">travmatik anı</text>
<path d="M198 275 C198 320 198 370 198 410" stroke="#6d28d9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
<text x="215" y="350" font-size="14" fill="#6d28d9" text-anchor="start">psişik enerji</text>
<text x="215" y="367" font-size="14" fill="#6d28d9" text-anchor="start">biçim değiştirir</text>
<path d="M120 470 C150 440 250 440 280 470" stroke="#ea580c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="285" cy="472" r="9" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<text x="198" y="505" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">bedensel belirti: felç, duyu kaybı</text>
<text x="198" y="525" font-size="14" fill="#475569" text-anchor="middle">istemsiz; kaygı yerine belirti</text>
<rect x="460" y="95" width="710" height="290" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="127" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">B · İki kazanç, ikisi de bilinçli hesap değil</text>
<path d="M480 240 C560 200 640 200 700 240" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
<path d="M740 240 C820 200 900 200 960 240" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
<text x="590" y="185" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">içeride</text>
<text x="850" y="185" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">dışarıda</text>
<rect x="480" y="250" width="320" height="120" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="640" y="278" font-size="17" fill="#6d28d9" text-anchor="middle" font-weight="bold">Birincil kazanç</text>
<text x="640" y="302" font-size="14" fill="#1e293b" text-anchor="middle">içsel çatışma bilinç dışında tutulur;</text>
<text x="640" y="320" font-size="14" fill="#1e293b" text-anchor="middle">kaygı azalır, belirti sembolik anlam taşır</text>
<rect x="830" y="250" width="320" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="990" y="278" font-size="17" fill="#ea580c" text-anchor="middle" font-weight="bold">İkincil kazanç</text>
<text x="990" y="302" font-size="14" fill="#1e293b" text-anchor="middle">hasta rolünün dış yararları:</text>
<text x="990" y="320" font-size="14" fill="#1e293b" text-anchor="middle">destek, ilgi, sorumluluktan uzaklaşma</text>
<circle cx="1020" cy="128" r="4.48" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
