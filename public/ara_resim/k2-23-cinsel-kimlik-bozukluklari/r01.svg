<path d="M491.9 393.0 L490.1 436.2" stroke="#ea580c" stroke-width="6.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M508.1 393.0 L509.9 436.2" stroke="#ea580c" stroke-width="6.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M340 340 C 390 120, 470 230, 488 300" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
<line x1="296" y1="232" x2="250" y2="170" stroke="#64748b" stroke-width="1.4"/>
<circle cx="296" cy="232" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="60" y="150" font-size="14" fill="#6d28d9" text-anchor="start">Cinsiyet kimliği: kendini kadın,</text>
<text x="60" y="170" font-size="14" fill="#6d28d9" text-anchor="start">erkek ya da başka hissetme</text>
<text x="60" y="190" font-size="13" fill="#6d28d9" text-anchor="start" font-style="italic">(içten duyulan his)</text>
<text x="430" y="150" font-size="14" fill="#ea580c" text-anchor="start" font-weight="bold">Cinsel yönelim:</text>
<text x="430" y="170" font-size="14" fill="#ea580c" text-anchor="start">çekim duyulan cinsiyet</text>
<line x1="276" y1="310" x2="150" y2="540" stroke="#64748b" stroke-width="1.4"/>
<circle cx="276" cy="310" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="50" y="560" font-size="14" fill="#6b7280" text-anchor="start">Cinsiyet ifadesi: giyim,</text>
<text x="50" y="580" font-size="14" fill="#6b7280" text-anchor="start">saç, davranış, ses</text>
<line x1="292" y1="415" x2="300" y2="575" stroke="#64748b" stroke-width="1.4"/>
<circle cx="292" cy="415" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="300" y="595" font-size="14" fill="#0f766e" text-anchor="middle">Biyolojik cinsiyet: kromozom,</text>
<text x="300" y="615" font-size="14" fill="#0f766e" text-anchor="middle">gonad, üreme organı, hormon</text>
<line x1="450" y1="335" x2="470" y2="540" stroke="#64748b" stroke-width="1.4"/>
<circle cx="450" cy="335" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="410" y="560" font-size="14" fill="#0f172a" text-anchor="start">Cinsiyet rolü: toplumun</text>
<text x="410" y="580" font-size="14" fill="#0f172a" text-anchor="start">beklediği tutum, sorumluluk</text>
<text x="300" y="642" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">Birini bilmek diğerleri hakkında bilgi vermez.</text>
<rect x="620" y="95" width="550" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="640" y="127" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">B · Sınavın karıştırdığı iki eksen</text>
<line x1="650" y1="190" x2="1140" y2="190" stroke="#6d28d9" stroke-width="3" marker-end="url(#okm)"/>
<text x="655" y="175" font-size="15" fill="#6d28d9" text-anchor="start" font-weight="bold">Kimlik ekseni</text>
<text x="670" y="212" font-size="13" fill="#6d28d9" text-anchor="start">Atanan cinsiyetle uyumlu</text>
<text x="1130" y="212" font-size="13" fill="#6d28d9" text-anchor="end">Atanan cinsiyetten farklı hissetme</text>
<circle cx="1040" cy="190" r="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="985" y="242" font-size="13" fill="#6d28d9" text-anchor="middle">Transseksüellik (eski ad) → cinsiyet hoşnutsuzluğu</text>
<line x1="650" y1="320" x2="1140" y2="320" stroke="#ea580c" stroke-width="3" marker-end="url(#oko)"/>
<text x="655" y="305" font-size="15" fill="#ea580c" text-anchor="start" font-weight="bold">Yönelim ekseni</text>
<circle cx="700" cy="320" r="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="700" y="350" font-size="13" fill="#ea580c" text-anchor="middle">Heteroseksüel</text>
<circle cx="895" cy="320" r="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="895" y="350" font-size="13" fill="#ea580c" text-anchor="middle">Biseksüel</text>
<circle cx="1090" cy="320" r="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1090" y="350" font-size="13" fill="#ea580c" text-anchor="middle">Homoseksüel</text>
<text x="895" y="372" font-size="13" fill="#ea580c" text-anchor="middle" font-style="italic">Üç yönelim de DSM-5-TR'de tanı değildir</text>
<path d="M1090 310 C 1135 290, 1140 240, 1060 200" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<line x1="1118" y1="262" x2="1144" y2="288" stroke="#b91c1c" stroke-width="4"/><line x1="1144" y1="262" x2="1118" y2="288" stroke="#b91c1c" stroke-width="4"/>
<text x="895" y="396" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">Yanlış önerme: transseksüellik, kendi cinsiyetine</text>
<text x="895" y="414" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">cinsel ilgi duymaktır</text>
<rect x="620" y="445" width="550" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="640" y="477" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">C · Tekrar eden tuzağın çözümü</text>
<rect x="640" y="495" width="240" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="760.0" y="520.6666666666666" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">Yönelim</text>
<text x="760.0" y="538.6666666666666" font-size="14" fill="#ea580c" text-anchor="middle">kime çekim duyduğun</text>
<rect x="910" y="495" width="240" height="60" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="1030.0" y="520.6666666666666" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">Kimlik</text>
<text x="1030.0" y="538.6666666666666" font-size="14" fill="#6d28d9" text-anchor="middle">kendini kim hissettiğin</text>
<line x1="880" y1="525" x2="910" y2="525" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<text x="895" y="590" font-size="13" fill="#0f172a" text-anchor="middle">Kendi cinsine ilgi = homoseksüel yönelim; transseksüellik = kimlik uyumsuzluğu</text>
<text x="895" y="615" font-size="13" fill="#b91c1c" text-anchor="middle">Tanı yalnız uyumsuzluk sıkıntı yaratınca konur (cinsiyet hoşnutsuzluğu)</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 4 (beş boyut), 6 (yönelim), 8 (tanım ve ad değişimi) · tuzak çıkmışları 2022-23, 2024-25, 2025-26; 2020-21 temel kavramlar sorusu</text>
