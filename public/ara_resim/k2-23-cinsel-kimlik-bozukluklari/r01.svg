<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Beş bağımsız boyut: biri diğerini söylemez</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Cinsiyet, kimlik, rol, ifade ve yönelim ayrı eksenlerdir · slayt 4, 6, 8</text>
<rect x="30" y="95" width="560" height="560" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Bir kişi, beş ayrı boyut</text>
<circle cx="300" cy="240" r="21.0" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<path d="M273.0 345.0 C267.0 285.0 285.0 264.0 300 264.0 C315.0 264.0 333.0 285.0 327.0 345.0 Z" stroke="#0f766e" stroke-width="2" fill="#0f766e" stroke-linecap="round" stroke-linejoin="round"/>
