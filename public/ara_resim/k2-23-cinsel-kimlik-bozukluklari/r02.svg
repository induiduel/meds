<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Cinsiyet kimliği dört basamakta gelişir</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Kimlik → kararlılık → sabitlik → pekişme · slayt 5</text>
