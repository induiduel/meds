<text x="1015" y="295" font-size="20" fill="#6d28d9" text-anchor="middle" font-weight="bold">Ergenlik</text>
<text x="1015" y="320" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">Pekişme</text>
<text x="1015" y="345" font-size="13" fill="#1e293b" text-anchor="middle">İkincil cinsiyet özellikleri gelişir;</text>
<text x="1015" y="363" font-size="13" fill="#1e293b" text-anchor="middle">cinsel yönelim belirginleşir</text>
