<text x="475" y="435" font-size="13" fill="#1e293b" text-anchor="middle">Cinsiyetin zamanla</text>
<text x="475" y="453" font-size="13" fill="#1e293b" text-anchor="middle">değişmeyeceğini anlar</text>
