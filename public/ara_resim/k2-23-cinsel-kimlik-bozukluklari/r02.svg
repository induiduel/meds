<text x="220.0" y="631.0" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">2–3 yaş</text>
<text x="220.0" y="650.0" font-size="15" fill="#6d28d9" text-anchor="middle">kimlik büyük ölçüde oluşur</text>
<text x="220.0" y="669.0" font-size="15" fill="#6d28d9" text-anchor="middle">(sınavda doğru önerme)</text>
<rect x="420" y="595" width="320" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="580.0" y="631.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Çoğu kişide</text>
<text x="580.0" y="650.0" font-size="15" fill="#0f766e" text-anchor="middle">doğumda atanan cinsiyetle</text>
<text x="580.0" y="669.0" font-size="15" fill="#0f766e" text-anchor="middle">uyumludur</text>
<rect x="780" y="595" width="360" height="100" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
<text x="960.0" y="631.6666666666666" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">Biyolojik etkenler + aile + toplum</text>
<text x="960.0" y="649.6666666666666" font-size="14" fill="#0f172a" text-anchor="middle">birlikte rol oynar;</text>
<text x="960.0" y="667.6666666666666" font-size="14" fill="#0f172a" text-anchor="middle">tek belirleyici yoktur</text>
<line x1="380" y1="645" x2="420" y2="645" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<line x1="740" y1="645" x2="780" y2="645" stroke="#64748b" stroke-width="2" marker-end="url(#okg)"/>
<text x="600" y="720" font-size="13" fill="#0f172a" text-anchor="middle">Kararlılık zamana karşı, sabitlik dış görünüşe karşı değişmezliktir</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 5 · geçen yılın öğrencileri 2–3 yaş sayısını işaretlemiştir</text>
