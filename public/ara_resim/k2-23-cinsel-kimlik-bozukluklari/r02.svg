<text x="205" y="480" font-size="13" fill="#1e293b" text-anchor="middle">Çocuk kendini kız ya da</text>
<text x="205" y="498" font-size="13" fill="#1e293b" text-anchor="middle">erkek olarak tanımlar</text>
