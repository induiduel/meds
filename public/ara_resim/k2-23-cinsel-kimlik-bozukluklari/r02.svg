<text x="330" y="170" font-size="13" fill="#6d28d9" text-anchor="middle" font-style="italic">sonra değişmezliği anlaşılır, en son pekişir</text>
<rect x="30" y="545" width="1140" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
