<text x="745" y="365" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">Sabitlik</text>
<text x="745" y="390" font-size="13" fill="#1e293b" text-anchor="middle">Kıyafet ya da oyun değişse de</text>
<text x="745" y="408" font-size="13" fill="#1e293b" text-anchor="middle">cinsiyetin değişmediğini anlar</text>
