<text x="826" y="625" font-size="12" fill="#1e293b" text-anchor="middle">isteği azaltır, orgazmı geciktirir</text>
<text x="826" y="643" font-size="12" fill="#b91c1c" text-anchor="middle" font-style="italic">işlevi bastırır</text>
<rect x="948" y="500" width="200" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1048" y="530" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">Prolaktin yüksekliği</text>
<line x1="1048" y1="550" x2="1048" y2="600" stroke="#b91c1c" stroke-width="4" marker-end="url(#okk)"/>
<text x="1048" y="625" font-size="12" fill="#1e293b" text-anchor="middle">isteği ve ereksiyonu azaltır</text>
<text x="1048" y="643" font-size="12" fill="#b91c1c" text-anchor="middle" font-style="italic">işlevi bastırır</text>
<text x="600" y="690" font-size="13" fill="#b91c1c" text-anchor="middle">Serotonin satırı SSRI yan etkisini, prolaktin satırı antipsikotik yan etkisini açıklar</text>
