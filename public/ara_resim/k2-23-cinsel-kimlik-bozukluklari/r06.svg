<text x="600" y="710" font-size="13" fill="#0f172a" text-anchor="middle">Yakınma bu üç olaydan biriyle zamansal ilişki içinde ortaya çıkarsa tanı ilaca bağlanır (ör. sertralin sonrası orgazm sorunu)</text>
