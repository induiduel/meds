<text x="1060" y="329" font-size="13" fill="#6d28d9" text-anchor="middle">birincil</text>
<line x1="615" y1="375" x2="1155" y2="375" stroke="#e2e8f0" stroke-width="1"/>
<text x="620" y="365" font-size="13" fill="#0f172a" text-anchor="start">Risk</text>
<text x="880" y="365" font-size="13" fill="#0f766e" text-anchor="middle">diyabet, sigara, damar, ilaç</text>
<text x="1060" y="365" font-size="13" fill="#6d28d9" text-anchor="middle">stres, ilişki, kaygı</text>
<text x="885" y="410" font-size="13" fill="#b91c1c" text-anchor="middle" font-style="italic">Sabah ereksiyonu normalse damar ve sinir sağlamdır; sorun bağlamdadır</text>
<rect x="30" y="445" width="1140" height="290" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="477" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">C · Gerçek hayatta çoğu olgu karmadır</text>
<rect x="60" y="500" width="300" height="80" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="210.0" y="535.6666666666666" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Organik sorun başlar</text>
<text x="210.0" y="553.6666666666666" font-size="14" fill="#0f766e" text-anchor="middle">(diyabet, damar hastalığı)</text>
<rect x="440" y="500" width="300" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="590.0" y="535.6666666666666" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">Başarısızlık yaşanır</text>
<text x="590.0" y="553.6666666666666" font-size="14" fill="#b91c1c" text-anchor="middle">performans kaygısı eklenir</text>
<rect x="820" y="500" width="320" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="980.0" y="535.6666666666666" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">Psikojenik katman kalıcılaşır</text>
<text x="980.0" y="553.6666666666666" font-size="14" fill="#6d28d9" text-anchor="middle">iki etken birlikte ele alınır</text>
<line x1="360" y1="540" x2="440" y2="540" stroke="#64748b" stroke-width="3" marker-end="url(#okg)"/>
<line x1="740" y1="540" x2="820" y2="540" stroke="#64748b" stroke-width="3" marker-end="url(#okg)"/>
<path d="M980 585 C 900 680, 300 680, 200 585" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)" stroke-dasharray="7 5"/>
<text x="600" y="650" font-size="13" fill="#b91c1c" text-anchor="middle" font-style="italic">kaygı ereksiyonu daha da bozar</text>
<text x="600" y="700" font-size="13" fill="#0f172a" text-anchor="middle">Öyküde sabah ereksiyonu ve mastürbasyonu sormak iki katmanı ayırmanın en kısa yoludur</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 29 (ölçüt, erken haberci), 30 (ayrım tablosu), 23 (cinsel öykü)</text>
