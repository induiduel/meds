<text x="300" y="415" font-size="13" fill="#0f172a" text-anchor="middle">birkaç yıl önce ortaya çıkar → kalp-damar risk değerlendirmesi yap</text>
<rect x="600" y="95" width="570" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="620" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · Organik mi, psikojenik mi?</text>
<text x="760" y="150" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">Özellik</text>
<text x="880" y="150" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Organik</text>
<text x="1060" y="150" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">Psikojenik</text>
<line x1="615" y1="195" x2="1155" y2="195" stroke="#e2e8f0" stroke-width="1"/>
