<text x="880" y="293" font-size="13" fill="#0f766e" text-anchor="middle">yetersiz</text>
<text x="1060" y="293" font-size="13" fill="#6d28d9" text-anchor="middle">normal</text>
<line x1="615" y1="339" x2="1155" y2="339" stroke="#e2e8f0" stroke-width="1"/>
<text x="620" y="329" font-size="13" fill="#0f172a" text-anchor="start">Kaygı, eş sorunu</text>
