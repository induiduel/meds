<text x="1060" y="221" font-size="13" fill="#6d28d9" text-anchor="middle">durumsal</text>
<line x1="615" y1="267" x2="1155" y2="267" stroke="#e2e8f0" stroke-width="1"/>
<text x="620" y="257" font-size="13" fill="#0f172a" text-anchor="start">Seyir</text>
