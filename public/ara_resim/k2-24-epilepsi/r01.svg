<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="DejaVu Sans, Arial, sans-serif">
<defs><linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f1efe9"/></linearGradient>
<marker id="okb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
<marker id="okt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
<marker id="oko" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="okg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="560" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Epilepsi tanısına giden üç kapı; tetiklenmiş nöbet neden dışarıda kalır?</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Klinik pratik tanım ve tetiklenmiş ↔ refleks nöbet · slayt 4–5</text>
<rect x="30" y="95" width="700" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Üç kapıdan biri açılırsa epilepsi hastalığı</text>
<text x="50" y="150" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">1) ≥ 24 saat arayla ≥ 2 tetiklenmemiş ya da refleks nöbet</text>
<line x1="60" y1="215" x2="420" y2="215" stroke="#64748b" stroke-width="3"/>
<path d="M92 215 L98 190 L104 230 L110 195 L116 235 L122 200 L128 215" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="252" font-size="14" fill="#b91c1c" text-anchor="middle">1. nöbet</text>
<path d="M312 215 L318 190 L324 230 L330 195 L336 235 L342 200 L348 215" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330" y="252" font-size="14" fill="#b91c1c" text-anchor="middle">2. nöbet</text>
<path d="M130 185 C200 160 260 160 310 185" stroke="#64748b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okg)" stroke-dasharray="5 4"/>
<text x="220" y="170" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">en az 24 saat</text>
<text x="460" y="220" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="bold">→ epilepsi</text>
<text x="50" y="290" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">2) Tek nöbet + 10 yılda tekrar riski ≥ %60</text>
<path d="M80 328 L86 303 L92 343 L98 308 L104 328" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="115" y1="326" x2="215" y2="326" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="222" y="306" width="200" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="322" y="332" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">yüksek risk bulgusu</text>
<text x="440" y="316" font-size="13" fill="#475569" text-anchor="start">yeni inme, yapısal lezyon,</text>
<text x="440" y="333" font-size="13" fill="#475569" text-anchor="start">EEG'de interiktal epileptiform aktivite</text>
<text x="50" y="380" font-size="16" fill="#0f172a" text-anchor="start" font-weight="bold">3) Bir epilepsi sendromunun varlığı</text>
<text x="60" y="402" font-size="14" fill="#475569" text-anchor="start" font-style="italic">nöbet sayısına bakılmadan tanı konur</text>
<rect x="50" y="430" width="660" height="78" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="65" y="458" font-size="14" fill="#b91c1c" text-anchor="start">Ortak nokta: nöbet tetiklenmemiş olmalı, yani beynin kendi yatkınlığından çıkmalı.</text>
<text x="65" y="479" font-size="14" fill="#b91c1c" text-anchor="start">Refleks nöbet (ışık, sıcak su) yatkın beynin kendi tetiğidir → bu tanıma GİRER.</text>
<rect x="760" y="95" width="410" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="780" y="127" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">B · Nöbet eşiği</text>
<path d="M896.8 206.2 C890.6 169.0 921.6 147.3 958.8 150.4 C989.8 141.1 1033.2 162.8 1036.3 196.9 C1039.4 221.7 1017.7 234.1 992.9 231.0 C983.6 246.5 958.8 249.6 946.4 237.2 C915.4 240.3 893.7 227.9 896.8 206.2 Z" stroke="#1d4ed8" stroke-width="3" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M927.8 175.2 C946.4 193.8 971.2 190.7 989.8 172.1" stroke="#1d4ed8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M915.4 209.3 C940.2 224.8 977.4 221.7 1008.4 206.2" stroke="#1d4ed8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="965" y="206" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">normal beyin</text>
<line x1="790" y1="262" x2="1140" y2="262" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1143" y="266" font-size="13" fill="#64748b" text-anchor="start">eşik</text>
<path d="M840 262 C860 300 880 312 905 318" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
<text x="790" y="345" font-size="13" fill="#ea580c" text-anchor="start">Hipoglisemi, alkol, kafa travması, inme → eşik akut</text>
<text x="790" y="362" font-size="13" fill="#ea580c" text-anchor="start">dönemde DÜŞER → tetiklenmiş (akut semptomatik)</text>
<text x="790" y="379" font-size="13" fill="#ea580c" text-anchor="start">nöbet → epilepsi SAYILMAZ</text>
<path d="M1110 262 C1090 232 1070 222 1030 220" stroke="#b91c1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)"/>
<text x="790" y="430" font-size="13" fill="#b91c1c" text-anchor="start">Işık ya da sıcak su uyaranı → zaten yatkın beynin</text>
<text x="790" y="447" font-size="13" fill="#b91c1c" text-anchor="start">kendine özgü tetiği → refleks nöbet</text>
<text x="790" y="464" font-size="13" fill="#b91c1c" text-anchor="start">→ epilepsi tanımına GİRER</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 4 (üç durum), 5 (tetiklenmiş ve refleks nöbetler), 6 (yüksek risk örnekleri) · kırmızı = epilepsi, turuncu = tetiklenmiş, mavi = normal beyin</text>
</svg>