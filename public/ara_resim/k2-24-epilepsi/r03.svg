<text x="900" y="325" font-size="13" fill="#b91c1c" text-anchor="middle">sol hemisfer</text>
<path d="M1010 250 C1000 180 1050 140 1080 145 C1110 140 1160 180 1150 250 C1140 300 1020 300 1010 250 Z" stroke="#1d4ed8" stroke-width="2.5" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1080" y="325" font-size="13" fill="#1d4ed8" text-anchor="middle">sağ hemisfer</text>
<circle cx="905" cy="205" r="13" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
<text x="905" y="185" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">odak</text>
<path d="M917 205 C980 170 1060 190 1095 350" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)" stroke-dasharray="6 4"/>
<text x="1080" y="375" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">karşı tarafa: sağ kol ekstansiyon</text>
<text x="830" y="420" font-size="13" fill="#1e293b" text-anchor="start">Sol frontal odak → sağ kol ekstansiyon.</text>
<text x="830" y="437" font-size="13" fill="#1e293b" text-anchor="start">Tonik baş dönmesi de karşı tarafa işaret</text>
<text x="830" y="454" font-size="13" fill="#1e293b" text-anchor="start">eder ama lateralize edici değeri düşüktür.</text>
<text x="830" y="471" font-size="13" fill="#1e293b" text-anchor="start">Jaksonyen yayılım: hareket komşu bölgelere ilerler.</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 15 (frontal lob kökenli fokal nöbetlerin 1–4. özellikleri) · kırmızı = ekstansör kol / odak, turuncu = fleksör kol</text>
</svg>