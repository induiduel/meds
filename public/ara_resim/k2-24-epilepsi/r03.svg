<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Eskrimci postürü ve figür 4: uzanan kolun karşısı odaktır</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Frontal lob nöbetlerinde lateralizasyon · slayt 15</text>
