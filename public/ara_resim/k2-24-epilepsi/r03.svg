<text x="650" y="275" font-size="13.5" fill="#b91c1c" text-anchor="start">tonik kasılma</text>
<line x1="545" y1="214" x2="500" y2="318" stroke="#64748b" stroke-width="1.4"/>
<circle cx="545" cy="214" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="440" y="335" font-size="13.5" fill="#ea580c" text-anchor="start">sol kol dirsekten</text>
<text x="440" y="352" font-size="13.5" fill="#ea580c" text-anchor="start">fleksör tonik kasılma</text>
<text x="500" y="300" font-size="30" fill="#b91c1c" text-anchor="middle" font-weight="bold">“4”</text>
<text x="440" y="395" font-size="13.5" fill="#1e293b" text-anchor="start">Bir kolda ekstansör, karşı kolda dirsekten</text>
<text x="440" y="413" font-size="13.5" fill="#1e293b" text-anchor="start">fleksör tonik kasılma → kollar 4 rakamı gibi.</text>
<text x="440" y="431" font-size="13.5" fill="#1e293b" text-anchor="start">Ekstansör kolun karşı hemisferi</text>
<text x="440" y="449" font-size="13.5" fill="#1e293b" text-anchor="start">epileptojenik alanla ilişkilendirilir.</text>
<rect x="810" y="95" width="360" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="830" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">C · Lateralizasyon kuralı</text>
