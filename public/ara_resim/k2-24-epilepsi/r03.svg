<text x="258" y="275" font-size="13.5" fill="#b91c1c" text-anchor="start">ekstansiyonda</text>
<line x1="150" y1="232" x2="120" y2="318" stroke="#64748b" stroke-width="1.4"/>
<circle cx="150" cy="232" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="50" y="335" font-size="13.5" fill="#ea580c" text-anchor="start">sol kol dirsek ve</text>
<text x="50" y="352" font-size="13.5" fill="#ea580c" text-anchor="start">bilekten fleksör</text>
<text x="50" y="395" font-size="13.5" fill="#1e293b" text-anchor="start">Bir kol ekstansör postürde, karşı kol dirsek ve</text>
<text x="50" y="413" font-size="13.5" fill="#1e293b" text-anchor="start">bilekten fleksör postürde tonik kasılır.</text>
<text x="50" y="431" font-size="13.5" fill="#1e293b" text-anchor="start">Odak: ekstansör kolun KARŞI tarafı →</text>
<text x="50" y="449" font-size="13.5" fill="#1e293b" text-anchor="start">sağ kol uzanıyorsa odak sol frontal lob.</text>
