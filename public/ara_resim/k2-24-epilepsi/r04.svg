<text x="360" y="180" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="bold">juvenil miyoklonik epilepsi</text>
<text x="360" y="202" font-size="13" fill="#0f172a" text-anchor="start">tonik-klonik nöbet: sürekli kasılma → kloniler</text>
<text x="360" y="224" font-size="13" fill="#475569" text-anchor="start" font-style="italic">(slayt 19)</text>
