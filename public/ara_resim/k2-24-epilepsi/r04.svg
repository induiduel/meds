<rect width="1200" height="560" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Miyoklonik sıçramadan sonra ne gelir? İki zincir ve absansın EEG frekansı</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Jeneralize motor tipler ve absans · slayt 19–20, 39</text>
<rect x="30" y="95" width="1140" height="235" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Miyoklonik → tonik-klonik (JME)  ↔  miyoklonik → atonik düşme (Lennox-Gastaut)</text>
