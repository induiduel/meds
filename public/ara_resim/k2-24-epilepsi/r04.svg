<text x="835" y="250" font-size="13" fill="#ea580c" text-anchor="middle">yere düşer</text>
<text x="920" y="180" font-size="15" fill="#ea580c" text-anchor="start" font-weight="bold">Lennox-Gastaut sendromu</text>
<text x="920" y="202" font-size="13" fill="#0f172a" text-anchor="start">tonus kaybı → düşme atağı</text>
<text x="920" y="224" font-size="13" fill="#475569" text-anchor="start" font-style="italic">gelişimsel ve epileptik ensefalopati</text>
<text x="60" y="300" font-size="13" fill="#1e293b" text-anchor="start">Atonik nöbette bilinç, tonus kaybı bitince saniyeler içinde döner; tonik-klonik nöbetten sonra toparlanma uzundur.</text>
<rect x="30" y="345" width="1140" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="377" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · Absans: ani ↔ sinsi, EEG frekansı ayırır</text>
<text x="50" y="405" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="bold">Tipik absans</text>
<text x="50" y="425" font-size="13.5" fill="#0f172a" text-anchor="start">ani başlar, ani biter · 3 Hz</text>
