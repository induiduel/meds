<text x="600" y="400" font-size="13" fill="#1e293b" text-anchor="start">Miyoklonik absans: 10–60 sn, miyoklonik sıçramalar,</text>
<text x="600" y="419" font-size="13" fill="#1e293b" text-anchor="start">3 Hz jeneralize diken-dalga.</text>
<text x="600" y="438" font-size="13" fill="#1e293b" text-anchor="start">Frekans sırası (slayt 39): atipik absans &lt; 2,5 Hz →</text>
<text x="600" y="457" font-size="13" fill="#1e293b" text-anchor="start">tipik absans 3 Hz → miyoklonik nöbet &gt; 3 Hz.</text>
<text x="600" y="476" font-size="13" fill="#1e293b" text-anchor="start">Klinik benzeşebilir; tipik ↔ atipik ayrımında karar EEG'nindir.</text>
<path d="M600 505 C700 525 900 525 1120 505" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okg)"/>
<text x="860" y="500" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">yavaştan hızlıya</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 19 (jeneralize motor nöbetler), 20 (absans), 39 (EEG paternleri) · kırmızı = tonik-klonik / tipik, turuncu = atonik / atipik, mavi = hasta</text>
