<text x="984" y="488" font-size="13" fill="#0f172a" text-anchor="middle">komplike</text>
<rect x="1044" y="240" width="96" height="230" rx="6" fill="#b91c1c" opacity="0.85"/>
<text x="1092" y="230" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">%49</text>
<text x="1092" y="488" font-size="13" fill="#0f172a" text-anchor="middle">3 özellik birden</text>
<path d="M780 410 C840 340 960 290 1130 225" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)" stroke-dasharray="5 4"/>
<text x="940" y="160" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">epilepsi gelişme riski</text>
<text x="720" y="185" font-size="13" fill="#475569" text-anchor="start">Febril nöbetin tekrar riski %30-40; artıranlar:</text>
<text x="720" y="201" font-size="13" fill="#475569" text-anchor="start">&lt; 15 ay başlangıç, aile öyküsü, sık ateşli</text>
<text x="720" y="217" font-size="13" fill="#475569" text-anchor="start">hastalık, düşük ateşte nöbet.</text>
<text x="1140" y="500" font-size="12.5" fill="#b91c1c" text-anchor="end" font-style="italic">uzun + tekrarlayan + fokal</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 21 (tanım, ölçütler), 22 (tablo), 23 (riskler ve tedavi) · yeşil = basit / düşük risk, kırmızı = komplike / yüksek risk, turuncu = ateş</text>
