<circle cx="455" cy="338" r="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
<text x="470" y="343" font-size="13.5" fill="#b91c1c" text-anchor="start">olabilir</text>
<rect x="160" y="400" width="490" height="34" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="405" y="422" font-size="13.5" fill="#b91c1c" text-anchor="middle" font-weight="bold">Komplike özelliklerden EN AZ BİRİ varsa nöbet komplikedir</text>
<text x="200" y="458" font-size="13" fill="#1e293b" text-anchor="start">Basit febril nöbette sürekli antiepileptik önerilmez;</text>
<text x="200" y="474" font-size="13" fill="#1e293b" text-anchor="start">rektal ya da oral diazepam profilaksisi yapılabilir.</text>
<text x="200" y="490" font-size="13" fill="#1e293b" text-anchor="start">Komplike nöbette akut nörolojik sendrom ya da Dravet sendromu araştırılır.</text>
