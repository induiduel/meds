<rect width="1200" height="560" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Febril nöbet: beş ölçüt basit ile komplikeyi ayırır, risk merdiven gibi yükselir</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Duruma bağlı nöbetler · slayt 21–23</text>
