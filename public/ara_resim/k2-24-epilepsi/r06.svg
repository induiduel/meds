<text x="1020" y="338" font-size="13" fill="#0f172a" text-anchor="middle">yatkınlığı</text>
<text x="600" y="370" font-size="13" fill="#1e293b" text-anchor="middle">Şemada kalın yazılan durak yapısal ve fonksiyonel değişikliklerdir: beyin kalıcı olarak nöbete yatkın hâle gelir.</text>
<rect x="30" y="400" width="1140" height="125" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="432" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · Akut semptomatik nöbet nerede durur?</text>
<text x="50" y="455" font-size="13" fill="#1e293b" text-anchor="start">Akut semptomatik nöbet tetikleyici olayla yakın zamansal ilişki içinde gelir; tekrar olasılığı epilepsideki gibi artmaz → tek başına epilepsi tanısı koydurmaz.</text>
<text x="50" y="476" font-size="13" fill="#1e293b" text-anchor="start">Ama hastalık yatıştıktan sonra bile epilepsi gelişme riski artmıştır; her geçişi genetik yapı ile yaş ve cins etkiler.</text>
<text x="50" y="497" font-size="13" fill="#1e293b" text-anchor="start">Epilepsi hastasında da akut semptomatik nöbet gelişebilir.</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 24 (akut semptomatik nöbet), 25 (epileptogenez şeması) · turuncu = akut/tetiklenmiş, kırmızı = epilepsi, mor = genetik, gri = yaş-cins</text>
