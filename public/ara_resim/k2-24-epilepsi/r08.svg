<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="DejaVu Sans, Arial, sans-serif">
<defs><linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f1efe9"/></linearGradient>
<marker id="okb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
<marker id="okt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
<marker id="oko" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="okg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="560" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Antiepileptikler üç etkileşim grubunda: indükleyen, baskılayan, etkileşmeyen</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Farmakokinetik tablolarının mantığı · slayt 47–48</text>
<rect x="30" y="95" width="740" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Karaciğer enzimi (P450) ne yapar?</text>
<path d="M160 230 C130 170 230 140 330 160 C410 175 450 230 410 290 C370 340 250 340 200 310 C150 285 140 260 160 230 Z" stroke="#92400e" stroke-width="3" fill="#fde68a" stroke-linecap="round" stroke-linejoin="round"/>
<text x="285" y="245" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">karaciğer enzimleri</text>
<path d="M120 185 C150 195 165 203 185 212" stroke="#b91c1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)"/>
<text x="45" y="160" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="bold">İNDÜKLEYİCİ</text>
<text x="45" y="180" font-size="13" fill="#b91c1c" text-anchor="start">karbamazepin</text>
<text x="45" y="196" font-size="13" fill="#b91c1c" text-anchor="start">fenitoin</text>
<text x="45" y="212" font-size="13" fill="#b91c1c" text-anchor="start">fenobarbital</text>
<text x="470" y="170" font-size="13" fill="#b91c1c" text-anchor="start">enzim ↑ → başka ilacın yıkımı</text>
<text x="470" y="186" font-size="13" fill="#b91c1c" text-anchor="start">hızlanır, düzeyi DÜŞER</text>
<text x="470" y="202" font-size="13" fill="#b91c1c" text-anchor="start">(lamotrijin, perampanel</text>
<text x="470" y="218" font-size="13" fill="#b91c1c" text-anchor="start">indükleyicilerle kısa ömürlü)</text>
<path d="M120 330 C150 320 165 310 185 300" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oky)"/>
<text x="45" y="345" font-size="14" fill="#15803d" text-anchor="start" font-weight="bold">İNHİBİTÖR</text>
<text x="45" y="365" font-size="13" fill="#15803d" text-anchor="start">valproat</text>
<text x="45" y="381" font-size="13" fill="#15803d" text-anchor="start">felbamat</text>
<text x="470" y="275" font-size="13" fill="#15803d" text-anchor="start">enzim ↓ → başka ilacın yıkımı</text>
<text x="470" y="291" font-size="13" fill="#15803d" text-anchor="start">yavaşlar, düzeyi YÜKSELİR</text>
<text x="470" y="307" font-size="13" fill="#15803d" text-anchor="start">(lamotrijin ömrü uzar,</text>
<text x="470" y="323" font-size="13" fill="#15803d" text-anchor="start">rufinamid düzeyi %70 artar)</text>
<path d="M520 400 C500 370 520 340 550 345 C580 350 585 390 565 415 C550 430 530 420 520 400 Z" stroke="#1d4ed8" stroke-width="2.5" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="445" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">böbrek</text>
<path d="M330 395 C400 390 460 385 508 382" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okb)"/>
<text x="290" y="400" font-size="14" fill="#1d4ed8" text-anchor="end" font-weight="bold">ETKİLEŞİMSİZ</text>
<text x="600" y="365" font-size="13" fill="#1d4ed8" text-anchor="start">levetirasetam, pregabalin,</text>
<text x="600" y="380" font-size="13" fill="#1d4ed8" text-anchor="start">gabapentin, zonisamid:</text>
<text x="600" y="395" font-size="13" fill="#1d4ed8" text-anchor="start">proteine az bağlanır, enzim</text>
<text x="600" y="410" font-size="13" fill="#1d4ed8" text-anchor="start">kullanmaz, çoğu değişmeden</text>
<text x="600" y="425" font-size="13" fill="#1d4ed8" text-anchor="start">idrarla atılır → etkileşim yok</text>
<text x="50" y="470" font-size="13" fill="#0f172a" text-anchor="start">Çıkmış (farmakoloji): etkileşimi olmayan antiepileptik → levetirasetam;</text>
<text x="50" y="488" font-size="13" fill="#0f172a" text-anchor="start">okskarbazepinin etkileşimi az ama sıfır değil.</text>
<rect x="800" y="95" width="370" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="820" y="127" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">B · Otoindüksiyon</text>
<text x="1140" y="127" font-size="14" fill="#b91c1c" text-anchor="end" font-weight="bold">karbamazepin</text>
<line x1="830" y1="410" x2="1150" y2="410" stroke="#64748b" stroke-width="2"/>
<line x1="830" y1="410" x2="830" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="990" y="432" font-size="13" fill="#64748b" text-anchor="middle">kullanım süresi (gün)</text>
<text x="835" y="165" font-size="13" fill="#64748b" text-anchor="start">yarı ömür</text>
<path d="M835 190 C900 200 960 310 1040 330 C1090 342 1120 345 1145 346" stroke="#b91c1c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="845" cy="192" r="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
<text x="860" y="200" font-size="13" fill="#b91c1c" text-anchor="start">tek doz: 24-45 saat</text>
<circle cx="1130" cy="345" r="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
<text x="1140" y="375" font-size="13" fill="#b91c1c" text-anchor="end">kronik: 8-24 saat</text>
<path d="M960 240 C990 250 1010 275 1030 300" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ok)" stroke-dasharray="4 3"/>
<text x="860" y="300" font-size="13" fill="#0f172a" text-anchor="start">ilaç kendi yıkım</text>
<text x="860" y="315" font-size="13" fill="#0f172a" text-anchor="start">enzimlerini uyarır</text>
<text x="830" y="462" font-size="13" fill="#b91c1c" text-anchor="start">Enzim indüksiyonu + otoindüksiyon: sürekli</text>
<text x="830" y="477" font-size="13" fill="#b91c1c" text-anchor="start">kullanımda kendi yarı ömrü KISALIR (çıkmış).</text>
<text x="830" y="492" font-size="13" fill="#b91c1c" text-anchor="start">Valproat da otoindüksiyon yapar ama inhibitördür.</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 47–48 (antiepileptik farmakokinetik tabloları, özellikler sütunu) · kırmızı = indükleyici, yeşil = inhibitör, mavi = etkileşimsiz / böbrek</text>
</svg>