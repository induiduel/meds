<text x="520" y="259" font-size="13" fill="#b91c1c" text-anchor="start">arada bilinç açılmadan art arda nöbetler</text>
<text x="790" y="150" font-size="13" fill="#0f172a" text-anchor="start">Tanım (slayt 49): nöbetin alışılmıştan uzun</text>
<text x="790" y="168" font-size="13" fill="#0f172a" text-anchor="start">sürmesi YA DA hasta eski nörolojik durumuna</text>
<text x="790" y="186" font-size="13" fill="#0f172a" text-anchor="start">dönmeden çok sayıda nöbetin tekrarlaması.</text>
<text x="790" y="204" font-size="13" fill="#0f172a" text-anchor="start">Algoritma 5. dakikada başlar; 10 dakikalık</text>
<text x="790" y="222" font-size="13" fill="#0f172a" text-anchor="start">nöbet olağan değildir (çıkmış).</text>
<rect x="30" y="285" width="1140" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="317" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · 5 → 30 → 60 dakika: basamaklar</text>
<path d="M60 368 C400 368 800 368 1140 368" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ok)"/>
<circle cx="210" cy="368" r="14" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
<text x="210" y="350" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">5 dk</text>
<text x="210" y="398" font-size="14" fill="#a16207" text-anchor="middle" font-weight="bold">ERKEN SE</text>
<text x="210" y="414" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">hastane öncesi / acil</text>
<text x="210" y="433" font-size="13" fill="#a16207" text-anchor="middle" font-weight="bold">benzodiazepin</text>
<text x="210" y="449" font-size="13" fill="#0f172a" text-anchor="middle">IV diazepam 5-10 mg (en çok 20 mg)</text>
<text x="210" y="465" font-size="13" fill="#0f172a" text-anchor="middle">damar yolu yoksa IM ya da bukkal</text>
<text x="210" y="481" font-size="13" fill="#0f172a" text-anchor="middle">midazolam ya da rektal diazepam 10 mg</text>
<text x="210" y="497" font-size="13" fill="#0f172a" text-anchor="middle">yaşlı / &lt; 50 kg: 5 mg, 10 dk sonra tekrar</text>
<circle cx="590" cy="368" r="14" fill="#ea580c" stroke="#0f172a" stroke-width="2"/>
<text x="590" y="350" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">30 dk</text>
<text x="590" y="398" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">DİRENÇLİ SE</text>
<text x="590" y="414" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">hastane</text>
<text x="590" y="433" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">IV yüklenen antiepileptik</text>
<text x="590" y="449" font-size="13" fill="#0f172a" text-anchor="middle">fenitoin 15-20 mg/kg · valproat 15-30 mg/kg</text>
<text x="590" y="465" font-size="13" fill="#0f172a" text-anchor="middle">levetirasetam 30-60 mg/kg · fenobarbital 10-20</text>
<text x="590" y="481" font-size="13" fill="#0f172a" text-anchor="middle">lakozamid 200-400 mg</text>
<text x="590" y="497" font-size="13" fill="#0f172a" text-anchor="middle">pregabalin listede YOK (çıkmış)</text>
<circle cx="960" cy="368" r="14" fill="#b91c1c" stroke="#0f172a" stroke-width="2"/>
<text x="960" y="350" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">60 dk</text>
<text x="960" y="398" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">SÜPER DİRENÇLİ SE</text>
<text x="960" y="414" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">yoğun bakım</text>
<text x="960" y="433" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">anestezik infüzyon + EEG izlemi</text>
<text x="960" y="449" font-size="13" fill="#0f172a" text-anchor="middle">midazolam · propofol · pentotal</text>
<text x="960" y="465" font-size="13" fill="#0f172a" text-anchor="middle">ketamin bolus + infüzyon</text>
<text x="960" y="481" font-size="13" fill="#0f172a" text-anchor="middle">kasılma görülmez, EEG zorunlu</text>
<path d="M60 524 C400 532 800 532 1140 524" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okb)"/>
<text x="600" y="517" font-size="13" fill="#1d4ed8" text-anchor="middle">her evrede: hava yolu, kan basıncı, damar yolu, EKG, kan sayımı, şeker, elektrolit, ilaç düzeyi, kan gazı, toksin taraması</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 49 (SE tanımı), 50 (tedavi algoritması: erken / dirençli / süper dirençli) · kırmızı = epileptik boşalım, sarı-turuncu-kırmızı = evreler, mavi = destek</text>
</svg>