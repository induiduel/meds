<text x="1000" y="337" font-size="16" fill="#0f766e" text-anchor="start">KCNQ2/KCNQ3</text>
<text x="1000" y="359" font-size="16" fill="#0f766e" text-anchor="start"></text>
<text x="1000" y="381" font-size="16" fill="#0f766e" text-anchor="start">Dravet →</text>
<text x="1000" y="403" font-size="16" fill="#0f766e" text-anchor="start">SCN1A</text>
<text x="1000" y="425" font-size="16" fill="#0f766e" text-anchor="start">(%70 kesin tanı)</text>
<text x="910" y="560" font-size="14" fill="#0f172a" text-anchor="middle">Bu analizlerle ensefalopatik epilepsilerin yolakları aydınlandı</text>
<text x="600.0" y="626" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 12–16 (CHRNA4, KCNQ2/3, KCNC1, SCN1A, PCDH19), 19–20 (a-CGH → karyotip → WES; BFNN, Dravet) · teal = kanal, kırmızı = hastalık, yeşil = test</text>
