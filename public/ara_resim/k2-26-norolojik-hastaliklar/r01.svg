<text x="830" y="502" font-size="14" fill="#475569" text-anchor="middle">aday gen; ensefalopati yolakları</text>
<text x="1000" y="165" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Belirti belli bir</text>
<text x="1000" y="185" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">geni gösteriyorsa:</text>
<path d="M1060 196 C1080 230 1080 260 1060 292" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okt)"/>
