<text x="50" y="440" font-size="15" fill="#0f172a" text-anchor="start">Kanal geni bozulunca nöronun uyarılabilirliği değişir:</text>
<text x="50" y="464" font-size="15" fill="#0f172a" text-anchor="start">nöronlar aşırı ve eş zamanlı ateşlenir → nöbet.</text>
<text x="50" y="488" font-size="15" fill="#0f172a" text-anchor="start">Dravet: &gt;%90 SCN1A; nadiren SCN1B, GABRG2, HCN1.</text>
<text x="50" y="512" font-size="15" fill="#0f172a" text-anchor="start">PCDH19: Ca²⁺ bağımlı hücre adezyonu (Dravet).</text>
<text x="50" y="536" font-size="15" fill="#0f172a" text-anchor="start">KCNC1 → işlevsiz Kv3.1 K⁺ kanalı → ilerleyen</text>
<text x="50" y="560" font-size="15" fill="#0f172a" text-anchor="start">miyoklonus epilepsisi (KCNQ2/3 ile karıştırma).</text>
