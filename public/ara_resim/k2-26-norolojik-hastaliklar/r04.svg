<text x="600.0" y="626" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 53 (OXPHOS genleri), 54 (MERRF, heteroplazmi, 8344, anneden gelen mt genom), 55 (NARP, 8993 T&gt;G, %70–90, Leigh) · mor = mitokondri, kırmızı = mutant</text>
