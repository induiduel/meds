<text x="50" y="556" font-size="15" fill="#166534" text-anchor="start">Öykü: en az 3 kuşak pedigri, ailede benzer olgu, etnik köken; başlangıç yaşı, gebelik/perinatal öykü, motor basamaklar,</text>
<text x="50" y="578" font-size="15" fill="#166534" text-anchor="start">işitme-görme kaybı ve kognitif etkilenme sorgulanır.  Akrabalık varsa ilk olarak OR ataksi tipleri akla gelir.</text>
<text x="600.0" y="626" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 23 (OD, OR, X'e bağlı, mt), 36 (OR: anne-baba sağlıklı), 48–52 (X'e bağlı), 54–55 (anneden mt genom, heteroplazmi), 56 (tanı) · dolu = hasta, yarım = taşıyıcı</text>
