<text x="920" y="360" font-size="15" fill="#0f172a" text-anchor="start">mt genom anneden gelir;</text>
<text x="920" y="381" font-size="15" fill="#0f172a" text-anchor="start">çocuklarda mutant oran</text>
<text x="920" y="402" font-size="15" fill="#0f172a" text-anchor="start">farklıdır (heteroplazmi):</text>
<text x="920" y="423" font-size="15" fill="#0f172a" text-anchor="start">kimi hasta, kimi</text>
<text x="920" y="444" font-size="15" fill="#0f172a" text-anchor="start">hafif ya da sağlam.</text>
