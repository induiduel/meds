<text x="600.0" y="626" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 96 (3 kuşak pedigri, tekrarlama riski), 97 (%18, %14, %25), 98 (%10, %15, %100) · turuncu = belirsiz kalıtım, mavi = ebeveyn etkilenmiş, kırmızı = yüksek risk</text>
