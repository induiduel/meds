<rect width="1200" height="640" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Herediter işitme kaybında genetik danışma: sonraki çocukta risk</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Aile durumuna göre tekrarlama riski · slayt 96–98</text>
