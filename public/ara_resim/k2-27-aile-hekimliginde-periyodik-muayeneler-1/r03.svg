<text x="797.6923076923077" y="443" font-size="13" fill="#0f172a" text-anchor="end">75 g glukoz 24–28: gestasyonel diyabet</text>
<text x="60" y="482" font-size="13" fill="#0f172a" text-anchor="start">1. izlemde: kan basıncı, Rh için kan grubu, demir eksikliği, hepatit B, idrar (bakteriüri, proteinüri), TSH, TORCH; tütün danışmanlığı</text>
<text x="60" y="502" font-size="13" fill="#b91c1c" text-anchor="start">2. izlemde: 1 ay arayla 2 doz Td · 3. izlemde: Rh uygunsuzluğunda indirekt Coombs, negatifse anti-D immünglobulin</text>
<text x="60" y="522" font-size="13" fill="#0f172a" text-anchor="start">4. izlemde: gebelik haftası ile uterus büyüklüğü uyumu, prezente kısım, emzirmeye yönelik meme muayenesi</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 27–37 · mavi = izlem penceresi, turuncu = tarama testi, yeşil = profilaksi, kırmızı = Rh uygunsuzluğu</text>
