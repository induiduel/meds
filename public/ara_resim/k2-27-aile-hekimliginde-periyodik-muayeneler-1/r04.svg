<rect x="40" y="320" width="540" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="352" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">Her izlemde dört basamak</text>
<text x="60" y="380" font-size="14" fill="#0f172a" text-anchor="start">1. Genel durum: kanama-loşi, idrar, meme, ağrı,</text>
<text x="60" y="400" font-size="14" fill="#0f172a" text-anchor="start">   bağırsak; psikolojik durum</text>
<text x="60" y="420" font-size="14" fill="#0f172a" text-anchor="start">2. Fizik muayene: kan basıncı, solunum, ateş;</text>
<text x="60" y="440" font-size="14" fill="#0f172a" text-anchor="start">   fundus yüksekliği, insizyon, epizyotomi</text>
<text x="60" y="460" font-size="14" fill="#0f172a" text-anchor="start">3. Laboratuvar: gerekirse hemoglobin, idrar</text>
<text x="60" y="480" font-size="14" fill="#0f172a" text-anchor="start">4. Danışmanlık: temizlik, dinlenme, anne sütü,</text>
<text x="60" y="500" font-size="14" fill="#0f172a" text-anchor="start">   demir ve D vitamini devam</text>
<rect x="610" y="320" width="550" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="630" y="352" font-size="20" fill="#6d28d9" text-anchor="start" font-weight="bold">Altıncı izlemde ve riskte ek işler</text>
<text x="630" y="380" font-size="14" fill="#0f172a" text-anchor="start">Gestasyonel diyabet öyküsü → postpartum</text>
<text x="630" y="402" font-size="14" fill="#0f172a" text-anchor="start">6–12. haftada OGTT'nin önemi anlatılır</text>
<text x="630" y="424" font-size="14" fill="#0f172a" text-anchor="start">İki doğum arası en az 2 yıl → korunma yöntemleri</text>
<text x="630" y="446" font-size="14" fill="#0f172a" text-anchor="start">Ruhsal hastalık, psikotik bozukluk ya da intihar</text>
<text x="630" y="468" font-size="14" fill="#0f172a" text-anchor="start">riski → Edinburgh Postpartum Depresyon Ölçeği</text>
<path d="M981.4285714285714 245 C981.4285714285714 290 1000 300 900 318" stroke="#6d28d9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 40–50 · kırmızı = hastanede kalış, mavi = ev ya da sağlık kuruluşu izlemi, mor = ek işlemler</text>
