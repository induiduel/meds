<text x="391" y="156" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="bold">kurtulan penumbra</text>
<text x="160" y="345" font-size="17" fill="#475569" text-anchor="middle">inmeden hemen sonra</text>
<text x="440" y="345" font-size="17" fill="#475569" text-anchor="middle">ilk haftalar – 3 ay</text>
<text x="50" y="384" font-size="17" fill="#1e293b" text-anchor="start">Çekirdek kansız kalan bölgedir. Penumbra, çekirdeğin</text>
<text x="50" y="407" font-size="17" fill="#1e293b" text-anchor="start">çevresindeki kurtarılabilir alandır.</text>
<text x="50" y="436" font-size="17" fill="#1e293b" text-anchor="start">Ödem azalır, penumbra kurtulur, reperfüzyonla kan geri</text>
<text x="50" y="459" font-size="17" fill="#1e293b" text-anchor="start">gelir: hasta kendiliğinden toparlanır.</text>
<text x="50" y="488" font-size="17" fill="#15803d" text-anchor="start">Örnek: inmeden sonraki günlerde kol kuvvetinin</text>
<text x="50" y="511" font-size="17" fill="#15803d" text-anchor="start">kendiliğinden kısmen artması.</text>
