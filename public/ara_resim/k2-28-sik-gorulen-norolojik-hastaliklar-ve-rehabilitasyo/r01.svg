<text x="936" y="186" font-size="17" fill="#6d28d9" text-anchor="start" font-weight="bold">alternatif nöral ağ</text>
<text x="936" y="206" font-size="17" fill="#6d28d9" text-anchor="start">(sinaptik güçlenme)</text>
<line x1="768" y1="318" x2="930" y2="330" stroke="#64748b" stroke-width="1.5"/>
