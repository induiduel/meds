<text x="936" y="336" font-size="17" fill="#6d28d9" text-anchor="start">yeni sinaptik bağlantılar</text>
<line x1="790" y1="268" x2="930" y2="262" stroke="#64748b" stroke-width="1.5"/>
<circle cx="790" cy="268" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="936" y="268" font-size="17" fill="#b91c1c" text-anchor="start">hasar alanı</text>
<text x="630" y="400" font-size="17" fill="#1e293b" text-anchor="start">Beyin, hasardan sonra kendini yeniden organize eder ve</text>
<text x="630" y="423" font-size="17" fill="#1e293b" text-anchor="start">işlevi farklı ağlar üzerinden sürdürür.</text>
<text x="630" y="452" font-size="17" fill="#1e293b" text-anchor="start">Deneyim, öğrenme ve tekrarlayan, göreve özgü</text>
<text x="630" y="475" font-size="17" fill="#1e293b" text-anchor="start">rehabilitasyon bu ağları destekler; akut, subakut ve</text>
<text x="630" y="498" font-size="17" fill="#1e293b" text-anchor="start">kronik dönemde sürer.</text>
<text x="630" y="527" font-size="17" fill="#15803d" text-anchor="start">Örnek: tekrarlayan yürüme eğitimiyle yürüme ağları</text>
<text x="630" y="550" font-size="17" fill="#15803d" text-anchor="start">yeniden örgütlenir.</text>
<rect x="30" y="592" width="1140" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
<text x="600" y="623" font-size="19" fill="#15803d" text-anchor="middle" font-weight="bold">Spontan iyileşme kendiliğinden olur; nöroplastisite ise egzersizle desteklenir.</text>
<text x="600.0" y="667" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 9; penumbra tanımı hocanın açıklamasıdır.</text>
