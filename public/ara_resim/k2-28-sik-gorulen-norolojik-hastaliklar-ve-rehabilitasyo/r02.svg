<text x="60" y="474" font-size="17" fill="#0f172a" text-anchor="start">Pozisyonlama, sık pozisyon değişikliği</text>
<text x="60" y="496" font-size="17" fill="#0f172a" text-anchor="start">Yutmanın değerlendirilmesi, beslenme</text>
<text x="60" y="518" font-size="17" fill="#0f172a" text-anchor="start">Mesane ve bağırsak programı</text>
<text x="60" y="540" font-size="17" fill="#0f172a" text-anchor="start">Hasta ve ailenin eğitimi, psikolojik destek</text>
<text x="450" y="452" font-size="17" fill="#0f172a" text-anchor="start">Kuvvetlendirme egzersizleri</text>
<text x="450" y="474" font-size="17" fill="#0f172a" text-anchor="start">Oturma dengesi ve ayakta durma eğitimi</text>
<text x="450" y="496" font-size="17" fill="#0f172a" text-anchor="start">Transfer, paralel barda ambulasyon eğitimi</text>
<text x="450" y="518" font-size="17" fill="#0f172a" text-anchor="start">Denge ve koordinasyon çalışmaları</text>
<text x="450" y="540" font-size="17" fill="#0f172a" text-anchor="start">Ortez, yardımcı cihaz, iş-uğraşı terapisi</text>
<text x="890" y="452" font-size="17" fill="#0f172a" text-anchor="start">Eski işe dönme</text>
<text x="890" y="474" font-size="17" fill="#0f172a" text-anchor="start">Yeni iş bulma</text>
<text x="890" y="496" font-size="17" fill="#0f172a" text-anchor="start">Sosyal birey olma</text>
<text x="890" y="518" font-size="17" fill="#0f172a" text-anchor="start">Aralıklı kontrol (hoca)</text>
