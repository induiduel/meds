<text x="575" y="162" font-size="20" fill="#ea580c" text-anchor="middle" font-weight="bold">Akut dönem: spinal şok</text>
<text x="575" y="186" font-size="17" fill="#0f172a" text-anchor="middle">genellikle ilk haftalar</text>
<text x="420" y="222" font-size="17" fill="#475569" text-anchor="start">kas</text>
<path d="M470 232 C530 225 630 225 700 232 C630 239 530 239 470 232 Z" stroke="#ea580c" stroke-width="2.5" fill="#e2e8f0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="300" font-size="17" fill="#475569" text-anchor="start">refleks</text>
<path d="M495 318 L530 318 C545 316 550 316 565 318 L720 318" stroke="#ea580c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="495" y1="318" x2="720" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="575" y="356" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">flask paralizi</text>
<text x="575" y="380" font-size="17" fill="#0f172a" text-anchor="middle">arefleksi</text>
<text x="575" y="404" font-size="17" fill="#0f172a" text-anchor="middle">kas gevşek, refleks alınmaz</text>
<rect x="800" y="132" width="350" height="300" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="975" y="162" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">İzleyen dönem</text>
<text x="975" y="186" font-size="17" fill="#0f172a" text-anchor="middle">üst motor nöron bulguları</text>
<text x="820" y="222" font-size="17" fill="#475569" text-anchor="start">kas</text>
<path d="M870 232 C930 210 1030 210 1100 232 C1030 254 930 254 870 232 Z" stroke="#b91c1c" stroke-width="2.5" fill="#fecdd3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="820" y="300" font-size="17" fill="#475569" text-anchor="start">refleks</text>
<path d="M895 318 L930 318 C945 318 950 250 962 250 C974 250 978 330 990 318 C1000 310 1010 318 1120 318" stroke="#b91c1c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="895" y1="318" x2="1120" y2="318" stroke="#64748b" stroke-width="1"/>
<text x="975" y="356" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">spastisite</text>
<text x="975" y="380" font-size="17" fill="#0f172a" text-anchor="middle">hiperrefleksi</text>
<text x="975" y="404" font-size="17" fill="#0f172a" text-anchor="middle">patolojik refleksler</text>
<line x1="754" y1="280" x2="796" y2="280" stroke="#0f172a" stroke-width="4" marker-end="url(#ok)"/>
<text x="775" y="262" font-size="17" fill="#475569" text-anchor="middle">haftalar</text>
<line x1="1000" y1="226" x2="960" y2="202" stroke="#64748b" stroke-width="1.5"/>
<circle cx="1000" cy="226" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="954" y="208" font-size="17" fill="#b91c1c" text-anchor="end">tonus artmış</text>
<line x1="962" y1="255" x2="1010" y2="280" stroke="#64748b" stroke-width="1.5"/>
<circle cx="962" cy="255" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="1016" y="286" font-size="17" fill="#b91c1c" text-anchor="start">abartılı yanıt</text>
<line x1="560" y1="317" x2="600" y2="290" stroke="#64748b" stroke-width="1.5"/>
<circle cx="560" cy="317" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="606" y="296" font-size="17" fill="#ea580c" text-anchor="start">yanıt yok</text>
<text x="400" y="468" font-size="17" fill="#1e293b" text-anchor="start">Spinal şokta tablo alt motor nöron hasarına benzer; dönem geçince üst motor</text>
<text x="400" y="491" font-size="17" fill="#1e293b" text-anchor="start">nöron bulguları ortaya çıkar.</text>
<text x="400" y="520" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">Aynı hastada önce refleks alınmaz, haftalar sonra refleksler artar:</text>
<text x="400" y="543" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">ikisini karıştırmayın.</text>
<text x="600.0" y="627" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 19; spinal şokun süresi ve alt motor nöron benzetmesi hocanın açıklamasıdır.</text>
</svg>