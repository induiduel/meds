<text x="186" y="268" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">lezyon seviyesi</text>
<rect x="60" y="292" width="270" height="182" rx="8" fill="#b91c1c" opacity="0.08"/>
<text x="190" y="180" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="bold">lezyonun üstü:</text>
<text x="190" y="202" font-size="17" fill="#1d4ed8" text-anchor="start">sağlam</text>
<text x="180" y="335" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">lezyonun altı:</text>
<text x="180" y="357" font-size="17" fill="#0f172a" text-anchor="start">kas kuvveti azalır</text>
<text x="180" y="379" font-size="17" fill="#0f172a" text-anchor="start">ya da paralizi olur;</text>
<text x="180" y="401" font-size="17" fill="#0f172a" text-anchor="start">duyu ve otonom</text>
<text x="180" y="423" font-size="17" fill="#0f172a" text-anchor="start">işlev de bozulur</text>
<text x="48" y="505" font-size="17" fill="#475569" text-anchor="start">Motor, duyusal ve otonom</text>
<text x="48" y="528" font-size="17" fill="#475569" text-anchor="start">etkilenimin ortak kuralı budur.</text>
<rect x="380" y="88" width="790" height="500" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="398" y="119" font-size="20" fill="#0f766e" text-anchor="start" font-weight="bold">B · Aynı hastada iki dönem</text>
