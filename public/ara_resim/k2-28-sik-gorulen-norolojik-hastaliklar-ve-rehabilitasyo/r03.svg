<rect width="1200" height="640" fill="url(#zemin)"/>
<text x="600.0" y="40" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Omurilik yaralanmasında motor tablo zamanla değişir</text>
<text x="600.0" y="68" font-size="17" fill="#475569" text-anchor="middle">Spinal şok döneminden üst motor nöron bulgularına · slayt 19</text>
<rect x="30" y="88" width="330" height="500" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="48" y="119" font-size="20" fill="#0f766e" text-anchor="start" font-weight="bold">A · Lezyonun altı etkilenir</text>
