<text x="366" y="454" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="bold">tekerlekli sandalye</text>
<text x="50" y="548" font-size="17" fill="#0f172a" text-anchor="start">Sandalyede sürme, transfer, rampa ve dönüşler</text>
<text x="50" y="571" font-size="17" fill="#0f172a" text-anchor="start">çalıştırılır.</text>
