<text x="276" y="156" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="300" y="149" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">Yatak içi egzersiz</text>
<text x="300" y="171" font-size="17" fill="#475569" text-anchor="start">dönme, oturmaya gelme</text>
<circle cx="276" cy="212" r="15" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="276" y="218" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="300" y="211" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">Oturma dengesi</text>
<text x="300" y="233" font-size="17" fill="#475569" text-anchor="start">destekli, sonra desteksiz</text>
<circle cx="276" cy="274" r="15" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="276" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="300" y="273" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">Transfer ve ayakta durma</text>
<text x="300" y="295" font-size="17" fill="#475569" text-anchor="start">oturma dengesi kazanılınca</text>
<circle cx="276" cy="336" r="15" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="276" y="342" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="300" y="335" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">Paralel barda ambulasyon</text>
<text x="300" y="357" font-size="17" fill="#475569" text-anchor="start">uygun ortezle</text>
<circle cx="305" cy="452" r="26" fill="none" stroke="#1d4ed8" stroke-width="4"/>
<circle cx="343" cy="472" r="8" fill="none" stroke="#1d4ed8" stroke-width="3"/>
