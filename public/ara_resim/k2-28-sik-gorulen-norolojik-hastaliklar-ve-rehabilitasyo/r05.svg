<text x="708" y="162" font-size="19" fill="#b91c1c" text-anchor="start" font-weight="bold">T10 ve üzeri</text>
<text x="860" y="162" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">Terapötik ambulasyon</text>
<text x="708" y="188" font-size="17" fill="#0f172a" text-anchor="start">Ortez ve cihazla, egzersiz salonunda,</text>
<text x="708" y="209" font-size="17" fill="#0f172a" text-anchor="start">fizyoterapist desteğiyle yürür; toplum içinde</text>
<text x="708" y="230" font-size="17" fill="#0f172a" text-anchor="start">yürüme genellikle yoktur.</text>
<rect x="596" y="318" width="558" height="112" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="708" y="348" font-size="19" fill="#ea580c" text-anchor="start" font-weight="bold">T11 – L2</text>
<text x="860" y="348" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">Ev içi ambulasyon</text>
<text x="708" y="374" font-size="17" fill="#0f172a" text-anchor="start">Cihazını ya da yürütecini alıp evin içinde</text>
<text x="708" y="395" font-size="17" fill="#0f172a" text-anchor="start">bağımsız hareket eder.</text>
<rect x="596" y="436" width="558" height="106" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="708" y="466" font-size="19" fill="#15803d" text-anchor="start" font-weight="bold">L2'nin altı</text>
<text x="860" y="466" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">Toplumsal ambulasyon</text>
<text x="708" y="492" font-size="17" fill="#0f172a" text-anchor="start">Toplum içinde yürüyebilir.</text>
