<text x="600.0" y="40" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Omurilik yaralanmasında harekete dönüş</text>
<text x="600.0" y="68" font-size="17" fill="#475569" text-anchor="middle">Mobilite basamakları ve seviyeye göre ambulasyon · slayt 28–29</text>
