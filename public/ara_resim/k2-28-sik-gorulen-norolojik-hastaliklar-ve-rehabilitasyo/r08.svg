<text x="600" y="630" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Akılda tutulacak iki eşlik eden durum: hidrosefali ve tip II Chiari malformasyonu</text>
<text x="600.0" y="667" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 44; cerrahinin amacı, seviye ile gidiş ilişkisi ve Chiari açıklaması hocanındır.</text>
