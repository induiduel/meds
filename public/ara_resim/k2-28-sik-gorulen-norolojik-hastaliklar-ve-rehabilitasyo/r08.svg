<text x="352" y="450" font-size="17" fill="#0f172a" text-anchor="start">Proprioseptif duyu azalır ya da kaybolur</text>
<circle cx="338" cy="471" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/>
<text x="352" y="477" font-size="17" fill="#0f172a" text-anchor="start">Bağırsak ve mesane inkontinansı</text>
