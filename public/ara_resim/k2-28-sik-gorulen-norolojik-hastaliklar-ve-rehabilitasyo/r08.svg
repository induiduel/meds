<text x="842" y="162" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">Erken cerrahi kritik:</text>
<text x="842" y="186" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">ilk 24–48 saat</text>
<text x="770" y="232" font-size="17" fill="#0f172a" text-anchor="start">Amaç: menenjit gelişmesini ve dışarıdaki</text>
<text x="770" y="255" font-size="17" fill="#0f172a" text-anchor="start">nöral dokunun zarar görmesini önlemek.</text>
<text x="770" y="286" font-size="17" fill="#0f172a" text-anchor="start">Cerrahi felç tablosunu pek değiştirmez;</text>
<text x="770" y="309" font-size="17" fill="#0f172a" text-anchor="start">inkontinans da cerrahiden bağımsız</text>
<text x="770" y="332" font-size="17" fill="#0f172a" text-anchor="start">sürer.</text>
<text x="770" y="389" font-size="17" fill="#0f766e" text-anchor="start" font-weight="bold">Gidişi kesenin seviyesi belirler</text>
