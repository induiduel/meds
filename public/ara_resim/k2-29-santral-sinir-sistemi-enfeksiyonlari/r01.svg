<path d="M205 355 C192 242 292 180 374 186 C455 199 480 268 468 330 C455 374 380 386 330 380 C280 392 218 399 205 355 Z" stroke="#9a6b55" stroke-width="2.5" fill="#fbe3d6" stroke-linecap="round" stroke-linejoin="round"/>
