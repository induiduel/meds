<rect width="1200" height="720" fill="url(#zemin)"/>
<text x="600.0" y="40" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Mikroorganizma MSS'ye beş yoldan ulaşır</text>
<text x="600.0" y="68" font-size="17" fill="#475569" text-anchor="middle">Giriş yolları · slayt 3 (s.5)</text>
