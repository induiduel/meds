<path d="M355 218 C386 255 418 236 442 280" stroke="#c9a28e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M250 645 C255 560 275 480 300 420" stroke="#b91c1c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)"/>
