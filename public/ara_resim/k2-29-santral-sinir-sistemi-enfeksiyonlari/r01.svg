<circle cx="590" cy="585" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="476" y="606" font-size="17" fill="#6d28d9" text-anchor="start" font-weight="bold">5 · Periferik sinir</text>
<text x="476" y="630" font-size="17" fill="#6d28d9" text-anchor="start">kuduz, herpes zoster</text>
<rect x="690" y="88" width="480" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="708" y="119" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">B · Plasenta yoluyla geçiş</text>
<ellipse cx="820" cy="220" rx="70" ry="60" fill="#fde68a" stroke="#ea580c" stroke-width="2.5"/>
<path d="M760 220 C790 180 850 180 880 220 C850 250 790 260 760 220 Z" stroke="#9a6b55" stroke-width="2" fill="#fbe3d6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="890" y1="220" x2="960" y2="220" stroke="#ea580c" stroke-width="4" marker-end="url(#oko)"/>
<text x="975" y="205" font-size="18" fill="#ea580c" text-anchor="start" font-weight="bold">3 · Perinatal</text>
<text x="975" y="228" font-size="18" fill="#ea580c" text-anchor="start" font-weight="bold">enfeksiyon</text>
<text x="710" y="290" font-size="17" fill="#1e293b" text-anchor="start">Sonuç: ciddi beyin malformasyonu ve</text>
<text x="710" y="313" font-size="17" fill="#1e293b" text-anchor="start">kalsifikasyon.</text>
<rect x="690" y="352" width="480" height="306" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="708" y="383" font-size="20" fill="#15803d" text-anchor="start" font-weight="bold">C · Akılda kalacak sıra</text>
<text x="710" y="420" font-size="17" fill="#1e293b" text-anchor="start">Ana yol kandır ve çoğunlukla arter yoluyla</text>
<text x="710" y="443" font-size="17" fill="#1e293b" text-anchor="start">olur.</text>
<text x="710" y="474" font-size="17" fill="#1e293b" text-anchor="start">Komşu sinüs, diş, kafatası ya da omurga odağı</text>
<text x="710" y="497" font-size="17" fill="#1e293b" text-anchor="start">içeri sızabilir.</text>
<text x="710" y="528" font-size="17" fill="#6d28d9" text-anchor="start">Kuduz ve herpes zoster virüsü sinir boyunca</text>
<text x="710" y="551" font-size="17" fill="#6d28d9" text-anchor="start">geriye yürür.</text>
<text x="710" y="582" font-size="17" fill="#1e293b" text-anchor="start">Açık travma ve doğuştan açıklık mikrobu</text>
<text x="710" y="605" font-size="17" fill="#1e293b" text-anchor="start">doğrudan içeri sokar.</text>
<text x="600.0" y="707" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 3 (PDF s.5). Numara sırası slayttaki sıradır.</text>
</svg>