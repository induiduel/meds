<circle cx="254" cy="600" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="66" y="596" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="bold">1 · Hematogen, arteriyel</text>
<text x="66" y="615" font-size="17" fill="#b91c1c" text-anchor="start">en sık yol</text>
<path d="M520 470 C470 450 450 420 430 380" stroke="#1d4ed8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okb)" stroke-dasharray="8 6"/>
<line x1="505" y1="462" x2="470" y2="545" stroke="#64748b" stroke-width="1.5"/>
<circle cx="505" cy="462" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="476" y="551" font-size="17" fill="#1d4ed8" text-anchor="start">yüz venleri–sinüs:</text>
<text x="476" y="569" font-size="17" fill="#1d4ed8" text-anchor="start">retrograd venöz</text>
<line x1="330" y1="110" x2="330" y2="175" stroke="#0f172a" stroke-width="4" marker-end="url(#ok)"/>
<text x="345" y="120" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">2 · Doğrudan implantasyon</text>
<text x="345" y="143" font-size="17" fill="#475569" text-anchor="start">delici kafa travması, meningomiyelosel</text>
<circle cx="470" cy="330" r="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
<path d="M462 320 C440 305 430 300 415 300" stroke="#ea580c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oko)"/>
<line x1="482" y1="330" x2="495" y2="262" stroke="#64748b" stroke-width="1.5"/>
<circle cx="482" cy="330" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="501" y="268" font-size="17" fill="#ea580c" text-anchor="start" font-weight="bold">4 · Lokal yayılım</text>
<text x="501" y="286" font-size="17" fill="#ea580c" text-anchor="start">sinüs, diş, kafatası</text>
<path d="M600 600 C560 540 520 520 470 470 C450 450 420 430 400 410" stroke="#6d28d9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okm)"/>
