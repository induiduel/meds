<text x="990" y="260" font-size="18" fill="#6d28d9" text-anchor="middle" font-weight="bold">peroksizom</text>
<text x="990" y="285" font-size="17" fill="#0f172a" text-anchor="middle">VLCFA yıkılamaz</text>
<text x="990" y="307" font-size="17" fill="#0f172a" text-anchor="middle">(katabolize edilemez)</text>
<path d="M990 355 C990 375 990 385 990 400" stroke="#b91c1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)"/>
<text x="990" y="425" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold">serum VLCFA ↑</text>
<text x="830" y="455" font-size="17" fill="#0f172a" text-anchor="start">Davranış değişikliği, adrenal</text>
<text x="830" y="478" font-size="17" fill="#0f172a" text-anchor="start">yetmezlik, beyaz madde</text>
<text x="830" y="501" font-size="17" fill="#0f172a" text-anchor="start">demiyelinizasyonu.</text>
<rect x="30" y="572" width="1140" height="104" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="50" y="604" font-size="17" fill="#0f172a" text-anchor="start">Krabbe ve metakromatik lökodistrofide eksik olan bir enzimdir;</text>
<text x="50" y="630" font-size="17" fill="#0f172a" text-anchor="start">adrenolökodistrofide ise peroksizoma madde taşıyan ABCD1 proteini bozuktur.</text>
<text x="50" y="658" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">Çıkmış: peroksizomal defekt sorulursa cevap adrenolökodistrofidir.</text>
<text x="600.0" y="707" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 38–40 ve eŞekil 21.8 (PDF s.52–55). VLCFA: çok uzun zincirli yağ asitleri.</text>
