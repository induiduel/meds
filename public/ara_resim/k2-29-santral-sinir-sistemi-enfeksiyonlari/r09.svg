<text x="210" y="418" font-size="17" fill="#b91c1c" text-anchor="middle">sitotoksik → oligodendrosit ölür</text>
<text x="50" y="455" font-size="17" fill="#0f172a" text-anchor="start">MSS ve periferik sinirde miyelin</text>
<text x="50" y="478" font-size="17" fill="#0f172a" text-anchor="start">kaybı; globoid hücreler; başlangıç</text>
<text x="50" y="501" font-size="17" fill="#0f172a" text-anchor="start">3–6 ay.</text>
