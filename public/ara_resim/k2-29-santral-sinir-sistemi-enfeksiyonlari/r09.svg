<text x="440" y="463" font-size="17" fill="#0f172a" text-anchor="start">başlangıç ne kadar erkense</text>
<text x="440" y="486" font-size="17" fill="#0f172a" text-anchor="start">ilerleme o kadar hızlı.</text>
<path d="M890 280 C870 220 930 180 990 180 C1050 180 1110 220 1090 280 C1080 330 1030 350 990 350 C950 350 900 330 890 280 Z" stroke="#6d28d9" stroke-width="2.5" fill="#ede9fe" stroke-linecap="round" stroke-linejoin="round"/>
