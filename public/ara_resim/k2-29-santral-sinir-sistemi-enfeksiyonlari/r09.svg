<text x="828" y="119" font-size="20" fill="#6d28d9" text-anchor="start" font-weight="bold">Adrenolökodistrofi</text>
<text x="828" y="148" font-size="17" fill="#475569" text-anchor="start">X'e bağlı resesif · gen ABCD1</text>
