<rect width="1200" height="720" fill="url(#zemin)"/>
<text x="600.0" y="40" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Üç lökodistrofi: eksik halka nerede?</text>
<text x="600.0" y="68" font-size="17" fill="#475569" text-anchor="middle">Krabbe, metakromatik lökodistrofi, adrenolökodistrofi · slayt 38–40 (s.52–55)</text>
