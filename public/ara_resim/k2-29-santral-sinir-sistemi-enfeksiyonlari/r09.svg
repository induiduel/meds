<text x="438" y="119" font-size="20" fill="#ea580c" text-anchor="start" font-weight="bold">Metakromatik lökodistrofi</text>
<text x="438" y="148" font-size="17" fill="#475569" text-anchor="start">otozomal resesif</text>
