<text x="460" y="630" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">kas</text>
<line x1="284" y1="300" x2="60" y2="330" stroke="#64748b" stroke-width="1.5"/>
<circle cx="284" cy="300" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="66" y="336" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">üst motor nöron</text>
<text x="66" y="358" font-size="17" fill="#b91c1c" text-anchor="start">lateral kortikospinal yol</text>
<line x1="330" y1="466" x2="60" y2="590" stroke="#64748b" stroke-width="1.5"/>
<circle cx="330" cy="466" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="66" y="596" font-size="17" fill="#1d4ed8" text-anchor="start" font-weight="bold">alt motor nöron</text>
<text x="66" y="620" font-size="17" fill="#1d4ed8" text-anchor="start">(omurilik → kas)</text>
<rect x="570" y="88" width="600" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="588" y="119" font-size="20" fill="#b91c1c" text-anchor="start" font-weight="bold">B · Üst motor nöron kaybı</text>
<text x="600" y="150" font-size="18" fill="#b91c1c" text-anchor="start">• Parezi</text>
<text x="600" y="190" font-size="18" fill="#b91c1c" text-anchor="start">• Hiperrefleksi, spastisite</text>
<text x="600" y="230" font-size="18" fill="#b91c1c" text-anchor="start">• Babinski pozitif</text>
<text x="600" y="270" font-size="18" fill="#b91c1c" text-anchor="start">• Lateral kortikospinal yol dejenerasyonu</text>
<text x="600" y="310" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="bold">= adın “lateral skleroz” kısmı</text>
<rect x="570" y="370" width="600" height="290" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="588" y="401" font-size="20" fill="#1d4ed8" text-anchor="start" font-weight="bold">C · Alt motor nöron kaybı</text>
<text x="600" y="430" font-size="18" fill="#1d4ed8" text-anchor="start">• Kas denervasyonu</text>
<text x="600" y="470" font-size="18" fill="#1d4ed8" text-anchor="start" font-weight="bold">• Atrofi = amyotrofi</text>
<text x="600" y="510" font-size="18" fill="#1d4ed8" text-anchor="start">• Güçsüzlük</text>
<text x="600" y="550" font-size="18" fill="#1d4ed8" text-anchor="start">• Fasikülasyon</text>
<text x="600" y="590" font-size="18" fill="#1d4ed8" text-anchor="start">• Kas gücü ve hacmi azalır</text>
<text x="870" y="640" font-size="17" fill="#475569" text-anchor="middle">Duyu genellikle korunur; bilişsel bozukluk eşlik edebilir.</text>
<text x="600.0" y="687" font-size="17" fill="#64748b" text-anchor="middle">Kaynak: slayt 60, 61 · alt ve üst motor nöron bulgusu birlikte = ALS</text>
</svg>