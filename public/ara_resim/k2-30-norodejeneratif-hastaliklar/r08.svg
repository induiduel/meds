<rect width="1200" height="700" fill="url(#zemin)"/>
<text x="600.0" y="40" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">ALS: iki motor nöron, iki bulgu grubu</text>
<text x="600.0" y="68" font-size="17" fill="#475569" text-anchor="middle">Üst motor nöron (lateral skleroz) + alt motor nöron (amyotrofi) · slayt 60–61</text>
<rect x="30" y="88" width="520" height="572" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="48" y="119" font-size="20" fill="#475569" text-anchor="start" font-weight="bold">A · Motor yol</text>
<path d="M140 210 C120 180 200 160 260 170 C330 160 400 190 380 230 C360 260 200 265 140 210 Z" stroke="#9a6b55" stroke-width="2.5" fill="#fbe3d6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="265" y="222" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">motor korteks</text>
<rect x="230" y="370" width="80" height="140" rx="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="270" y="535" font-size="17" fill="#475569" text-anchor="middle">omurilik</text>
<path d="M272 240 C288 290 282 335 262 398" stroke="#b91c1c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okk)"/>
<circle cx="260" cy="420" r="12" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<path d="M262 432 C300 460 360 470 418 500" stroke="#1d4ed8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okb)"/>
