<circle cx="200" cy="330" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="366" y="355" font-size="15" fill="#0f172a" text-anchor="start">ön beyaz komissür:</text>
<text x="366" y="375" font-size="15" fill="#ea580c" text-anchor="start">ağrı-ısı lifleri</text>
<text x="366" y="393" font-size="15" fill="#ea580c" text-anchor="start">burada karşıya geçer</text>
<text x="60" y="470" font-size="15" fill="#7c3aed" text-anchor="start">taralı mor alan = lezyon (kesitin bir yarısı)</text>
<text x="60" y="494" font-size="15" fill="#0f172a" text-anchor="start">bulbusta çaprazlaşan iki yol aynı tarafta kalır</text>
<rect x="570" y="90" width="600" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="590" y="122" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · Hastada bulgunun tarafı (lezyon altında)</text>
