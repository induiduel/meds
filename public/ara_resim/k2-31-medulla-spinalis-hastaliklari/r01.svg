<text x="760" y="455" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">LEZYON TARAFI ← | → KARŞI TARAF</text>
<text x="690" y="335" font-size="15" fill="#7c3aed" text-anchor="end">lezyon</text>
<text x="690" y="352" font-size="15" fill="#7c3aed" text-anchor="end">düzeyi</text>
<text x="850" y="150" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="bold">Lezyonla aynı taraf:</text>
<text x="850" y="171" font-size="15" fill="#b91c1c" text-anchor="start">• üst motor nöron felci</text>
<text x="850" y="192" font-size="15" fill="#b91c1c" text-anchor="start">  (kortikospinal kordda</text>
<text x="850" y="213" font-size="15" fill="#b91c1c" text-anchor="start">  aynı tarafta iner)</text>
<text x="850" y="234" font-size="15" fill="#b91c1c" text-anchor="start">• pozisyon ve vibrasyon</text>
<text x="850" y="255" font-size="15" fill="#b91c1c" text-anchor="start">  kaybı (arka kolon</text>
<text x="850" y="276" font-size="15" fill="#b91c1c" text-anchor="start">  ancak bulbusta çaprazlaşır)</text>
<text x="850" y="320" font-size="15" fill="#ea580c" text-anchor="start" font-weight="bold">Karşı taraf:</text>
<text x="850" y="341" font-size="15" fill="#ea580c" text-anchor="start">• ağrı ve ısı kaybı</text>
<text x="850" y="362" font-size="15" fill="#ea580c" text-anchor="start">  (spinotalamik lif kordda</text>
<text x="850" y="383" font-size="15" fill="#ea580c" text-anchor="start">  ön komissürden karşıya</text>
<text x="850" y="404" font-size="15" fill="#ea580c" text-anchor="start">  geçmiştir)</text>
