<circle cx="112" cy="335" r="3.5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="366" y="255" font-size="15" fill="#ea580c" text-anchor="start">spinotalamik (ağrı-ısı)</text>
