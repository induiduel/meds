<text x="236" y="505" font-size="15" fill="#7c3aed" text-anchor="start">tam kesi = kesitin tamamı</text>
<text x="260" y="405" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Lezyon DÜZEYİNDE: ön boynuz / ön kök harap →</text>
<text x="260" y="426" font-size="15" fill="#0f172a" text-anchor="start">alt motor nöron: parezi, atrofi, fasikülasyon, arefleksi;</text>
<text x="260" y="447" font-size="15" fill="#0f172a" text-anchor="start">radiküler ağrı, segmental parestezi</text>
<text x="720" y="400" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="bold">Lezyonun ALTINDA:</text>
<text x="720" y="421" font-size="15" fill="#b91c1c" text-anchor="start">tüm duyularda kayıp (duyu seviyesi)</text>
<text x="720" y="442" font-size="15" fill="#b91c1c" text-anchor="start">üst motor nöron: spastik parapleji/kuadripleji</text>
<text x="720" y="463" font-size="15" fill="#b91c1c" text-anchor="start">Mesane: sakral düzey → flask, geniş</text>
<text x="720" y="484" font-size="15" fill="#b91c1c" text-anchor="start">sakral üstü → spastik, küçük</text>
<line x1="255" y1="490" x2="700" y2="490" stroke="#0f172a" stroke-width="2" marker-end="url(#ok)" stroke-dasharray="6 5"/>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 15 (tam kesi bulguları), 31 (iskemide başlangıçta spinal şok) · mavi = şok dönemi, kırmızı = üst motor nöron dönemi, mor = lezyon</text>
