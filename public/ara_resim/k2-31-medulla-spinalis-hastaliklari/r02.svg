<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Tam kesi: önce spinal şok, sonra spastisite</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Aynı hastada zamanla değişen tablo; düzeyde ve düzeyin altında farklı bulgu</text>
<rect x="30" y="90" width="700" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="122" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Zaman çizgisi: akut dönemden kronik döneme</text>
<path d="M70 250 C250 250 450 250 700 250" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ok)"/>
<path d="M80 165 C130 165 150 225 220 230 C300 236 320 236 360 232" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 232 C420 222 450 175 520 160 C580 150 620 148 690 146" stroke="#b91c1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="155" font-size="15" fill="#475569" text-anchor="start">refleks düzeyi</text>
<text x="200" y="280" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">SPİNAL ŞOK</text>
<text x="200" y="300" font-size="15" fill="#1d4ed8" text-anchor="middle">flask, arefleksik felç</text>
<text x="200" y="318" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">refleks YOK</text>
<text x="560" y="280" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold">SPASTİK DÖNEM</text>
<text x="560" y="300" font-size="15" fill="#b91c1c" text-anchor="middle">spastik, hiperrefleksik</text>
<text x="560" y="318" font-size="15" fill="#b91c1c" text-anchor="middle">Babinski (+), karın cildi refleksi (−)</text>
<text x="380" y="210" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">şok geçer</text>
<rect x="750" y="90" width="420" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="770" y="122" font-size="20" fill="#7c3aed" text-anchor="start" font-weight="bold">B · Çıkmış tuzağı</text>
<text x="770" y="150" font-size="16" fill="#0f172a" text-anchor="start">Tam ya da tama yakın hasarda</text>
<text x="770" y="176" font-size="16" fill="#0f172a" text-anchor="start">GÖRÜLMEYEN bulgu:</text>
<text x="770" y="202" font-size="16" fill="#0f172a" text-anchor="start">“spinal şok döneminde</text>
<text x="770" y="228" font-size="16" fill="#0f172a" text-anchor="start">refleksler artmıştır”.</text>
<text x="770" y="254" font-size="16" fill="#0f172a" text-anchor="start">Şok döneminde refleks kaybolur;</text>
<text x="770" y="280" font-size="16" fill="#0f172a" text-anchor="start">artış ancak şoktan sonra gelir.</text>
<rect x="30" y="355" width="1140" height="175" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="387" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">C · Kesik düzeyinde ve altında ne olur?</text>
