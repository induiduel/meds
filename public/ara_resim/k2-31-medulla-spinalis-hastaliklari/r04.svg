<text x="630" y="400" font-size="15" fill="#0f172a" text-anchor="start">Arka kolon → parestezi, duysal ataksi, Romberg (+)</text>
<text x="630" y="423" font-size="15" fill="#0f172a" text-anchor="start">Lateral kolon → spastisite, hiperrefleksi</text>
