<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 33–36 · en ağır hasar servikal ve üst dorsal arka-lateral kordonlar · mavi derin duyu, kırmızı motor, mor = miyelin kaybı</text>
