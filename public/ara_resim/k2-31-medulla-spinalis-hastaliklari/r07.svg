<text x="966" y="285" font-size="15" fill="#ea580c" text-anchor="start">tek kök sıkışır → keskin</text>
<text x="966" y="300" font-size="15" fill="#ea580c" text-anchor="start">radiküler ağrı, tek yanlı</text>
<text x="630" y="420" font-size="15" fill="#0f172a" text-anchor="start">L3 vertebra altı · başlangıç yavaş, tek yanlı</text>
<text x="630" y="442" font-size="15" fill="#0f172a" text-anchor="start">Ağrı ÇOK şiddetli, ön planda (en belirgin fark)</text>
<text x="630" y="464" font-size="15" fill="#0f172a" text-anchor="start">Duyu radiküler, asimetrik · sfinkter GEÇ, nadir</text>
<text x="630" y="486" font-size="15" fill="#0f172a" text-anchor="start">Güçsüzlük arefleksik, atrofik, asimetrik</text>
<text x="960" y="150" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Refleks:</text>
<text x="960" y="171" font-size="15" fill="#0f172a" text-anchor="start">s41: Aşil kayıp,</text>
<text x="960" y="192" font-size="15" fill="#0f172a" text-anchor="start">patella elde edilebilir</text>
<text x="960" y="213" font-size="15" fill="#0f172a" text-anchor="start">s43: patella ve</text>
<text x="960" y="234" font-size="15" fill="#0f172a" text-anchor="start">Aşil (−)</text>
<text x="600.0" y="546" font-size="13" fill="#64748b" text-anchor="middle">Kaynak: slayt 41 (konus, kauda), 42 (ayırım özeti), 43 (karşılaştırma tablosu, L1–L2 çizimi) · mor = merkez hasarı, turuncu = kök basısı</text>
