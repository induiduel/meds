<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Konus medullaris mi, kauda ekuina mı? Merkez hasarı ile kök basısı</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Konus sakral segmentlerin kendisidir; kauda tek tek köklerdir</text>
<rect x="30" y="90" width="560" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="122" font-size="20" fill="#7c3aed" text-anchor="start" font-weight="bold">A · Konus medullaris: merkez iki yandan birden</text>
