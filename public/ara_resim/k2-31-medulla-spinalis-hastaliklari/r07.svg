<text x="336" y="220" font-size="15" fill="#7c3aed" text-anchor="start">sakral segmentler (mesane,</text>
<text x="336" y="240" font-size="15" fill="#7c3aed" text-anchor="start">anal sfinkter, perianal duyu)</text>
<text x="60" y="385" font-size="15" fill="#0f172a" text-anchor="start">Başlangıç ani, bilateral</text>
<text x="60" y="404" font-size="15" fill="#0f172a" text-anchor="start">Sfinkter tam ve akut:</text>
<text x="60" y="423" font-size="15" fill="#0f172a" text-anchor="start">retansiyon, taşma</text>
<text x="60" y="442" font-size="15" fill="#0f172a" text-anchor="start">inkontinansı</text>
<text x="60" y="461" font-size="15" fill="#0f172a" text-anchor="start">Duyu simetrik:</text>
<text x="60" y="480" font-size="15" fill="#0f172a" text-anchor="start">süvari yaması, perianal</text>
<text x="60" y="499" font-size="15" fill="#0f172a" text-anchor="start">Ağrı hafif, geri planda</text>
<text x="60" y="518" font-size="15" fill="#0f172a" text-anchor="start">İmpotans sık</text>
<text x="330" y="385" font-size="15" fill="#0f172a" text-anchor="start">Refleks (tablo):</text>
<text x="330" y="404" font-size="15" fill="#0f172a" text-anchor="start">patella (+), Aşil (−)</text>
<text x="330" y="423" font-size="15" fill="#0f172a" text-anchor="start">Parezi distal, simetrik,</text>
<text x="330" y="442" font-size="15" fill="#0f172a" text-anchor="start">hafif; DTR artar,</text>
<text x="330" y="461" font-size="15" fill="#0f172a" text-anchor="start">fasikülasyon olabilir</text>
<text x="330" y="480" font-size="15" fill="#0f172a" text-anchor="start">Sık neden: tethered kord</text>
