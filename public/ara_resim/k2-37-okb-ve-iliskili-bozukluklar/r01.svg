<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Obsesyon kaygıyı yükseltir, kompulsiyon onu azaltmaya çalışır</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">OKB tanımı · hocanın kirlilik örneği (slayt 4)</text>
<rect x="30" y="100" width="520" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Kirlilik örneği</text>
<path d="M118 438 C79 412 72 321 118 282 C164 243 242 256 254 321 C261 347 274 360 280 380 C274 386 264 389 261 396 C264 412 254 432 228 432 C209 435 202 458 202 484 L124 484 C124 464 121 451 118 438 z" fill="url(#ten)" stroke="#9a5b34" stroke-width="2.5"/>
<path d="M265 226 C245 188 322 140 368 166 C403 135 484 150 478 194 C515 210 472 275 414 257 C380 280 311 275 265 226 z" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2.5"/>
<text x="380" y="205" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="bold">Çok kirliyim!</text>
<text x="380" y="232" font-size="17" fill="#7c3aed" text-anchor="middle">zorla gelen düşünce</text>
<circle cx="290" cy="270" r="9" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2"/>
<circle cx="262" cy="300" r="6" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2"/>
<path d="M369 472 C364 444 366 416 375 399 C380 388 392 391 392 405 L394 382 C397 371 411 371 411 385 L414 391 C417 380 431 382 428 396 L428 430 C434 444 425 469 414 472 z" fill="url(#ten)" stroke="#9a5b34" stroke-width="2"/>
<path d="M429 472 C424 444 426 416 435 399 C440 388 452 391 452 405 L454 382 C457 371 471 371 471 385 L474 391 C477 380 491 382 488 396 L488 430 C494 444 485 469 474 472 z" fill="url(#ten)" stroke="#9a5b34" stroke-width="2"/>
<use href="#damla" x="395" y="360"/>
<use href="#damla" x="430" y="372"/>
<use href="#damla" x="455" y="352"/>
<use href="#damla" x="470" y="382"/>
<use href="#damla" x="415" y="392"/>
<path d="M380 330 C400 300 450 300 470 330" fill="none" stroke="#0369a1" stroke-width="5"/>
<text x="320" y="500" font-size="19" fill="#c2410c" text-anchor="start" font-weight="bold">Yıkar da yıkar:</text>
<text x="320" y="524" font-size="18" fill="#c2410c" text-anchor="start">yıkama kompulsiyonu</text>
<text x="60" y="500" font-size="19" fill="#7c3aed" text-anchor="start" font-weight="bold">Obsesyon:</text>
<text x="60" y="524" font-size="18" fill="#7c3aed" text-anchor="start">kirlilik düşüncesi</text>
<text x="60" y="552" font-size="17" fill="#475569" text-anchor="start">Düşünce zihindedir, davranış dışarıda görülür.</text>
<rect x="570" y="100" width="600" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="590" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Kaygının zaman içindeki seyri</text>
<line x1="630" y1="510" x2="1140" y2="510" stroke="#475569" stroke-width="2.5" marker-end="url(#ok)"/>
<line x1="630" y1="510" x2="630" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="1135" y="540" font-size="17" fill="#475569" text-anchor="end">zaman</text>
<text x="640" y="165" font-size="17" fill="#dc2626" text-anchor="start" font-weight="bold">anksiyete (kaygı)</text>
<path d="M640 470 C700 470 720 300 790 240 C830 210 860 215 880 230 C900 250 905 420 960 455 C1000 470 1060 470 1120 468 L1120 510 L640 510 z" fill="url(#ankz)"/>
<path d="M640 470 C700 470 720 300 790 240 C830 210 860 215 880 230 C900 250 905 420 960 455 C1000 470 1060 470 1120 468" fill="none" stroke="#dc2626" stroke-width="5"/>
<line x1="700" y1="380" x2="735" y2="330" stroke="#7c3aed" stroke-width="3" marker-end="url(#okm)"/>
<text x="650" y="410" font-size="17" fill="#7c3aed" text-anchor="start" font-weight="bold">1 · obsesyon gelir</text>
<text x="800" y="200" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">2 · belirgin anksiyete</text>
<line x1="900" y1="300" x2="905" y2="360" stroke="#c2410c" stroke-width="3" marker-end="url(#okk)"/>
<text x="915" y="320" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">3 · kompulsiyon</text>
<text x="915" y="343" font-size="17" fill="#c2410c" text-anchor="start">(yıkama)</text>
<text x="975" y="440" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">4 · kaygı azalır</text>
<rect x="30" y="590" width="1140" height="180" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="60" y="630" font-size="19" fill="#7c3aed" text-anchor="start" font-weight="bold">Obsesyon: belirgin anksiyete yaratan, yineleyici ve zorla gelen düşünce, dürtü ya da düşlem.</text>
<text x="60" y="668" font-size="19" fill="#c2410c" text-anchor="start" font-weight="bold">Kompulsiyon: obsesyona yanıt olarak, anksiyeteyi azaltmak amacıyla yapılan yineleyici</text>
<text x="60" y="694" font-size="19" fill="#c2410c" text-anchor="start" font-weight="bold">törensel davranış ya da zihinsel eylem.</text>
<text x="60" y="734" font-size="17" fill="#475569" text-anchor="start">OKB tanısı için bu tablo kişide belirgin sıkıntı yaratır ve günlük, mesleki, toplumsal işlevselliği bozar.</text>
</svg>
