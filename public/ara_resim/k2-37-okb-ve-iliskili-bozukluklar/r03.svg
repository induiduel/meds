<path d="M570 380 C590 370 610 380 605 400 C600 420 585 420 575 410" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#okk)"/>
<text x="560" y="450" font-size="18" fill="#c2410c" text-anchor="start" font-weight="bold">kontrol</text>
<text x="60" y="520" font-size="17" fill="#475569" text-anchor="start">Kirlenme bir temadır; ona karşı yapılan yıkamadır.</text>
<rect x="690" y="100" width="480" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="710" y="136" font-size="22" font-weight="bold" fill="#0f172a">B · Ritüelin gerçekçi bağı yoktur</text>
<path d="M780 224 C760 192 855 150 915 174 C960 145 1065 160 1058 196 C1100 210 1050 265 975 248 C930 270 840 265 780 224 z" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2.5"/>
<text x="930" y="206" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="bold">"Anneme zarar gelecek"</text>
<text x="930" y="230" font-size="17" fill="#7c3aed" text-anchor="middle">obsesyon</text>
<rect x="760" y="300" width="90" height="140" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
<rect x="785" y="330" width="40" height="80" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="790" y="335" width="30" height="35" rx="4" fill="#f97316"/>
<line x1="825" y1="350" x2="880" y2="330" stroke="#334155" stroke-width="1.6"/>
<circle cx="825" cy="350" r="3" fill="#334155"/>
<text x="885" y="336" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">elektrik düğmesi</text>
<text x="885" y="372" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">aç–kapa, aç–kapa, aç–kapa:</text>
<text x="885" y="396" font-size="17" fill="#c2410c" text-anchor="start" font-weight="bold">üç kez</text>
<text x="720" y="480" font-size="17" fill="#1e293b" text-anchor="start">Düğme ile annenin güvenliği arasında</text>
<text x="720" y="504" font-size="17" fill="#1e293b" text-anchor="start">gerçek bir ilişki yoktur; hasta yine de</text>
<text x="720" y="528" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">bir süre rahatlar.</text>
<path d="M930 260 C930 280 900 300 860 320" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#okm)"/>
<rect x="30" y="570" width="1140" height="200" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="60" y="610" font-size="20" fill="#c2410c" text-anchor="start" font-weight="bold">Sık karşılaşılan altı kompulsiyon:</text>
<circle cx="70" cy="654" r="9" fill="#c2410c"/>
<text x="90" y="660" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">yıkama / temizlik</text>
<circle cx="440" cy="654" r="9" fill="#c2410c"/>
<text x="460" y="660" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">kontrol etme</text>
<circle cx="810" cy="654" r="9" fill="#c2410c"/>
<text x="830" y="660" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">dokunma</text>
<circle cx="70" cy="704" r="9" fill="#c2410c"/>
<text x="90" y="710" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">sayma</text>
<circle cx="440" cy="704" r="9" fill="#c2410c"/>
<text x="460" y="710" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">düzenleme</text>
<circle cx="810" cy="704" r="9" fill="#c2410c"/>
<text x="830" y="710" font-size="19" fill="#0f172a" text-anchor="start" font-weight="bold">biriktirme</text>
<text x="600" y="755" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">Kirlenme bu listede yoktur: o bir obsesyon temasıdır.</text>
