<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Her obsesyon temasının sık eşleştiği bir kompulsiyon vardır</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Tema düşüncedir, kompulsiyon davranış ya da zihinsel eylemdir (slayt 9–10)</text>
<rect x="30" y="100" width="640" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Obsesyon teması  →  kompulsiyon</text>
<text x="70" y="160" font-size="18" fill="#7c3aed" text-anchor="start" font-weight="bold">OBSESYON (zihinde)</text>
<text x="420" y="160" font-size="18" fill="#c2410c" text-anchor="start" font-weight="bold">KOMPULSİYON (yapılan)</text>
<path d="M50 254 C30 222 105 180 149 204 C182 175 259 190 254 226 C290 240 248 295 193 278 C160 300 94 295 50 254 z" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2.5"/>
