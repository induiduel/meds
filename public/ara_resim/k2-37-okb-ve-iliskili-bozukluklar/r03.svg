<text x="160" y="396" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="bold">Patolojik şüphe</text>
<text x="160" y="418" font-size="17" fill="#7c3aed" text-anchor="middle">"Kilitledim mi?"</text>
<path d="M265 400 C320 380 380 380 430 400" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#okk)"/>
