<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">PANDAS: streptokok enfeksiyonundan sonra gelen immün reaksiyon</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">OKB ayırıcı tanısında tıbbi bir tablo · bazal ganglionlarda hacim değişikliği (slayt 12; yapılar slayt 7)</text>
