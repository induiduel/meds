<text x="870" y="136" font-size="22" font-weight="bold" fill="#0f172a">C · Klinikte</text>
<text x="870" y="170" font-size="17" fill="#1e293b" text-anchor="start">Obsesif özelliği</text>
<text x="870" y="194" font-size="17" fill="#1e293b" text-anchor="start">olmayan çocukta ya da</text>
<text x="870" y="218" font-size="17" fill="#1e293b" text-anchor="start">ergende tablo aniden</text>
<text x="870" y="242" font-size="17" fill="#1e293b" text-anchor="start">başlar.</text>
<line x1="1010" y1="260" x2="1010" y2="300" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="870" y="330" font-size="17" fill="#991b1b" text-anchor="start" font-weight="bold">Kanda streptokok</text>
<text x="870" y="354" font-size="17" fill="#991b1b" text-anchor="start" font-weight="bold">araştırılır.</text>
<line x1="1010" y1="370" x2="1010" y2="410" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="870" y="440" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">Tedavi: streptokok</text>
<text x="870" y="464" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">tedavisi; OKB ilacı</text>
<text x="870" y="488" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">değil (hoca).</text>
<rect x="30" y="560" width="1140" height="210" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="600" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">Ayırıcı tanıdaki öteki tıbbi hastalıklar: Tourette sendromu, diğer tik bozuklukları, temporal lob epilepsisi.</text>
<text x="60" y="640" font-size="17" fill="#1e293b" text-anchor="start">Kaudat nükleus ve bazal ganglionlar, OKB'de beyin görüntüleme çalışmalarında da öne çıkan bölgelerdir.</text>
<text x="60" y="680" font-size="17" fill="#1e293b" text-anchor="start">Hoca: PANDAS'ta hacim değişikliği, OKB çalışmalarında öne çıkan bu bölgelerde saptanmıştır.</text>
<text x="60" y="730" font-size="17" fill="#475569" text-anchor="start">Çizim şematiktir: yapıların yerleşimi sadeleştirilmiştir.</text>
</svg>
