<g id="mikrop"><circle r="7" fill="#a3e635" stroke="#3f6212" stroke-width="1.5"/><path d="M-9 0 h-4 M9 0 h4 M0 -9 v-4 M0 9 v4" stroke="#3f6212" stroke-width="1.5"/></g>
<g id="kok"><circle r="9" fill="#fca5a5" stroke="#991b1b" stroke-width="1.5"/></g>
<g id="ab"><path d="M0 14 V0 M0 0 L-9 -12 M0 0 L9 -12" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round"/></g>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">OKB'de ilaç tedavisi: yüksek doz, sabır ve uzun süre</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">SSGİ ilk seçenek, klomipramin ilk kanıtlanan ilaç (slayt 14–15)</text>
<rect x="30" y="100" width="1140" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Haftalar içinde ne olur?</text>
<line x1="90" y1="400" x2="1120" y2="400" stroke="#475569" stroke-width="2.5" marker-end="url(#ok)"/>
<line x1="90" y1="400" x2="90" y2="410" stroke="#475569" stroke-width="2"/>
<text x="90.0" y="432" font-size="17" fill="#475569" text-anchor="middle">0</text>
<line x1="204" y1="400" x2="204" y2="410" stroke="#475569" stroke-width="2"/>
<text x="203.75" y="432" font-size="17" fill="#475569" text-anchor="middle">2</text>
<line x1="318" y1="400" x2="318" y2="410" stroke="#475569" stroke-width="2"/>
<text x="317.5" y="432" font-size="17" fill="#475569" text-anchor="middle">4</text>
<line x1="431" y1="400" x2="431" y2="410" stroke="#475569" stroke-width="2"/>
<text x="431.25" y="432" font-size="17" fill="#475569" text-anchor="middle">6</text>
<line x1="545" y1="400" x2="545" y2="410" stroke="#475569" stroke-width="2"/>
<text x="545.0" y="432" font-size="17" fill="#475569" text-anchor="middle">8</text>
<line x1="659" y1="400" x2="659" y2="410" stroke="#475569" stroke-width="2"/>
<text x="658.75" y="432" font-size="17" fill="#475569" text-anchor="middle">10</text>
<line x1="772" y1="400" x2="772" y2="410" stroke="#475569" stroke-width="2"/>
<text x="772.5" y="432" font-size="17" fill="#475569" text-anchor="middle">12</text>
<line x1="886" y1="400" x2="886" y2="410" stroke="#475569" stroke-width="2"/>
<text x="886.25" y="432" font-size="17" fill="#475569" text-anchor="middle">14</text>
<line x1="1000" y1="400" x2="1000" y2="410" stroke="#475569" stroke-width="2"/>
<text x="1000.0" y="432" font-size="17" fill="#475569" text-anchor="middle">16</text>
<text x="1110" y="440" font-size="17" fill="#475569" text-anchor="end">hafta</text>
<path d="M90 385 C318 384 374 370 488 320 C602 260 772 210 1000 200 L1100 198" fill="none" stroke="#0e7490" stroke-width="5"/>
<text x="1010.0" y="190" font-size="17" fill="#0e7490" text-anchor="start" font-weight="bold">en yüksek etki</text>
<rect x="90" y="150" width="171" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="100.0" y="172" font-size="17" fill="#92400e" text-anchor="start" font-weight="bold">İlk haftalar:</text>
<text x="100.0" y="194" font-size="17" fill="#92400e" text-anchor="start">geçici yan etkiler</text>
<rect x="431" y="335" width="114" height="20" rx="5" fill="#a5f3fc" stroke="#0e7490" stroke-width="1.5"/>
<line x1="488.125" y1="355" x2="317.5" y2="300" stroke="#334155" stroke-width="1.6"/>
<circle cx="488.125" cy="355" r="3" fill="#334155"/>
<text x="107.0625" y="292" font-size="17" fill="#0e7490" text-anchor="start" font-weight="bold">6–8. hafta: antiobsesyonel etki başlar</text>
<rect x="545" y="230" width="455" height="20" rx="5" fill="#67e8f9" stroke="#0e7490" stroke-width="1.5" opacity="0.8"/>
<text x="772.5" y="285" font-size="17" fill="#0e7490" text-anchor="middle" font-weight="bold">8–16. hafta: en yüksek etkiye ulaşılır</text>
<text x="110" y="460" font-size="17" fill="#475569" text-anchor="start">Yan etkiler: huzursuzluk, uykusuzluk, sedasyon, mide-bağırsak yakınmaları, cinsel işlev bozukluğu; geçicidir.</text>
<rect x="30" y="500" width="360" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="536" font-size="22" font-weight="bold" fill="#0f172a">B · Doz</text>
<rect x="80" y="640" width="70" height="80" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<rect x="180" y="580" width="70" height="140" rx="6" fill="#0e7490" stroke="#155e75" stroke-width="2"/>
<text x="115" y="750" font-size="17" fill="#475569" text-anchor="middle">olağan</text>
<text x="215" y="750" font-size="17" fill="#0e7490" text-anchor="middle" font-weight="bold">OKB'de</text>
<path d="M115 630 C125 595 150 585 172 590" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#ok)"/>
<text x="265" y="640" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">Obsesyon</text>
<text x="265" y="662" font-size="17" fill="#0f172a" text-anchor="start" font-weight="bold">geç kırılır;</text>
<text x="265" y="690" font-size="17" fill="#1e293b" text-anchor="start">doz olağan</text>
<text x="265" y="712" font-size="17" fill="#1e293b" text-anchor="start">dozdan</text>
<text x="265" y="734" font-size="17" fill="#1e293b" text-anchor="start">yüksek</text>
<rect x="410" y="500" width="380" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="430" y="536" font-size="22" font-weight="bold" fill="#0f172a">C · İki ilaç, iki ayrı unvan</text>
<text x="430" y="570" font-size="17" fill="#9333ea" text-anchor="start" font-weight="bold">Klomipramin (trisiklik):</text>
<text x="430" y="594" font-size="17" fill="#1e293b" text-anchor="start">etkinliği kanıtlanmış ilk ilaç;</text>
<text x="430" y="618" font-size="17" fill="#1e293b" text-anchor="start">antikolinerjik yan etki: ağız</text>
<text x="430" y="642" font-size="17" fill="#1e293b" text-anchor="start">kuruluğu, kabızlık, taşikardi</text>
<text x="430" y="685" font-size="17" fill="#0e7490" text-anchor="start" font-weight="bold">SSGİ: bugün ilk seçenek</text>
<text x="430" y="709" font-size="17" fill="#1e293b" text-anchor="start">fluoksetin, fluvoksamin, sertralin,</text>
<text x="430" y="733" font-size="17" fill="#1e293b" text-anchor="start">paroksetin, sitalopram, essitalopram</text>
<rect x="810" y="500" width="360" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="830" y="536" font-size="22" font-weight="bold" fill="#0f172a">D · Sürdürme</text>
<path d="M850 705 C900 680 960 680 1000 705 C1040 730 1100 730 1140 705" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<text x="830" y="570" font-size="18" fill="#dc2626" text-anchor="start" font-weight="bold">Yüksek nüks riski:</text>
<text x="830" y="600" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">ilaç 1–2 yıl sürdürülür.</text>
<text x="830" y="640" font-size="17" fill="#1e293b" text-anchor="start">Nüks: düzelmiş hastalığın</text>
<text x="830" y="664" font-size="17" fill="#1e293b" text-anchor="start">yeniden ortaya çıkması</text>
<text x="830" y="750" font-size="17" fill="#475569" text-anchor="start">Erken düzelme yoksa bırakılmaz.</text>
</svg>
