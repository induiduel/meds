<text x="510" y="676" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">olumsuz</text>
<text x="510" y="698" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold">duygu</text>
<text x="600" y="650" font-size="18" fill="#0f172a" text-anchor="start" font-weight="bold">Koşullanmayla kurulmuş bağ:</text>
<text x="600" y="680" font-size="17" fill="#1e293b" text-anchor="start">düşünce geldiğinde olumsuz duygu da gelir.</text>
<text x="600" y="715" font-size="18" fill="#15803d" text-anchor="start" font-weight="bold">Maruz bırakma + tepki engelleme bu bağı söndürür.</text>
<text x="600" y="748" font-size="17" fill="#475569" text-anchor="start">İlaç alıp kapıya hâlâ dokunamayan hasta iyileşmiş sayılmaz.</text>
