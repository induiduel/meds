<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Maruz bırakma ve tepki engelleme: kaçınmadan yüzleşmek</text>
<text x="600" y="76" text-anchor="middle" font-size="19" fill="#475569">Bilişsel davranışçı terapi · hocanın kapı kolu basamakları (slayt 16)</text>
