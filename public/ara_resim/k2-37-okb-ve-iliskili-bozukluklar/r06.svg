<text x="800" y="395" font-size="18" fill="#c2410c" text-anchor="start" font-weight="bold">Kompulsiyon yapılmaz:</text>
<text x="800" y="420" font-size="17" fill="#1e293b" text-anchor="start">anksiyeteyi azaltmak için</text>
<text x="800" y="444" font-size="17" fill="#1e293b" text-anchor="start">yıkamaya izin verilmez.</text>
<text x="800" y="490" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">Hasta korkulan düşünceyle</text>
<text x="800" y="514" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">kompulsiyonsuz karşılaşır.</text>
<rect x="30" y="590" width="1140" height="180" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<path d="M75 692 C55 664 118 625 152 648 C177 620 236 635 232 668 C265 680 228 730 186 714 C160 735 109 730 75 692 z" fill="url(#bulut)" stroke="#7c3aed" stroke-width="2.5"/>
<text x="160" y="685" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="bold">obsesif düşünce</text>
<path d="M250 680 C320 650 380 650 455 675" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M335 650 L365 710 M365 650 L335 710" stroke="#15803d" stroke-width="5"/>
