<text x="50" y="136" font-size="22" font-weight="bold" fill="#0f172a">A · Aşamalı maruz bırakma (kapı kolu)</text>
<text x="55" y="165" font-size="17" fill="#475569" text-anchor="start">Hasta kaçındığı durumla küçük adımlarla yüzleşir; kaçındıkça hastalık bitmez.</text>
