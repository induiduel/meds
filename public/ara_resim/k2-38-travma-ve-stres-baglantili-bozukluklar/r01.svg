<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Century Gothic, Arial, sans-serif">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#eef3f7"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" fill="url(#zemin)"/>
<text x="40" y="52" font-size="30" fill="#1c2833" font-weight="bold" text-anchor="start">Travmadan sonra süre: tepki mi, akut stres bozukluğu mu, TSSB mi?</text>
<line x1="90" y1="300" x2="1130" y2="300" stroke="#1c2833" stroke-width="4" marker-end="url(#ok)"/>
<line x1="90" y1="286" x2="90" y2="314" stroke="#1c2833" stroke-width="3"/>
<text x="90" y="342" font-size="18" fill="#1c2833" font-weight="bold" text-anchor="middle">Travma (gün 0)</text>
<line x1="250" y1="286" x2="250" y2="314" stroke="#1c2833" stroke-width="3"/>
<text x="250" y="342" font-size="18" fill="#1c2833" font-weight="bold" text-anchor="middle">3. gün</text>
<line x1="560" y1="286" x2="560" y2="314" stroke="#1c2833" stroke-width="3"/>
<text x="560" y="342" font-size="18" fill="#1c2833" font-weight="bold" text-anchor="middle">4. hafta = 1 ay</text>
<line x1="860" y1="286" x2="860" y2="314" stroke="#1c2833" stroke-width="3"/>
<text x="860" y="342" font-size="18" fill="#1c2833" font-weight="bold" text-anchor="middle">3. ay</text>
<path d="M95,270 Q170,210 245,270" fill="#d5f5e3" stroke="#27ae60" stroke-width="3"/>
<text x="170" y="110" font-size="17" fill="#27ae60" font-weight="normal" text-anchor="middle">İlk günlerdeki korku,</text>
<text x="170" y="132" font-size="17" fill="#27ae60" font-weight="normal" text-anchor="middle">uykusuzluk: normal tepki</text>
<path d="M255,270 Q407,150 555,270" fill="#fdebd0" stroke="#e67e22" stroke-width="3"/>
<text x="405" y="95" font-size="18" fill="#e67e22" font-weight="normal" text-anchor="middle">Akut stres bozukluğu</text>
<text x="405" y="118" font-size="18" fill="#e67e22" font-weight="normal" text-anchor="middle">ilk 4 haftada başlar,</text>
<text x="405" y="141" font-size="18" fill="#e67e22" font-weight="normal" text-anchor="middle">3 gün – 4 hafta sürer</text>
<path d="M565,270 Q710,150 855,270" fill="#e8daef" stroke="#8e44ad" stroke-width="3"/>
<text x="710" y="95" font-size="18" fill="#8e44ad" font-weight="normal" text-anchor="middle">TSSB</text>
<text x="710" y="118" font-size="18" fill="#8e44ad" font-weight="normal" text-anchor="middle">belirtiler 1 aydan</text>
<text x="710" y="141" font-size="18" fill="#8e44ad" font-weight="normal" text-anchor="middle">uzun sürer</text>
<path d="M865,270 Q1000,150 1120,270" fill="#d7bde2" stroke="#8e44ad" stroke-width="3"/>
<text x="995" y="95" font-size="18" fill="#8e44ad" font-weight="normal" text-anchor="middle">Kronik TSSB</text>
<text x="995" y="118" font-size="18" fill="#8e44ad" font-weight="normal" text-anchor="middle">3 aydan uzun</text>
<path d="M74,400 H566 Q580,400 580,414 V646 Q580,660 566,660 H74 Q60,660 60,646 V414 Q60,400 74,400 Z" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="76" y="432" font-size="21" fill="#c0392b" font-weight="bold" text-anchor="start">Dört ölçütlü tanım</text>
<circle cx="80" cy="458.35" r="5" fill="#566573"/>
<text x="94" y="465" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Olay: ölüm tehdidi, ağır yaralanma</text>
<circle cx="80" cy="488.35" r="5" fill="#566573"/>
<text x="94" y="495" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Kendisi yaşar ya da tanık olur</text>
<circle cx="80" cy="518.35" r="5" fill="#566573"/>
<text x="94" y="525" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Tepki: korku, çaresizlik, dehşet</text>
<circle cx="80" cy="548.35" r="5" fill="#566573"/>
<text x="94" y="555" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Belirtiler 1 aydan uzun sürer</text>
<circle cx="80" cy="578.35" r="5" fill="#566573"/>
<text x="94" y="585" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">İşlevsellik bozulur</text>
<path d="M634,400 H1126 Q1140,400 1140,414 V646 Q1140,660 1126,660 H634 Q620,660 620,646 V414 Q620,400 634,400 Z" fill="#ffffff" stroke="#8e44ad" stroke-width="2.5"/>
<text x="636" y="432" font-size="21" fill="#8e44ad" font-weight="bold" text-anchor="start">Ayıran tek şey süredir</text>
<circle cx="640" cy="458.35" r="5" fill="#566573"/>
<text x="654" y="465" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Deprem ertesi korku normaldir</text>
<circle cx="640" cy="488.35" r="5" fill="#566573"/>
<text x="654" y="495" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Toparlanma için en az 3 gün beklenir</text>
<circle cx="640" cy="518.35" r="5" fill="#566573"/>
<text x="654" y="525" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">1 aydan kısa: akut stres bozukluğu</text>
<circle cx="640" cy="548.35" r="5" fill="#566573"/>
<text x="654" y="555" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">1 aydan uzun: TSSB, 3 aydan uzun: kronik</text>
<circle cx="640" cy="578.35" r="5" fill="#566573"/>
<text x="654" y="585" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Sevgiliden ayrılık travma sayılmaz</text>
<text x="40" y="704" font-size="18" fill="#566573" font-weight="normal" text-anchor="start">Kaynak: slayt 3 ve hocanın deprem ve ayrılık örnekleri</text>
</svg>