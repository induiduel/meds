<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Century Gothic, Arial, sans-serif">
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#eef3f7"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" fill="url(#zemin)"/>
<text x="40" y="52" font-size="30" fill="#1c2833" font-weight="bold" text-anchor="start">Uyum bozukluğunun zaman kuralı: 3 ay içinde başlar, 6 ay içinde söner</text>
<line x1="70" y1="330" x2="1140" y2="330" stroke="#1c2833" stroke-width="4" marker-end="url(#ok)"/>
<line x1="110" y1="316" x2="110" y2="344" stroke="#1c2833" stroke-width="3"/>
<text x="110" y="374" font-size="19" fill="#1c2833" font-weight="bold" text-anchor="middle">Stres etkeni</text>
<line x1="430" y1="316" x2="430" y2="344" stroke="#1c2833" stroke-width="3"/>
<text x="430" y="374" font-size="19" fill="#1c2833" font-weight="bold" text-anchor="middle">≤ 3 ay</text>
<line x1="700" y1="316" x2="700" y2="344" stroke="#1c2833" stroke-width="3"/>
<text x="700" y="374" font-size="19" fill="#1c2833" font-weight="bold" text-anchor="middle">Etken kalkar</text>
<line x1="1020" y1="316" x2="1020" y2="344" stroke="#1c2833" stroke-width="3"/>
<text x="1020" y="374" font-size="19" fill="#1c2833" font-weight="bold" text-anchor="middle">≤ 6 ay</text>
<path d="M110,326 C250,326 330,160 430,160 L700,160 C820,160 900,326 1020,326 Z" fill="#d6eaf8" stroke="#2471a3" stroke-width="3"/>
<text x="565" y="200" font-size="18" fill="#2471a3" font-weight="bold" text-anchor="middle">Belirtiler: sıkıntı, depresif,</text>
<text x="565" y="224" font-size="18" fill="#2471a3" font-weight="bold" text-anchor="middle">anksiyeteli ya da davranım belirtileri</text>
<path d="M110,140 Q110,220 112,300" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ok)"/>
<text x="120" y="120" font-size="17" fill="#c0392b" font-weight="normal" text-anchor="start">Evlenme, boşanma, atanma, maddi kayıp</text>
<path d="M54,430 H566 Q580,430 580,444 V656 Q580,670 566,670 H54 Q40,670 40,656 V444 Q40,430 54,430 Z" fill="#ffffff" stroke="#2471a3" stroke-width="2.5"/>
<text x="56" y="462" font-size="21" fill="#2471a3" font-weight="bold" text-anchor="start">Kural</text>
<circle cx="60" cy="483.35" r="5" fill="#566573"/>
<text x="74" y="490" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Sorun çıkar → 3 ay içinde belirti başlar</text>
<circle cx="60" cy="517.35" r="5" fill="#566573"/>
<text x="74" y="524" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Sorun kalkar → 6 ay içinde belirti kalkar</text>
<circle cx="60" cy="551.35" r="5" fill="#566573"/>
<text x="74" y="558" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">1 yıl sonra başlayan sıkıntı başka nedenli</text>
<circle cx="60" cy="585.35" r="5" fill="#566573"/>
<text x="74" y="592" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Belirtiler olağan yası göstermez</text>
<circle cx="60" cy="619.35" r="5" fill="#566573"/>
<text x="74" y="626" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Ergende davranım, yetişkinde kaygı önde</text>
<path d="M634,430 H1146 Q1160,430 1160,444 V656 Q1160,670 1146,670 H634 Q620,670 620,656 V444 Q620,430 634,430 Z" fill="#ffffff" stroke="#8e44ad" stroke-width="2.5"/>
<text x="636" y="462" font-size="21" fill="#8e44ad" font-weight="bold" text-anchor="start">TSSB ile fark</text>
<circle cx="640" cy="483.35" r="5" fill="#566573"/>
<text x="654" y="490" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">TSSB travma ister</text>
<circle cx="640" cy="517.35" r="5" fill="#566573"/>
<text x="654" y="524" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">TSSB kronik seyredebilir</text>
<circle cx="640" cy="551.35" r="5" fill="#566573"/>
<text x="654" y="558" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Yıldönümünde yeniden tetiklenebilir</text>
<circle cx="640" cy="585.35" r="5" fill="#566573"/>
<text x="654" y="592" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Uyum bozukluğunda travma yoktur</text>
<circle cx="640" cy="619.35" r="5" fill="#566573"/>
<text x="654" y="626" font-size="19" fill="#1c2833" font-weight="normal" text-anchor="start">Uyum bozukluğu etkene bağlı, sınırlı</text>
<text x="40" y="704" font-size="18" fill="#566573" font-weight="normal" text-anchor="start">Kaynak: slayt 21–22; hocanın boşanma ve tazminat örnekleri</text>
</svg>