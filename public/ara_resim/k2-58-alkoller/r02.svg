<text x="230" y="296" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="bold">ADH</text>
<text x="230" y="314" font-size="11" fill="#6d28d9" text-anchor="middle">alkol dehidrogenaz</text>
<path d="M175 260 C200 240 260 240 285 260" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oke)"/>
<text x="170" y="250" font-size="12" fill="#0f766e" text-anchor="end" font-weight="bold">NAD+</text>
<text x="292" y="250" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold">NADH</text>
<line x1="300" y1="300" x2="395" y2="300" stroke="#ea580c" stroke-width="3" marker-end="url(#okt)"/>
<path d="M150 430 C190 400 230 460 270 430 C310 400 350 460 390 430" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M150 465 C190 435 230 495 270 465 C310 435 350 495 390 465" stroke="#6d28d9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="395" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="bold">MİKROZOM (endoplazmik retikulum)</text>
<ellipse cx="270" cy="520" rx="85" ry="34" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="270" y="516" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">MEOS · CYP2E1</text>
<text x="270" y="533" font-size="11" fill="#6d28d9" text-anchor="middle">kofaktör NADPH</text>
<path d="M70 300 C60 420 120 520 185 520" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okb)" stroke-dasharray="7 5"/>
<path d="M355 520 C400 520 420 400 405 320" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#okt)"/>
<text x="415" y="470" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="bold">kronik alkol: MEOS indüklenir</text>
<text x="415" y="487" font-size="12" fill="#6d28d9" text-anchor="start">→ diğer ilaçların klirensi ↑</text>
<text x="415" y="504" font-size="12" fill="#ea580c" text-anchor="start">→ serbest radikal, H2O2 ↑</text>
<circle cx="430" cy="300" r="20" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
<text x="430" y="268" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">asetaldehid</text>
<line x1="450" y1="300" x2="530" y2="300" stroke="#ea580c" stroke-width="3" marker-end="url(#okt)"/>
