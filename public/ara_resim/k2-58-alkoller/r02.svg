<text x="610" y="370" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="bold">ALDH</text>
<path d="M560 400 C580 420 640 420 660 400" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oke)"/>
<text x="555" y="395" font-size="12" fill="#0f766e" text-anchor="end" font-weight="bold">NAD+</text>
<text x="666" y="395" font-size="12" fill="#0f766e" text-anchor="start" font-weight="bold">NADH</text>
<line x1="688" y1="300" x2="770" y2="300" stroke="#15803d" stroke-width="3" marker-end="url(#oky)"/>
<circle cx="792" cy="300" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="792" y="340" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">asetat</text>
<text x="786" y="357" font-size="11" fill="#15803d" text-anchor="middle">→ CO2 + su</text>
<text x="786" y="371" font-size="11" fill="#15803d" text-anchor="middle">ya da asetil-CoA</text>
<rect x="150" y="585" width="150" height="36" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="225.0" y="607.6666666666666" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">FOMEPİZOL</text>
<path d="M225 585 C225 560 230 350 230 336" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="230" cy="336" r="11" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<line x1="224" y1="336" x2="236" y2="336" stroke="#b91c1c" stroke-width="3"/>
<rect x="660" y="440" width="140" height="36" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="730.0" y="462.6666666666667" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">DİSÜLFİRAM</text>
<path d="M730 440 C730 420 630 405 612 391" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="610" cy="391" r="11" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<line x1="604" y1="391" x2="616" y2="391" stroke="#b91c1c" stroke-width="3"/>
<text x="325" y="605" font-size="12" fill="#b91c1c" text-anchor="start">ADH'yi bloke eder</text>
<text x="660" y="500" font-size="12" fill="#b91c1c" text-anchor="start">ALDH'yi bloke eder →</text>
<text x="660" y="516" font-size="12" fill="#b91c1c" text-anchor="start">asetaldehid birikir</text>
<rect x="840" y="95" width="330" height="600" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="860" y="127" font-size="20" fill="#0f766e" text-anchor="start" font-weight="bold">NADH fazlasının sonuçları</text>
<text x="860" y="165" font-size="14" fill="#1e293b" text-anchor="start">Her iki NAD+ basamağı NADH üretir;</text>
<text x="860" y="185" font-size="14" fill="#1e293b" text-anchor="start">karaciğer indirgeyici yükle dolar:</text>
<rect x="860" y="215" width="290" height="44" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="1005.0" y="241.66666666666666" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">NAD+/NADH oranı DÜŞER</text>
<line x1="1005" y1="259" x2="1005" y2="285" stroke="#0f766e" stroke-width="2.5" marker-end="url(#oke)"/>
<rect x="860" y="290" width="140" height="48" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="930.0" y="310.3333333333333" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">laktik</text>
<text x="930.0" y="326.3333333333333" font-size="13" fill="#0f766e" text-anchor="middle">asidoz</text>
<rect x="1010" y="290" width="140" height="48" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="1080.0" y="310.5" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">hipoglisemi</text>
<text x="1080.0" y="325.5" font-size="12" fill="#0f766e" text-anchor="middle">(glukoneogenez ↓)</text>
<text x="860" y="380" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">Adresler:</text>
<text x="860" y="401" font-size="14" fill="#1e293b" text-anchor="start">• ADH → sitozol</text>
<text x="860" y="422" font-size="14" fill="#1e293b" text-anchor="start">• MEOS → mikrozom</text>
<text x="860" y="443" font-size="14" fill="#1e293b" text-anchor="start">• ALDH → mitokondri</text>
<text x="860" y="480" font-size="13" fill="#2563eb" text-anchor="start">Cinsiyet farkı: kadında mide ADH'si az</text>
<text x="860" y="499" font-size="13" fill="#2563eb" text-anchor="start">+ vücut suyu az → aynı içkide kan</text>
<text x="860" y="518" font-size="13" fill="#2563eb" text-anchor="start">alkolü daha yüksek.</text>
<text x="860" y="560" font-size="13" fill="#475569" text-anchor="start">Genetik: ADH çeşitliliği yıkım hızını</text>
<text x="860" y="579" font-size="13" fill="#475569" text-anchor="start">ve kötüye kullanım eğilimini etkiler.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 5–9 · mavi etanol · turuncu asetaldehid · mor enzim · teal NAD+/NADH · kırmızı ilaç blokajı · yeşil son ürün</text>
