<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Hepatosit içinde etanolün yıkımı: üç enzim, üç adres</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Sitozolde ADH, mikrozomda MEOS, mitokondride ALDH; NADH fazlası ve iki ilacın blokaj noktaları · slayt 5–9</text>
<path d="M110 130 C260 100 560 100 700 130 C760 180 760 560 700 610 C560 650 260 650 110 610 C60 560 60 180 110 130 Z" stroke="#d97706" stroke-width="3" fill="#fffbeb" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="160" font-size="15" fill="#92400e" text-anchor="start" font-weight="bold">HEPATOSİT (karaciğer hücresi)</text>
<circle cx="40" cy="300" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="40" y="345" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">etanol</text>
<text x="40" y="362" font-size="12" fill="#2563eb" text-anchor="middle">(kandan)</text>
<line x1="58" y1="300" x2="140" y2="300" stroke="#2563eb" stroke-width="3" marker-end="url(#okb)"/>
<text x="230" y="215" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">SİTOZOL</text>
