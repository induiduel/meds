<text x="80" y="460" font-size="13" fill="#1e293b" text-anchor="start">Kanıt: GABA-mimetikler alkolün etkisini şiddetlendirir, GABA-A antagonistleri azaltır.</text>
<text x="80" y="479" font-size="13" fill="#1e293b" text-anchor="start">Etanolün tek reseptörü yoktur; iyon kanalları, Na+/K+-ATPaz, adenilil siklaz, fosfolipaz C de etkilenir.</text>
<text x="80" y="515" font-size="14" fill="#0f172a" text-anchor="start" font-weight="bold">Eşleme: sedasyon → GABA-A, unutma → NMDA.</text>
