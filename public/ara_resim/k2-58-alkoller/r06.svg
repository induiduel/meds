<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Alkol–ilaç etkileşimi: akut alkol yıkımı yavaşlatır, kronik alkol hızlandırır</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Farmakokinetik iki zıt yön, asetaminofen örneği ve farmakodinamik aditif depresyon · slayt 31–32</text>
