<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Naltrekson ödül yolunu, akamprosat NMDA–GABA-A dengesini, disülfiram ALDH'yi hedefler; onaysızlar ayrı listede · slayt 39–44</text>
