<text x="1027.5" y="486.5" font-size="12" fill="#64748b" text-anchor="middle">gabapentin · valproat</text>
<text x="1027.5" y="501.5" font-size="12" fill="#64748b" text-anchor="middle">baklofen · SSRI · ondansetron</text>
<rect x="640" y="548" width="245" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="762.5" y="572.0" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">karaciğer dikkat:</text>
<text x="762.5" y="587.0" font-size="12" fill="#b91c1c" text-anchor="middle">naltrekson + disülfiram</text>
<text x="762.5" y="602.0" font-size="12" fill="#b91c1c" text-anchor="middle">birlikte verilmez</text>
<rect x="905" y="548" width="245" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1027.5" y="572.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">böbrek dikkat:</text>
<text x="1027.5" y="587.0" font-size="12" fill="#b45309" text-anchor="middle">akamprosat ciddi böbrek</text>
<text x="1027.5" y="602.0" font-size="12" fill="#b45309" text-anchor="middle">yetmezliğinde kullanılmaz</text>
<text x="895" y="650" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">Temel tedavi ilaç değil, yoğun psikososyal tedavidir; ilaçlar yardımcıdır.</text>
<text x="895" y="675" font-size="12" fill="#475569" text-anchor="middle">Disülfiram fenitoin, oral antikoagülan ve izoniazid yıkımını da inhibe eder.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 39–44 · kırmızı ilaç/blokaj · amber ödül-NMDA · teal GABA-A · mor enzim · turuncu asetaldehid · yeşil onaylı</text>
