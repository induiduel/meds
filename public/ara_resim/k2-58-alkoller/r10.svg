<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="DejaVu Sans, Arial, sans-serif">
<defs><linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f1efe9"/></linearGradient>
<linearGradient id="zar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="okb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="okt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
<marker id="okk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="oke" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
<marker id="oka" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
<marker id="okg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="780" fill="url(#zemin)"/>
<text x="600.0" y="42" font-size="27" fill="#0f172a" text-anchor="middle" font-weight="bold">Etilen glikol: üç evre ve metanolden ayıran bulgu</text>
<text x="600.0" y="70" font-size="17" fill="#475569" text-anchor="middle">Tatlı antifriz → aldehid ve oksalat → asidoz ve böbrek yetmezliği; tanı anahtarı idrarda oksalat kristali · slayt 51–52</text>
<rect x="30" y="95" width="760" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">A · Zaman içinde üç evre</text>
<line x1="70" y1="380" x2="760" y2="380" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ok)"/>
<line x1="70" y1="380" x2="70" y2="388" stroke="#0f172a" stroke-width="2"/>
<text x="70" y="406" font-size="12" fill="#0f172a" text-anchor="middle">alım</text>
<line x1="240" y1="380" x2="240" y2="388" stroke="#0f172a" stroke-width="2"/>
<text x="240" y="406" font-size="12" fill="#0f172a" text-anchor="middle">birkaç saat</text>
<line x1="450" y1="380" x2="450" y2="388" stroke="#0f172a" stroke-width="2"/>
<text x="450" y="406" font-size="12" fill="#0f172a" text-anchor="middle">4–12 saat</text>
<line x1="670" y1="380" x2="670" y2="388" stroke="#0f172a" stroke-width="2"/>
<text x="670" y="406" font-size="12" fill="#0f172a" text-anchor="middle">daha sonra</text>
<path d="M110 230 C90 200 110 160 150 160 C170 135 230 135 250 160 C290 160 300 200 280 230 C290 260 250 280 210 270 C170 285 120 265 110 230 Z" stroke="#2563eb" stroke-width="2.5" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="95" y="290" width="230" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="316.3333333333333" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">1 · geçici eksitasyon →</text>
<text x="210.0" y="332.3333333333333" font-size="13" fill="#2563eb" text-anchor="middle">MSS depresyonu</text>
<text x="195" y="205" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">ETİLEN GLİKOL</text>
<text x="195" y="223" font-size="11" fill="#2563eb" text-anchor="middle" font-style="italic">kendisi görece zararsız</text>
<path d="M330 205 C330 180 360 170 390 180 L450 180 C480 170 510 180 510 205 L510 250 C510 275 480 285 450 275 L390 275 C360 285 330 275 330 250 Z" stroke="#ea580c" stroke-width="2.5" fill="#ffedd5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="215" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">aldehid</text>
<text x="420" y="233" font-size="12" fill="#ea580c" text-anchor="middle">+ laktat</text>
<text x="420" y="251" font-size="12" fill="#ea580c" text-anchor="middle">+ asit metabolitler</text>
<rect x="320" y="290" width="230" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="435.0" y="316.3333333333333" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">2 · şiddetli metabolik asidoz</text>
<text x="435.0" y="332.3333333333333" font-size="13" fill="#ea580c" text-anchor="middle">(anyon açıklı)</text>
<path d="M620 170 C600 165 585 195 590 225 C595 255 615 275 640 272 C665 270 680 245 672 215 C664 185 640 175 620 170 Z" stroke="#b91c1c" stroke-width="2.5" fill="#fee2e2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="608,205 615,198 622,205 615,212" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<polygon points="633,225 640,218 647,225 640,232" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<polygon points="618,245 625,238 632,245 625,252" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<polygon points="643,205 650,198 657,205 650,212" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="630" y="160" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">böbrek tübülleri</text>
<rect x="545" y="290" width="230" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="660.0" y="316.3333333333333" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">3 · oksalat birikir →</text>
<text x="660.0" y="332.3333333333333" font-size="13" fill="#b91c1c" text-anchor="middle">böbrek yetmezliği</text>
<line x1="255" y1="230" x2="325" y2="230" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ok)"/>
<line x1="515" y1="230" x2="585" y2="230" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ok)"/>
<rect x="820" y="95" width="350" height="610" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="840" y="127" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">B · Metanol ↔ etilen glikol</text>
<rect x="840" y="145" width="310" height="50" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="995.0" y="174.0" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">ORTAK: anyon açıklı metabolik asidoz</text>
<rect x="840" y="215" width="150" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="915.0" y="251.5" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">METANOL</text>
<text x="915.0" y="266.5" font-size="12" fill="#2563eb" text-anchor="middle">görme bozukluğu</text>
<text x="915.0" y="281.5" font-size="12" fill="#2563eb" text-anchor="middle">(kar fırtınası)</text>
<text x="915.0" y="296.5" font-size="12" fill="#2563eb" text-anchor="middle">→ göz</text>
<rect x="1000" y="215" width="150" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1075.0" y="251.5" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">ETİLEN GLİKOL</text>
<text x="1075.0" y="266.5" font-size="12" fill="#b91c1c" text-anchor="middle">görme belirtisi YOK</text>
<text x="1075.0" y="281.5" font-size="12" fill="#b91c1c" text-anchor="middle">idrarda oksalat</text>
<text x="1075.0" y="296.5" font-size="12" fill="#b91c1c" text-anchor="middle">kristali → böbrek</text>
<polygon points="1068,360 1075,353 1082,360 1075,367" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1095" y="365" font-size="11" fill="#b91c1c" text-anchor="start">oksalat kristali</text>
<rect x="840" y="395" width="310" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="995.0" y="421.5" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">ORTAK TEDAVİ</text>
<text x="995.0" y="436.5" font-size="12" fill="#15803d" text-anchor="middle">fomepizol iv (15 → 10 → 15 mg/kg, 12 saatte bir)</text>
<text x="995.0" y="451.5" font-size="12" fill="#15803d" text-anchor="middle">alternatif: etanol (ADH yarışması)</text>
<text x="995.0" y="466.5" font-size="12" fill="#15803d" text-anchor="middle">serum düzeyi &lt; 20–30 mg/dL olana dek</text>
<text x="840" y="520" font-size="12" fill="#1e293b" text-anchor="start">Kaynak: antifriz, endüstriyel solvent.</text>
<text x="840" y="538" font-size="12" fill="#1e293b" text-anchor="start">Tatlı tadı → çocuk ve hayvan alımı;</text>
<text x="840" y="556" font-size="12" fill="#1e293b" text-anchor="start">nadiren etanol yerine ya da intihar amaçlı.</text>
<text x="840" y="574" font-size="12" fill="#1e293b" text-anchor="start">Kendisi böbrekle atılır; toksik ürünler</text>
<text x="840" y="592" font-size="12" fill="#1e293b" text-anchor="start">aldehid ve oksalattır.</text>
<text x="995" y="660" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">İlke aynı: zehir metabolit, ADH'yi kapat.</text>
<text x="60" y="460" font-size="13" fill="#1e293b" text-anchor="start">Her iki alkolde de toksisite ana maddeden değil metabolitlerinden doğar; ADH ilk basamağı katalizler.</text>
<text x="60" y="482" font-size="13" fill="#1e293b" text-anchor="start">Fomepizol ya da etanol ADH'yi kapatınca aldehid ve oksalat oluşumu azalır.</text>
<text x="60" y="504" font-size="13" fill="#1e293b" text-anchor="start">Metanol gözü, etilen glikol böbreği etkiler — ayrım idrar oksalat kristali ve görme belirtisidir.</text>
<text x="600.0" y="764" font-size="14" fill="#64748b" text-anchor="middle">Kaynak: slayt 51–52 · mavi MSS evresi/metanol · turuncu asidoz · kırmızı oksalat ve böbrek · yeşil tedavi</text>
</svg>