<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<radialGradient id="ggoz" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe4ee"/></radialGradient>
<radialGradient id="giris" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4ed8"/></radialGradient>
<linearGradient id="gbeyin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
<radialGradient id="gnuk" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></radialGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="okm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
<marker id="oky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Işık refleksi: retinadan iris sfinkterine uzanan yol</text>
<text x="600" y="74" font-size="18" text-anchor="middle" fill="#475569">Işık optik sinirle gelir ve pretektal çekirdeğe ulaşır; ileti Edinger-Westphal çekirdeğine geçer</text>
<text x="600" y="98" font-size="18" text-anchor="middle" fill="#475569">ve üçüncü sinirin parasempatik lifleri iris sfinkterini daraltır (slayt 13)</text>
<rect x="24" y="116" width="736" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Afferent ve efferent kol, yandan görünüm</text>
<ellipse cx="130" cy="318" rx="66" ry="66" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
<path d="M 130 252 A 66 66 0 0 1 130 384" stroke="#1d4ed8" stroke-width="7" fill="none"/>
<path d="M 176 272 Q 158 318 176 364" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" fill="none"/>
<path d="M 192 290 Q 174 318 192 346" stroke="#64748b" stroke-width="3" fill="none"/>
<circle cx="106" cy="318" r="22" fill="url(#giris)" stroke="#1e3a8a" stroke-width="2"/>
<circle cx="106" cy="318" r="9" fill="#0f172a"/>
<path d="M 190 310 C 250 292 310 288 360 292" stroke="#b45309" stroke-width="6" fill="none" marker-end="url(#oky)"/>
<path d="M 190 326 C 250 320 310 320 356 326" stroke="#b45309" stroke-width="4" fill="none" opacity="0.45"/>
<circle cx="360" cy="292" r="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<path d="M 368 288 L 404 270 M 368 296 L 404 322" stroke="#b45309" stroke-width="4" fill="none"/>
<path d="M 396 236 C 438 200 540 194 596 230 C 640 272 644 396 596 442 C 540 484 448 470 412 424 C 376 378 364 278 396 236 Z" fill="url(#gbeyin)" stroke="#64748b" stroke-width="2"/>
<circle cx="448" cy="262" r="18" fill="url(#gnuk)" stroke="#b45309" stroke-width="2"/>
<circle cx="488" cy="382" r="18" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<path d="M 448 280 C 456 308 470 350 484 366" stroke="#b91c1c" stroke-width="3.5" fill="none" marker-end="url(#okm)"/>
<path d="M 404 270 C 420 262 434 258 438 254" stroke="#b45309" stroke-width="5" fill="none" marker-end="url(#oky)"/>
<path d="M 404 322 C 436 336 466 352 480 366" stroke="#b45309" stroke-width="5" fill="none" marker-end="url(#oky)" opacity="0.4"/>
<path d="M 470 278 C 552 288 584 294 606 300" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#ok)"/>
<path d="M 488 400 C 474 430 438 466 396 490" stroke="#b91c1c" stroke-width="5" fill="none" marker-end="url(#okm)"/>
<circle cx="382" cy="500" r="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<circle cx="382" cy="500" r="6" fill="#b91c1c"/>
<path d="M 370 492 C 316 480 236 452 202 414" stroke="#b91c1c" stroke-width="5" fill="none" marker-end="url(#okm)"/>
<path d="M 202 414 C 192 400 182 388 174 376" stroke="#b91c1c" stroke-width="5" fill="none" marker-end="url(#okm)"/>
<text x="380" y="216" font-size="17" fill="#0f172a">Beyin sapı kesiti: orta beyin</text>
<text x="388" y="292" font-size="17" fill="#b45309">Pretektal çekirdek</text>
<line x1="428" y1="282" x2="442" y2="266" stroke="#94a3b8" stroke-width="1.3"/><circle cx="428" cy="282" r="3" fill="#334155"/>
<text x="380" y="404" font-size="17" fill="#b91c1c">Edinger-Westphal çekirdeği</text>
<line x1="474" y1="392" x2="493" y2="386" stroke="#94a3b8" stroke-width="1.3"/><circle cx="474" cy="392" r="3" fill="#334155"/>
<text x="380" y="426" font-size="17" fill="#334155">Üçüncü sinirin parasempatik liflerini</text>
<text x="380" y="448" font-size="17" fill="#334155">harekete geçirir.</text>
<text x="380" y="476" font-size="17" fill="#7c3aed">İleti karşı tarafa da geçer;</text>
<text x="380" y="498" font-size="17" fill="#7c3aed">konsensüel yanıt buradan doğar.</text>
<text x="44" y="212" font-size="17" fill="#1d4ed8">Retina: ışık burada algılanır</text>
<line x1="142" y1="236" x2="130" y2="252" stroke="#94a3b8" stroke-width="1.3"/><circle cx="142" cy="236" r="3" fill="#334155"/>
<text x="214" y="278" font-size="17" fill="#b45309">Optik sinir</text>
<text x="44" y="386" font-size="17" fill="#b45309">Kiazmada lifler</text>
<text x="44" y="408" font-size="17" fill="#b45309">çaprazlaşır</text>
<line x1="132" y1="396" x2="344" y2="316" stroke="#94a3b8" stroke-width="1.3"/><circle cx="344" cy="316" r="3" fill="#334155"/>
<text x="44" y="470" font-size="17" fill="#b91c1c">Kısa silier sinirler iris</text>
<text x="44" y="492" font-size="17" fill="#b91c1c">sfinkterine gider</text>
<text x="44" y="528" font-size="17" fill="#334155">Pupilla daralır; emir üçüncü sinirden gelir.</text>
<rect x="776" y="116" width="400" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="798" y="146" font-size="20" font-weight="bold" fill="#0f172a">B · Doğrudan ve konsensüel</text>
<ellipse cx="876" cy="240" rx="44" ry="44" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
<ellipse cx="1086" cy="240" rx="44" ry="44" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
<circle cx="876" cy="240" r="17" fill="#0f172a"/>
<circle cx="1086" cy="240" r="17" fill="#0f172a"/>
<circle cx="876" cy="240" r="8" fill="#ffffff"/>
<circle cx="1086" cy="240" r="8" fill="#ffffff"/>
<path d="M 786 200 C 806 202 826 210 844 220" stroke="#facc15" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#ok)"/>
<path d="M 922 240 C 966 214 1036 214 1068 230" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#ok)"/>
<text x="792" y="186" font-size="17" fill="#b45309">Işık sol göze tutulur</text>
<text x="898" y="200" font-size="17" fill="#7c3aed">İleti iki tarafa birden geçer</text>
<text x="876" y="308" font-size="17" text-anchor="middle" fill="#334155">Doğrudan yanıt</text>
<text x="1086" y="308" font-size="17" text-anchor="middle" fill="#334155">Konsensüel yanıt</text>
<text x="798" y="352" font-size="17" fill="#334155">Optik sinir lezyonunda ışık</text>
<text x="798" y="374" font-size="17" fill="#334155">tutulan gözün yanıtı kaybolur,</text>
<text x="798" y="396" font-size="17" fill="#334155">karşı göz yanıt vermeyi sürdürür.</text>
<text x="798" y="428" font-size="17" fill="#334155">Üçüncü sinir lezyonunda pupilla</text>
<text x="798" y="450" font-size="17" fill="#334155">geniş kalır ve ışığa daralmaz.</text>
<text x="798" y="482" font-size="17" fill="#475569">Yanıtın hangi kolda kesildiği</text>
<text x="798" y="504" font-size="17" fill="#475569">bu iki lezyonu ayırır.</text>
<rect x="24" y="556" width="1152" height="172" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="586" font-size="19" font-weight="bold" fill="#0f172a">C · Işık refleksinin beş basamağı</text>
<circle cx="126" cy="628" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="126" y="635" font-size="17" text-anchor="middle" fill="#1d4ed8">1</text>
<circle cx="336" cy="628" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="336" y="635" font-size="17" text-anchor="middle" fill="#1d4ed8">2</text>
<circle cx="546" cy="628" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="546" y="635" font-size="17" text-anchor="middle" fill="#1d4ed8">3</text>
<circle cx="756" cy="628" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="756" y="635" font-size="17" text-anchor="middle" fill="#1d4ed8">4</text>
<circle cx="966" cy="628" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="966" y="635" font-size="17" text-anchor="middle" fill="#1d4ed8">5</text>
<text x="126" y="668" font-size="17" text-anchor="middle" fill="#334155">Işık retinaya düşer</text>
<text x="126" y="690" font-size="17" text-anchor="middle" fill="#475569">ve optik sinirle taşınır</text>
<text x="336" y="668" font-size="17" text-anchor="middle" fill="#334155">Pretektal çekirdeğe</text>
<text x="336" y="690" font-size="17" text-anchor="middle" fill="#475569">ulaşır</text>
<text x="546" y="668" font-size="17" text-anchor="middle" fill="#334155">Edinger-Westphal</text>
<text x="546" y="690" font-size="17" text-anchor="middle" fill="#475569">çekirdeği uyarılır</text>
<text x="756" y="668" font-size="17" text-anchor="middle" fill="#334155">Silier gangliyona</text>
<text x="756" y="690" font-size="17" text-anchor="middle" fill="#475569">ve kısa silier sinirlere iner</text>
<text x="966" y="668" font-size="17" text-anchor="middle" fill="#334155">İris sfinkteri kasılır</text>
<text x="966" y="690" font-size="17" text-anchor="middle" fill="#475569">ve pupilla daralır</text>
<text x="600" y="720" font-size="17" text-anchor="middle" fill="#475569">Afferent kol optik sinirden, efferent kol üçüncü sinirden geçer; iki kol birlikte çalıştığında yanıt alınır.</text>
<text x="600" y="766" font-size="17" text-anchor="middle" fill="#64748b">Kaynak slayt 13: ışık refleksi yolu, doğrudan ve konsensüel yanıt.</text>
</svg>
