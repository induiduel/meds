<text x="212" y="182" font-size="17" fill="#2563eb">Medial rektus kasılır, göz buruna döner</text>

<text x="46" y="196" font-size="17" fill="#0ea5e9">Kornea</text>
<line x1="118" y1="204" x2="164" y2="240" stroke="#94a3b8" stroke-width="1.3"/><circle cx="164" cy="240" r="3" fill="#334155"/>
<text x="46" y="286" font-size="17" fill="#b45309">Retina</text>
<line x1="118" y1="292" x2="188" y2="298" stroke="#94a3b8" stroke-width="1.3"/><circle cx="188" cy="298" r="3" fill="#334155"/>
<text x="64" y="490" font-size="17" fill="#0284c7">Mercek: kırıcılığı artar</text>
<line x1="240" y1="448" x2="240" y2="386" stroke="#94a3b8" stroke-width="1.3"/><circle cx="240" cy="386" r="3" fill="#334155"/>
<text x="358" y="454" font-size="17" fill="#059669">Silier kas gevşer</text>
<line x1="330" y1="384" x2="284" y2="358" stroke="#94a3b8" stroke-width="1.3"/><circle cx="284" cy="358" r="3" fill="#334155"/>
<text x="300" y="516" font-size="17" fill="#059669">Silier kas halkası merceği sarmalar.</text>

<text x="404" y="290" font-size="17" fill="#b45309">Optik sinir</text>
<text x="404" y="312" font-size="17" fill="#475569">iletiyi beyne taşır</text>
<text x="46" y="540" font-size="17" fill="#475569">Kas gevşeyince mercek kalınlaşır ve kırıcılığı artar.</text>
<rect x="612" y="116" width="564" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="634" y="146" font-size="21" font-weight="bold" fill="#0f172a">B · Konverjans ve uyum yolları</text>
<path d="M 660 208 C 692 180 756 184 782 214 C 794 248 776 280 734 286 C 698 290 664 262 660 208 Z" fill="url(#gbeyin)" stroke="#64748b" stroke-width="2"/>
<text x="672" y="236" font-size="17" fill="#334155">Oksipital</text>
<text x="672" y="256" font-size="17" fill="#334155">korteks</text>
<path d="M 796 248 C 852 258 890 278 924 296" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#okb)"/>
