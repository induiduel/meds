<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Yakın refleks: konverjans ve uyum iki ayrı yoldan yürür</text>
<text x="600" y="74" font-size="18" text-anchor="middle" fill="#475569">Göz yakına odaklandığında gözler buruna döner ve merceğin kırıcılığı artar;</text>
<text x="600" y="98" font-size="18" text-anchor="middle" fill="#475569">iki yanıtın yolu birbirinden ayrıdır (slayt 14)</text>
<rect x="24" y="116" width="556" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Göz kesiti: mercek ve silier kas</text>
<ellipse cx="272" cy="330" rx="120" ry="104" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
