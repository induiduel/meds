<circle cx="1040" cy="456" r="21" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="1040" y="462" font-size="17" text-anchor="middle" fill="#b45309">III</text>
<text x="866" y="452" font-size="17" fill="#b45309">Üçüncü sinir</text>
<text x="1004" y="478" font-size="17" fill="#b45309">medial rektusa gider</text>
<path d="M 966 342 C 930 386 886 414 846 436" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#okg)"/>
<circle cx="812" cy="454" r="21" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
<text x="812" y="460" font-size="17" text-anchor="middle" fill="#059669">EW</text>
<path d="M 791 462 C 762 472 740 476 720 478" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#okg)"/>
<circle cx="686" cy="480" r="19" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="690" y="486" font-size="17" text-anchor="middle" fill="#059669">SG</text>
<text x="634" y="502" font-size="17" fill="#059669">Silier gangliyondan çıkan lifler kası gevşetir.</text>
<text x="634" y="526" font-size="17" fill="#475569">Edinger-Westphal çekirdeği üçüncü sinirin</text>
<text x="634" y="548" font-size="17" fill="#475569">parasempatik bölümüdür ve silier kası besler.</text>
<rect x="24" y="556" width="1152" height="172" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="586" font-size="19" font-weight="bold" fill="#0f172a">C · İki yanıtın karşılaştırması</text>
<text x="286" y="622" font-size="19" text-anchor="middle" font-weight="bold" fill="#2563eb">Konverjans</text>
<text x="286" y="648" font-size="17" text-anchor="middle" fill="#334155">Gözler buruna doğru birlikte döner.</text>
<text x="286" y="670" font-size="17" text-anchor="middle" fill="#334155">Kas medial rektustur, sinir üçüncüdür.</text>
<text x="286" y="692" font-size="17" text-anchor="middle" fill="#334155">Merkez orta beyindeki konverjans merkezidir.</text>
<line x1="600" y1="610" x2="600" y2="706" stroke="#cbd5e1" stroke-width="2"/>
<text x="914" y="622" font-size="19" text-anchor="middle" font-weight="bold" fill="#059669">Uyum</text>
<text x="914" y="648" font-size="17" text-anchor="middle" fill="#334155">Silier kas gevşer, mercek kırıcılığı artar.</text>
<text x="914" y="670" font-size="17" text-anchor="middle" fill="#334155">Yol silier gangliyon üzerinden parasempatiktir.</text>
<text x="914" y="692" font-size="17" text-anchor="middle" fill="#334155">Yakın görüntü retina üzerinde odaklanır.</text>
<text x="600" y="770" font-size="17" text-anchor="middle" fill="#64748b">Kaynak slayt 14: yakın refleks, konverjans merkezi, silier gangliyon ve medial rektus.</text>
