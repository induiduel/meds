<text x="966" y="316" font-size="17" text-anchor="middle" fill="#ffffff">Orta</text>
<text x="966" y="332" font-size="17" text-anchor="middle" fill="#ffffff">beyin</text>
<text x="1004" y="298" font-size="17" fill="#b91c1c">Konverjans merkezi</text>
