<ellipse cx="348" cy="308" rx="26" ry="16" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
<circle cx="262" cy="308" r="8" fill="#0f172a"/><circle cx="352" cy="308" r="8" fill="#0f172a"/>
