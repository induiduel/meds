<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="42" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Fasyal paralizi: alın kasları periferik ile santrali ayırır</text>
<text x="600" y="72" font-size="18" text-anchor="middle" fill="#475569">Yedinci sinir mimik kaslarını çalıştırır; alın kasları iki taraftan ayrı ayrı innerve edildiği için</text>
<text x="600" y="96" font-size="18" text-anchor="middle" fill="#475569">santral tipte korunur (slayt 25, 26, 27)</text>
<rect x="24" y="116" width="576" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Periferik tip: yarım yüzün tamamı</text>
<ellipse cx="300" cy="340" rx="112" ry="142" fill="url(#gderi)" stroke="#a16207" stroke-width="2"/>
<path d="M 300 198 C 236 198 194 244 190 300 L 190 350 L 410 350 L 410 300 C 406 244 364 198 300 198 Z" fill="url(#gfelc)" stroke="#64748b" stroke-width="2" opacity="0.85"/>
<path d="M 210 268 C 250 240 350 240 390 268" stroke="#475569" stroke-width="4" fill="none"/>
<path d="M 214 254 q18 -10 34 -4" stroke="#475569" stroke-width="3" fill="none"/>
