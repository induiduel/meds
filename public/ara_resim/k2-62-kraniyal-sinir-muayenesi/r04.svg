<path d="M 348 288 C 348 280 358 278 362 284" stroke="#475569" stroke-width="3" fill="none"/>
<path d="M 300 330 C 288 356 292 372 300 384" stroke="#a16207" stroke-width="2.5" fill="none"/>
<path d="M 244 418 C 274 402 326 402 356 418 C 340 434 300 438 244 418 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
<path d="M 244 418 C 254 442 262 448 268 446" stroke="#7f1d1d" stroke-width="2" fill="none"/>
<path d="M 268 450 C 292 460 330 452 356 430" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#okm)"/>
<text x="392" y="452" font-size="17" fill="#b91c1c">Ağız sağlam tarafa kayar</text>
<text x="46" y="196" font-size="17" fill="#b91c1c">Alın kırışmaz</text>
<line x1="140" y1="202" x2="236" y2="248" stroke="#94a3b8" stroke-width="1.3"/><circle cx="236" cy="248" r="3" fill="#334155"/>
<text x="46" y="238" font-size="17" fill="#b91c1c">Kaş kaldırılamaz</text>
<line x1="150" y1="244" x2="216" y2="258" stroke="#94a3b8" stroke-width="1.3"/><circle cx="216" cy="258" r="3" fill="#334155"/>
<text x="46" y="372" font-size="17" fill="#b91c1c">Göz kapanmaz</text>
<line x1="146" y1="378" x2="228" y2="322" stroke="#94a3b8" stroke-width="1.3"/><circle cx="228" cy="322" r="3" fill="#334155"/>
<text x="424" y="246" font-size="17" fill="#475569">Felçli yarım yüz</text>
<text x="424" y="268" font-size="17" fill="#475569">gri taranmış alan</text>
<line x1="414" y1="266" x2="384" y2="292" stroke="#94a3b8" stroke-width="1.3"/><circle cx="384" cy="292" r="3" fill="#334155"/>
<text x="46" y="504" font-size="17" fill="#334155">Lezyon çekirdeğe ya da çekirdeğin altındaki gövdeye oturur;</text>
<text x="46" y="526" font-size="17" fill="#334155">bu nedenle alın kasları da felç olur ve yüzün tamamı tutulur.</text>
<text x="46" y="550" font-size="17" fill="#475569">Yedinci sinir ayrıca dilin ön üçte birinin tat duyusunu taşır,</text>
<text x="46" y="566" font-size="17" fill="#475569">parotis dışı tükürük bezlerini ve stapedius kasını çalıştırır.</text>
<rect x="624" y="116" width="552" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="646" y="146" font-size="21" font-weight="bold" fill="#0f172a">B · Santral tip: yalnız yüzün alt yarısı</text>
<ellipse cx="900" cy="340" rx="112" ry="142" fill="url(#gderi)" stroke="#a16207" stroke-width="2"/>
