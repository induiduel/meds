<ellipse cx="948" cy="308" rx="26" ry="16" fill="url(#ggoz)" stroke="#64748b" stroke-width="2"/>
<circle cx="862" cy="308" r="8" fill="#0f172a"/><circle cx="952" cy="308" r="8" fill="#0f172a"/>
<path d="M 900 330 C 888 356 892 372 900 384" stroke="#a16207" stroke-width="2.5" fill="none"/>
<path d="M 844 418 C 874 402 926 402 956 418 C 940 434 900 438 844 418 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
