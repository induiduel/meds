<path d="M 868 450 C 892 460 930 452 956 430" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#okm)"/>
<text x="992" y="452" font-size="17" fill="#b91c1c">Ağız köşesi kayar</text>
<text x="944" y="216" font-size="17" fill="#059669">Alın kırışır</text>
<line x1="938" y1="222" x2="918" y2="248" stroke="#94a3b8" stroke-width="1.3"/><circle cx="918" cy="248" r="3" fill="#334155"/>
<text x="944" y="252" font-size="17" fill="#059669">Kaş kaldırılır</text>
<line x1="936" y1="256" x2="920" y2="276" stroke="#94a3b8" stroke-width="1.3"/><circle cx="920" cy="276" r="3" fill="#334155"/>
<text x="944" y="376" font-size="17" fill="#059669">Göz kapanır</text>
<line x1="940" y1="380" x2="922" y2="326" stroke="#94a3b8" stroke-width="1.3"/><circle cx="922" cy="326" r="3" fill="#334155"/>
<text x="646" y="250" font-size="17" fill="#475569">Korunan üst yarı</text>
<line x1="768" y1="258" x2="806" y2="288" stroke="#94a3b8" stroke-width="1.3"/><circle cx="806" cy="288" r="3" fill="#334155"/>
<text x="646" y="288" font-size="17" fill="#475569">Felçli alt yarı</text>
<line x1="768" y1="296" x2="846" y2="330" stroke="#94a3b8" stroke-width="1.3"/><circle cx="846" cy="330" r="3" fill="#334155"/>
<text x="646" y="504" font-size="17" fill="#334155">Lezyon çekirdeğin üstündedir; alın kasları iki taraftan</text>
<text x="646" y="526" font-size="17" fill="#334155">ayrı ayrı innerve edildiği için korunur ve tablo hemen</text>
<text x="646" y="548" font-size="17" fill="#334155">her zaman aynı taraftaki hemipareziyle birliktedir.</text>
<rect x="24" y="586" width="1152" height="186" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="614" font-size="19" font-weight="bold" fill="#0f172a">C · İki tipin ayrımı: alın kasları çalışıyor mu?</text>
<path d="M 186 662 L 240 698 L 186 734 L 132 698 Z" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
<text x="186" y="694" font-size="17" text-anchor="middle" fill="#334155">Alın kasları</text>
<text x="186" y="714" font-size="17" text-anchor="middle" fill="#334155">çalışır mı?</text>
<path d="M 240 680 C 262 662 284 654 306 650" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#okg)"/>
<path d="M 240 716 C 262 734 284 742 306 746" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#okm)"/>
<text x="248" y="646" font-size="17" fill="#059669">Evet</text>
<text x="248" y="766" font-size="17" fill="#b91c1c">Hayır</text>
<text x="320" y="644" font-size="18" font-weight="bold" fill="#059669">Santral tip</text>
<text x="320" y="668" font-size="17" fill="#334155">Lezyon çekirdeğin üstündedir.</text>
<text x="320" y="690" font-size="17" fill="#334155">Göz kapanır, alın kırışır;</text>
<text x="320" y="712" font-size="17" fill="#334155">ağız köşesi kayar ve tablo</text>
<text x="320" y="734" font-size="17" fill="#334155">aynı taraftaki hemiparezi</text>
<text x="320" y="756" font-size="17" fill="#334155">ile birliktedir.</text>
<text x="700" y="644" font-size="18" font-weight="bold" fill="#b91c1c">Periferik tip</text>
<text x="700" y="668" font-size="17" fill="#334155">Lezyon çekirdeğe ya da gövdeye</text>
<text x="700" y="690" font-size="17" fill="#334155">oturur; göz kapanmaz, kaş</text>
<text x="700" y="712" font-size="17" fill="#334155">kaldırılamaz, alın kırışmaz ve</text>
<text x="700" y="734" font-size="17" fill="#334155">ağız sağlam tarafa kayar.</text>
<text x="700" y="756" font-size="17" fill="#475569">Yarım yüzün tamamı felç olur.</text>
</svg>
