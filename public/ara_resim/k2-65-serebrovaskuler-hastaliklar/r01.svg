<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<linearGradient id="gbeyin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
<radialGradient id="gcekir" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/></radialGradient>
<radialGradient id="gpen" cx="0.4" cy="0.4" r="0.8"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
<linearGradient id="gzaman" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bbf7d0"/><stop offset="0.55" stop-color="#fde68a"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">İskemi uzadıkça hasar basamak basamak ağırlaşır</text>
<text x="600" y="74" font-size="18" text-anchor="middle" fill="#475569">Kan akımı hafif düşerse doku geri dönebilir; akım uzun süre çok düşük kalırsa geri dönüşümsüz hasar gelişir</text>
<text x="600" y="98" font-size="18" text-anchor="middle" fill="#475569">ve arada kalan penumbra tedavinin hedefidir (slayt 12)</text>
<rect x="24" y="116" width="636" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Tıkanan damarın beslediği alanda üç bölge</text>
<ellipse cx="330" cy="336" rx="206" ry="150" fill="url(#gbeyin)" stroke="#64748b" stroke-width="2"/>
<path d="M 330 186 C 214 190 132 262 130 336 C 128 412 208 482 330 486 C 452 482 532 412 530 336 C 528 262 446 190 330 186 Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M 330 208 C 240 212 176 268 174 330" stroke="#cbd5e1" stroke-width="10" fill="none" opacity="0.8"/>
<path d="M 330 208 C 420 212 484 268 486 330" stroke="#cbd5e1" stroke-width="10" fill="none" opacity="0.8"/>
<path d="M 330 214 C 300 244 296 300 320 322 C 340 340 348 376 336 410" stroke="#e2e8f0" stroke-width="3" fill="none"/>
<ellipse cx="252" cy="330" rx="24" ry="46" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 396 232 C 470 250 502 300 500 360" stroke="#dc2626" stroke-width="7" fill="none" opacity="0.7"/>
<path d="M 96 336 C 140 322 168 318 196 320" stroke="#dc2626" stroke-width="6" fill="none"/>
<circle cx="188" cy="320" r="12" fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>
<path d="M 96 336 C 150 392 196 412 240 420" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#ok)"/>
<path d="M 300 300 C 372 282 452 300 494 342 C 470 388 396 404 330 392 C 352 360 336 322 300 300 Z" fill="url(#gpen)" stroke="#b45309" stroke-width="2.5" opacity="0.85"/>
<path d="M 340 316 C 388 306 424 320 438 344 C 420 368 380 376 350 368 C 364 350 356 330 340 316 Z" fill="url(#gcekir)" stroke="#7f1d1d" stroke-width="2.5"/>
<text x="252" y="238" font-size="17" fill="#0f172a">Normal doku</text>
<line x1="266" y1="244" x2="286" y2="272" stroke="#94a3b8" stroke-width="1.3"/><circle cx="286" cy="272" r="3" fill="#334155"/>
<text x="44" y="252" font-size="17" fill="#b91c1c">Tıkanan</text>
<text x="44" y="274" font-size="17" fill="#b91c1c">damar</text>
<line x1="112" y1="282" x2="162" y2="314" stroke="#94a3b8" stroke-width="1.3"/><circle cx="162" cy="314" r="3" fill="#334155"/>
<text x="44" y="376" font-size="17" fill="#2563eb">Erken tedavi</text>
<text x="44" y="398" font-size="17" fill="#2563eb">bu bölgeye ulaşır</text>
<line x1="128" y1="404" x2="196" y2="420" stroke="#94a3b8" stroke-width="1.3"/><circle cx="196" cy="420" r="3" fill="#334155"/>
<text x="462" y="238" font-size="17" fill="#b45309">Penumbra: canlı</text>
<text x="462" y="260" font-size="17" fill="#b45309">ama enerji yetersiz</text>
<line x1="500" y1="270" x2="480" y2="304" stroke="#94a3b8" stroke-width="1.3"/><circle cx="480" cy="304" r="3" fill="#334155"/>
<text x="462" y="418" font-size="17" fill="#b91c1c">Ölü çekirdek</text>
<text x="462" y="440" font-size="17" fill="#475569">geri dönüşü yok</text>
<line x1="466" y1="410" x2="432" y2="370" stroke="#94a3b8" stroke-width="1.3"/><circle cx="432" cy="370" r="3" fill="#334155"/>
<text x="46" y="474" font-size="17" fill="#334155">Kan akımı düşen bölgede hücreler önce işlevini yitirir;</text>
<text x="46" y="496" font-size="17" fill="#334155">akım geri gelirse penumbra yaşamını sürdürür. Bu yüzden tedavi</text>
<text x="46" y="518" font-size="17" fill="#334155">ne kadar erken başlarsa kurtarılan doku o kadar büyük olur.</text>

<rect x="684" y="116" width="492" height="424" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="706" y="146" font-size="21" font-weight="bold" fill="#0f172a">B · Zamanla kurtarılabilirlik azalır</text>
<line x1="716" y1="470" x2="1148" y2="470" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="1148" y="500" font-size="17" text-anchor="end" fill="#334155">geçen süre</text>
<text x="712" y="500" font-size="17" fill="#475569">tıkanma</text>
<path d="M 716 300 C 820 296 900 316 980 360 C 1040 394 1096 424 1140 446" stroke="#059669" stroke-width="4" fill="none"/>
<path d="M 716 470 C 760 466 800 452 840 430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
<path d="M 716 212 L 716 470" stroke="#94a3b8" stroke-width="2"/>
<circle cx="716" cy="300" r="9" fill="#059669"/>
<circle cx="866" cy="330" r="9" fill="#b45309"/>
<circle cx="1032" cy="392" r="9" fill="#b91c1c"/>
<circle cx="1140" cy="446" r="9" fill="#7f1d1d"/>
<text x="742" y="272" font-size="17" fill="#059669">İşlev bozulur, doku geri dönebilir</text>
<text x="742" y="294" font-size="17" fill="#475569">(geri dönüşümlü hasar)</text>
<text x="742" y="360" font-size="17" fill="#b45309">Penumbra: akım düştü,</text>
<text x="742" y="382" font-size="17" fill="#b45309">hücreler henüz ölmedi</text>
<text x="742" y="424" font-size="17" fill="#b91c1c">Akım çok düşük kalırsa</text>
<text x="742" y="446" font-size="17" fill="#b91c1c">geri dönüşümsüz hasar</text>
<text x="716" y="530" font-size="17" fill="#475569">Erken tedavi penumbradan kurtarılan dokuyu büyütür;</text>
<text x="716" y="552" font-size="17" fill="#475569">gecikme kurtarılabilir dokuyu ölü çekirdeğe katar.</text>
<rect x="24" y="556" width="1152" height="172" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="586" font-size="19" font-weight="bold" fill="#0f172a">C · Aynı hastada üç sonuç</text>
<circle cx="150" cy="630" r="18" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="150" y="637" font-size="17" text-anchor="middle" fill="#059669">1</text>
<text x="150" y="672" font-size="17" text-anchor="middle" fill="#334155">Akım hafif düşük:</text>
<text x="150" y="694" font-size="17" text-anchor="middle" fill="#475569">işlev bozulur, doku yaşar</text>
<circle cx="450" cy="630" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450" y="637" font-size="17" text-anchor="middle" fill="#b45309">2</text>
<text x="450" y="672" font-size="17" text-anchor="middle" fill="#334155">Akım düşük ve tedavi erken:</text>
<text x="450" y="694" font-size="17" text-anchor="middle" fill="#475569">penumbra kurtarılır</text>
<circle cx="750" cy="630" r="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="750" y="637" font-size="17" text-anchor="middle" fill="#b91c1c">3</text>
<text x="720" y="672" font-size="17" text-anchor="middle" fill="#334155">Akım çok düşük kalırsa:</text>
<text x="750" y="694" font-size="17" text-anchor="middle" fill="#475569">geri dönüşümsüz hasar</text>
<path d="M 220 632 C 300 620 366 620 402 630" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
<path d="M 520 632 C 600 620 666 620 702 630" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
<text x="1010" y="636" font-size="17" text-anchor="middle" fill="#334155">Hedef ölü çekirdek değil,</text>
<text x="1010" y="658" font-size="17" text-anchor="middle" fill="#334155">çevresindeki kurtarılabilir penumbra.</text>
<text x="1010" y="688" font-size="17" text-anchor="middle" fill="#475569">Bu yüzden inmede tedavi erken başlar.</text>
<text x="600" y="770" font-size="17" text-anchor="middle" fill="#64748b">Kaynak slayt 12: iskemi süresi, geri dönüşümlü ve geri dönüşümsüz hasar, penumbra.</text>
</svg>
