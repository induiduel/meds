<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<linearGradient id="gbar1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient>
<linearGradient id="gbar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<linearGradient id="gbar3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="gbolus" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Trombolitik tedavi: fayda saat saat azalır</text>
<text x="600" y="74" font-size="18" text-anchor="middle" fill="#475569">Doku plazminojen aktivatörü ilk dört buçuk saat içinde verilir; aynı iyileşmeyi sağlamak için</text>
<text x="600" y="98" font-size="18" text-anchor="middle" fill="#475569">tedavi geciktikçe daha çok hasta tedavi edilmesi gerekir (slayt 28, 29)</text>
<rect x="24" y="116" width="700" height="446" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Bir hastanın iyileşmesi için kaç hasta tedavi edilmeli?</text>
<line x1="110" y1="500" x2="680" y2="500" stroke="#334155" stroke-width="3"/>
<line x1="110" y1="180" x2="110" y2="500" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<text x="96" y="176" font-size="17" text-anchor="end" fill="#334155">tedavi</text>
<text x="96" y="198" font-size="17" text-anchor="end" fill="#334155">edilen</text>
<text x="96" y="220" font-size="17" text-anchor="end" fill="#334155">hasta</text>
<line x1="110" y1="440" x2="680" y2="440" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="110" y1="380" x2="680" y2="380" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="110" y1="320" x2="680" y2="320" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="110" y1="260" x2="680" y2="260" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="102" y="446" font-size="17" text-anchor="end" fill="#475569">5</text>
<text x="102" y="386" font-size="17" text-anchor="end" fill="#475569">10</text>
<text x="102" y="326" font-size="17" text-anchor="end" fill="#475569">15</text>
<text x="102" y="266" font-size="17" text-anchor="end" fill="#475569">20</text>
<path d="M 200 500 L 200 446 L 250 446 L 250 500 Z" fill="url(#gbar1)" stroke="#15803d" stroke-width="2"/>
<path d="M 330 500 L 330 392 L 380 392 L 380 500 Z" fill="url(#gbar2)" stroke="#b45309" stroke-width="2"/>
<path d="M 460 500 L 460 332 L 510 332 L 510 500 Z" fill="url(#gbar3)" stroke="#b91c1c" stroke-width="2"/>
<text x="225" y="428" font-size="19" text-anchor="middle" font-weight="bold" fill="#0f172a">4,5</text>
<text x="355" y="374" font-size="19" text-anchor="middle" font-weight="bold" fill="#0f172a">9</text>
<text x="485" y="314" font-size="19" text-anchor="middle" font-weight="bold" fill="#0f172a">14</text>
<text x="225" y="528" font-size="17" text-anchor="middle" fill="#15803d">0–90 dakika</text>
<text x="355" y="528" font-size="17" text-anchor="middle" fill="#b45309">90–180 dakika</text>
<text x="485" y="528" font-size="17" text-anchor="middle" fill="#b91c1c">180–270 dakika</text>
<text x="640" y="528" font-size="17" text-anchor="middle" fill="#334155">başlangıçtan</text>
<text x="640" y="550" font-size="17" text-anchor="middle" fill="#334155">itibaren süre</text>
<text x="46" y="290" font-size="17" fill="#334155">Fayda aynı kalırken gereken</text>
<text x="46" y="308" font-size="17" fill="#334155">hasta sayısı üç katına çıkar.</text>
<text x="532" y="200" font-size="17" fill="#059669">En kısa sürede</text>
<text x="532" y="222" font-size="17" fill="#059669">en büyük fayda</text>

<rect x="748" y="116" width="428" height="446" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="770" y="146" font-size="21" font-weight="bold" fill="#0f172a">B · Zaman penceresi ve dışlama</text>
<line x1="790" y1="232" x2="1134" y2="232" stroke="#334155" stroke-width="3"/>
<line x1="790" y1="210" x2="790" y2="254" stroke="#334155" stroke-width="3"/>
<line x1="1134" y1="210" x2="1134" y2="254" stroke="#334155" stroke-width="3"/>
<path d="M 790 232 C 872 224 960 224 1046 226" stroke="#2563eb" stroke-width="10" fill="none" opacity="0.75"/>
<path d="M 1046 226 C 1082 228 1112 230 1134 232" stroke="#f59e0b" stroke-width="10" fill="none" opacity="0.5"/>
<path d="M 1134 232 C 1150 234 1160 236 1168 238" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
<text x="790" y="284" font-size="17" fill="#334155">0 saat</text>
<text x="1134" y="284" font-size="17" text-anchor="middle" fill="#334155">4,5 saat</text>
<text x="900" y="212" font-size="17" text-anchor="middle" fill="#2563eb">trombolitik verilir</text>
<text x="1134" y="308" font-size="17" text-anchor="end" fill="#b91c1c">sonrasında verilmez</text>
<text x="770" y="330" font-size="17" fill="#334155">Başlangıç anı, hastanın son normal</text>
<text x="770" y="352" font-size="17" fill="#334155">görüldüğü zamandır; uykuda gelişen</text>
<text x="770" y="374" font-size="17" fill="#334155">inmede bu an belirleyicidir.</text>
<text x="770" y="406" font-size="17" fill="#b91c1c">Dört buçuk saat içinde başlanamıyorsa</text>
<text x="770" y="428" font-size="17" fill="#b91c1c">trombolitik kesin dışlama nedenidir.</text>
<text x="770" y="460" font-size="17" fill="#475569">Görüntülemede kanama varsa ya da</text>
<text x="770" y="482" font-size="17" fill="#475569">başka kesin engel varsa tedavi verilmez.</text>
<text x="770" y="514" font-size="17" fill="#475569">Karar, ölçek puanı ve görüntülemeyle</text>
<text x="770" y="536" font-size="17" fill="#475569">birlikte verilir.</text>
<rect x="24" y="578" width="1152" height="150" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="608" font-size="19" font-weight="bold" fill="#0f172a">C · Doğru hastada doz ve uygulama</text>
<text x="60" y="646" font-size="17" fill="#334155">Doz kilogram başına sıfır virgül dokuz miligramdır; toplam doz doksan miligramı geçmez.</text>
<path d="M 60 690 C 180 678 260 678 330 686" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ok)"/>
<rect x="354" y="658" width="230" height="60" rx="10" fill="url(#gbolus)" stroke="#2563eb" stroke-width="2"/>
<text x="469" y="682" font-size="17" text-anchor="middle" fill="#0f172a">Dozun yüzde onu</text>
<text x="469" y="706" font-size="17" text-anchor="middle" fill="#475569">bir dakikada bolus</text>
<line x1="596" y1="688" x2="636" y2="688" stroke="#334155" stroke-width="3" marker-end="url(#ok)"/>
<rect x="648" y="658" width="250" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="773" y="682" font-size="17" text-anchor="middle" fill="#0f172a">Kalan kısım altmış</text>
<text x="773" y="706" font-size="17" text-anchor="middle" fill="#475569">dakikada infüzyon</text>
<text x="930" y="676" font-size="17" fill="#334155">Hedef doku penumbradır;</text>
<text x="930" y="698" font-size="17" fill="#334155">rekanalizasyon enfarkt</text>
<text x="930" y="720" font-size="17" fill="#334155">alanını küçültür.</text>
<text x="600" y="748" font-size="17" text-anchor="middle" fill="#475569">Bir hastanın iyileşmesi için ilk doksan dakikada dört buçuk, doksan ile yüz seksen dakika arasında dokuz,</text>
<text x="600" y="770" font-size="17" text-anchor="middle" fill="#475569">yüz seksen ile iki yüz yetmiş dakika arasında on dört hasta tedavi edilir; kazanç aynıdır, bedeli gecikmeyle büyür.</text>
<text x="600" y="792" font-size="17" text-anchor="middle" fill="#64748b">Kaynak slayt 28 ve 29: doz, uygulama ve tedavi ekranına göre fayda.</text>
</svg>
