<ellipse cx="342" cy="296" rx="16" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<path d="M 240 336 C 252 330 264 332 272 340 C 266 354 254 358 244 352 Z" fill="url(#ghem)" stroke="#450a0a" stroke-width="2"/>
