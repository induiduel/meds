<linearGradient id="gbeyin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="0.6" stop-color="#dbe4ee"/><stop offset="1" stop-color="#c3cfdd"/></linearGradient>
<radialGradient id="ghem" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#7f1d1d"/></radialGradient>
