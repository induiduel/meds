<rect width="1200" height="800" fill="url(#zemin)"/>
<text x="600" y="44" font-size="29" text-anchor="middle" font-weight="bold" fill="#0f172a">Kanamalı inme: yerleşim dağılımı ve klinik karşılığı</text>
<text x="600" y="74" font-size="18" text-anchor="middle" fill="#475569">Kanamaların yerleşimi klinik tabloyu belirler; putaminal kanama en sık görülürken</text>
<text x="600" y="98" font-size="18" text-anchor="middle" fill="#475569">pons ve serebellar kanama en az sıklıkta ama en ağır seyirlidir (slayt 40–45)</text>
<rect x="24" y="116" width="560" height="472" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="46" y="146" font-size="21" font-weight="bold" fill="#0f172a">A · Eksenel kesitte beş yerleşim</text>
<ellipse cx="304" cy="322" rx="184" ry="150" fill="url(#gbeyin)" stroke="#64748b" stroke-width="2"/>
<path d="M 200 176 C 236 190 258 208 268 236" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 408 176 C 372 190 350 208 340 236" stroke="#94a3b8" stroke-width="2" fill="none"/>
