<path d="M 304 300 C 338 288 372 292 386 312 C 374 338 338 346 308 338 C 292 326 292 310 304 300 Z" fill="url(#gvent)" stroke="#0284c7" stroke-width="1.5"/>
<line x1="304" y1="228" x2="304" y2="452" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<ellipse cx="250" cy="350" rx="24" ry="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<ellipse cx="358" cy="350" rx="24" ry="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
