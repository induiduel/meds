<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Üç ayakkabı: alçak bilekli patika ayakkabısı düzgün patika ve hafif yük için, orta bilekli yürüyüş botu bozuk arazi ve sırt çantası için, sert tabanlı dağ botu kar, kaya ve ağır yük için">
  <rect width="800" height="480" rx="28" fill="#F4EEE2"/>
  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- zemin şeritleri -->
    <g fill="#E4D8C3">
      <rect x="40" y="262" width="220" height="14" rx="7"/>
      <rect x="290" y="262" width="220" height="14" rx="7"/>
      <rect x="540" y="262" width="220" height="14" rx="7"/>
    </g>

    <!-- 1 alçak bilekli patika ayakkabısı -->
    <g transform="translate(150,248)">
      <path d="M-88,-4 V-50 Q-88,-62 -76,-62 H-58 Q-46,-62 -36,-52 L8,-36 Q58,-32 84,-16 Q92,-11 92,-4 Z" fill="#7FA387" stroke="#7FA387" stroke-width="4"/>
      <path d="M-88,-28 Q-60,-20 -40,-4" fill="none" stroke="#2F5D50" stroke-width="3"/>
      <path d="M-30,-40 L-22,-52 M-14,-34 L-6,-46 M2,-29 L10,-41" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-94" y="-6" width="190" height="16" rx="8" fill="#1E2A2E"/>
    </g>

    <!-- 2 orta bilekli yürüyüş botu -->
    <g transform="translate(400,244)">
      <path d="M-88,-4 V-92 Q-88,-104 -76,-104 H-54 Q-42,-104 -40,-92 L-34,-58 L12,-38 Q60,-34 86,-16 Q94,-11 94,-4 Z" fill="#D9865B" stroke="#D9865B" stroke-width="4"/>
      <path d="M-88,-30 Q-58,-22 -38,-4" fill="none" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M-40,-84 L-26,-88 M-37,-68 L-23,-72 M-26,-48 L-16,-60 M-10,-41 L-2,-53 M6,-34 L14,-46" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-94" y="-6" width="194" height="20" rx="8" fill="#1E2A2E"/>
      <g fill="#1E2A2E">
        <rect x="-86" y="8" width="20" height="12" rx="3"/><rect x="-56" y="8" width="20" height="12" rx="3"/><rect x="-26" y="8" width="20" height="12" rx="3"/><rect x="14" y="8" width="20" height="12" rx="3"/><rect x="44" y="8" width="20" height="12" rx="3"/><rect x="74" y="8" width="18" height="12" rx="3"/>
      </g>
    </g>

    <!-- 3 sert tabanlı dağ botu -->
    <g transform="translate(650,238)">
      <path d="M-88,-4 L-92,-118 Q-92,-130 -80,-130 H-54 Q-42,-130 -41,-118 L-34,-64 L14,-42 Q62,-38 88,-18 Q96,-12 96,-4 Z" fill="#24384F" stroke="#24384F" stroke-width="4"/>
      <path d="M-90,-110 H-42" stroke="#F2C14E" stroke-width="6"/>
      <path d="M-40,-94 L-24,-98 M-38,-78 L-22,-82 M-28,-54 L-18,-66 M-10,-46 L-2,-58 M8,-38 L16,-50" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-94" y="-18" width="194" height="16" rx="6" fill="#D9865B"/>
      <rect x="-96" y="-6" width="198" height="26" rx="6" fill="#1E2A2E"/>
      <g fill="#1E2A2E">
        <rect x="-90" y="12" width="22" height="16" rx="3"/><rect x="-60" y="12" width="22" height="16" rx="3"/><rect x="-30" y="12" width="22" height="16" rx="3"/><rect x="12" y="12" width="22" height="16" rx="3"/><rect x="42" y="12" width="22" height="16" rx="3"/><rect x="72" y="12" width="24" height="16" rx="3"/>
      </g>
    </g>

    <!-- etiketler -->
    <g fill="#2F5D50" font-size="20" font-weight="700" text-anchor="middle">
      <text x="150" y="316">Düzgün patika</text>
      <text x="400" y="316">Bozuk arazi</text>
      <text x="650" y="316">Kar, kaya</text>
    </g>
    <g fill="#1E2A2E" font-size="18" text-anchor="middle">
      <text x="150" y="344">hafif yük</text>
      <text x="400" y="344">sırt çantası</text>
      <text x="650" y="344">ağır yük</text>
    </g>

    <!-- alt şerit -->
    <rect x="40" y="388" width="720" height="52" rx="26" fill="#FFFFFF"/>
    <text x="400" y="420" font-size="18" fill="#1E2A2E" text-anchor="middle">Burunda 1 cm boşluk · öğleden sonra dene · yürüyüş çorabıyla</text>
  </g>
</svg>
