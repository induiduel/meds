<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Üç katman: taban katman teri uzaklaştırır, ara katman ısıyı tutar, dış katman rüzgâr ve yağmuru keser; pamuk giyilmez">
  <rect width="800" height="480" rx="28" fill="#F4EEE2"/>
  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1 Taban: içlik -->
    <g transform="translate(150,200)">
      <path d="M-28,-90 Q0,-70 28,-90 L52,-82 L86,40 L62,48 L44,-20 V95 H-44 V-20 L-62,48 L-86,40 L-52,-82 Z" fill="#7FA387" stroke="#7FA387" stroke-width="6"/>
      <path d="M-28,-90 Q0,-70 28,-90" fill="none" stroke="#2F5D50" stroke-width="3"/>
      <path d="M-78,36 L-56,43 M78,36 L56,43 M-44,84 H44" fill="none" stroke="#2F5D50" stroke-width="3"/>
      <!-- ter damlaları dışarı -->
      <g fill="#CDE3EA" stroke="#24384F" stroke-width="3">
        <path d="M96,-74 q8,11 0,17 q-8,-6 0,-17 Z"/>
        <path d="M116,-96 q8,11 0,17 q-8,-6 0,-17 Z"/>
      </g>
    </g>

    <!-- 2 Ara: polar -->
    <g transform="translate(400,200)">
      <path d="M-30,-90 V-102 Q0,-110 30,-102 V-90 L58,-82 L94,44 L66,54 L50,-14 V98 H-50 V-14 L-66,54 L-94,44 L-58,-82 Z" fill="#D9865B" stroke="#D9865B" stroke-width="6"/>
      <path d="M0,-104 V98" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M-36,50 H-14 M36,50 H14" stroke="#1E2A2E" stroke-width="3"/>
      <!-- ısı dalgaları -->
      <g fill="none" stroke="#FFFFFF" stroke-width="4">
        <path d="M-30,-10 q-7,-9 0,-18 q7,-9 0,-18"/>
        <path d="M30,-10 q-7,-9 0,-18 q7,-9 0,-18"/>
      </g>
    </g>

    <!-- 3 Dış: yağmurluk -->
    <g transform="translate(650,206)">
      <path d="M-34,-84 Q-38,-128 0,-128 Q38,-128 34,-84 L62,-76 L98,48 L70,58 L54,-10 V98 H-54 V-10 L-70,58 L-98,48 L-62,-76 Z" fill="#24384F" stroke="#24384F" stroke-width="6"/>
      <ellipse cx="0" cy="-100" rx="19" ry="20" fill="#F4EEE2"/>
      <path d="M0,-78 V98" stroke="#CDE3EA" stroke-width="3"/>
      <path d="M-40,52 H-18 M40,52 H18" stroke="#CDE3EA" stroke-width="3"/>
      <!-- yağmur -->
      <g stroke="#24384F" stroke-width="4" fill="none">
        <path d="M-92,-112 l-8,18 M-66,-128 l-8,18 M70,-128 l-8,18 M98,-108 l-8,18 M112,-66 l-8,18"/>
      </g>
    </g>

    <!-- Pamuk yok rozeti -->
    <rect x="28" y="28" width="196" height="56" rx="28" fill="#FFFFFF"/>
    <g transform="translate(62,56)">
      <path d="M-7,-15 Q0,-10 7,-15 L20,-9 L15,1 L10,-2 V16 H-10 V-2 L-15,1 L-20,-9 Z" fill="#E4D8C3" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M-18,18 L18,-18" stroke="#C8553D" stroke-width="5"/>
    </g>
    <text x="96" y="63" font-size="20" font-weight="700" fill="#1E2A2E">Pamuk yok</text>

    <!-- etiketler -->
    <g fill="#2F5D50">
      <circle cx="105" cy="356" r="20"/><circle cx="366" cy="356" r="20"/><circle cx="618" cy="356" r="20"/>
    </g>
    <g fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle">
      <text x="105" y="365">1</text><text x="366" y="365">2</text><text x="618" y="365">3</text>
    </g>
    <g fill="#2F5D50" font-size="22" font-weight="700">
      <text x="134" y="364">Taban</text>
      <text x="395" y="364">Ara</text>
      <text x="647" y="364">Dış</text>
    </g>
    <g fill="#1E2A2E" font-size="18" text-anchor="middle">
      <text x="150" y="410">teri uzaklaştırır</text>
      <text x="400" y="410">ısıyı tutar</text>
      <text x="650" y="410">rüzgâr ve yağmuru keser</text>
    </g>
  </g>
</svg>
