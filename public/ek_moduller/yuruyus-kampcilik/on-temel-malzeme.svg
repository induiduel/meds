<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="On temel malzeme: harita ve pusula, kafa lambası, güneş koruması, ilk yardım, bıçak, ateş, acil barınak, fazladan yiyecek, fazladan su, fazladan giysi">
  <rect width="800" height="480" rx="28" fill="#F4EEE2"/>
  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1 Harita + pusula -->
    <g transform="translate(96,118)">
      <circle r="58" fill="#FFFFFF"/>
      <path d="M-36,-20 L-16,-28 L6,-20 L26,-28 L26,12 L6,20 L-16,12 L-36,20 Z" fill="#CFE0CF" stroke="#2F5D50" stroke-width="3"/>
      <path d="M-16,-28 V12 M6,-20 V20" fill="none" stroke="#2F5D50" stroke-width="3"/>
      <circle cx="20" cy="18" r="17" fill="#FFFFFF" stroke="#1E2A2E" stroke-width="3"/>
      <polygon points="20,5 25,18 15,18" fill="#C8553D"/>
      <polygon points="20,31 25,18 15,18" fill="#1E2A2E"/>
    </g>

    <!-- 2 Kafa lambası -->
    <g transform="translate(248,118)">
      <circle r="58" fill="#FFFFFF"/>
      <rect x="-40" y="-17" width="80" height="18" rx="9" fill="#7FA387"/>
      <rect x="-18" y="-28" width="36" height="40" rx="10" fill="#1E2A2E"/>
      <circle cy="-8" r="11" fill="#F2C14E"/>
      <path d="M-16,22 L-24,36 M0,24 V40 M16,22 L24,36" fill="none" stroke="#F2C14E" stroke-width="5"/>
    </g>

    <!-- 3 Güneş koruması -->
    <g transform="translate(400,118)">
      <circle r="58" fill="#FFFFFF"/>
      <circle cy="-18" r="12" fill="#F2C14E"/>
      <path d="M0,-36 V-42 M0,0 V4 M-18,-18 H-24 M18,-18 H24 M-13,-31 L-17,-35 M13,-31 L17,-35 M-13,-5 L-17,-1 M13,-5 L17,-1" fill="none" stroke="#F2C14E" stroke-width="4"/>
      <rect x="-32" y="14" width="28" height="20" rx="9" fill="#1E2A2E"/>
      <rect x="4" y="14" width="28" height="20" rx="9" fill="#1E2A2E"/>
      <path d="M-6,20 H6 M-32,20 L-40,16 M32,20 L40,16" fill="none" stroke="#1E2A2E" stroke-width="3"/>
    </g>

    <!-- 4 İlk yardım -->
    <g transform="translate(552,118)">
      <circle r="58" fill="#FFFFFF"/>
      <path d="M-12,-18 V-27 Q-12,-31 -8,-31 H8 Q12,-31 12,-27 V-18" fill="none" stroke="#1E2A2E" stroke-width="3"/>
      <rect x="-33" y="-19" width="66" height="48" rx="10" fill="#C8553D"/>
      <rect x="-5" y="-9" width="10" height="28" rx="2" fill="#FFFFFF"/>
      <rect x="-14" y="0" width="28" height="10" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- 5 Bıçak -->
    <g transform="translate(704,118)">
      <circle r="58" fill="#FFFFFF"/>
      <g transform="rotate(-35)">
        <path d="M0,-8 H24 Q38,-7 41,6 L0,8 Z" fill="#CDE3EA" stroke="#1E2A2E" stroke-width="3"/>
        <rect x="-40" y="-9" width="42" height="18" rx="9" fill="#D9865B"/>
        <circle cx="-6" cy="0" r="3" fill="#1E2A2E"/>
      </g>
    </g>

    <!-- 6 Ateş -->
    <g transform="translate(96,322)">
      <circle r="58" fill="#FFFFFF"/>
      <g transform="translate(0,-8) scale(1.1)">
        <path d="M0,-30 C10,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -16,-8 -12,-14 C-10,-6 -6,-4 -4,-6 C-6,-16 -4,-24 0,-30 Z" fill="#C8553D"/>
        <path d="M0,4 C6,10 10,13 10,19 C10,26 5,30 0,30 C-5,30 -10,26 -10,19 C-10,13 -4,10 0,4 Z" fill="#F2C14E"/>
      </g>
      <path d="M-28,34 L28,22" stroke="#1E2A2E" stroke-width="14"/>
      <path d="M-28,34 L28,22" stroke="#E4D8C3" stroke-width="8"/>
      <path d="M-28,22 L28,34" stroke="#1E2A2E" stroke-width="14"/>
      <path d="M-28,22 L28,34" stroke="#E4D8C3" stroke-width="8"/>
    </g>

    <!-- 7 Acil barınak -->
    <g transform="translate(248,322)">
      <circle r="58" fill="#FFFFFF"/>
      <polygon points="-36,24 0,-28 36,24" fill="#D9865B" stroke="#D9865B" stroke-width="3"/>
      <polygon points="-11,24 0,0 11,24" fill="#1E2A2E"/>
      <path d="M-42,25 H42" stroke="#1E2A2E" stroke-width="3"/>
    </g>

    <!-- 8 Fazladan yiyecek -->
    <g transform="translate(400,322)">
      <circle r="58" fill="#FFFFFF"/>
      <circle cx="-9" cy="8" r="19" fill="#C8553D"/>
      <circle cx="9" cy="8" r="19" fill="#C8553D"/>
      <path d="M0,-8 Q0,-18 4,-24" fill="none" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M4,-18 Q16,-32 26,-20 Q14,-10 4,-18 Z" fill="#7FA387"/>
    </g>

    <!-- 9 Fazladan su -->
    <g transform="translate(552,322)">
      <circle r="58" fill="#FFFFFF"/>
      <rect x="-9" y="-38" width="18" height="12" rx="4" fill="#2F5D50"/>
      <rect x="-17" y="-24" width="34" height="58" rx="11" fill="#CDE3EA" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M-17,-2 H17" stroke="#1E2A2E" stroke-width="3"/>
      <path d="M-8,10 V22" stroke="#FFFFFF" stroke-width="4"/>
    </g>

    <!-- 10 Fazladan giysi -->
    <g transform="translate(704,322)">
      <circle r="58" fill="#FFFFFF"/>
      <path d="M-10,-28 Q0,-21 10,-28 L21,-25 L38,12 L25,18 L17,-2 V31 H-17 V-2 L-25,18 L-38,12 L-21,-25 Z" fill="#D9865B" stroke="#D9865B" stroke-width="3"/>
      <path d="M0,-22 V31" stroke="#1E2A2E" stroke-width="3"/>
    </g>

    <!-- numaralar -->
    <g fill="#2F5D50">
      <circle cx="52" cy="76" r="20"/><circle cx="204" cy="76" r="20"/><circle cx="356" cy="76" r="20"/><circle cx="508" cy="76" r="20"/><circle cx="660" cy="76" r="20"/>
      <circle cx="52" cy="280" r="20"/><circle cx="204" cy="280" r="20"/><circle cx="356" cy="280" r="20"/><circle cx="508" cy="280" r="20"/><circle cx="660" cy="280" r="20"/>
    </g>
    <g fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle">
      <text x="52" y="85">1</text><text x="204" y="85">2</text><text x="356" y="85">3</text><text x="508" y="85">4</text><text x="660" y="85">5</text>
      <text x="52" y="289">6</text><text x="204" y="289">7</text><text x="356" y="289">8</text><text x="508" y="289">9</text>
      <text x="660" y="288" font-size="22">10</text>
    </g>

    <!-- etiketler -->
    <g fill="#1E2A2E" font-size="18" text-anchor="middle">
      <text x="96" y="208">Harita + pusula</text>
      <text x="248" y="208">Kafa lambası</text>
      <text x="400" y="208">Güneş koruması</text>
      <text x="552" y="208">İlk yardım</text>
      <text x="704" y="208">Bıçak</text>
      <text x="96" y="412">Ateş</text>
      <text x="248" y="412">Acil barınak</text>
      <text x="400" y="412">Fazladan yiyecek</text>
      <text x="552" y="412">Fazladan su</text>
      <text x="704" y="412">Fazladan giysi</text>
    </g>
  </g>
</svg>
