<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Uyku sistemi kesiti: zemin üstünde yalıtan mat, konfor sıcaklığına göre seçilen uyku tulumu ve rüzgâr ile yağmurdan koruyan, havalandırması açık çadır; mat zemine ısı kaybını keser">
  <rect width="800" height="480" rx="28" fill="#F4EEE2"/>
  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- zemin -->
    <path d="M0,376 H800 V452 Q800,480 772,480 H28 Q0,480 0,452 Z" fill="#E4D8C3"/>
    <g fill="#F4EEE2">
      <ellipse cx="80" cy="420" rx="14" ry="7"/><ellipse cx="380" cy="446" rx="16" ry="7"/><ellipse cx="470" cy="410" rx="12" ry="6"/><ellipse cx="730" cy="412" rx="14" ry="7"/>
    </g>

    <!-- çadır -->
    <path d="M40,376 C40,170 180,110 280,110 C380,110 520,170 520,376 Z" fill="#2F5D50"/>
    <path d="M56,376 C56,186 188,126 280,126 C372,126 504,186 504,376 Z" fill="#F4EEE2"/>
    <!-- havalandırma -->
    <path d="M250,116 Q280,84 310,116" fill="none" stroke="#2F5D50" stroke-width="8"/>
    <rect x="266" y="108" width="28" height="20" fill="#F4EEE2"/>
    <g fill="none" stroke="#1E2A2E" stroke-width="3">
      <path d="M272,122 q-6,-12 0,-22 q5,-9 0,-20 M266,88 l6,-9 l7,8"/>
      <path d="M290,122 q-6,-12 0,-22 q5,-9 0,-20 M284,88 l6,-9 l7,8"/>
    </g>

    <!-- yağmur ve rüzgâr -->
    <path d="M70,52 l-9,20 M104,40 l-9,20 M96,88 l-9,20 M138,64 l-9,20 M172,44 l-9,20 M60,118 l-9,20" fill="none" stroke="#24384F" stroke-width="4"/>
    <path d="M372,64 h64 q14,0 14,-12 q0,-10 -10,-10 M392,88 h78" fill="none" stroke="#24384F" stroke-width="4"/>

    <!-- mat -->
    <rect x="84" y="352" width="392" height="24" rx="10" fill="#D9865B"/>

    <!-- uyku tulumu ve figür -->
    <path d="M150,300 L430,310 Q464,330 430,346 L150,352 Q112,352 108,326 Q112,300 150,300 Z" fill="#7FA387"/>
    <path d="M210,304 V349 M270,306 V348 M330,308 V347 M390,310 V346" stroke="#2F5D50" stroke-width="3"/>
    <circle cx="144" cy="326" r="17" fill="#E4D8C3" stroke="#1E2A2E" stroke-width="3"/>
    <path d="M144,330 q5,4 9,0" fill="none" stroke="#1E2A2E" stroke-width="3"/>

    <!-- ısı kaybı (üstü çizili ok) -->
    <path d="M190,456 V398 M178,410 L190,396 L202,410" fill="none" stroke="#C8553D" stroke-width="6"/>
    <path d="M172,414 L208,446 M208,414 L172,446" stroke="#1E2A2E" stroke-width="4"/>
    <text x="224" y="438" font-size="20" font-weight="700" fill="#1E2A2E">ısı kaybı</text>

    <!-- kılavuz çizgileri -->
    <g fill="none" stroke="#1E2A2E" stroke-width="3">
      <path d="M442,176 L540,80"/>
      <path d="M418,328 L540,216"/>
      <path d="M462,364 L540,308"/>
    </g>
    <g fill="#1E2A2E">
      <circle cx="442" cy="176" r="5"/><circle cx="418" cy="328" r="5"/><circle cx="462" cy="364" r="5"/>
    </g>

    <!-- etiketler -->
    <g fill="#2F5D50" font-size="20" font-weight="700">
      <text x="552" y="84">Çadır</text>
      <text x="552" y="220">Tulum</text>
      <text x="552" y="312">Mat</text>
    </g>
    <g fill="#1E2A2E" font-size="18">
      <text x="552" y="109">rüzgâr ve yağmur;</text>
      <text x="552" y="132">havalandırma açık</text>
      <text x="552" y="245">konfor sıcaklığına göre</text>
      <text x="552" y="337">zeminden yalıtır,</text>
      <text x="552" y="360">R değeri</text>
      <text x="552" y="438">Soğuk zemin</text>
    </g>
  </g>
</svg>
