services:
  meds-trainer:
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
    container_name: meds-trainer
    volumes:
      - ../../meds_database:/workspace/database:ro
      - ../training_data:/workspace/data
      - .:/workspace/scripts
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash -c "pip install --no-cache-dir trl peft transformers datasets bitsandbytes && python scripts/train_lora.py"
